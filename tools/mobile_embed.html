<!doctype html>
<!-- A host page for the mobile sweep's --embedded mode: Labbook inside a full-size iframe, the way
     dHUB hosts it on a phone (header hidden by the shell, no Labbook tab bar because the shell's
     #ws-tabs is the navigation). lbHost() is truthy here, which is the point.
     tools/mobile_sweep.mjs --embedded loads it with ?src=<app url>. -->
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style>
<iframe name="app" id="app" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe>
<script>
  var src=new URLSearchParams(location.search).get('src')||'../apps/labbook/labbook.html';
  var f=document.getElementById('app'); f.src=src+(src.indexOf('?')>=0?'&':'?')+'_ts='+Date.now();
  // What dHUB's _loadApp injects: the app's own header is the shell's job.
  f.addEventListener('load',function(){ try{ var d=f.contentDocument; var st=d.createElement('style'); st.textContent='header{display:none!important}'; d.head.appendChild(st); }catch(e){} });
</script>
