name: Build and Deploy dHUB

# Two halves, on purpose.
#
#   build -> deploy   is the path to Pages: static checks, every build profile, a look inside the artifact.
#                     Minutes, no browser, no network beyond checkout. A push is live as soon as this is green.
#   tests             run in parallel with it (the invariants, the audits, the phone/desktop sweeps). They
#                     answer "is it right?", not "can it ship?" — a red one marks the commit and says which
#                     suite, but it no longer holds the deploy hostage to a CDN hiccup or a slow runner.
#
# This used to be one 32-step job in which any finding in any suite stopped Pages. The suites grew from
# 15 to 32 steps in two weeks (about 40 minutes on a fast laptop, more on a 2-vCPU runner), several of them
# fetch jsPDF / SheetJS / RDKit / 3Dmol from a CDN, and deploys started failing for reasons unrelated to the
# change being pushed. To make a suite gate the deploy again, add its job id to `needs:` on `deploy`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────── ships ───────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # tools/check_js.py shells out to node to parse every app's inline <script>.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No module system, so these are the safety net that is cheap enough to sit on the way to Pages:
      # a SyntaxError in any app, orphan CSS declarations and white ink on a solid fill, and drift in
      # every block that is copied from one canonical source into several files.
      - name: Parse-check every app's inline JavaScript
        run: python tools/check_js.py

      - name: Check every stylesheet
        run: python tools/check_css.py

      - name: Check the shared fit engine for drift
        run: python tools/check_shared.py

      - name: Check the icon set for drift
        run: python tools/sync_icons.py --check

      - name: Check the motion kit for drift
        run: python tools/sync_motion.py --check

      - name: Check the right-click kit for drift
        run: python tools/sync_ctxkit.py --check

      - name: Check the help assistant for drift
        run: python tools/sync_assist.py --check

      - name: Check the shared Echo blocks for drift
        run: python tools/sync_screen_engine.py --check

      # Smoke test only — the sellable subset is not what Pages serves, but a broken product build
      # should fail here rather than the day someone asks for it.
      - name: Build the product profile (smoke test)
        run: python embed.py --profile=product /tmp/product.html

      # Pages serves the full personal build. The apps that must not be public are gated by
      # ADMIN_ONLY_APPS, which openApp enforces from every entry point including #hashes.
      - name: Build dHUB
        run: python embed.py dist/index.html

      # Ribbon's 3Dmol is embedded in the Hub (vendor/, tools/inline_3dmol.py) so the viewer works
      # offline. embed.py refuses a vendored file that is not the pinned one; this proves the built Hub
      # really carries it and no longer asks a CDN for it.
      - name: The built Hub carries 3Dmol
        run: |
          python - <<'PY'
          import base64, re
          t = open('dist/index.html', encoding='utf-8').read()
          m = re.search(r'ribbon: "([^"]*)"', t)
          assert m, 'Ribbon payload not found in dist/index.html'
          h = base64.b64decode(m.group(1)).decode('utf-8')
          assert 'embedded by embed.py so Ribbon works offline' in h, 'Ribbon in the Hub has no embedded 3Dmol'
          assert '<script src="https://unpkg.com/3dmol' not in h, 'Ribbon in the Hub still loads 3Dmol from a CDN'
          print('Ribbon in the Hub carries 3Dmol inline (%d KB)' % (len(h) // 1024))
          PY

      # dist/ is gitignored, so a profile CI does not build exists only on one laptop and its installed
      # copies point at a 404 their own service worker hides. ARCHIVE_SLUG and LABBOOK_SLUG must never
      # change: each installed home-screen app is pinned to its slug.
      - name: Build the Archive PWA
        run: python embed.py --profile=archive dist/archive-14cadcd792a2

      - name: Build the Labbook bench PWA
        run: python embed.py --profile=labbook-pwa dist/labbook-6b1d0c4f9a72

      - name: Verify the PWA is actually in the artifact
        run: |
          for d in archive-14cadcd792a2 labbook-6b1d0c4f9a72; do
            for f in index.html manifest.webmanifest sw.js icons/icon-192.png; do
              test -s "dist/$d/$f" || { echo "MISSING dist/$d/$f"; exit 1; }
            done
          done
          test -s dist/index.html
          echo "dist contents:"; find dist -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One deploy at a time, and a deploy already running is never cancelled mid-way.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy

  # ───────────────────────────── checks it ─────────────────────────────
  # Independent suites in parallel. Each starts its own server on a free port, so they share nothing.
  # Every command goes through tools/ci_retry.sh: a CDN that does not answer or one slow frame gets a
  # second attempt, a real failure fails both.
  suites:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A newer push makes the older run's verdict moot; don't spend runner minutes on it.
    concurrency:
      group: tests-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # The bug classes found by hand in the Designer, the quick window, the Report and the exports,
          # checked over every preset and every library module. Run against the standalone build too:
          # only that one embeds Archive, so only there do the protocol cases run.
          - name: Labbook invariants
            run: |
              python embed.py --profile=labbook
              tools/ci_retry.sh node tools/invariants.mjs

          # Blueprint and Ribbon: the 2026-09-28 beta-test classes, then Ribbon's own (a viewer that is
          # never inert, framing, one colour function, files, AlphaFold, ligands, measure, interface,
          # compare, values, scripts, panels). RCSB is stubbed; 3Dmol comes from its CDN and the viewer
          # checks are reported as skipped if it cannot load.
          - name: Blueprint and Ribbon invariants
            run: |
              tools/ci_retry.sh node tools/design_invariants.mjs
              tools/ci_retry.sh node tools/ribbon_invariants.mjs

          # Echo Dose Response (curve figures, vector PDFs, fits, normalisation, History), Lumina (plates,
          # units, keys, Plot) and the Labbook <-> Echo/Lumina transfer (results with their curves, Edit in
          # the app, Update in Labbook).
          - name: Echo, Lumina and transfer invariants
            run: |
              tools/ci_retry.sh node tools/echo_invariants.mjs
              tools/ci_retry.sh node tools/lumina_invariants.mjs
              tools/ci_retry.sh node tools/transfer_invariants.mjs

          # Hit Finder (what a hit is, why a compound is not one, a missing number stays missing) and Tempo
          # (readers, normalisation, known-answer fits, Michaelis-Menten rules). The real ProNect files are
          # local only, so CI runs on the synthetic plates.
          - name: Hit Finder and Tempo invariants
            run: |
              tools/ci_retry.sh node tools/hitfinder_invariants.mjs
              tools/ci_retry.sh node tools/tempo_invariants.mjs

          # BCA, Dora and Beacon (a blank well is not 0, a bound is not a value), then a monkey that puts
          # hostile values in every box of the Data Analysis apps, a box-legibility audit, and a motion audit.
          - name: Data Analysis apps — hostile input, boxes, motion
            run: |
              python3 -m http.server 8791 > /dev/null 2>&1 &
              sleep 2
              tools/ci_retry.sh node tools/analysis_invariants.mjs
              tools/ci_retry.sh node tools/monkey.mjs
              tools/ci_retry.sh node tools/inputs_audit.mjs
              tools/ci_retry.sh node tools/motion_audit.mjs

          # The Freezer: nothing lost on load and save, Firebase-shaped states, stable colours, find, move,
          # discard, fill, thaw logged through the Hub, views kept local, the old inventory set aside first.
          # Cuppa: the ledger is the state, a toggle undoes, viewers do not write, months cross the year, no
          # emoji in the interface, and every screen in its box at three widths in both themes.
          # Blot: pictures out of localStorage, labels that are text, undo, densitometry on a gel of known ratios,
          # kDa markers, image adjustments, saved figures that travel, and the Labbook round trip.
          - name: Freezer, Cuppa and Blot invariants
            run: |
              python embed.py
              tools/ci_retry.sh node tools/iceberg_invariants.mjs
              tools/ci_retry.sh node tools/cuppa_invariants.mjs
              tools/ci_retry.sh node tools/blot_invariants.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tests
      - name: ${{ matrix.name }}
        shell: bash
        run: |
          chmod +x tools/ci_retry.sh
          ${{ matrix.run }}

  # The built Hub, in a browser: the help assistant's notes, and the shell plus all 17 apps in their real
  # frames — an emulated iPhone upright and sideways, then a laptop and a tablet with a mouse. Fails on text
  # that overlaps text, anything cut by an overflow with nothing to scroll it back, anything that leaves the
  # box drawn around it, a page that scrolls sideways, text under 11px on a phone, and a 384-well plate drawn
  # in portrait instead of the "turn your phone" note.
  hub:
    name: The Hub in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: tests-${{ github.ref }}-hub
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tests

      - name: Build dHUB
        run: python embed.py dist/index.html

      - name: Assistant invariants
        run: tools/ci_retry.sh node tools/assist_invariants.mjs

      - name: Shell invariants
        run: tools/ci_retry.sh node tools/hub_invariants.mjs

      - name: Serve the build
        run: |
          python3 -m http.server 8899 --directory dist > /dev/null 2>&1 &
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:8899/index.html

      - name: On a phone (upright and sideways)
        run: tools/ci_retry.sh node tools/mobile_hub_sweep.mjs --url=http://127.0.0.1:8899/index.html --sizes=390x844,844x390 --themes=light --escape

      - name: On a laptop, with a mouse
        run: tools/ci_retry.sh node tools/mobile_hub_sweep.mjs --url=http://127.0.0.1:8899/index.html --desktop --escape --sizes=1440x900 --themes=light

      - name: On a tablet, dark theme
        run: tools/ci_retry.sh node tools/mobile_hub_sweep.mjs --url=http://127.0.0.1:8899/index.html --desktop --escape --sizes=1024x768 --themes=dark
