name: Set up the test tooling
description: Python, Node and Chromium for the Playwright suites (run after actions/checkout)

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - name: Install Playwright (Chromium)
      shell: bash
      run: |
        chmod +x tools/ci_retry.sh
        tools/ci_retry.sh npm ci
        tools/ci_retry.sh npx playwright install --with-deps chromium
