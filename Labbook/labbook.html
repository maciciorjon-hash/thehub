// Selection
function plWellDown(id,ev){ ev.preventDefault();
  if(ev.shiftKey&&PL.anchor){ plSelectRange(PL.anchor,id,ev.ctrlKey||ev.metaKey); }
  else if(ev.ctrlKey||ev.metaKey){ if(PL.sel[id]) delete PL.sel[id]; else PL.sel[id]=1; PL.anchor=id; }
  else { PL.sel={}; PL.sel[id]=1; PL.anchor=id; }
  PL.drag=true; PL.dragAdd=true; plRender(); }
function plWellEnter(id){ if(!PL.drag) return; PL.sel[id]=1; plRenderGrid(); }
function plSelectRange(a,b,add){ var A=wellRC(a), B=wellRC(b); if(!A||!B) return; if(!add) PL.sel={};
  var r1=Math.min(A.r,B.r), r2=Math.max(A.r,B.r), c1=Math.min(A.c,B.c), c2=Math.max(A.c,B.c);
  for(var r=r1;r<=r2;r++) for(var c=c1;c<=c2;c++) PL.sel[wellIdOf(r,c)]=1; }
function plSelectRow(r,ev){ var p=plCur(); if(!p) return; var d=plateDims(p);
  if(!(ev&&(ev.ctrlKey||ev.metaKey))) PL.sel={};
  for(var c=0;c<d.c;c++) PL.sel[wellIdOf(r,c)]=1; PL.anchor=wellIdOf(r,0); plRender(); }
function plSelectCol(c,ev){ var p=plCur(); if(!p) return; var d=plateDims(p);
  if(!(ev&&(ev.ctrlKey||ev.metaKey))) PL.sel={};
  for(var r=0;r<d.r;r++) PL.sel[wellIdOf(r,c)]=1; PL.anchor=wellIdOf(0,c); plRender(); }
function plSelectAll(){ var p=plCur(); if(!p) return; var d=plateDims(p); PL.sel={};
  for(var r=0;r<d.r;r++) for(var c=0;c<d.c;c++) PL.sel[wellIdOf(r,c)]=1; plRender(); }
function plClearSel(){ PL.sel={}; PL.anchor=null; plRender(); }
// The selection is a single row or a single column (→ a dose series can run along it).
function plSelAxis(){ var ids=plSelIds(); if(ids.length<2) return null;
  var rs={}, cs={}; ids.forEach(function(id){ var x=wellRC(id); if(x){ rs[x.r]=1; cs[x.c]=1; } });
  if(Object.keys(rs).length===1) return 'row';
  if(Object.keys(cs).length===1) return 'col';
  return null; }

// Writing into wells
function _plWell(p,id){ if(!p.wells) p.wells={}; if(!p.wells[id]) p.wells[id]={typeId:PL.type}; return p.wells[id]; }
function plSetType(tid){ var p=plCur(); if(!p) return; PL.type=tid;
  plSelIds().forEach(function(id){ _plWell(p,id).typeId=tid; });
  platePersist(PL.key); plRender(); }
function plApplyFields(){ var p=plCur(), host=el('pl-side'); if(!p||!host) return;
  var ids=plSelIds(); if(!ids.length) return;
  host.querySelectorAll('[data-pf]').forEach(function(n){ var k=n.getAttribute('data-pf'), v=n.value;
    // Blank + placeholder "Mixed…" means "leave each well's own value alone".
    if(v===''&&n.placeholder==='Mixed…') return;
    ids.forEach(function(id){ var w=_plWell(p,id); if(v==='') delete w[k]; else w[k]=v; }); });
  platePersist(PL.key); plRenderGrid(); plRenderSum();
  var t=el('pl-count'); if(t) t.textContent=plateCount(p)+' / '+(plateDims(p).r*plateDims(p).c)+' wells used'; }
function plEraseSel(){ var p=plCur(); if(!p) return; plSelIds().forEach(function(id){ delete p.wells[id]; });
  platePersist(PL.key); plRender(); }
function plSetTitle(v){ var p=plCur(); if(!p) return; p.title=v; platePersist(PL.key); }
// Block labels
function plSelGroupLabel(){ var p=plCur(); if(!p) return ''; var ids=plSelIds(); if(!ids.length) return '';
  var v=null; for(var i=0;i<ids.length;i++){ var w=(p.wells||{})[ids[i]]||{};
    var lab=(w.groupId&&p.groups&&p.groups[w.groupId])?(p.groups[w.groupId].label||''):'';
    if(v===null) v=lab; else if(v!==lab) return null; }
  return v||''; }
function plGroupLabel(v){ var p=plCur(); if(!p) return; var ids=plSelIds(); if(ids.length<2) return;
  if(!String(v||'').trim()){ plUngroup(); return; }
  if(!p.groups) p.groups={};
  // Reuse the group if the selection already is one, so re-labelling doesn't orphan it.
  var cur=null, single=true;
  ids.forEach(function(id){ var g=((p.wells||{})[id]||{}).groupId||null; if(cur===null) cur=g; else if(cur!==g) single=false; });
  var gid=(single&&cur)?cur:('g'+Date.now().toString(36));
  ids.forEach(function(id){ _plWell(p,id).groupId=gid; });
  p.groups[gid]={label:String(v).trim()};
  _plGcGroups(p); platePersist(PL.key); plRender(); }
function plUngroup(){ var p=plCur(); if(!p) return;
  plSelIds().forEach(function(id){ var w=(p.wells||{})[id]; if(w) delete w.groupId; });
  _plGcGroups(p); platePersist(PL.key); plRender(); }
function _plGcGroups(p){ if(!p.groups) return; var live={};
  Object.keys(p.wells||{}).forEach(function(id){ var g=p.wells[id].groupId; if(g) live[g]=1; });
  Object.keys(p.groups).forEach(function(g){ if(!live[g]) delete p.groups[g]; }); }
// Shading
function plApplyShade(dir){ var p=plCur(); if(!p) return; var ids=plSelIds(); if(!ids.length) return;
  if(!dir){ ids.forEach(function(id){ var w=(p.wells||{})[id]; if(w) delete w.shade; }); platePersist(PL.key); plRender(); return; }
  var rs=[], cs=[]; ids.forEach(function(id){ var x=wellRC(id); if(x){ rs.push(x.r); cs.push(x.c); } });
  var lo, hi, byCol=(dir!=='down');
  if(byCol){ lo=Math.min.apply(null,cs); hi=Math.max.apply(null,cs); }
  else { lo=Math.min.apply(null,rs); hi=Math.max.apply(null,rs); }
  var span=Math.max(1,hi-lo);
  ids.forEach(function(id){ var x=wellRC(id); var pos=(byCol?x.c:x.r)-lo;
    var t=(dir==='left')?(1-pos/span):(pos/span);
    _plWell(p,id).shade=Math.round(t*0.8*1000)/1000; });
  platePersist(PL.key); plRender(); }
// Column headers
function plSetColTitle(v){ var p=plCur(); if(!p) return; p.colTitle=String(v||''); platePersist(PL.key); plRender(); }
function plSetColLabel(v){ var p=plCur(); if(!p) return; var cols={};
  plSelIds().forEach(function(id){ var x=wellRC(id); if(x) cols[x.c]=1; });
  var ks=Object.keys(cols); if(!ks.length) return;
  if(!p.colLabels) p.colLabels={};
  ks.forEach(function(c){ if(String(v||'').trim()) p.colLabels[c]=String(v).trim(); else delete p.colLabels[c]; });
  platePersist(PL.key); plRender(); }
// Write the dose series into the column headers instead of every well — the compact style
// where the concentration is stated once per column.
function plDoseToCols(dir){ var p=plCur(); if(!p) return; if(plSelAxis()!=='row') return;
  var ids=plSelIds().slice().sort(function(a,b){ return wellRC(a).c-wellRC(b).c; });
  if(dir<0) ids.reverse();
  var fold=+((el('pl-dose-fold')||{}).value)||3;
  var top=_toNM((el('pl-dose-top')||{}).value,(el('pl-dose-unit')||{}).value||'nM');
  if(!p.colLabels) p.colLabels={};
  if(!p.colTitle) p.colTitle=(el('pl-dose-unit')||{}).value||'nM';
  var unit=p.colTitle;
  ids.forEach(function(id,i){ var nM=top/Math.pow(fold,i);
    p.colLabels[wellRC(id).c]=_cn(unit==='µM'?nM/1e3:(unit==='mM'?nM/1e6:nM)); });
  platePersist(PL.key); plRender();
  toast(ids.length+' column headers written'); }
// Switching format keeps every well that still fits the new grid (Blueprint wipes them — don't).
function plSetFormat(f){ var p=plCur(); if(!p) return; var d=PLATE_FORMATS[String(f)]; if(!d) return;
  var kept={}, lost=0;
  Object.keys(p.wells||{}).forEach(function(id){ var x=wellRC(id);
    if(x&&x.r<d.r&&x.c<d.c) kept[id]=p.wells[id]; else lost++; });
  p.format=String(f); p.wells=kept; PL.sel={}; PL.anchor=null;
  platePersist(PL.key); plRender();
  if(lost) toast(lost+' well'+(lost!==1?'s':'')+' fell outside the '+f+'-well grid and '+(lost!==1?'were':'was')+' dropped'); }
// Concentration formatting — nM/µM/mM chosen automatically as the series steps down.
function _toNM(v,unit){ return (+v||0)*(unit==='mM'?1e6:(unit==='µM'?1e3:1)); }
function _cn(x){ var v=+x; if(!isFinite(v)) return '0';
  var s=(v>=100)?v.toFixed(0):((v>=10)?v.toFixed(1):v.toFixed(2));
  return s.indexOf('.')<0?s:s.replace(/0+$/,'').replace(/\.$/,''); }
// Steps right down to fM so a long series never collapses to "0 nM".
function _fmtConc(nM){ if(!isFinite(nM)||nM<=0) return '0';
  if(nM>=1e6) return _cn(nM/1e6)+' mM';
  if(nM>=1e3) return _cn(nM/1e3)+' µM';
  if(nM>=1)   return _cn(nM)+' nM';
  if(nM>=1e-3)return _cn(nM*1e3)+' pM';
  return _cn(nM*1e6)+' fM'; }
function plApplyDose(dir){ var p=plCur(); if(!p) return; var axis=plSelAxis(); if(!axis) return;
  var ids=plSelIds().slice(); var fold=+((el('pl-dose-fold')||{}).value)||3;
  var top=_toNM((el('pl-dose-top')||{}).value,(el('pl-dose-unit')||{}).value||'nM');
  ids.sort(function(a,b){ var A=wellRC(a), B=wellRC(b); return axis==='row'?(A.c-B.c):(A.r-B.r); });
  if(dir<0) ids.reverse();
  ids.forEach(function(id,i){ var fresh=!(p.wells||{})[id]; var w=_plWell(p,id);
    // Wells you hadn't touched become "Dose series"; ones you already typed keep their type.
    if(fresh||!w.typeId||w.typeId==='blank') w.typeId='dose';
    w.conc=_fmtConc(top/Math.pow(fold,i)); });
  platePersist(PL.key); plRender();
  toast(ids.length+'-point series, '+fold+'-fold, from '+_fmtConc(top)); }
// Drag-select ends wherever the mouse comes up, even outside the grid.
document.addEventListener('mouseup',function(){ if(PL.drag){ PL.drag=false; plRenderSide(); } });
// Touch: mouseenter never fires, and there is no shift/ctrl on a phone, so without this you
// can only ever select one well at a time. Drag across the grid to paint a selection.
(function(){
  function wellAt(t){ if(!t) return null; var n=document.elementFromPoint(t.clientX,t.clientY);
    n=n&&n.closest?n.closest('.pl-w[data-w]'):null; return n?n.getAttribute('data-w'):null; }
  var grid=null;
  document.addEventListener('touchstart',function(e){
    var g=e.target.closest&&e.target.closest('#pl-grid'); if(!g) return;
    var id=wellAt(e.touches[0]); if(!id) return;
    grid=g; e.preventDefault();
    // A fresh touch starts a new selection unless "add" mode is on (the range toggle).
    if(!PL.touchAdd) PL.sel={};
    PL.sel[id]=1; PL.anchor=id; PL.drag=true; plRenderGrid();
  },{passive:false});
  document.addEventListener('touchmove',function(e){
    if(!PL.drag||!grid) return; e.preventDefault();
    var id=wellAt(e.touches[0]); if(id&&!PL.sel[id]){ PL.sel[id]=1; plRenderGrid(); }
  },{passive:false});
  document.addEventListener('touchend',function(){
    if(!PL.drag) return; PL.drag=false; grid=null; plRenderSide();
  });
})();
function plToggleTouchAdd(){ PL.touchAdd=!PL.touchAdd; plRenderSide(); }
document.addEventListener('keydown',function(ev){
  if(!PL.key||!el('plate-modal').classList.contains('open')) return;
  if(ev.key==='Escape'){ if(plSelIds().length) plClearSel(); else closePlateEditor(); }
  else if((ev.key==='Delete'||ev.key==='Backspace')&&plSelIds().length&&!/^(INPUT|SELECT|TEXTAREA)$/.test((ev.target.tagName||''))){ ev.preventDefault(); plEraseSel(); }
});

try{ LB.data=JSON.parse(localStorage.getItem('hub_labbook')||'null'); }catch(e){}

['projects','generalSections','experiments','pages','notebook','tags','presets','antibodies','attachments'].forEach(function(k){ if(!LB.data[k]) LB.data[k]=(k==='projects'||k==='generalSections'||k==='tags')?[]:{}; });
if(!LB.data.planner||typeof LB.data.planner!=='object') LB.data.planner={tasks:{}};

  if(e.projectId && !e.sectionId){ var p=LB.data.projects.filter(function(x){return x.id===e.projectId;})[0];
    if(p){ var u=(p.sections||[]).filter(function(s){return s.name==='Unclassified';})[0];

// One-time backfill of the explicit `done` flag. Carry-over used to be inferred from unticked
// checkboxes; every template block ships with a checklist, so without this every historical
// step in an existing notebook would land in carry-over on the first load after the upgrade.
// Anything already past the lookback window is treated as settled.
if(!LB.data._doneV1){
  var _cutoff=addDays(todayStr(),-CARRY_LOOKBACK_DAYS);
  Object.keys(LB.data.experiments).forEach(function(k){ var e=LB.data.experiments[k];
    (e.blocks||[]).forEach(function(b){
      if(b.done!==undefined) return;
      // Old enough to be history, or its checklist is fully ticked → done.
      b.done = (!b.date || b.date<_cutoff) ? true : !_legacyHasUnchecked(b.html);
      b.completedAt = b.done?(e.updated||Date.now()):null;
    });
    if(e.status==='done') (e.blocks||[]).forEach(function(b){ if(b.done===false){ b.done=true; b.completedAt=e.updated||Date.now(); } });
  });
  LB.data._doneV1=true;
}
// Only used by the migration above, to read the pre-existing checkbox state once.
function _legacyHasUnchecked(html){
  if(!html || html.indexOf('lb-check')<0) return false;
  try{ var d=document.createElement('div'); d.innerHTML=html;
    var lis=d.querySelectorAll('ul.lb-check > li, ul.lb-check ul > li');
    for(var i=0;i<lis.length;i++){ if(!lis[i].classList.contains('done')) return true; }
  }catch(e){}
  return false;
}
// preset instantiation from a seed (carries live calculators)
function presetFromSeed(seed,name,baseType){ return {name:name,baseType:baseType,title:seed.title,blocks:(seed.blocks||[]).map(function(b){ var o={dayOffset:b.d,title:b.title,html:b.html}; if(b.calc) o.calc=JSON.parse(JSON.stringify(b.calc)); return o; })}; }
function seedPresets(){
  // One-time upgrade: refresh built-in presets to the calc-enabled, correctly-dated versions.
  // (Only rewrites the built-in type presets; user-added custom presets are never touched.)
  var upgrade=!LB.data._presetV3;
  EXP_TYPES.forEach(function(t){ if(!LB.data.presets[t.id] || upgrade){ var s=PRESET_SEED[t.id]||PRESET_SEED.EXP; LB.data.presets[t.id]=presetFromSeed(s,(LB.data.presets[t.id]&&LB.data.presets[t.id].name)||t.name,t.id); }
    else if(!LB.data.presets[t.id].baseType){ LB.data.presets[t.id].baseType=t.id; } });
  if(upgrade) LB.data._presetV3=true;
  if(!LB.data._extraPresets){ Object.keys(EXTRA_PRESET_SEED).forEach(function(k){ if(!LB.data.presets[k]){ var s=EXTRA_PRESET_SEED[k]; LB.data.presets[k]={name:s.name,baseType:s.baseType,title:s.title,blocks:s.blocks.map(function(b){ var o={dayOffset:b.d,title:b.title,html:b.html}; if(b.calc) o.calc=JSON.parse(JSON.stringify(b.calc)); return o; })}; } }); LB.data._extraPresets=true; }
}

function isBuiltinPreset(k){ return EXP_TYPES.some(function(t){return t.id===k;}); }
function allPresetKeys(){ var built=EXP_TYPES.map(function(t){return t.id;}).filter(function(k){return LB.data.presets[k];}); var custom=Object.keys(LB.data.presets).filter(function(k){return !isBuiltinPreset(k);}).sort(function(a,b){ return ((LB.data.presets[a].name||a)).localeCompare(LB.data.presets[b].name||b); }); return built.concat(custom); }

function updateStatus(){ var p=el('lb-status'); if(!p) return; var txt=el('lb-status-txt'); var on=navigator.onLine;

  if(_storageBroken){ p.classList.add('offline'); if(txt) txt.textContent='Not saved!'; p.title='Browser storage rejected a write — see the warning. Export a backup now.'; return; }

var _lsT=null,_lsDirty=false;
function _flushLocal(){ if(!_lsDirty) return; _lsDirty=false; clearTimeout(_lsT); _lsT=null;
  try{ localStorage.setItem('hub_labbook', JSON.stringify(LB.data)); }

  // reload wipes the day's work. Always surface it.
  catch(e){ _storageFailed(e); } }
function save(){
  if(_adopting) return;

  // multi-step structural op serialises once. Keystrokes already arrive via queueSave (600ms).
  _lsDirty=true; clearTimeout(_lsT); _lsT=setTimeout(_flushLocal,150);

}

function isCoded(e){ return e.kind!=='note'; }
function allBlockDates(){ var set={}; Object.keys(LB.data.experiments).forEach(function(k){ (LB.data.experiments[k].blocks||[]).forEach(function(b){ if(b.date) set[b.date]=1; }); }); return set; }

// A block is "unfinished" if it holds a checklist item that isn't ticked (done).
// ── Step completion ──
// A step is done when you say so. Ticking every checkbox in it says so for you, but a
// prose-only step can be completed too — which the old checkbox-inference could never express.
function blockDone(b){ return !!(b&&b.done); }
// Outstanding = dated, in the past, and not finished. Deliberately NOT derived from checkboxes:
// every template block ships with a checklist, so inferring from them made every experiment
// permanently "unfinished" and grew the carry-over list without bound.
function blockOutstanding(b){ return !!(b && b.date && !b.done); }
function blockFinder(expId,blockId){
  var e=LB.data.experiments[expId]; if(!e) return null;
  var b=(e.blocks||[]).filter(function(x){return x.id===blockId;})[0];
  return b?{exp:e,block:b}:null;
}
function setBlockDone(expId,blockId,done,silent){
  var f=blockFinder(expId,blockId); if(!f) return;
  f.block.done=!!done; f.block.completedAt=done?Date.now():null;
  syncExpStatus(f.exp); f.exp.updated=Date.now(); save();
  if(!silent) renderAll();
}
function toggleDone(expId,blockId){
  var f=blockFinder(expId,blockId); if(!f) return;
  setBlockDone(expId,blockId,!f.block.done);
}
function expProgress(e){
  var bs=(e.blocks||[]); var done=0;
  bs.forEach(function(b){ if(b.done) done++; });
  return {done:done,total:bs.length};
}
// Status used to be a manual dropdown that silently drifted out of truth. Derive it from the
// steps instead, so "ongoing" always means what it says. With no steps done we leave the
// status alone — that's the one case where the user's own choice carries information.
function syncExpStatus(e){
  if(!e || !isCoded(e) || !(e.blocks||[]).length) return;
  var p=expProgress(e);
  if(!p.total || !p.done) return;
  e.status = (p.done===p.total) ? 'done' : 'ongoing';
}
// How far back carry-over looks. Without a bound it scans all history for ever.
var CARRY_LOOKBACK_DAYS=21;
// Blocks dated before D that are still outstanding, grouped by experiment, most recent first.
function carryoverForDate(D){
  var byExp={}, order=[], floor=addDays(D,-CARRY_LOOKBACK_DAYS);
  Object.keys(LB.data.experiments).forEach(function(k){ var e=LB.data.experiments[k];
    (e.blocks||[]).forEach(function(b){
      if(b.date && b.date<D && b.date>=floor && !b.done && !b.carryDismissed){
        if(!byExp[e.id]){ byExp[e.id]={exp:e,blocks:[]}; order.push(e.id); }
        byExp[e.id].blocks.push(b);
      }
    });
  });
  order.forEach(function(id){ byExp[id].blocks.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }); });
  return {byExp:byExp, order:order};
}
// Stop nagging about a step without claiming it was done.
function dismissCarry(expId,blockId){
  var f=blockFinder(expId,blockId); if(!f) return;
  f.block.carryDismissed=true; f.exp.updated=Date.now(); save(); renderAll();
  toast('Removed from carry-over — the step itself is unchanged.');
}
// Re-date an outstanding block onto day D so it physically moves into that day's notebook.
function carryBlockToToday(expId,blockId,D){
  var f=blockFinder(expId,blockId); if(!f) return;
  f.block.date=D;
  // Peers (setBlock('date'), snoozeBlock) both do this; omitting it left dayOffset stale, so
  // the wrong "Day N" printed in the outline and the PDF.
  recomputeDayOffsets(f.exp); f.exp.updated=Date.now(); save(); renderAll();
}
// Snooze: didn't get to this step today? Push it n days forward. Every later-dated step in the
// same experiment moves with it, so the day spacing you designed stays intact.
function snoozeBlock(expId,blockId,n){
  var e=LB.data.experiments[expId]; if(!e) return;
  var b=(e.blocks||[]).filter(function(x){return x.id===blockId;})[0]; if(!b||!b.date) return;
  var from=b.date, days=n||1, moved=0;
  (e.blocks||[]).forEach(function(x){ if(x.date && x.date>=from && x.id!==b.id){ x.date=addDays(x.date,days); moved++; } });
  b.date=addDays(b.date,days);
  recomputeDayOffsets(e); e.updated=Date.now(); save(); renderAll();
  toast('Snoozed to '+fmtDate(b.date)+(moved?(' — '+moved+' later step'+(moved!==1?'s':'')+' moved too'):''));
}

  return '<div class="page-item'+(SEL.page===e.id?' active':'')+'" onclick="selectPage(\''+e.id+'\')" oncontextmenu="ctxExp(event,\''+e.id+'\')"><div class="page-body">'+code+'<div class="page-title">'+esc(e.title||(isCoded(e)?e.code:'Untitled'))+'</div><div class="page-meta">'+meta+'</div></div></div>'; }
function renderPages(){
  var host=el('pane-pages'); var node=SEL.node;
  var ppw=el('pane-pages-wrap'), spg=el('split-pages'); if(ppw) ppw.style.display=''; if(spg) spg.style.display='';
  if(node.kind==='week'||node.kind==='archive'){ if(ppw) ppw.style.display='none'; if(spg) spg.style.display='none'; host.innerHTML=''; return; }
  if(node.kind==='notebook'){
    var dset=allBlockDates(); Object.keys(LB.data.notebook).forEach(function(k){dset[k]=1;});
    var days=Object.keys(dset).sort(); if(LAYOUT.daysDesc) days.reverse();
    var items=days.map(function(k){ var pg=LB.data.notebook[k]; var nblk=blocksForDate(k).length;

// The global dragover handler only preventDefaults inside .rt, so the drop zone needs its own —
// otherwise the browser navigates away from the app when you let go.
function wireFileDrop(root){
  var z=(root||document).querySelector('#fx-drop'); if(!z||z._wired) return; z._wired=true;
  ['dragenter','dragover'].forEach(function(ev){ z.addEventListener(ev,function(e){
    e.preventDefault(); e.stopPropagation(); z.classList.add('over'); }); });
  ['dragleave','dragend'].forEach(function(ev){ z.addEventListener(ev,function(e){
    e.preventDefault(); e.stopPropagation(); if(e.target===z) z.classList.remove('over'); }); });
  z.addEventListener('drop',function(e){
    e.preventDefault(); e.stopPropagation(); z.classList.remove('over');
    var dt=e.dataTransfer; if(dt&&dt.files&&dt.files.length) addFilesTo(z.getAttribute('data-key'),dt.files); });
}

function wkMonday(D){ var d=new Date(D+'T00:00:00'); var off=(d.getDay()+6)%7; return addDays(D,-off); }
function plannerTasks(){ return (LB.data.planner&&LB.data.planner.tasks)||(LB.data.planner={tasks:{}}).tasks; }
function tasksForDate(D){ var t=plannerTasks(); return Object.keys(t).map(function(k){return t[k];}).filter(function(x){return x&&x.date===D;}).sort(function(a,b){ return (a.done?1:0)-(b.done?1:0) || (a.created||0)-(b.created||0); }); }

function addPlannerTask(D,text){ text=(text||'').trim(); if(!text) return; var id=uid(); plannerTasks()[id]={id:id,date:D,text:text,done:false,expId:null,blockId:null,created:Date.now(),updated:Date.now()}; save(); renderEditor(); }
function togglePlannerTask(id){ var t=plannerTasks()[id]; if(!t) return; t.done=!t.done; t.updated=Date.now(); save(); renderEditor(); }
function delPlannerTask(id){ if(plannerTasks()[id]){ delete plannerTasks()[id]; save(); renderEditor(); } }
function editPlannerTask(id,text){ var t=plannerTasks()[id]; if(!t) return; text=(text||'').trim(); if(!text){ return delPlannerTask(id); } t.text=text; t.updated=Date.now(); save(); }
function linkPlannerTask(id){ var t=plannerTasks()[id]; if(!t) return;
  var items=Object.keys(LB.data.experiments).map(function(k){return LB.data.experiments[k];}).filter(function(e){return isCoded(e);})
    .map(function(e){ var p=projById(e.projectId); return {id:e.id,label:e.code||e.title||'Untitled',sub:(p?p.name:'')+(e.title?(' · '+e.title):''),ic:(e.type||'E').slice(0,2).toUpperCase(),c:(p&&p.color)||'#4f9d8f'}; });
  items.unshift({id:'__none__',label:'— No experiment —',sub:'Unlink',ic:'—',c:'#888'});
  lbPicker('Link task to experiment',items,function(it){
    if(it.id==='__none__'){ t.expId=null; t.blockId=null; t.updated=Date.now(); save(); renderEditor(); return; }
    t.expId=it.id; t.blockId=null; t.updated=Date.now(); save();
    // Second stage: optionally pin the task to one step of that experiment.
    var e=LB.data.experiments[it.id]; var bs=(e&&e.blocks)||[];
    if(!bs.length){ renderEditor(); return; }
    var steps=bs.map(function(b){ return {id:b.id,label:b.title||('Day '+(b.dayOffset||0)),sub:(b.date?fmtDate(b.date):'no date')+(b.done?' · done':''),ic:'D'+(b.dayOffset||0),c:(projById(e.projectId)||{}).color||'#4f9d8f'}; });
    steps.unshift({id:'__exp__',label:'— Whole experiment —',sub:'No particular step',ic:'—',c:'#888'});
    lbPicker('Pin to a step? (optional)',steps,function(st){

function wkAddKey(ev,D){ if(ev.key==='Enter'){ addPlannerTask(D, ev.target.value); ev.target.value=''; } }
// Outstanding steps dated before the shown week — the week view used to omit these entirely,
// so it and the daily notebook disagreed about what was still owed.
function wkOverdue(beforeD){
  var out=[], floor=addDays(beforeD,-CARRY_LOOKBACK_DAYS);
  Object.keys(LB.data.experiments).forEach(function(k){ var e=LB.data.experiments[k];
    (e.blocks||[]).forEach(function(b){
      if(b.date && b.date<beforeD && b.date>=floor && !b.done && !b.carryDismissed) out.push({exp:e,block:b});
    });
  });
  return out.sort(function(a,b){ return (a.block.date||'').localeCompare(b.block.date||''); });
}
// One step chip, shared by the day columns and the overdue strip.

    +' oncontextmenu="wkCtxBlock(event,\''+e.id+'\',\''+b.id+'\')"'

// ── Drag a step or a task onto another day ──
var WK_DRAG=null;
function wkDragStart(ev,kind,a,b){ WK_DRAG={kind:kind,a:a,b:b};

function wkDragOver(ev,D){ if(!WK_DRAG) return; ev.preventDefault();
  var col=ev.currentTarget.closest('.wk-col'); if(col&&!col.classList.contains('wk-over')){ _wkClearOver(); col.classList.add('wk-over'); } }
function wkDrop(ev,D){ if(!WK_DRAG) return; ev.preventDefault(); _wkClearOver(); wkMoveTo(D); }
function wkMoveTo(D){
  var d=WK_DRAG; WK_DRAG=null; if(!d) return;
  if(d.kind==='task'){ var t=plannerTasks()[d.a]; if(t&&t.date!==D){ t.date=D; t.updated=Date.now(); save(); renderEditor(); toast('Task moved to '+fmtDate(D)); } return; }
  var f=blockFinder(d.a,d.b); if(!f||f.block.date===D) return;

// Touch equivalent — HTML5 drag events never fire from a finger.
(function(){
  var src=null;
  document.addEventListener('touchstart',function(e){
    var chip=e.target.closest&&e.target.closest('.wk-blk,.wk-task'); if(!chip) return;
    if(e.target.closest('.wk-cb,.wk-sn,.wk-del,.wk-lnk,[contenteditable]')) return;
    src=chip;
    if(chip.classList.contains('wk-task')) WK_DRAG={kind:'task',a:chip.getAttribute('data-id')};
    else WK_DRAG={kind:'blk',a:chip.getAttribute('data-exp'),b:chip.getAttribute('data-blk')};
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!src||!WK_DRAG) return;
    var t=e.touches[0], n=document.elementFromPoint(t.clientX,t.clientY);
    var col=n&&n.closest?n.closest('.wk-col'):null;
    if(col){ e.preventDefault(); if(!col.classList.contains('wk-over')){ _wkClearOver(); col.classList.add('wk-over'); } }
  },{passive:false});
  document.addEventListener('touchend',function(e){
    if(!src){ return; }
    var over=document.querySelector('.wk-col.wk-over');
    src=null; _wkClearOver();
    if(over&&WK_DRAG) wkMoveTo(over.getAttribute('data-date')); else WK_DRAG=null;
  });
})();

function buildWeekPrintDoc(){
  var mon=wkMonday(WK_ANCHOR||todayStr()), today=todayStr();
  var days=[]; for(var i=0;i<7;i++) days.push(addDays(mon,i));
  var range=fmtDate(days[0])+' – '+fmtDate(days[6]);
  var h=WK_PRINT_CSS+'<div class="wp-head"><div class="wp-kicker">Week planner</div><div class="wp-title">'+esc(range)+'</div></div><div class="wp-grid">';
  h+=days.map(function(D,i){
    var d=new Date(D+'T00:00:00'), weekend=i>=5, isToday=D===today;
    var blks=blocksForDate(D).map(function(bt){ var e=bt.exp,b=bt.block; var p=projById(e.projectId); var pc=(p&&p.color)||'#4f9d8f';
      return '<div class="wp-blk'+(b.done?' done':'')+'" style="border-left-color:'+pc+'"><span class="wp-box"></span><b>'+esc(e.code||e.title||'Exp')+'</b>'+(b.title?'<span>'+esc(b.title)+'</span>':'')+'</div>'; }).join('');
    var tks=tasksForDate(D).map(function(t){ var ex=''; if(t.expId){ var le=LB.data.experiments[t.expId]; if(le) ex=' <span class="wp-ex">['+esc(le.code||le.title||'exp')+']</span>'; }
      return '<div class="wp-task'+(t.done?' done':'')+'"><span class="wp-box"></span><span>'+esc(t.text)+ex+'</span></div>'; }).join('');
    var body=blks+tks; if(!body) body='<div class="wp-empty">—</div>';
    return '<div class="wp-col'+(weekend?' wp-weekend':'')+(isToday?' wp-today':'')+'"><div class="wp-chd"><div class="wp-dow">'+WK_DOW[i]+'</div><div class="wp-dnum">'+d.getDate()+' '+d.toLocaleDateString('en-GB',{month:'short'})+'</div></div><div class="wp-body">'+body+'</div></div>';
  }).join('');
  h+='</div>';
  var od=wkOverdue(mon);
  if(od.length){
    h+='<div class="wp-od"><div class="wp-od-t">Still outstanding — '+od.length+' step'+(od.length!==1?'s':'')+' from before this week</div>';
    h+=od.map(function(x){ var p=projById(x.exp.projectId); var pc=(p&&p.color)||'#4f9d8f';
      return '<div class="wp-blk" style="border-left-color:'+pc+'"><span class="wp-box"></span><b>'+esc(x.exp.code||x.exp.title||'Exp')+'</b><span>'+esc(x.block.title||'')+' · '+esc(fmtDate(x.block.date))+'</span></div>'; }).join('');
    h+='</div>';
  }
  h+='<div class="wp-foot">'+_brand()+' · Week planner · exported '+fmtDate(todayStr())+'</div>';
  return h;
}

// Ticking the last box in a step's checklist completes the step; unticking one reopens it.
// The explicit flag is still the source of truth — this only keeps it in step with the boxes.
function _checklistDoneSync(ed){
  var ctx=(ed.getAttribute('data-ctx')||'').split(':'), expId=null, blkId=null;
  if(ctx[0]==='block'){ var ce=_curExp(); if(ce){ expId=ce.id; blkId=ctx[1]; } }
  else if(ctx[0]==='expblock'){ expId=ctx[1]; blkId=ctx[2]; }
  if(!expId||!blkId) return;
  var lis=ed.querySelectorAll('ul.lb-check > li, ul.lb-check ul > li');
  if(!lis.length) return;
  var all=true; for(var i=0;i<lis.length;i++) if(!lis[i].classList.contains('done')){ all=false; break; }
  var f=blockFinder(expId,blkId); if(!f || !!f.block.done===all) return;
  // Re-render so the step leaves (or rejoins) the carry-over list immediately.
  setBlockDone(expId,blkId,all);
}
document.addEventListener('click',function(e){
  // Checklist: click the checkbox zone (left marker area) of a lb-check <li>
  var cli=e.target.closest && e.target.closest('li');
  if(cli && cli.closest('ul.lb-check')){ var r=cli.getBoundingClientRect(); var pl=parseFloat(getComputedStyle(cli).paddingLeft)||26; if(e.clientX-r.left<=pl && (e.clientY-r.top)<=Math.max(pl,parseFloat(getComputedStyle(cli).lineHeight)||22)){ cli.classList.toggle('done'); var edc=cli.closest('.rt'); if(edc){ edc.dispatchEvent(new Event('input')); _checklistDoneSync(edc); } return; } }
  // Legacy .lb-todo/.lb-box lists: nothing creates them any more, but old notebooks may still
  // contain them, so they stay tickable.
  if(e.target.classList && e.target.classList.contains('lb-box')){ var td=e.target.closest('.lb-todo'); if(td){ td.classList.toggle('done'); var ed=e.target.closest('.rt'); if(ed) ed.dispatchEvent(new Event('input')); } }
  var abx=e.target.closest && e.target.closest('.lb-ab');
  if(abx && abx.dataset.ab){ e.preventDefault(); var s=LB.data.generalSections.filter(function(x){return x.kind==='antibodies';})[0]; if(s){ window._abQ=(LB.data.antibodies[abx.dataset.ab]||{}).name||''; selectNode('general','',s.id); } return; }
  var a=e.target.closest && e.target.closest('a.lb-link');
  if(a){ e.preventDefault(); if(a.dataset.exp){ openExp(a.dataset.exp); } else if(a.dataset.page){ var pg=LB.data.pages[a.dataset.page]; if(pg){ selectNode('general','',pg.sectionId); SEL.page=a.dataset.page; renderAll(); } } else if(a.dataset.app){
      // Cross-app links only mean something when a host is there to route them. Standalone,
      // an embedded Archive can still answer a protocol link; anything else should say so
      // rather than look clickable and do nothing.
      var routed=false;
      try{ if(window.parent && window.parent!==window && window.parent.openApp){ window.parent.openApp(a.dataset.app, undefined, a.dataset.pid||undefined); routed=true; } }catch(err){}
      if(!routed && a.dataset.app==='protocols' && archiveEmbedded()){ selectNode('archive'); routed=true; }
      if(!routed) toast('That link opens "'+(a.dataset.app||'another app')+'", which isn\'t part of this build.');
    } }
});

// ── Image attachments (paste / drag-drop, stored in IndexedDB) ──
var _attDBPromise=null;
function _attDB(){ if(_attDBPromise) return _attDBPromise; _attDBPromise=new Promise(function(res,rej){ var r=indexedDB.open('lb_att',1); r.onupgradeneeded=function(){ if(!r.result.objectStoreNames.contains('att')) r.result.createObjectStore('att'); }; r.onsuccess=function(){ var db=r.result; db.onclose=function(){ _attDBPromise=null; }; res(db); }; r.onerror=function(){ _attDBPromise=null; rej(r.error); }; }); return _attDBPromise; }
// Storing a file must never fail quietly — losing a gel image without being told is the worst
// thing this app can do. Resolves true on success, false (loudly) on failure.
function _attPut(id,dataURL){ return _attDB().then(function(db){ return new Promise(function(res){
  var t=db.transaction('att','readwrite').objectStore('att').put(dataURL,id);
  t.onsuccess=function(){ res(true); };
  t.onerror=function(){ _storageFailed(t.error); res(false); };
}); }).catch(function(err){ _storageFailed(err); return false; }); }
var _storageWarned=false, _storageBroken=false;
function _storageFailed(err){
  var quota=err&&(err.name==='QuotaExceededError'||/quota/i.test(err.name||err.message||''));
  _storageBroken=true; updateStatus();
  if(_storageWarned){ toast(quota?'Storage full — that file was not saved':'That file was not saved'); return; }
  _storageWarned=true;
  lbAlert(quota
    ? 'Your browser storage is full, so that file could NOT be saved. Nothing you already had is lost, but new images and files will not stick until you free space — export a backup, then delete attachments you no longer need.'
    : 'That file could not be saved to this browser ('+((err&&(err.name||err.message))||'unknown error')+'). Do not rely on it being kept.',
    {title:'Attachment NOT saved',danger:true,ok:'I understand'});
}
// Rough space check before accepting a large file.
function _storageRoom(bytes){
  try{ if(!navigator.storage||!navigator.storage.estimate) return Promise.resolve(true);
    return navigator.storage.estimate().then(function(est){
      if(!est||!est.quota) return true;
      return (est.usage||0)+bytes < est.quota*0.92;
    }).catch(function(){ return true; });
  }catch(e){ return Promise.resolve(true); }
}
function _attGet(id){ return _attDB().then(function(db){ return new Promise(function(res){ var t=db.transaction('att','readonly').objectStore('att').get(id); t.onsuccess=function(){res(t.result||null);}; t.onerror=function(){res(null);}; }); }).catch(function(){return null;}); }

function _compressImage(file){ return new Promise(function(res,rej){ var url=URL.createObjectURL(file); var img=new Image(); img.onload=function(){ URL.revokeObjectURL(url); var max=1400,w=img.naturalWidth,h=img.naturalHeight; if(w>max||h>max){ var s=Math.min(max/w,max/h); w=Math.round(w*s); h=Math.round(h*s); } var c=document.createElement('canvas'); c.width=w||1; c.height=h||1; try{ c.getContext('2d').drawImage(img,0,0,w,h); }catch(e){ return rej(e); } var out; try{ out=c.toDataURL('image/jpeg',0.85); if(!out||out.length<40) out=c.toDataURL('image/png'); }catch(e2){ return rej(e2); } res(out); }; img.onerror=function(){ URL.revokeObjectURL(url); rej(); }; img.src=url; }); }
// Firebase Storage sync (works once Jon enables Storage in the console; degrades to
// device-local IndexedDB otherwise). IDB stays the fast local cache; the small
// {id:{url}} map in LB.data.attachments syncs cross-device via RTDB + appears in backups.
var _lbStore=null,_lbStoreTried=false;
function lbStorage(){ if(_lbStoreTried) return _lbStore; _lbStoreTried=true; try{ if(window.parent && window.parent.firebase && window.parent.firebase.storage){ _lbStore=window.parent.firebase.storage(); } }catch(e){ _lbStore=null; } return _lbStore; }
function _attUpload(id,dataURL){ var st=lbStorage(); if(!st){ _cloudUnavailable('no storage configured'); return Promise.resolve(null); }
  try{ var ref=st.ref('labbook/'+id); return ref.putString(dataURL,'data_url').then(function(){ return ref.getDownloadURL(); }).then(function(url){ (LB.data.attachments||(LB.data.attachments={}))[id]={url:url}; save(); _cloudWarned=true; return url; }).catch(function(err){ _cloudUnavailable(err); return null; }); }catch(e){ _cloudUnavailable(e); return Promise.resolve(null); } }
// Cloud copy is a bonus on top of local IndexedDB + backups, so a failure is not fatal — but
// say it once, otherwise "why are my images missing on my laptop?" is unanswerable.
var _cloudWarned=false;
function _cloudUnavailable(err){ if(_cloudWarned) return; _cloudWarned=true;

// ── Inline math (OneNote-style): type a simple sum ending in "=" and it appends the result. ──
function _fmtMath(x){ if(!isFinite(x)) return null; var r=parseFloat(x.toFixed(10)); return (Object.is(r,-0)?0:r).toString(); }
function _safeMath(expr){ expr=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/\s+/g,''); if(!expr) return null;
  if(!/^[0-9.()+\-*/]+$/.test(expr)) return null;              // arithmetic charset only — never eval free text
  if(!/[+\-*/]/.test(expr) || !/[0-9]/.test(expr)) return null;// need an operator and a digit
  if(/[+\-*/]{3,}/.test(expr)) return null;
  try{ var v=Function('"use strict";return('+expr+')')(); return (typeof v==='number')?_fmtMath(v):null; }catch(e){ return null; } }
var _mathBusy=false;
document.addEventListener('input',function(e){ if(_mathBusy) return; var ed=e.target && e.target.closest && e.target.closest('.rt'); if(!ed) return;
  if(e.inputType!=='insertText' || e.data!=='=') return;
  var sel=window.getSelection(); if(!sel||!sel.rangeCount) return; var node=sel.anchorNode; if(!node||node.nodeType!==3) return;
  var off=sel.anchorOffset; var before=node.textContent.slice(0,off); var m=before.match(/([0-9.\s()+\-*/×÷]{1,40})=$/); if(!m) return;
  var res=_safeMath(m[1]); if(res==null) return;
  _mathBusy=true;
  try{ var r=sel.getRangeAt(0); var tn=document.createTextNode(res); r.insertNode(tn); r.setStartAfter(tn); r.setEndAfter(tn); sel.removeAllRanges(); sel.addRange(r); ed.dispatchEvent(new Event('input')); }catch(_e){}
  _mathBusy=false; }, true);

// ── Archive bridge ──────────────────────────────────────────────────────
// Archive publishes ARCHIVE_INDEX/CALC/CALC_SCHEMA/COMPUTE/STEPS onto ITS window.parent.
// That means an Archive running in an iframe *inside Labbook* publishes straight onto this
// window — so the standalone build embeds Archive verbatim (no forking, no CSS surgery) and
// every consumer below keeps working unchanged. Inside dHUB the placeholder stays empty and we
// use the shell's Archive instead.
var ARCHIVE_B64 = "";           // filled by embed.py for the standalone build
var _arcFrame=null, _arcLoading=false;
function _arcHasLocal(){ try{ return !!(window.ARCHIVE_INDEX && window.ARCHIVE_INDEX.length); }catch(e){ return false; } }
// Whichever window is actually holding the Archive globals.
function _arcWin(){ if(_arcHasLocal()) return window; try{ return window.parent||window; }catch(e){ return window; } }
function archiveEmbedded(){ return !!ARCHIVE_B64; }
// Create (once) the hidden iframe that hosts Archive's document. Kept in the DOM so the
// scraper bridge (ARCHIVE_STEPS/COMPUTE walk Archive's live DOM) has something to read.
function _arcEnsureFrame(){
  if(_arcFrame||!ARCHIVE_B64) return _arcFrame;
  var host=el('arc-host'); if(!host) return null;
  _arcFrame=document.createElement('iframe');
  _arcFrame.id='arc-frame';
  _arcFrame.setAttribute('sandbox','allow-scripts allow-same-origin allow-downloads allow-forms allow-modals allow-popups');
  _arcFrame.srcdoc=decodeB64(ARCHIVE_B64);
  host.appendChild(_arcFrame);
  return _arcFrame;
}
function decodeB64(b64){
  var bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
// Ensure Archive is loaded, then run cb(ok).
function ensureArchive(cb){
  cb=cb||function(){};
  if(_arcHasLocal()) return cb(true);
  try{ if(window.parent && window.parent!==window && (window.parent.ARCHIVE_INDEX||[]).length){ cb(true); return; } }catch(e){}
  if(ARCHIVE_B64){
    _arcEnsureFrame();
    var t=0; (function poll(){ t++; if(_arcHasLocal()) return cb(true); if(t>60) return cb(false); setTimeout(poll,100); })();
    return;
  }
  try{ if(window.parent && window.parent.hubEnsureApp) window.parent.hubEnsureApp('protocols'); }catch(e2){}
  var tries=0; (function poll2(){ tries++; var ok=false; try{ ok=(window.parent.ARCHIVE_INDEX||[]).length>0; }catch(e){} if(ok) return cb(true); if(tries>20) return cb(false); setTimeout(poll2,150); })();
}
// The browsable Archive view — the point of embedding it is being able to look a protocol up,
// on a phone, without the notebook getting in the way.
function renderArchiveView(host){
  (el('export-btn')||{style:{}}).style.display='none';
  if(!archiveEmbedded()){
    host.innerHTML='<div class="ed-empty"><div class="t">Archive isn\'t part of this build</div><div>This build reads the protocol library from its host application.</div></div>';
    return;
  }
  host.innerHTML='<div class="arc-view"><div id="arc-mount" class="arc-mount"></div></div>';
  _arcEnsureFrame();
  var mount=el('arc-mount');
  if(_arcFrame && mount && _arcFrame.parentNode!==mount) mount.appendChild(_arcFrame);
  if(_arcFrame){ _arcFrame.classList.add('arc-visible'); }
  renderDockPanels();
}
// Park the frame back in the hidden host so it keeps living (and keeps its state) between views.
function _arcPark(){
  var host=el('arc-host');
  if(_arcFrame&&host&&_arcFrame.parentNode!==host){ _arcFrame.classList.remove('arc-visible'); host.appendChild(_arcFrame); }
}

    var data = (parsed && parsed._lbBackup && parsed.data) ? parsed.data
             : (parsed && parsed.journal && parsed.journal.labbook) ? parsed.journal.labbook : parsed;
    if(!data || typeof data!=='object' || !('experiments' in data)){ toast('That file doesn\'t look like a Labbook backup.'); return; }
    var nBlob=blobs?Object.keys(blobs).length:0;
    var warn=blobs
      ? ('It contains '+nBlob+' attachment'+(nBlob!==1?'s':'')+', which will be restored too.')
      : 'This is an older backup with no attachment data — images and files will come back as empty placeholders.';
    lbConfirm('Restore this backup? This REPLACES your entire current notebook — anything added since this backup was made will be lost unless it\'s in another backup.\n\n'+warn,{danger:true,title:'Restore from backup',ok:'Replace everything'}).then(function(ok){
      if(!ok) return;
      // Write the attachment bytes back into IndexedDB before swapping the tree, so the
      // reload finds them already in place.
      var ids=blobs?Object.keys(blobs):[];
      Promise.all(ids.map(function(id){ return _attPut(id,blobs[id]); })).then(function(results){
        var failed=results.filter(function(x){ return x===false; }).length;
        LB.data=data; save();
        if(failed){ lbAlert(failed+' of '+ids.length+' attachments could not be written to this browser\'s storage — the notebook text restored fine, but those images will be missing. Free up space and restore again.',{title:'Some attachments not restored',danger:true}).then(function(){ location.reload(); }); return; }
        toast('Restored'+(ids.length?(' with '+ids.length+' attachment'+(ids.length!==1?'s':'')):'')+' — reloading…');
        setTimeout(function(){ location.reload(); },600);
      });
    });
  };
  reader.onerror=function(){ toast('Could not read that file.'); };
  reader.readAsText(file);
}
// Daily safety net.
//
// Two things were wrong here. It only ran when the File System Access API existed, so on
// Firefox and Safari — where the backup file is the ONLY durability guarantee — no automatic
// backup ever happened, silently. And when a folder had never been chosen it fell through to
// _download(), so a fresh install spat a JSON file into Downloads on first load with no user
// action. Now: write to the folder if we have one, otherwise keep a rolling snapshot in
// IndexedDB and ask (once) for somewhere real to put it.
function maybeAutoBackup(){
  var last=''; try{ last=localStorage.getItem('lb_last_backup')||''; }catch(e){}
  if(last===todayStr()) return;
  var pb=_parentBackup();
  if(pb&&pb.writeFile){ doBackup(false); return; }
  (typeof window.showDirectoryPicker==='function' ? _idbGet() : Promise.resolve(null))
    .catch(function(){ return null; })
    .then(function(h){
      if(h){ doBackup(false); return; }          // folder already chosen — normal path
      return _snapshotBackup().then(function(ok){ if(ok) _nudgeBackupFolder(); });
    });
}
// Rolling local snapshot: not a substitute for a real backup file, but it means a browser that
// can't write to disk still has yesterday's notebook recoverable.
function _snapshotBackup(){
  return _buildBackupPayload().then(function(r){
    return _idb().then(function(db){
      return new Promise(function(res){
        try{
          var tx=db.transaction('h','readwrite').objectStore('h');
          tx.put({at:Date.now(),date:todayStr(),json:JSON.stringify(r.payload)},'snapshot:'+todayStr());
          // Keep the last 3 days only — this data is large.
          var all=tx.getAllKeys?tx.getAllKeys():null;
          if(all) all.onsuccess=function(){
            var keys=(all.result||[]).filter(function(k){ return String(k).indexOf('snapshot:')===0; }).sort();
            var extra=keys.length-3;
            for(var i=0;i<extra;i++){ try{ db.transaction('h','readwrite').objectStore('h').delete(keys[i]); }catch(e){} }
          };
          tx.transaction.oncomplete=function(){ try{ localStorage.setItem('lb_last_backup',todayStr()); }catch(e){} res(true); };
          tx.transaction.onerror=function(){ res(false); };
        }catch(e){ res(false); }
      });
    });
  }).catch(function(){ return false; });
}
// Ask once — never on every load — for a folder to keep real backup files in.
function _nudgeBackupFolder(){
  try{ if(localStorage.getItem('lb_backup_nudged')==='1') return; localStorage.setItem('lb_backup_nudged','1'); }catch(e){}
  var canPick=(typeof window.showDirectoryPicker==='function');
  lbAlert(canPick
    ? 'Your notebook is saved in this browser, and a daily snapshot is kept here too — but that all lives on this one device. Use Backup (in the View tab) to choose a folder for real backup files.'
    : 'Your notebook is saved in this browser, and a daily snapshot is kept here too — but that all lives on this one device, and this browser cannot write backup files automatically. Use Backup (in the View tab) now and then to download one.',
    {title:'Keep a backup somewhere else'});
}
// Recover from the rolling snapshot when there is no backup file to hand.
function restoreFromSnapshot(){
  _idb().then(function(db){
    var os=db.transaction('h','readonly').objectStore('h');
    if(!os.getAllKeys){ toast('No snapshots available in this browser.'); return; }
    var rq=os.getAllKeys();
    rq.onsuccess=function(){
      var keys=(rq.result||[]).filter(function(k){ return String(k).indexOf('snapshot:')===0; }).sort().reverse();
      if(!keys.length){ toast('No local snapshots yet.'); return; }
      var items=keys.map(function(k){ return {id:k,label:fmtDate(String(k).slice(9)),sub:'local snapshot',ic:'↻',c:'#4f9d8f'}; });
      lbPicker('Restore a local snapshot',items,function(it){
        db.transaction('h','readonly').objectStore('h').get(it.id).onsuccess=function(ev){
          var rec=ev.target.result; if(!rec||!rec.json){ toast('That snapshot could not be read.'); return; }
          var blob=new Blob([rec.json],{type:'application/json'});
          restoreFromBackupFile(new File([blob],'snapshot-'+String(it.id).slice(9)+'.json'));
        };
      });
    };
  }).catch(function(){ toast('Could not open local snapshots.'); });
}

var _toastT=null; function toast(msg){ var t=el('lb-toast'); if(!t){ t=document.createElement('div'); t.id='lb-toast'; t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--text);border:1px solid var(--border2);box-shadow:var(--shadow-md);border-radius:10px;padding:10px 16px;font-size:13px;z-index:400;opacity:0;transition:opacity .2s'; document.body.appendChild(t); } t.textContent=msg; t.style.opacity='1'; clearTimeout(_toastT); _toastT=setTimeout(function(){t.style.opacity='0';},2600); }
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
  var next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{ localStorage.setItem('hub_theme',next); }catch(e){}
  renderRibbon();
}
function _themeIsDark(){ return document.documentElement.getAttribute('data-theme')==='dark'; }
function updateNet(){ updateStatus(); }
window.addEventListener('online',updateNet); window.addEventListener('offline',updateNet);

// ── Init ──
function renderAll(){ renderSections(); renderPages(); renderEditor(); }
if(maybeSeed()) save();
applyLayout(); renderPanels(); renderAll();
lbInitSync();
setTimeout(maybeAutoBackup,1500);
setTimeout(gcAttachments,4000);
// Deep-link: another app (e.g. Plasmids "Used in") can open a specific experiment/page.
window.addEventListener('message', function(e){ if(e.data && e.data.type==='switchTab' && e.data.item){ var id=String(e.data.item);
  if(LB.data.experiments[id]){ openExp(id); }
  else if(LB.data.pages[id]){ selectPage(id); }
  else { jumpCode(id); }
} });

// Fast custom tooltips — native title= lags ~1.5s; show ours after 140ms.
(function(){ var tip=null, showT=null;
  function ensure(){ if(!tip){ tip=document.createElement('div'); tip.id='lb-tip'; document.body.appendChild(tip); } return tip; }
  document.addEventListener('mouseover', function(e){ var b=e.target.closest && e.target.closest('[title]'); if(!b) return; var txt=b.getAttribute('title'); if(!txt) return;
    b.setAttribute('data-otitle', txt); b.removeAttribute('title');
    clearTimeout(showT); showT=setTimeout(function(){ var t=ensure(); t.textContent=b.getAttribute('data-otitle')||txt; var r=b.getBoundingClientRect(); t.style.left=Math.max(60,Math.min(r.left+r.width/2, window.innerWidth-60))+'px'; t.style.top=(r.bottom+7)+'px'; t.classList.add('on'); }, 140);
  });
  document.addEventListener('mouseout', function(e){ var b=e.target.closest && e.target.closest('[data-otitle]'); if(!b) return; clearTimeout(showT); if(tip) tip.classList.remove('on'); var o=b.getAttribute('data-otitle'); if(o!=null){ b.setAttribute('title',o); b.removeAttribute('data-otitle'); } });
})();
</script>
