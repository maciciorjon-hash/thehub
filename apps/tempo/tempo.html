<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempo — Kinetic degradation</title>
<!-- Excel is one of this app's inputs. Inside dHUB the shell already carries SheetJS and a srcdoc iframe
     is same-origin, so take that copy first; the tag below stays for standalone use and, when it loads,
     simply replaces this with the same library at the same version. -->
<script>(function(){ try{ if(window.parent&&window.parent!==window&&window.parent.XLSX){ window.XLSX=(window.parent.hubXLSX?window.parent.hubXLSX():window.parent.XLSX); } }catch(e){} })();</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

:root{
  /* the shared type and radius scales — see docs/UI.md */
  --fs-1:10px;--fs-2:11px;--fs-3:12px;--fs-4:13px;--fs-5:15px;--fs-6:17px;--fs-7:20px;--fs-8:26px;--fs-9:38px;
  --r-1:4px;--r-2:6px;--r-3:9px;--r-4:13px;--r-full:999px;
  --bg:#f4f5f8; --surface:#ffffff; --surface2:#f0f1f5; --surface3:#e4e6ee;
  --border:rgba(0,0,0,0.07); --border2:rgba(0,0,0,0.13);
  --text:#1a1d2e; --text2:#4f5470; --text3:#5f647e;
  --brand:#c26d3a; --accent:#4b76b5;--on-accent:#ffffff; --accent-dim:rgba(75,118,181,0.12); --accent-soft:rgba(75,118,181,0.22);
  --good:#238150; --warn:#a8650f; --danger:#c04040;
  --accent-ink:#36609f; --good-ink:#176c42; --warn-ink:#8a4f08;   /* the accent and the state colours AS TEXT: fills keep the plain tokens */
  --sans:'IBM Plex Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow-xs:0 1px 4px rgba(0,0,0,.04); --shadow-sm:0 2px 8px rgba(0,0,0,.06); --shadow-md:0 6px 24px rgba(0,0,0,.09); --shadow-lg:0 16px 48px rgba(0,0,0,.14);
  --shadow-xl:0 32px 80px rgba(0,0,0,.22); --modal-backdrop:rgba(0,0,0,.45); --mid:var(--warn); --poor:var(--danger);   /* the names the Setup kit says them by */
  --ease:cubic-bezier(.2,.8,.3,1); --ease-out:cubic-bezier(.16,1,.3,1); --dur-1:120ms; --dur-2:200ms; --dur-3:300ms;
}
html[data-theme="dark"]{
  --bg:#0d0f14; --surface:#13161e; --surface2:#1c2030; --surface3:#252a3a;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --text:#e8eaf2; --text2:#a8adc4; --text3:#9096ad;
  --accent:#8aaee0;--on-accent:#0d0f14; --accent-dim:rgba(138,174,224,0.16); --accent-soft:rgba(138,174,224,0.26);
  --good:#6ddca8; --warn:#f0b060; --danger:#f08a84;
  --accent-ink:#8aaee0; --good-ink:#6ddca8; --warn-ink:#f0b060;
  --shadow-xs:0 1px 4px rgba(0,0,0,.30); --shadow-sm:0 2px 8px rgba(0,0,0,.40); --shadow-md:0 6px 24px rgba(0,0,0,.50); --shadow-lg:0 16px 48px rgba(0,0,0,.55);
  --shadow-xl:0 32px 80px rgba(0,0,0,.65); --modal-backdrop:rgba(0,0,0,.65);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:var(--sans);font-size:var(--fs-4);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;}
::placeholder{color:color-mix(in srgb,var(--text2) 80%,var(--surface));}

/* ── Header ─────────────────────────────────────── */
header{min-height:48px;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
.logo{width:32px;height:32px;border-radius:var(--r-1);background:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;}
.logo svg{width:19px;height:19px;}
.app-name{font-size:var(--fs-5);font-weight:600;letter-spacing:-0.2px;cursor:pointer;white-space:nowrap;}
.app-sub{font-size:var(--fs-2);color:var(--text2);}
.hdr-spacer{flex:1;}
.hdr-chip{font-family:var(--mono);font-size:var(--fs-2);color:var(--text2);padding:4px 10px;border-radius:var(--r-full);background:var(--surface2);border:1px solid var(--border);white-space:nowrap;}
.hdr-chip b{color:var(--text);font-weight:600;}
@media(max-width:560px){header .app-sub{display:none;}}
@media(max-width:480px){.hdr-chip{display:none;}}

/* ── Tabs: text over a rail, one underline that travels ───────────────── */
.tabbar{position:relative;display:flex;align-items:center;gap:2px;padding:0 clamp(12px,2.5vw,40px);background:var(--surface);border-bottom:1px solid var(--border);}
.tab{display:flex;align-items:center;gap:7px;height:40px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:none;font-size:var(--fs-4);font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;transition:color var(--dur-1) var(--ease);}
.tab svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--text);font-weight:600;}
.tab .badge{font-family:var(--mono);font-size:var(--fs-1);font-weight:600;padding:1px 6px;border-radius:var(--r-full);background:var(--accent-dim);color:var(--accent-ink);}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--r-1);}
.tab-ink{position:absolute;left:0;bottom:-1px;width:1px;height:2px;background:var(--accent);transform-origin:left center;transition:transform var(--dur-2) var(--ease);pointer-events:none;}
.tab-end{margin-left:auto;display:flex;gap:8px;align-items:center;padding:4px 0;}
/* five views and Set up share one line down to a tablet: closer, before the phone rule wraps them. 9px left the bar 21px wider than a 768px window in a wide system font (DejaVu, as on CI) */
@media (max-width:900px) and (min-width:761px){.tabbar{padding:0 10px;gap:0;} .tab{padding:0 6px;gap:5px;} .tab-end{gap:6px;}}

.main{max-width:1680px;margin:0 auto;padding:20px clamp(14px,2.5vw,40px) 70px;}
.tabpane{display:none;}
.tabpane.active{display:block;}

/* ── Surfaces and controls ─────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);padding:18px;box-shadow:var(--shadow-xs);min-width:0;}
.card + .card{margin-top:14px;}
.card h3{margin:0 0 10px;font-size:var(--fs-5);font-weight:600;letter-spacing:-.1px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
.card h3 .sub select{max-width:100%;min-width:0;flex:1 1 120px;}
.card h3 .sub{font-size:var(--fs-2);color:var(--text2);font-weight:400;margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;min-width:0;max-width:100%;justify-content:flex-end;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 14px;border-radius:var(--r-1);border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:var(--fs-3);font-weight:600;cursor:pointer;white-space:nowrap;transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease),transform var(--dur-1) var(--ease);}
.btn:hover{background:var(--surface3);}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 86%,var(--text));border-color:color-mix(in srgb,var(--accent) 86%,var(--text));}
.btn.sm{height:28px;padding:0 10px;font-size:var(--fs-2);}
.btn[disabled]{opacity:.45;pointer-events:none;}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
/* one focus ring for everything a keyboard can reach that is not a field: chips, rows, sortable headers, wells, chart marks */
[tabindex]:focus-visible,[role=button]:focus-visible,summary:focus-visible,a:focus-visible,.cv-item:focus-visible,.segw button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.tbl tbody tr.pick:focus-visible{outline-offset:-2px;} .tbl th[tabindex]:focus-visible{outline-offset:-2px;}
svg [tabindex]:focus-visible{outline:none;} svg [tabindex]:focus-visible circle:first-child,svg rect[tabindex]:focus-visible{stroke:var(--accent);stroke-width:3.2;}
.inp{height:32px;padding:0 9px;border:1px solid var(--border2);border-radius:var(--r-1);background:var(--surface2);color:var(--text);font-family:inherit;font-size:var(--fs-3);min-width:0;max-width:100%;}
.inp:focus{outline:none;border-color:var(--accent);}
.inp:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.inp.mono{font-family:var(--mono);}
select.inp{padding-right:6px;}
.segw{display:flex;flex-wrap:wrap;gap:6px;}
.segw button{height:30px;padding:0 12px;border:1px solid var(--border2);border-radius:var(--r-full);background:var(--surface);color:var(--text);font-size:var(--fs-3);font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background var(--dur-1) var(--ease),color var(--dur-1) var(--ease);}
.segw button:hover{background:var(--surface2);} .segw button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.ico-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;border-radius:var(--r-2);background:none;color:var(--text3);cursor:pointer;transition:background var(--dur-1) var(--ease),color var(--dur-1) var(--ease);}
.ico-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.ico-btn:hover{background:var(--surface2);color:var(--text);}

.fld{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-2);color:var(--text2);font-weight:600;min-width:0;}
.fld > .inp{font-weight:400;color:var(--text);}
.frow{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.hint{font-size:var(--fs-2);color:var(--text2);line-height:1.5;}
.mono{font-family:var(--mono);}
.muted{color:var(--text2);}
.sec-hd{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;flex-wrap:wrap;}
.sec-hd h2{margin:0;font-size:var(--fs-6);font-weight:600;letter-spacing:-.2px;}
.sec-hd .sec-sub{font-size:var(--fs-3);color:var(--text2);}

.tbl-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-4);}
.tbl th{font-size:var(--fs-2);font-weight:700;color:var(--text2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border2);white-space:nowrap;position:sticky;top:0;background:var(--surface);z-index:1;}
.tbl th[data-k]{cursor:pointer;} .tbl th[data-k]:hover{color:var(--text);}
.tbl th .ar{margin-left:3px;color:var(--text);}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.tbl tbody tr:last-child td{border-bottom:0;}
.tbl tbody tr.pick{cursor:pointer;} .tbl tbody tr.pick:hover td{background:var(--surface2);}
.tbl tbody tr.on td{background:var(--accent-dim);}
.tbl .num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
.tbl th.num{text-align:right;}
.tbl .nm{font-weight:600;}
.tbl .sub{display:block;font-size:var(--fs-2);color:var(--text2);font-weight:400;margin-top:1px;}
.tbl tr.off td{color:var(--text3);}

.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--r-full);font-family:var(--mono);font-size:var(--fs-1);font-weight:600;white-space:nowrap;color:var(--pt,var(--pc,var(--text2)));background:color-mix(in srgb,var(--pc,var(--text2)) 14%,transparent);}
.pill.good{--pc:var(--good);--pt:var(--good-ink);} .pill.warn{--pc:var(--warn);--pt:var(--warn-ink);} .pill.bad{--pc:var(--danger);} .pill.acc{--pc:var(--accent);--pt:var(--accent-ink);}
.note-list{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;}
.note-list li{font-size:var(--fs-3);line-height:1.45;color:var(--text2);padding-left:14px;position:relative;}
.note-list li::before{content:'';position:absolute;left:2px;top:.55em;width:5px;height:5px;border-radius:50%;background:var(--warn);}
.note-list li.ok::before{background:var(--good);}

.empty-state{text-align:center;padding:56px 20px;color:var(--text2);}
.empty-state > svg{width:44px;height:44px;stroke:var(--text3);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.5;margin-bottom:12px;}
.empty-state .es-t{font-size:var(--fs-5);font-weight:600;color:var(--text);margin-bottom:4px;}
.empty-state .es-s{font-size:var(--fs-3);max-width:50ch;margin:0 auto 18px;line-height:1.5;}
.empty-state .es-a{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:var(--r-2);font-size:var(--fs-3);box-shadow:var(--shadow-lg);z-index:2300;opacity:0;pointer-events:none;transition:opacity var(--dur-2) var(--ease),transform var(--dur-2) var(--ease-out);max-width:min(560px,calc(100vw - 32px));}
.toast.show{opacity:1;transform:translateX(-50%);}
.toast.err{background:var(--danger);color:var(--on-accent);}
.toast.warn{background:var(--warn);color:var(--on-accent);}
#tp-notices{position:relative;z-index:15;}
.dep-notice{display:flex;align-items:flex-start;gap:10px;padding:9px clamp(14px,2.5vw,40px);background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--warn) 35%,var(--border));font-size:var(--fs-3);color:var(--text);line-height:1.45;}
.dep-notice b{font-weight:600;}
.dep-notice button{transition:color var(--dur-1) var(--ease);margin:-4px 0 -4px auto;border:0;background:none;color:var(--text2);cursor:pointer;font-size:var(--fs-5);line-height:1;padding:0;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;flex:none;}

/* One gear in every app's header: the panel behind it holds the theme switch. */
.opts-btn{background:none;border:1px solid var(--border2);color:var(--text2);width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;transition:background var(--dur-1) var(--ease),color var(--dur-1) var(--ease);}
.opts-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.opts-btn:hover{background:var(--surface2);color:var(--text);}
.opts-panel{display:none;position:fixed;top:58px;right:0;background:var(--surface);border:1px solid var(--border2);border-radius:0 0 0 var(--r-2);padding:14px 18px;z-index:200;min-width:190px;box-shadow:var(--shadow-md);}
.opts-panel.open{display:block;}
.opts-row{display:flex;align-items:center;justify-content:space-between;gap:20px;}
.opts-label{font-size:var(--fs-4);color:var(--text2);}
.theme-switch{position:relative;display:inline-block;width:40px;height:22px;}
.theme-switch input{opacity:0;width:0;height:0;}
.theme-slider{position:absolute;cursor:pointer;inset:0;background:var(--surface3);border-radius:var(--r-4);transition:background var(--dur-2) var(--ease);border:1px solid var(--border2);}
.theme-slider:before{position:absolute;content:'';height:16px;width:16px;left:2px;top:2px;background:var(--text2);border-radius:50%;transition:transform var(--dur-2) var(--ease);}
.theme-switch input:checked+.theme-slider{background:var(--accent);}
.theme-switch input:checked+.theme-slider:before{transform:translateX(18px);background:#fff;}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important;}
}
html.theme-swap *,html.theme-swap *::before,html.theme-swap *::after{transition:none!important;}
[hidden]{display:none !important;}   /* an author rule such as .tab{display:flex} would otherwise beat the attribute */
.drop-veil{position:fixed;inset:0;z-index:2200;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 12%,rgba(10,12,18,.35));border:3px dashed var(--accent);opacity:0;pointer-events:none;transition:opacity var(--dur-1) var(--ease);font-size:var(--fs-6);font-weight:600;color:var(--text);}
.drop-veil.on{opacity:1;}

/* ── Plate tab ───────────────────────────────────── */
.pl-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.pl-top .btn.sm{height:32px;}
.pchip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 4px 0 12px;border:1px solid var(--border2);border-radius:var(--r-full);background:var(--surface);color:var(--text);font-size:var(--fs-3);font-weight:600;cursor:pointer;white-space:nowrap;transition:background var(--dur-1) var(--ease);}
.pchip:hover{background:var(--surface2);} .pchip[aria-pressed="true"]{background:var(--accent-dim);border-color:var(--accent);}
.pchip .x{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;color:var(--text2);cursor:pointer;font-size:var(--fs-5);line-height:1;}
.pchip .x:hover{background:var(--surface3);color:var(--text);}
.pl-grid{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:14px;align-items:start;}
.pl-grid > *{min-width:0;}
.pl-left{display:flex;flex-direction:column;gap:14px;min-width:0;} .pl-left .card+.card{margin-top:0;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:var(--fs-3);margin:0;}
.kv dt{color:var(--text2);} .kv dd{margin:0;font-family:var(--mono);text-align:right;overflow-wrap:anywhere;}
.plate-card .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.pgrid{display:grid;gap:3px;user-select:none;-webkit-user-select:none;touch-action:none;--wpx:34px;}
.pgrid .hd{display:flex;align-items:center;justify-content:center;font-size:var(--fs-1);color:var(--text3);font-family:var(--mono);cursor:pointer;min-height:16px;border-radius:var(--r-1);}
.pgrid .hd:hover{background:var(--surface2);color:var(--text);}
.w{position:relative;height:var(--wpx);border-radius:var(--r-2);background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:var(--fs-1);color:var(--text);overflow:hidden;cursor:pointer;}
.w.empty{background:transparent;border-style:dashed;}
.w.veh{background:repeating-linear-gradient(45deg,var(--surface3),var(--surface3) 4px,var(--surface2) 4px,var(--surface2) 8px);}
.w.bkg{background:color-mix(in srgb,var(--warn) 16%,var(--surface));border-color:color-mix(in srgb,var(--warn) 40%,var(--border));}
.w.blank{background:var(--surface);border-style:dotted;color:var(--text3);}
.w.sel{outline:2px solid var(--accent);outline-offset:-1px;z-index:1;}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-3);color:var(--text2);cursor:pointer;}
.chk input{width:16px;height:16px;accent-color:var(--accent);}
.w .rv{font-size:var(--fs-1);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.w.nrx{box-shadow:inset 0 0 0 3px var(--nc);}
.w.nry{outline:2px dashed var(--nc);outline-offset:-4px;}
.w.nrp{box-shadow:inset 0 0 0 3px var(--accent);border-style:dotted;}
.rule-list{display:flex;flex-direction:column;gap:6px;}
.rule-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-3);}
.rule-dot{width:10px;height:10px;border-radius:var(--r-1);flex:0 0 auto;}
.rule-n{font-weight:600;min-width:12px;}
.rule-by,.rule-cv{color:var(--text3);}
.rule-bad{color:var(--warn-ink,var(--warn));}
.rule-row .lnk{border:none;background:none;padding:0 2px;font-family:var(--mono);font-size:var(--fs-3);color:var(--accent-ink,var(--accent));text-decoration:underline;text-decoration-color:var(--border2);text-underline-offset:3px;cursor:pointer;}
.rule-row .btn{margin-left:auto;}

      if (rec && H.id !== rec.id) { H.id = rec.id; H.sig = ''; }
      if (rec && sig === H.sig) return Promise.resolve();
      var now = Date.now();
      var out = { id: rec ? rec.id : 'h' + now.toString(36) + Math.random().toString(36).slice(2, 6), dkey: cur.key || '', name: rec && rec.named && !cur.nameWins ? rec.name : (cur.name || 'Untitled ' + noun), named: !!(rec && rec.named),
        x: cur.x || null, bits: cur.bits || [], chips: cur.chips || [], files: cur.files || [], data: cur.data, created: rec ? rec.created : now, updated: now, pinned: rec ? !!rec.pinned : false };
      return req('readwrite', function(st){ return st.put(out); }).then(function(){
        H.id = out.id; H.sig = sig;
        var i = H.list.findIndex(function(r){ return r.id === out.id; }); if (i >= 0) H.list[i] = out; else H.list.push(out);
        sort();
        var over = H.list.length - MAX, drop = over > 0 ? H.list.filter(function(r){ return !r.pinned && r.id !== out.id; }).slice(-over) : [];
        if (drop.length) {
          H.list = H.list.filter(function(r){ return drop.indexOf(r) < 0; });
          return req('readwrite', function(st){ drop.forEach(function(r){ st.delete(r.id); }); });
        }
      }).then(changed).catch(function(e){
        H.broken = e;
        if (!H.warned) { H.warned = true; toast('History cannot be kept in this browser (' + ((e && e.message) || 'storage unavailable') + '). Save the project to keep your numbers.', 'err'); }
      });
    };
    H.open = function(id){
      var rec = find(id); if (!rec) return;
      clearTimeout(H.timer);
      H.quiet = Date.now() + 1200;
      var r; try { r = o.open(typeof structuredClone === 'function' ? structuredClone(rec.data) : rec.data, rec); } catch (e) { console.warn('History open:', e); r = false; }
      // open may answer straight away or with a promise (Tempo reads its plates in again before it can say).
      Promise.resolve(r).then(function(ok){
        if (ok === false) { toast('“' + rec.name + '” could not be opened.', 'err'); return; }
        var cur = null; try { cur = o.current(); } catch (e) {}
        H.id = rec.id; try { H.sig = JSON.stringify([rec.named && !(cur && cur.nameWins) ? rec.name : (cur && cur.name), cur && cur.data]); } catch (e) { H.sig = ''; }
        H.quiet = Date.now() + 1200;
        if (o.afterOpen) o.afterOpen(rec);

      }, function(e){ console.warn('History open:', e); toast('“' + rec.name + '” could not be opened.', 'err'); });
    };
    H.remove = function(id){
      var rec = find(id); if (!rec) return;
      ask('Delete “' + rec.name + '” from History?', 'Its readings and layout are deleted from this browser.' + (id === H.id ? ' It is the ' + noun + ' open now: it stays open, and the next change keeps it again as a new entry.' : ''), dlg({ ok: 'Delete', danger: true }), function(ok){
        if (!ok) return;
        req('readwrite', function(st){ return st.delete(id); }).then(function(){ H.list = H.list.filter(function(r){ return r.id !== id; }); if (id === H.id) { H.id = null; H.sig = ''; } changed(); });
      });
    };
    H.pin = function(id){
      var rec = find(id); if (!rec) return; rec.pinned = !rec.pinned;
      req('readwrite', function(st){ return st.put(rec); }).then(function(){ sort(); changed(); });
    };
    H.rename = function(id){
      var rec = find(id); if (!rec) return;
      ask('Rename this ' + noun, 'History keeps it under this name.', dlg({ input: true, value: rec.name, ok: 'Rename' }), function(ok, v){
        v = String(v || '').replace(/\s+/g, ' ').trim().slice(0, 80); if (!ok || !v || v === rec.name) return;
        rec.name = v; rec.named = true;

      });
    };
    H.render = function(){
      var root = rootEl(); if (!root) return;
      function empty(t, p, act){ return '<div class="hk-empty">' + IC.clock + '<h3>' + esc(t) + '</h3><p>' + esc(p) + '</p>' + (act ? '<p style="margin-top:14px"><button type="button" class="btn ' + (K.primary || 'primary') + '" data-a="empty">' + esc(act.label) + '</button></p>' : '') + '</div>'; }
      if (H.broken && !H.list.length) { root.innerHTML = empty('History cannot be kept here', 'This browser would not give ' + (o.app || 'the app') + ' a place to store analyses (' + (H.broken.message || 'storage unavailable') + '). Everything else works; save the project to keep your numbers.'); return; }
      if (!H.loaded) { root.innerHTML = ''; return; }
      if (!H.list.length) { root.innerHTML = empty('Nothing saved yet', 'Every ' + noun + ' you read is kept here by itself, under its name — open it again later exactly as you left it.', o.emptyAction); return; }
      var q = H.q.trim().toLowerCase(), shown = H.list.filter(function(r){ return !q || (r.name + ' ' + r.chips.join(' ') + ' ' + r.files.join(' ') + ' ' + r.bits.join(' ')).toLowerCase().indexOf(q) >= 0; });

      shown.forEach(function(r){
        var now = r.id === H.id;
        h += '<div class="hk-row' + (now ? ' now' : '') + '"><div class="hk-main"><div class="hk-name"><span class="n" title="' + esc(r.name) + '">' + esc(r.name) + '</span>' + (now ? '<span class="hk-pill">Open now</span>' : '') + (r.pinned ? '<span class="hk-pill pin">Pinned</span>' : '') + '</div>' +
          (r.bits.length ? '<div class="hk-meta">' + esc(r.bits.join(' · ')) + '</div>' : '') +
          (r.chips.length ? '<div class="hk-chips">' + r.chips.slice(0, 8).map(function(c){ return '<span class="hk-chip">' + esc(c) + '</span>'; }).join('') + (r.chips.length > 8 ? '<span class="hk-chip">+ ' + (r.chips.length - 8) + ' more</span>' : '') + '</div>' : '') +
          (r.files.length ? '<div class="hk-files" title="' + esc(r.files.join(', ')) + '">' + esc(r.files.join(' · ')) + '</div>' : '') + '</div>' +
          '<div class="hk-side"><div class="hk-when">' + when(r.updated) + '</div><div class="hk-acts">' +
          '<button type="button" class="hk-ic' + (r.pinned ? ' on' : '') + '" data-a="pin" data-id="' + esc(r.id) + '" title="' + (r.pinned ? 'Unpin' : 'Pin to the top') + '" aria-label="Pin">' + IC.pin + '</button>' +
          '<button type="button" class="hk-ic" data-a="ren" data-id="' + esc(r.id) + '" title="Rename" aria-label="Rename">' + IC.ren + '</button>' +
          '<button type="button" class="hk-ic" data-a="del" data-id="' + esc(r.id) + '" title="Delete from History" aria-label="Delete">' + IC.del + '</button>' +
          '<button type="button" class="btn' + (now ? (K.sec ? ' ' + K.sec : '') : ' ' + (K.primary || 'primary')) + '" data-a="open" data-id="' + esc(r.id) + '">' + (now ? 'Show' : 'Open') + '</button></div></div></div>';
      });
      if (!shown.length) h += '<div class="hk-empty" style="margin:30px auto"><p>Nothing in History matches “' + esc(H.q) + '”.</p></div>';
      root.innerHTML = h + '</div><div class="hk-foot">An ' + esc(noun) + ' is saved a moment after any change. Renaming it here renames the entry.</div>';
    };
    (function wire(){
      var root = rootEl(); if (!root) return;
      root.addEventListener('click', function(e){
        var b = e.target.closest('[data-a]'); if (!b) return;
        var id = b.dataset.id, a = b.dataset.a;
        if (a === 'empty') { if (o.emptyAction) o.emptyAction.fn(); return; }
        if (a === 'open') { if (id === H.id) { if (o.afterOpen) o.afterOpen(find(id)); } else H.open(id); }

    ['change', 'click', 'keyup', 'paste', 'drop'].forEach(function(ev){ document.addEventListener(ev, function(e){ var r = rootEl(); if (r && r.contains(e.target)) return; H.touch(); }, true); });

  }

})();
/* history-kit-js:end */
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════════════════════════════
   Tempo — kinetic degradation analysis. One file, no build step.
   §0 helpers · §1 FIT ENGINE (Echo's, copied) · §1b SCREEN ENGINE (Echo's, copied) · §2 TEMPO ENGINE (pure)
   §3 state · §4 charts · §5 Plate · §6 Curves · §7 Results & Compare · §8 export · §9 bridges · §10 wiring
   ═══════════════════════════════════════════════════════════════════════════════════════════════ */

/* ───── §0 helpers ───── */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
// A cell in a file is data, never a formula: =, + - @ at the start of text are neutralised (numbers are left alone).
const TP_NUMLIKE = /^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/;
function csvCell(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'number') return isFinite(v) ? String(v) : '';
  let s = String(v);
  if (/^[=+\-@\t\r]/.test(s) && !TP_NUMLIKE.test(s)) s = "'" + s;
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function tpToast(msg, kind) {
  const t = $('#tp-toast'); if (!t) return;
  t.className = 'toast show' + (kind ? ' ' + kind : ''); t.textContent = msg;
  clearTimeout(tpToast._t); tpToast._t = setTimeout(() => { t.classList.remove('show'); }, kind === 'err' ? 6000 : 3200);
}

/* ───── §1 FIT ENGINE (Echo's, copied: tools/sync_fit_engine.py keeps it identical) ───── */
function _4plVal4(xi, bot, logec50, h, top) {
  return bot + (top - bot) / (1 + Math.pow(10, h * (xi - logec50)));
}
// AUDIT-KEEP: part of the fit engine kept identical to Echo’s (tools/check_shared.py)
function _4plVal4_gain(xi, bot, logec50, h, top) {
  return bot + (top - bot) / (1 + Math.pow(10, h * (logec50 - xi)));
}
function _4plJac4(xi, bot, logec50, h, top) {
  const ln10 = Math.LN10;

  return [E / (1 + E), (top - bot) * h * ln10 * E / denom, -(top - bot) * (xi - logec50) * ln10 * E / denom, 1 / (1 + E)];
}
// AUDIT-KEEP: part of the fit engine kept identical to Echo’s (tools/check_shared.py)
function _4plJac4_gain(xi, bot, logec50, h, top) {
  const ln10=Math.LN10, E=Math.pow(10,h*(logec50-xi)), denom=(1+E)*(1+E);
  return [E/(1+E), -(top-bot)*h*ln10*E/denom, (top-bot)*(xi-logec50)*ln10*E/denom, 1/(1+E)];
}
function _solveLin(A, b) {
  const n = b.length;
  const M = A.map((r, i) => [...r, b[i]]);
  for (let col = 0; col < n; col++) {
    let mx = col;
    for (let r = col + 1; r < n; r++) if (Math.abs(M[r][col]) > Math.abs(M[mx][col])) mx = r;
    [M[col], M[mx]] = [M[mx], M[col]];
    if (Math.abs(M[col][col]) < 1e-14) return null;
    for (let r = col + 1; r < n; r++) {
      const f = M[r][col] / M[col][col];
      for (let k = col; k <= n; k++) M[r][k] -= f * M[col][k];
    }
  }
  const x = new Array(n).fill(0);
  for (let i = n - 1; i >= 0; i--) {
    x[i] = M[i][n] / M[i][i];
    for (let k = i - 1; k >= 0; k--) M[k][n] -= M[k][i] * x[i];
  }
  return x;
}
function _matInv(A) {
  const n=A.length;
  const M=A.map((row,i)=>[...row,...Array.from({length:n},(_,j)=>i===j?1:0)]);
  for(let col=0;col<n;col++){
    let maxRow=col;
    for(let r=col+1;r<n;r++) if(Math.abs(M[r][col])>Math.abs(M[maxRow][col])) maxRow=r;
    [M[col],M[maxRow]]=[M[maxRow],M[col]];
    if(Math.abs(M[col][col])<1e-14) return null;
    const piv=M[col][col];
    for(let j=0;j<2*n;j++) M[col][j]/=piv;
    for(let r=0;r<n;r++){
      if(r===col) continue;
      const f=M[r][col];
      for(let j=0;j<2*n;j++) M[r][j]-=f*M[col][j];
    }
  }
  return M.map(row=>row.slice(n));
}
function _lnGammaFn(z) {
  const c = [676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if (z < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * z)) - _lnGammaFn(1 - z);
  z -= 1; let x = 0.99999999999980993; for (let i = 0; i < 8; i++) x += c[i] / (z + i + 1);
  const t = z + 7.5; return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(x);
}
function _betaIncReg(x, a, b) {
  const cf = (x, a, b) => { let c = 1, d = 1 - (a + b) * x / (a + 1); if (Math.abs(d) < 1e-300) d = 1e-300; d = 1 / d; let h = d;
    for (let m = 1; m <= 300; m++) { const m2 = 2 * m;
      let aa = m * (b - m) * x / ((a + m2 - 1) * (a + m2)); d = 1 + aa * d; if (Math.abs(d) < 1e-300) d = 1e-300; c = 1 + aa / c; if (Math.abs(c) < 1e-300) c = 1e-300; d = 1 / d; h *= d * c;
      aa = -(a + m) * (a + b + m) * x / ((a + m2) * (a + m2 + 1)); d = 1 + aa * d; if (Math.abs(d) < 1e-300) d = 1e-300; c = 1 + aa / c; if (Math.abs(c) < 1e-300) c = 1e-300; d = 1 / d;
      const del = d * c; h *= del; if (Math.abs(del - 1) < 1e-15) break; }
    return h; };
  if (x <= 0) return 0; if (x >= 1) return 1;
  const bt = Math.exp(_lnGammaFn(a + b) - _lnGammaFn(a) - _lnGammaFn(b) + a * Math.log(x) + b * Math.log(1 - x));
  return x < (a + 1) / (a + b + 2) ? bt * cf(x, a, b) / a : 1 - bt * cf(1 - x, b, a) / b;
}
function _pF(F, d1, d2) { return F <= 0 ? 1 : !isFinite(F) ? 0 : _betaIncReg(d2 / (d2 + d1 * F), d2 / 2, d1 / 2); }
function _curveVsFlat(fit) {
