<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hit Finder — Triage Echo screens</title>
<!-- Excel is one of this app's inputs. Inside dHUB the shell already carries SheetJS and a srcdoc iframe
     is same-origin, so take that copy first; the tag below stays for standalone use and, when it loads,
     simply replaces this with the same library at the same version. -->

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

:root{
  /* the shared type and radius scales — see docs/UI.md */
  --fs-1:10px;--fs-2:11px;--fs-3:12px;--fs-4:13px;--fs-5:15px;--fs-6:17px;--fs-7:20px;--fs-8:26px;--fs-9:38px;
  --r-1:4px;--r-2:6px;--r-3:9px;--r-4:13px;--r-full:999px;
  --bg:#f4f5f8; --surface:#ffffff; --surface2:#f0f1f5; --surface3:#e4e6ee;
  --border:rgba(0,0,0,0.07); --border2:rgba(0,0,0,0.13);
  --text:#1a1d2e; --text2:#5a5f7a; --text3:#9ca0b8;
  --brand:#8a9440; --accent:#5e87c5; --accent-dim:rgba(94,135,197,0.12); --accent-soft:rgba(94,135,197,0.22);
  --good:#2d9462; --warn:#c47818; --danger:#c04040;
  --sans:'IBM Plex Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow-xs:0 1px 4px rgba(0,0,0,.04); --shadow-sm:0 2px 8px rgba(0,0,0,.06); --shadow-md:0 6px 24px rgba(0,0,0,.09); --shadow-lg:0 16px 48px rgba(0,0,0,.14);
  --ease:cubic-bezier(.2,.8,.3,1); --ease-out:cubic-bezier(.16,1,.3,1); --dur-1:120ms; --dur-2:200ms; --dur-3:300ms;
}
html[data-theme="dark"]{
  --bg:#0d0f14; --surface:#13161e; --surface2:#1c2030; --surface3:#252a3a;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --text:#e8eaf2; --text2:#8b90a8; --text3:#4e5368;
  --accent:#8aaee0; --accent-dim:rgba(138,174,224,0.16); --accent-soft:rgba(138,174,224,0.26);
  --good:#6ddca8; --warn:#f0b060; --danger:#f08a84;
  --shadow-xs:0 1px 4px rgba(0,0,0,.30); --shadow-sm:0 2px 8px rgba(0,0,0,.40); --shadow-md:0 6px 24px rgba(0,0,0,.50); --shadow-lg:0 16px 48px rgba(0,0,0,.55);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:var(--sans);font-size:var(--fs-4);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;}
::placeholder{color:var(--text3);}

/* ── Header ─────────────────────────────────────── */
header{min-height:48px;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
.logo{width:32px;height:32px;border-radius:var(--r-1);background:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;}
.logo svg{width:19px;height:19px;}
.app-name{font-size:var(--fs-5);font-weight:600;letter-spacing:-0.2px;cursor:pointer;}
.app-sub{font-size:var(--fs-2);color:var(--text2);}
.hdr-spacer{flex:1;}
.hdr-chip{font-family:var(--mono);font-size:var(--fs-2);color:var(--text2);padding:4px 10px;border-radius:var(--r-full);background:var(--surface2);border:1px solid var(--border);white-space:nowrap;}
.hdr-chip b{color:var(--text);font-weight:600;}
@media(max-width:560px){header .app-sub{display:none;}}

/* ── Tabs: text over a rail, one underline that travels ───────────────── */
.tabbar{position:relative;display:flex;gap:2px;padding:0 clamp(12px,2.5vw,40px);background:var(--surface);border-bottom:1px solid var(--border);}
.tab{display:flex;align-items:center;gap:7px;height:40px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:none;font-size:var(--fs-4);font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;transition:color var(--dur-1) var(--ease);}
.tab svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--text);font-weight:600;}
.tab .badge{font-family:var(--mono);font-size:var(--fs-1);font-weight:600;padding:1px 6px;border-radius:var(--r-full);background:var(--accent-dim);color:var(--accent);}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--r-1);}
.tab-ink{position:absolute;left:0;bottom:-1px;width:1px;height:2px;background:var(--accent);transform-origin:left center;transition:transform var(--dur-2) var(--ease);pointer-events:none;}

.main{max-width:1680px;margin:0 auto;padding:22px clamp(14px,2.5vw,40px) 70px;}
.tabpane{display:none;}
.tabpane.active{display:block;}

/* ── Surfaces and controls ─────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);padding:20px;box-shadow:var(--shadow-xs);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 14px;border-radius:var(--r-4);border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:var(--fs-3);font-weight:600;cursor:pointer;white-space:nowrap;transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease),transform var(--dur-1) var(--ease);}
.btn:hover{background:var(--surface3);}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{filter:brightness(1.08);}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.sec-hd{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;}
.sec-hd h2{margin:0;font-size:var(--fs-6);font-weight:600;letter-spacing:-.2px;}
.sec-hd .sec-sub{font-size:var(--fs-3);color:var(--text2);}

.tbl-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-4);}
.tbl th{font-size:var(--fs-2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border2);white-space:nowrap;}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
.tbl tbody tr:last-child td{border-bottom:0;}
.tbl .num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;}
.tbl th.num{text-align:right;}
.tbl .nm{font-weight:600;}
.tbl .sub{display:block;font-size:var(--fs-2);color:var(--text2);font-weight:400;margin-top:1px;}

.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--r-full);font-family:var(--mono);font-size:var(--fs-1);font-weight:600;white-space:nowrap;color:var(--pc,var(--text2));background:color-mix(in srgb,var(--pc,var(--text2)) 14%,transparent);}

.empty-state{text-align:center;padding:56px 20px;color:var(--text2);}
.empty-state svg{width:44px;height:44px;stroke:var(--text3);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.5;margin-bottom:12px;}
.empty-state .es-t{font-size:var(--fs-5);font-weight:600;color:var(--text);margin-bottom:4px;}
.empty-state .es-s{font-size:var(--fs-3);max-width:46ch;margin:0 auto 18px;line-height:1.5;}
.empty-state .es-a{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:var(--r-2);font-size:var(--fs-3);box-shadow:var(--shadow-lg);z-index:300;opacity:0;pointer-events:none;transition:opacity var(--dur-2) var(--ease),transform var(--dur-2) var(--ease-out);max-width:min(560px,calc(100vw - 32px));}
.toast.show{opacity:1;transform:translateX(-50%);}
.toast.err{background:var(--danger);color:#fff;}
.toast.warn{background:var(--warn);color:#fff;}

#hf-notices{position:sticky;top:48px;z-index:15;}
.dep-notice{display:flex;align-items:flex-start;gap:10px;padding:9px clamp(14px,2.5vw,40px);background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--warn) 35%,var(--border));font-size:var(--fs-3);color:var(--text);line-height:1.45;}
.dep-notice b{font-weight:600;}
.dep-notice button{margin-left:auto;border:0;background:none;color:var(--text2);cursor:pointer;font-size:var(--fs-5);line-height:1;padding:0 4px;}

/* One gear in every app's header: the panel behind it holds the theme switch. */
.opts-btn{background:none;border:1px solid var(--border2);color:var(--text2);width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;transition:background var(--dur-1) var(--ease),color var(--dur-1) var(--ease);}
.opts-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.opts-btn:hover{background:var(--surface2);color:var(--text);}
.opts-panel{display:none;position:fixed;top:58px;right:0;background:var(--surface);border:1px solid var(--border2);border-radius:0 0 0 var(--r-2);padding:14px 18px;z-index:200;min-width:190px;box-shadow:var(--shadow-md);}
.opts-panel.open{display:block;}
.opts-row{display:flex;align-items:center;justify-content:space-between;gap:20px;}
.opts-label{font-size:var(--fs-4);color:var(--text2);}
.theme-switch{position:relative;display:inline-block;width:40px;height:22px;}
.theme-switch input{opacity:0;width:0;height:0;}
.theme-slider{position:absolute;cursor:pointer;inset:0;background:var(--surface3);border-radius:var(--r-4);transition:background var(--dur-2) var(--ease);border:1px solid var(--border2);}
.theme-slider:before{position:absolute;content:'';height:16px;width:16px;left:2px;top:2px;background:var(--text2);border-radius:50%;transition:transform var(--dur-2) var(--ease);}
.theme-switch input:checked+.theme-slider{background:var(--accent);}
.theme-switch input:checked+.theme-slider:before{transform:translateX(18px);background:#fff;}

/* Motion here is decoration: nothing it conveys is lost when it is switched off. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important;}
}
/* a theme switch must not cross-fade the whole page */
html.theme-swap *,html.theme-swap *::before,html.theme-swap *::after{transition:none!important;}

/* ##CSS-MORE */

/* phone type scale (docs/UI.md): a 10px label is a desktop read. Portrait phones by width, landscape phones by height. */
@media (max-width:760px), (hover:none) and (pointer:coarse) and (max-height:520px){
  :root{--fs-1:11px;--fs-2:12px;--fs-3:13px;--fs-4:14px;--fs-5:16px;}
  .tabbar{flex-wrap:wrap;}
  .tab{height:44px;border-bottom-color:transparent;}
  .tab.active{border-bottom-color:var(--accent);}
  .tab-ink{display:none;}
  .main{padding-top:16px;}
}
/* mo-kit:begin — generated by the sync_motion tool, do not edit here */
:root .tabpane.active{animation:moPane var(--dur-2) var(--ease-out) backwards;}
@keyframes moPane{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
/* mo-kit:end */
/* ic-tile:begin — generated by the sync_icons tool, do not edit here */
:root .ic-tile.ic-tile{--ic-ac:var(--hue,currentColor);color:var(--text);box-sizing:border-box;background:color-mix(in oklab,var(--hue,#888) 9%,var(--surface));border:1px solid color-mix(in oklab,var(--hue,#888) 22%,var(--border));}
:root[data-theme="dark"] .ic-tile.ic-tile{--ic-ac:color-mix(in oklab,var(--hue,#888) 60%,#fff);background:color-mix(in oklab,var(--hue,#888) 13%,var(--surface));}
:root .ic-tile.ic-tile svg{width:58%;height:58%;display:block;flex:none;}
/* ic-tile:end */
</style>
<style>
/* Touch devices: never let iOS zoom the page on focus (it zooms on any control under 16px and never zooms back). */
@media (hover:none){
  input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]),
  select, textarea { font-size:16px !important; }
}
</style>
<style>
/* ctx-kit:begin — generated by tools/sync_ctxkit.py from tools/ctxkit/ctxkit.css; do not edit here */
.ctx{position:fixed;z-index:9000;min-width:210px;max-width:min(340px,calc(100vw - 16px));max-height:calc(100dvh - 16px);overflow:auto;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-2,6px);box-shadow:var(--shadow-lg,0 10px 30px rgba(0,0,0,.18));padding:5px;font-family:var(--sans,system-ui,sans-serif);opacity:0;transform:translateY(-3px);transition:opacity 120ms ease,transform 120ms ease;outline:none;overscroll-behavior:contain;}
.ctx.open{opacity:1;transform:none;}
.ctx-hd{padding:6px 10px 5px;font-size:var(--fs-2,11px);font-weight:600;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ctx-i{display:flex;align-items:center;gap:10px;width:100%;min-height:32px;padding:0 10px;border:none;background:none;border-radius:var(--r-1,4px);color:var(--text);font-family:inherit;font-size:var(--fs-3,12px);text-align:left;cursor:pointer;white-space:nowrap;}
.ctx-i:hover,.ctx-i.on{background:var(--accent-dim);}
.ctx-i[disabled]{color:var(--text3);cursor:default;background:none;}
.ctx-i.danger{color:var(--error,#e0393e);}
.ctx-i.danger:hover,.ctx-i.danger.on{background:var(--error-soft,rgba(224,57,62,.12));}
.ctx-i .k{margin-left:auto;padding-left:22px;color:var(--text3);font-size:var(--fs-2,11px);font-family:var(--mono,monospace);}
.ctx-i .ck{width:14px;flex:none;color:var(--accent);font-weight:700;}
.ctx-sep{height:1px;background:var(--border);margin:5px 4px;}
@media (hover:none){.ctx-i{min-height:44px;}}
@media (prefers-reduced-motion:reduce){.ctx{transition:none;}}
/* ctx-kit:end */
</style>
</head>
<body>

<header>
  <div class="logo ic-tile" style="--hue:#8a9440"><svg class="ic mo-hitfinder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" shape-rendering="geometricPrecision" aria-hidden="true"><path d="M3.5 6h17L14 12.6v4l-4 1.9v-5.9z"/><circle cx="7.2" cy="2.9" r=".95" fill="currentColor" stroke="none" opacity=".45"/><circle cx="12" cy="2.1" r=".95" fill="currentColor" stroke="none" opacity=".45"/><circle cx="16.8" cy="3" r=".95" fill="currentColor" stroke="none" opacity=".45"/><circle cx="12" cy="21.2" r="1.6" class="ac m1" style="fill:var(--ic-ac,currentColor)" stroke="none"/></svg></div>
  <div><div class="app-name">Hit Finder</div><div class="app-sub">Triage Echo screens into hits</div></div>
  <div class="hdr-spacer"></div>
  <span class="hdr-chip" id="hf-status" hidden></span>
  <button class="opts-btn" id="opts-btn" onclick="toggleOpts()" aria-label="Settings" aria-haspopup="true" aria-expanded="false" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <div class="opts-panel" id="opts-panel">
    <div class="opts-row"><span class="opts-label">Dark mode</span><label class="theme-switch"><input type="checkbox" id="theme-chk" onchange="toggleTheme()" aria-label="Dark mode"><span class="theme-slider"></span></label></div>
  </div>
</header>
<div id="hf-notices"></div>

<nav class="tabbar" id="hf-tabs" role="tablist" aria-label="Hit Finder views">
  <button class="tab active" role="tab" data-tab="screens" aria-selected="true" onclick="hfTab('screens')"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="6" rx="1.6"/><rect x="3.5" y="14" width="17" height="6" rx="1.6"/></svg>Screens<span class="badge" id="b-screens" hidden></span></button>
  <button class="tab" role="tab" data-tab="criteria" aria-selected="false" onclick="hfTab('criteria')"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Criteria</button>
  <button class="tab" role="tab" data-tab="hits" aria-selected="false" onclick="hfTab('hits')"><svg viewBox="0 0 24 24"><path d="M4 5h16l-6 7.2V18l-4 2v-7.8z"/></svg>Hits<span class="badge" id="b-hits" hidden></span></button>
  <button class="tab" role="tab" data-tab="plots" aria-selected="false" onclick="hfTab('plots')"><svg viewBox="0 0 24 24"><path d="M4 4v16h16"/><circle cx="9" cy="14" r="1.2"/><circle cx="13" cy="9.5" r="1.2"/><circle cx="17" cy="12.5" r="1.2"/></svg>Plots</button>
  <button class="tab" role="tab" data-tab="chem" aria-selected="false" onclick="hfTab('chem')"><svg viewBox="0 0 24 24"><path d="M12 3.5l7 4v8l-7 4-7-4v-8z"/><path d="M12 11.5v8M5 7.5l7 4 7-4"/></svg>Chemistry</button>
  <button class="tab" role="tab" data-tab="export" aria-selected="false" onclick="hfTab('export')"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4 20h16"/></svg>Export</button>
  <span class="tab-ink" id="hf-ink"></span>
</nav>

<main class="main">
  <section class="tabpane active" id="pane-screens" role="tabpanel"></section>
  <section class="tabpane" id="pane-criteria" role="tabpanel"></section>
  <section class="tabpane" id="pane-hits" role="tabpanel"></section>
  <section class="tabpane" id="pane-plots" role="tabpanel"></section>
  <section class="tabpane" id="pane-chem" role="tabpanel"></section>
  <section class="tabpane" id="pane-export" role="tabpanel"></section>
</main>
<div class="toast" id="hf-toast" role="status" aria-live="polite"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════════════════════════
   Hit Finder — triage of Echo Dose Response screens. One file, no build step.
   §0 helpers · §1 SCREEN ENGINE (Echo's, copied) · §1b RDKIT LOADER (Echo's, copied) · §2 state
   §3 ingest · §4 example screen · §5 views · §6 wiring
   ═══════════════════════════════════════════════════════════════════════════════════════════════ */

/* ───── §0 helpers ───── */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
const _natColl = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
function natCmp(a, b) { return _natColl.compare(String(a == null ? '' : a), String(b == null ? '' : b)) || (a < b ? -1 : a > b ? 1 : 0); }
// A cell in a file is data, never a formula: =, + - @ at the start of text are neutralised (numbers are left alone).
function csvCell(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'number') return isFinite(v) ? String(v) : '';
  let s = String(v);
  if (/^[=+\-@\t\r]/.test(s) && !/^[+-]?(\d|\.\d)/.test(s)) s = "'" + s;
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function hfToast(msg, kind) {
  const t = $('#hf-toast'); if (!t) return;
  t.className = 'toast show' + (kind ? ' ' + kind : ''); t.textContent = msg;
  clearTimeout(hfToast._t); hfToast._t = setTimeout(() => { t.classList.remove('show'); }, kind === 'err' ? 6000 : 3200);
}
// A potency reads in the unit that fits it: 450 pM, 12.3 nM, 1.2 µM.
