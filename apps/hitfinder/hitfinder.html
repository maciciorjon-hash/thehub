<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hit Finder — Triage Echo screens</title>
<!-- Excel is one of this app's inputs. Inside dHUB the shell already carries SheetJS and a srcdoc iframe
     is same-origin, so take that copy first; the tag below stays for standalone use and, when it loads,
     simply replaces this with the same library at the same version. -->
<script>(function(){ try{ if(window.parent&&window.parent!==window&&window.parent.XLSX){ window.XLSX=window.parent.XLSX; } }catch(e){} })();</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

:root{
  /* the shared type and radius scales — see docs/UI.md */
  --fs-1:10px;--fs-2:11px;--fs-3:12px;--fs-4:13px;--fs-5:15px;--fs-6:17px;--fs-7:20px;--fs-8:26px;--fs-9:38px;
  --r-1:4px;--r-2:6px;--r-3:9px;--r-4:13px;--r-full:999px;
  --bg:#f4f5f8; --surface:#ffffff; --surface2:#f0f1f5; --surface3:#e4e6ee;
  --border:rgba(0,0,0,0.07); --border2:rgba(0,0,0,0.13);
  --text:#1a1d2e; --text2:#5a5f7a; --text3:#9ca0b8;
  --brand:#8a9440; --accent:#5e87c5; --accent-dim:rgba(94,135,197,0.12); --accent-soft:rgba(94,135,197,0.22);
  --good:#2d9462; --warn:#c47818; --danger:#c04040;
  --sans:'IBM Plex Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow-xs:0 1px 4px rgba(0,0,0,.04); --shadow-sm:0 2px 8px rgba(0,0,0,.06); --shadow-md:0 6px 24px rgba(0,0,0,.09); --shadow-lg:0 16px 48px rgba(0,0,0,.14);
  --ease:cubic-bezier(.2,.8,.3,1); --ease-out:cubic-bezier(.16,1,.3,1); --dur-1:120ms; --dur-2:200ms; --dur-3:300ms;
}
html[data-theme="dark"]{
  --bg:#0d0f14; --surface:#13161e; --surface2:#1c2030; --surface3:#252a3a;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --text:#e8eaf2; --text2:#8b90a8; --text3:#4e5368;
  --accent:#8aaee0; --accent-dim:rgba(138,174,224,0.16); --accent-soft:rgba(138,174,224,0.26);
  --good:#6ddca8; --warn:#f0b060; --danger:#f08a84;
  --shadow-xs:0 1px 4px rgba(0,0,0,.30); --shadow-sm:0 2px 8px rgba(0,0,0,.40); --shadow-md:0 6px 24px rgba(0,0,0,.50); --shadow-lg:0 16px 48px rgba(0,0,0,.55);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:var(--sans);font-size:var(--fs-4);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;}
::placeholder{color:color-mix(in srgb,var(--text2) 80%,var(--surface));}

/* ── Header ─────────────────────────────────────── */
header{min-height:48px;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
.logo{width:32px;height:32px;border-radius:var(--r-1);background:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;}
.logo svg{width:19px;height:19px;}
.app-name{font-size:var(--fs-5);font-weight:600;letter-spacing:-0.2px;cursor:pointer;white-space:nowrap;}
.app-sub{font-size:var(--fs-2);color:var(--text2);}
.hdr-spacer{flex:1;}
.hdr-chip{font-family:var(--mono);font-size:var(--fs-2);color:var(--text2);padding:4px 10px;border-radius:var(--r-full);background:var(--surface2);border:1px solid var(--border);white-space:nowrap;}
.hdr-chip b{color:var(--text);font-weight:600;}
@media(max-width:560px){header .app-sub{display:none;}}
@media(max-width:480px){.hdr-chip{display:none;}}

/* ── Tabs: text over a rail, one underline that travels ───────────────── */
.tabbar{position:relative;display:flex;gap:2px;padding:0 clamp(12px,2.5vw,40px);background:var(--surface);border-bottom:1px solid var(--border);}
.tab{display:flex;align-items:center;gap:7px;height:40px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:none;font-size:var(--fs-4);font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;transition:color var(--dur-1) var(--ease);}
.tab svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--text);font-weight:600;}
.tab .badge{font-family:var(--mono);font-size:var(--fs-1);font-weight:600;padding:1px 6px;border-radius:var(--r-full);background:var(--accent-dim);color:var(--accent);}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--r-1);}
.tab-ink{position:absolute;left:0;bottom:-1px;width:1px;height:2px;background:var(--accent);transform-origin:left center;transition:transform var(--dur-2) var(--ease);pointer-events:none;}

.main{max-width:1680px;margin:0 auto;padding:22px clamp(14px,2.5vw,40px) 70px;}
.tabpane{display:none;}
.tabpane.active{display:block;}

/* ── Surfaces and controls ─────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);padding:20px;box-shadow:var(--shadow-xs);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 14px;border-radius:var(--r-4);border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:var(--fs-3);font-weight:600;cursor:pointer;white-space:nowrap;transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease),transform var(--dur-1) var(--ease);}
.btn:hover{background:var(--surface3);}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{filter:brightness(1.08);}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.sec-hd{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;}
.sec-hd h2{margin:0;font-size:var(--fs-6);font-weight:600;letter-spacing:-.2px;}
.sec-hd .sec-sub{font-size:var(--fs-3);color:var(--text2);}

.tbl-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-4);}
.tbl th{font-size:var(--fs-2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border2);white-space:nowrap;}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
.tbl tbody tr:last-child td{border-bottom:0;}
.tbl .num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;}
.tbl th.num{text-align:right;}
.tbl .nm{font-weight:600;}
.tbl .sub{display:block;font-size:var(--fs-2);color:var(--text2);font-weight:400;margin-top:1px;}

.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--r-full);font-family:var(--mono);font-size:var(--fs-1);font-weight:600;white-space:nowrap;color:var(--pc,var(--text2));background:color-mix(in srgb,var(--pc,var(--text2)) 14%,transparent);}

.empty-state{text-align:center;padding:56px 20px;color:var(--text2);}
.empty-state svg{width:44px;height:44px;stroke:var(--text3);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.5;margin-bottom:12px;}
.empty-state .es-t{font-size:var(--fs-5);font-weight:600;color:var(--text);margin-bottom:4px;}
.empty-state .es-s{font-size:var(--fs-3);max-width:46ch;margin:0 auto 18px;line-height:1.5;}
.empty-state .es-a{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:var(--r-2);font-size:var(--fs-3);box-shadow:var(--shadow-lg);z-index:300;opacity:0;pointer-events:none;transition:opacity var(--dur-2) var(--ease),transform var(--dur-2) var(--ease-out);max-width:min(560px,calc(100vw - 32px));}
.toast.show{opacity:1;transform:translateX(-50%);}
.toast.err{background:var(--danger);color:#fff;}
.toast.warn{background:var(--warn);color:#fff;}

#hf-notices{position:sticky;top:48px;z-index:15;}
.dep-notice{display:flex;align-items:flex-start;gap:10px;padding:9px clamp(14px,2.5vw,40px);background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--warn) 35%,var(--border));font-size:var(--fs-3);color:var(--text);line-height:1.45;}
.dep-notice b{font-weight:600;}
.dep-notice button{margin-left:auto;border:0;background:none;color:var(--text2);cursor:pointer;font-size:var(--fs-5);line-height:1;padding:0 4px;}

/* One gear in every app's header: the panel behind it holds the theme switch. */
.opts-btn{background:none;border:1px solid var(--border2);color:var(--text2);width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;transition:background var(--dur-1) var(--ease),color var(--dur-1) var(--ease);}
.opts-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.opts-btn:hover{background:var(--surface2);color:var(--text);}
.opts-panel{display:none;position:fixed;top:58px;right:0;background:var(--surface);border:1px solid var(--border2);border-radius:0 0 0 var(--r-2);padding:14px 18px;z-index:200;min-width:190px;box-shadow:var(--shadow-md);}
.opts-panel.open{display:block;}
.opts-row{display:flex;align-items:center;justify-content:space-between;gap:20px;}
.opts-label{font-size:var(--fs-4);color:var(--text2);}
.theme-switch{position:relative;display:inline-block;width:40px;height:22px;}
.theme-switch input{opacity:0;width:0;height:0;}
.theme-slider{position:absolute;cursor:pointer;inset:0;background:var(--surface3);border-radius:var(--r-4);transition:background var(--dur-2) var(--ease);border:1px solid var(--border2);}
.theme-slider:before{position:absolute;content:'';height:16px;width:16px;left:2px;top:2px;background:var(--text2);border-radius:50%;transition:transform var(--dur-2) var(--ease);}
.theme-switch input:checked+.theme-slider{background:var(--accent);}
.theme-switch input:checked+.theme-slider:before{transform:translateX(18px);background:#fff;}

/* Motion here is decoration: nothing it conveys is lost when it is switched off. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important;}
}
/* a theme switch must not cross-fade the whole page */
html.theme-swap *,html.theme-swap *::before,html.theme-swap *::after{transition:none!important;}

.ico-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;border-radius:var(--r-2);background:none;color:var(--text3);cursor:pointer;transition:background var(--dur-1) var(--ease),color var(--dur-1) var(--ease);}
.ico-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.ico-btn:hover{background:var(--surface2);color:var(--danger);}
.ico-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.inp{height:32px;padding:0 9px;border:1px solid var(--border2);border-radius:var(--r-2);background:var(--surface);color:var(--text);font-family:inherit;font-size:var(--fs-3);min-width:0;max-width:100%;}
.inp:focus{outline:none;border-color:var(--accent);}
.inp.mono{font-family:var(--mono);}
.mono{font-family:var(--mono);}
.sub{font-size:var(--fs-2);color:var(--text2);}

.src-bar{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;padding:14px 16px;margin-bottom:16px;}
.src-btns{display:flex;gap:10px;flex-wrap:wrap;}
.src-hint{font-size:var(--fs-3);color:var(--text2);}
.note{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;padding:12px 16px;margin-bottom:16px;border:1px solid color-mix(in srgb,var(--warn) 35%,var(--border));border-radius:var(--r-3);background:color-mix(in srgb,var(--warn) 9%,var(--surface));font-size:var(--fs-3);line-height:1.5;}
.note b{font-weight:600;}
.scr-tbl td{padding:7px 10px;}
.scr-tbl tr.scr td{border-bottom:0;padding-top:12px;}
.scr-tbl tr.scr:first-child td{padding-top:6px;}
.scr-tbl tr.arm td{border-bottom:0;padding-top:3px;padding-bottom:3px;}
.scr-tbl tr.arm:last-of-type td,.scr-tbl tr.arm + tr.scr td{border-top:0;}
.scr-tbl tr.arm .arm-n{padding-left:26px;font-weight:500;color:var(--text2);position:relative;}
.scr-tbl tr.arm .arm-n::before{content:'';position:absolute;left:12px;top:50%;width:8px;height:1px;background:var(--border2);}
.scr-tbl td .inp{width:100%;min-width:140px;}
.scr-tbl td select.inp{min-width:168px;}
.scr-tbl td.act{width:34px;padding-left:0;}
.slot-cell{display:flex;align-items:center;gap:8px;}
.slot-cell .inp{flex:1;}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.chip{font-size:var(--fs-3);color:var(--text2);padding:4px 10px;border-radius:var(--r-full);background:var(--surface2);border:1px solid var(--border);}
.chip b{color:var(--text);font-family:var(--mono);}
.rc-line{margin:12px 0 0;font-size:var(--fs-3);line-height:1.55;color:var(--text2);}
.rc-line b{color:var(--text);}
.rc-names{font-family:var(--mono);font-size:var(--fs-2);color:var(--text);}
.sug{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.sug-r{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--border);font-size:var(--fs-3);}
.sug-r .sub{flex:1 1 200px;}
.sug-r .btn{height:28px;font-size:var(--fs-2);padding:0 10px;}

.dlg-back{position:fixed;inset:0;z-index:250;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,12,18,.45);opacity:0;transition:opacity var(--dur-2) var(--ease);}
.dlg-back.open{opacity:1;}
.dlg{width:min(640px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-3);box-shadow:var(--shadow-lg);transform:translateY(8px);transition:transform var(--dur-2) var(--ease-out);}
.dlg-back.open .dlg{transform:none;}
.dlg-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 10px;}
.dlg-hd h3{margin:0;font-size:var(--fs-6);font-weight:600;letter-spacing:-.2px;}
.dlg-bd{padding:0 18px 14px;overflow:auto;}
.dlg-ft{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px;border-top:1px solid var(--border);}
.dlg-p{margin:0 0 12px;font-size:var(--fs-3);line-height:1.55;color:var(--text2);}
.eh-list{display:flex;flex-direction:column;gap:10px;}
.eh-set{border:1px solid var(--border);border-radius:var(--r-2);}
.eh-set-hd{display:flex;align-items:baseline;gap:10px;padding:8px 12px;background:var(--surface2);border-radius:var(--r-2) var(--r-2) 0 0;}
.eh-run{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--border);font-size:var(--fs-3);cursor:pointer;}
.eh-run.done{opacity:.6;cursor:default;}
.eh-v{font-weight:600;min-width:28px;}
.mp-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px;margin-bottom:12px;}
.mp-f{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-2);font-weight:600;color:var(--text2);}
.mp-f .inp{width:100%;font-weight:400;color:var(--text);}
.drop-veil{position:fixed;inset:0;z-index:260;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 12%,rgba(10,12,18,.35));border:3px dashed var(--accent);opacity:0;pointer-events:none;transition:opacity var(--dur-1) var(--ease);font-size:var(--fs-6);font-weight:600;color:var(--text);}
.drop-veil.on{opacity:1;}
@media(max-width:760px){
  .dlg{max-height:calc(100dvh - 16px);}
  /* a ten-column table has no phone form: each screen becomes a card of labelled fields, its groups under it */
  .scr-tbl thead{display:none;}
  .scr-tbl,.scr-tbl tbody{display:block;}
  .scr-tbl tr{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:8px 12px;padding:12px 8px;border-top:1px solid var(--border);}
  .scr-tbl tr:first-child{border-top:0;}
  .scr-tbl tr.arm{padding:4px 8px 8px 24px;border-top:0;}
  .scr-tbl td,.scr-tbl tr.scr td,.scr-tbl tr.arm td{display:flex;flex-direction:column;gap:3px;padding:0;border:0;text-align:left;}
  .scr-tbl td[data-l]::before{content:attr(data-l);font-size:var(--fs-1);font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--text2);}
  .scr-tbl td:empty{display:none;}
  .scr-tbl td.nm{grid-column:1/-1;}
  .scr-tbl tr.arm .arm-n{padding-left:0;}
  .scr-tbl tr.arm .arm-n::before{display:none;}
  .scr-tbl td.act{grid-column:1/-1;align-items:flex-end;width:auto;}
  .scr-tbl td .inp{width:100%;max-width:none;}
  .scr-tbl td.num{font-family:var(--mono);}
}

/* ── tiers: one colour each, never the only signal (the name is always written) ── */
.t-hit{--tc:var(--good);} .t-borderline{--tc:var(--warn);} .t-unverified{--tc:var(--text2);} .t-rejected{--tc:var(--text3);}
.tier{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px 0 8px;border-radius:var(--r-full);font-size:var(--fs-2);font-weight:600;white-space:nowrap;color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,transparent);}
.tier::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--tc);flex:none;}
.t-borderline.tier::before{background:linear-gradient(90deg,var(--tc) 50%,transparent 50%);box-shadow:inset 0 0 0 1.5px var(--tc);}
.t-unverified.tier::before{background:none;box-shadow:inset 0 0 0 1.5px var(--tc);border:0;}
.t-rejected.tier::before{background:none;box-shadow:inset 0 0 0 1.5px var(--tc);opacity:.7;}
.t-rejected.tier{color:var(--text2);}
.fld{display:flex;flex-direction:column;gap:3px;font-size:var(--fs-1);font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--text2);}
.fld .inp{font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);}
.fld .inp.nn{width:86px;font-family:var(--mono);}
.fld .inp.bad{border-color:var(--danger);}
.theme-switch.sm{width:34px;height:20px;flex:none;}
.theme-switch.sm .theme-slider:before{width:14px;height:14px;}
.theme-switch.sm input:checked+.theme-slider:before{transform:translateX(14px);}

/* ── criteria ── */
.crit-top{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:14px;}
.crit-top .l,.crit-top .r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.crit-note{font-size:var(--fs-3);color:var(--text2);margin:-6px 0 16px;line-height:1.5;max-width:90ch;}
.crit{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow-xs);transition:opacity var(--dur-2) var(--ease),border-color var(--dur-2) var(--ease);}
.crit.off{opacity:.55;}
.crit.inactive{border-style:dashed;background:var(--surface2);}
.crit-hd{display:flex;align-items:flex-start;gap:12px;}
.crit-t{flex:1;min-width:0;}
.crit-t b{font-size:var(--fs-4);font-weight:600;}
.crit-t .inact{display:inline-block;margin-left:8px;font-size:var(--fs-2);color:var(--warn);font-weight:600;}
.crit-sentence{font-size:var(--fs-3);color:var(--text2);margin-top:3px;line-height:1.5;}
.crit-sentence em{font-style:normal;color:var(--text);font-family:var(--mono);font-weight:600;}
.crit-ctl{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:flex-end;margin-top:12px;}
.crit-counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}

.hist .hh:hover circle,.hist .hh:focus-visible circle{transform:scale(1.3);} .hist .hh.soft line{stroke-dasharray:3 3;stroke:var(--warn);} .hist .hh.soft circle{stroke:var(--warn);}
.cat-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.cat-chip{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 11px;border-radius:var(--r-full);border:1px solid var(--border2);background:var(--surface);font-size:var(--fs-3);cursor:pointer;color:var(--text);transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease);}
.cat-chip b{font-family:var(--mono);font-weight:600;}
.cat-chip.p{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent);} .cat-chip.b{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);}
.cat-chip.x{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent);}
.cat-chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.sel-add{max-width:320px;}
@media(max-width:760px){.crit{padding:12px;}.fld .inp.nn{width:72px;}}
/* ── hits ── */
.funnel{display:flex;flex-direction:column;gap:2px;margin-bottom:16px;}
.fn-r{display:grid;grid-template-columns:minmax(150px,260px) 1fr minmax(150px,auto);gap:12px;align-items:center;padding:4px 8px;border-radius:var(--r-2);font-size:var(--fs-3);cursor:pointer;border:0;background:none;text-align:left;color:var(--text);width:100%;font-family:inherit;}
.fn-r:hover,.fn-r.on{background:var(--accent-dim);}
.fn-r:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.fn-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}
.fn-bar{position:relative;height:16px;border-radius:var(--r-1);background:var(--surface2);overflow:hidden;}
.fn-bar i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--good) 58%,transparent);transform-origin:left center;animation:fnGrow var(--dur-3) var(--ease-out) backwards;}
.fn-bar u{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--border2) 0 3px,transparent 3px 6px);}
@keyframes fnGrow{from{transform:scaleX(0);}}
.fn-n{font-family:var(--mono);font-size:var(--fs-2);color:var(--text2);white-space:nowrap;}
.fn-n b{color:var(--text);font-weight:600;}
.hits-bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-bottom:10px;}
.hits-bar .grow{flex:1 1 180px;min-width:150px;}
.tchip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:var(--r-full);border:1px solid var(--border2);background:var(--surface);font-size:var(--fs-3);font-weight:600;cursor:pointer;color:var(--text);font-family:inherit;transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease);}
.tchip::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--tc);}
.tchip b{font-family:var(--mono);font-weight:600;}
.tchip[aria-pressed="true"]{background:color-mix(in srgb,var(--tc) 13%,var(--surface));border-color:var(--tc);}
.tchip[aria-pressed="false"]{opacity:.55;}
.tchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.dropnote{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 12px;border-radius:var(--r-full);background:var(--accent-dim);font-size:var(--fs-3);}
.hits-scroll{max-height:calc(100dvh - 360px);min-height:300px;overflow:auto;border:1px solid var(--border);border-radius:var(--r-3);background:var(--surface);position:relative;outline:none;}
.hits-scroll:focus-visible{border-color:var(--accent);}
.h-hd,.h-r{display:grid;grid-template-columns:var(--cols);align-items:center;column-gap:12px;padding:0 14px;}
.h-hd{position:sticky;top:0;z-index:2;height:34px;background:var(--surface);border-bottom:1px solid var(--border2);font-size:var(--fs-2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);}
.h-r{height:var(--rowh,46px);border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--dur-1) var(--ease);}
.h-r:hover{background:var(--surface2);} .h-r.sel{background:var(--accent-dim);box-shadow:inset 3px 0 0 var(--accent);}
.h-r > span,.h-hd > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.c-rk{font-family:var(--mono);font-size:var(--fs-2);color:var(--text3);}
.c-nm{font-weight:600;}
.c-nm .you{margin-left:6px;font-size:var(--fs-1);font-weight:600;color:var(--accent);}
.c-sc{display:flex;align-items:center;gap:8px;}
.sbar{position:relative;flex:1;height:8px;border-radius:var(--r-full);background:var(--surface3);min-width:40px;}
.sbar i{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-full);background:var(--tc);opacity:.35;}
.sbar b{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-full);background:var(--tc);}
.c-m{font-family:var(--mono);font-size:var(--fs-3);font-variant-numeric:tabular-nums;}
.c-m small{color:var(--text3);font-size:var(--fs-1);}
.c-ms{display:contents;}
.c-why{font-size:var(--fs-3);color:var(--text2);}
.c-why .near{color:var(--warn);font-weight:600;}
.h-empty{padding:40px 16px;text-align:center;color:var(--text2);font-size:var(--fs-3);}
.hk{display:inline-block;margin-left:5px;padding:0 5px;border-radius:var(--r-1);font-size:var(--fs-1);font-weight:700;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);}

/* ── the compound drawer ── */
#hf-drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);z-index:120;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--border2);box-shadow:var(--shadow-lg);transform:translateX(105%);transition:transform var(--dur-3) var(--ease-out);visibility:hidden;}
#hf-drawer.open{transform:none;visibility:visible;}
.dr-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);}
.dr-hd h3{margin:0;font-size:var(--fs-6);font-weight:600;letter-spacing:-.2px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dr-hd .ico-btn:hover{color:var(--text);}
.dr-bd{flex:1;overflow:auto;padding:14px 16px 24px;}
.dr-sec{margin-top:18px;} .dr-sec:first-child{margin-top:0;}
.dr-sec h4{margin:0 0 8px;font-size:var(--fs-2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);}
.dr-chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0;}
.dr-why{width:100%;border-collapse:collapse;font-size:var(--fs-3);}
.dr-why td{padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:top;}
.dr-why tr:last-child td{border-bottom:0;}
.dr-why .st{width:22px;font-weight:700;text-align:center;} .dr-why .st.pass{color:var(--good);} .dr-why .st.borderline{color:var(--warn);} .dr-why .st.fail{color:var(--danger);} .dr-why .st.unknown{color:var(--text2);} .dr-why .st.skip{color:var(--text3);}
.dr-why .vv{font-family:var(--mono);text-align:right;white-space:nowrap;} .dr-why .rl{color:var(--text2);font-size:var(--fs-2);}
.dr-why tr.soft td{color:var(--text2);}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:var(--r-4);overflow:hidden;}
.seg button{height:30px;padding:0 13px;border:0;border-right:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:var(--fs-3);font-weight:600;cursor:pointer;font-family:inherit;transition:background var(--dur-1) var(--ease);}
.seg button:last-child{border-right:0;} .seg button:hover{background:var(--surface2);} .seg button[aria-pressed="true"]{background:var(--accent);color:#fff;}
.seg button kbd{margin-left:6px;font-family:var(--mono);font-size:var(--fs-1);opacity:.6;}
textarea.note-in{width:100%;min-height:62px;margin-top:8px;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r-2);background:var(--surface);color:var(--text);font-family:inherit;font-size:var(--fs-3);resize:vertical;}
textarea.note-in:focus{outline:none;border-color:var(--accent);}
.cv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
.cv{border:1px solid var(--border);border-radius:var(--r-2);padding:8px 8px 4px;background:var(--surface);}
.cv-t{display:flex;justify-content:space-between;gap:6px;font-size:var(--fs-2);font-weight:600;margin-bottom:2px;}
.cv-t span{font-family:var(--mono);color:var(--text2);font-weight:500;}
.cv svg{width:100%;height:auto;display:block;overflow:visible;}
.cv svg text{fill:var(--text2);font-size:9.5px;font-family:var(--mono);}
.cv .ln{fill:none;stroke:var(--accent);stroke-width:1.8;} .cv .ln.o{opacity:.4;stroke-dasharray:4 3;}
.cv .pt{fill:var(--accent);} .cv .eb{stroke:var(--accent);stroke-width:1;opacity:.6;} .cv .hp{fill:var(--surface);stroke:var(--warn);stroke-width:1.5;}
.cv .hl{stroke:var(--warn);stroke-width:1;stroke-dasharray:2 3;fill:none;} .cv .ref{stroke:var(--border2);stroke-dasharray:3 3;} .cv .gx{stroke:var(--border);}
.cv .pm{stroke:var(--text);stroke-width:1;stroke-dasharray:1 3;} .cv-none{padding:18px 8px;font-size:var(--fs-2);color:var(--text3);text-align:center;}
.dr-names{font-size:var(--fs-3);color:var(--text2);line-height:1.5;}
.dr-names code{font-family:var(--mono);color:var(--text);}
@media(max-width:760px){
  .fn-r{grid-template-columns:1fr auto;grid-template-areas:'l n' 'b b';row-gap:3px;} .fn-l{grid-area:l;white-space:normal;overflow:visible;text-overflow:clip;} .fn-n{grid-area:n;} .fn-bar{grid-area:b;}
  .crit-top .l{width:100%;} .crit-top .l .fld,.crit-top .l .inp{min-width:0;max-width:100%;} .crit-top .l .fld{flex:1 1 220px;} .crit-ctl .fld>span{flex-wrap:wrap;}
  .pl-hd{flex-wrap:wrap;} .pl-tools{flex-wrap:wrap;}
  .hits-scroll{max-height:none;border:0;background:none;overflow:visible;}
  .h-hd{display:none;}
  .h-r{--rowh:96px;grid-template-columns:1fr auto;grid-template-rows:auto auto auto;row-gap:2px;align-content:center;margin-bottom:8px;border:1px solid var(--border);border-radius:var(--r-3);background:var(--surface);padding:8px 12px;height:var(--rowh);}
  .c-rk,.c-sc{display:none;} .c-nm{grid-column:1;} .c-tier{grid-column:2;grid-row:1;justify-self:end;}
  .c-ms{display:flex;gap:12px;grid-column:1/-1;grid-row:2;flex-wrap:nowrap;overflow:hidden;} .c-ms .c-m{font-size:var(--fs-2);flex:none;} .c-ms .c-m:nth-child(n+4){display:none;}
  .c-why{grid-column:1/-1;grid-row:3;white-space:nowrap;}
  #hf-drawer{top:auto;height:90dvh;width:100%;border-left:0;border-top:1px solid var(--border2);border-radius:var(--r-4) var(--r-4) 0 0;transform:translateY(105%);}
}

/* ── plots ── */
.pl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px;}
.pl{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);padding:14px 14px 10px;box-shadow:var(--shadow-xs);min-width:0;}
.pl-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
.pl-hd h3{margin:0;font-size:var(--fs-5);font-weight:600;letter-spacing:-.2px;}
.pl-hd .sub{display:block;margin-top:2px;line-height:1.45;}
.pl-tools{display:flex;gap:4px;flex:none;}
.pl-tools .btn{height:28px;padding:0 10px;font-size:var(--fs-2);}
.pl svg.plot{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y;user-select:none;-webkit-user-select:none;}
.pl svg.plot text{fill:var(--text2);font-size:11px;font-family:var(--mono);}
.pl svg.plot text.lab{font-family:var(--sans);font-size:12px;}
.pl svg.plot .gx{stroke:var(--border);stroke-width:1;} .pl svg.plot .axl{stroke:var(--border2);stroke-width:1;}
.pl svg.plot .zp{fill:var(--good);fill-opacity:.11;} .pl svg.plot .zb{fill:var(--warn);fill-opacity:.09;}
.pl svg.plot .ref{stroke:var(--text3);stroke-dasharray:4 4;stroke-width:1;fill:none;}
.pl svg.plot .mk{cursor:pointer;transition:opacity var(--dur-1) var(--ease);} .pl svg.plot .mk:hover{opacity:.8;}
.pl svg.plot .brush{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3;pointer-events:none;}
.pl svg.plot .selr{fill:none;stroke:var(--accent);stroke-width:2;pointer-events:none;}
.pl .tbl-wrap{max-height:360px;overflow:auto;}
.pl-leg{display:flex;gap:6px 14px;flex-wrap:wrap;margin:6px 2px 2px;font-size:var(--fs-2);color:var(--text2);}
.pl-leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--c);}
.pl-leg i.r{background:none;box-shadow:inset 0 0 0 1.5px var(--c);} .pl-leg i.d{background:none;box-shadow:inset 0 0 0 1.5px var(--c);border:1px dashed var(--c);box-shadow:none;}
.selbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:8px 14px;margin-bottom:14px;border:1px solid var(--accent);border-radius:var(--r-3);background:var(--accent-dim);font-size:var(--fs-3);}
#hf-tip{position:fixed;z-index:300;max-width:280px;padding:8px 11px;border-radius:var(--r-2);background:var(--text);color:var(--bg);font-size:var(--fs-2);line-height:1.5;box-shadow:var(--shadow-lg);pointer-events:none;opacity:0;transition:opacity var(--dur-1) var(--ease);}
#hf-tip.on{opacity:1;} #hf-tip b{font-weight:600;} #hf-tip .mono{font-family:var(--mono);}

/* ##CSS-MORE */

/* phone type scale (docs/UI.md): a 10px label is a desktop read. Portrait phones by width, landscape phones by height. */
@media (max-width:760px), (hover:none) and (pointer:coarse) and (max-height:520px){
  :root{--fs-1:11px;--fs-2:12px;--fs-3:13px;--fs-4:14px;--fs-5:16px;}
  .tabbar{flex-wrap:wrap;}
  .tab{height:44px;border-bottom-color:transparent;}
  .tab.active{border-bottom-color:var(--accent);}
  .tab-ink{display:none;}
  .main{padding-top:16px;}
}

[hidden]{display:none !important;}   /* an author rule such as .tab{display:flex} would otherwise beat the attribute */
/* ───── the Export tab, and the page you print ───── */
.ex-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start;}
.ex-col{display:flex;flex-direction:column;gap:16px;min-width:0;}
.ex-c h3{margin:0 0 6px;font-size:var(--fs-5);font-weight:600;letter-spacing:-.1px;}
.ex-c p{margin:0 0 12px;color:var(--text2);font-size:var(--fs-3);line-height:1.5;max-width:62ch;}
.ex-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.ex-acts .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.ex-sheets{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;}
.ex-sheets span{font-size:var(--fs-2);color:var(--text2);padding:2px 9px;border-radius:var(--r-full);background:var(--surface2);border:1px solid var(--border);white-space:nowrap;}
.ex-prev{border:1px solid var(--border);border-radius:var(--r-2);margin-bottom:12px;overflow:hidden;}
.ex-prev .tbl td{padding:6px 12px;font-size:var(--fs-3);}
.ex-auto{margin-top:12px;font-size:var(--fs-2);color:var(--text2);line-height:1.5;}
.lnk{border:0;background:none;padding:0;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px;}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;padding:14px 18px;margin-bottom:16px;border:1px solid var(--accent-soft);border-radius:var(--r-3);background:var(--accent-dim);font-size:var(--fs-3);}
.resume b{font-weight:600;}
.resume .sub{display:block;color:var(--text2);margin-top:2px;}
.resume-acts{display:flex;gap:8px;}
@media (max-width:900px){.ex-grid{grid-template-columns:minmax(0,1fr);}}
#hf-print{display:none;}
@media print{
  @page{size:A4;margin:13mm 12mm;}
  html,body{background:#fff !important;color:#111 !important;}

  .pr-tiles div:last-child{border-right:0;}

  .pr-t{width:100%;border-collapse:collapse;font-size:8.5pt;}
  .pr-t th{font-size:7.5pt;text-transform:uppercase;letter-spacing:.3pt;text-align:left;border-bottom:.75pt solid #111;padding:2pt 4pt;color:#333 !important;}
  .pr-t td{padding:2.2pt 4pt;border-bottom:.4pt solid #bbb;vertical-align:top;}
  .pr-t .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .pr-t tr{break-inside:avoid;}

  .pr-rule{color:#555 !important;font-size:7.5pt;margin-left:4pt;}
  .pr-f .b{width:34%;}

  .pr-you{font-size:7.5pt;border:.5pt solid #111;padding:0 3pt;border-radius:2pt;}
  .pr-fig{margin-top:8pt;break-inside:avoid;}

  .pr-ft{margin-top:12pt;padding-top:4pt;border-top:.5pt solid #777;font-size:7.5pt;color:#555 !important;}
}

/* ───── chemistry ───── */
.struct{display:flex;align-items:center;justify-content:center;border-radius:var(--r-2);background:var(--surface);border:1px solid var(--border);overflow:hidden;color:var(--text);}
.struct svg{width:100%;height:100%;display:block;}
.struct.sm{width:132px;min-height:0;}
.struct.big{width:100%;max-width:320px;margin-bottom:8px;}
[data-theme="dark"] .struct svg{filter:invert(.9) hue-rotate(180deg);}
.nostruct{font-size:var(--fs-2);color:var(--text3);padding:6px;text-align:center;}
.chem-st{display:flex;gap:12px;align-items:center;margin:0 2px 12px;font-size:var(--fs-3);color:var(--text2);}
.cs{display:inline-flex;align-items:center;gap:10px;}
.cs.ok::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);}

<script>
/* ═══════════════════════════════════════════════════════════════════════════════════════════════
   Hit Finder — triage of Echo Dose Response screens. One file, no build step.
   §0 helpers · §1 SCREEN ENGINE (Echo's, copied) · §1b RDKIT LOADER (Echo's, copied) · §2 state
   §3 ingest · §4 example screen · §5 views · §6 wiring
   ═══════════════════════════════════════════════════════════════════════════════════════════════ */

/* ───── §0 helpers ───── */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
const _natColl = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
function natCmp(a, b) { return _natColl.compare(String(a == null ? '' : a), String(b == null ? '' : b)) || (a < b ? -1 : a > b ? 1 : 0); }
// A cell in a file is data, never a formula: =, + - @ at the start of text are neutralised (numbers are left alone).
// a string that IS a number ("-5", "1e-3") is left alone; "-2+3" is not a number, it is a formula waiting for a spreadsheet
const HF_NUMLIKE = /^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/;
function csvCell(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'number') return isFinite(v) ? String(v) : '';
  let s = String(v);
  if (/^[=+\-@\t\r]/.test(s) && !HF_NUMLIKE.test(s)) s = "'" + s;
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function hfToast(msg, kind) {
  const t = $('#hf-toast'); if (!t) return;
  t.className = 'toast show' + (kind ? ' ' + kind : ''); t.textContent = msg;
  clearTimeout(hfToast._t); hfToast._t = setTimeout(() => { t.classList.remove('show'); }, kind === 'err' ? 6000 : 3200);
}
// A potency reads in the unit that fits it: 450 pM, 12.3 nM, 1.2 µM.
function fmtNM(v) {
  v = scrFin(v); if (v == null) return '—';
  if (v >= 1000) return (+(v / 1000).toPrecision(3)) + ' µM';
  if (v < 1) return (+(v * 1000).toPrecision(3)) + ' pM';
  return (+v.toPrecision(3)) + ' nM';
}
function fmtPct(v) { v = scrFin(v); return v == null ? '—' : Math.round(v) + '%'; }
function fmtFold(v) { v = scrFin(v); return v == null ? '—' : '×' + (v >= 100 ? Math.round(v) : +v.toPrecision(2)); }
// What one compound is called. Case, spaces and - _ are the same name; everything else is a different one.
function hfKey(id) { return String(id == null ? '' : id).trim().toLowerCase().replace(/[\s_‐-―-]+/g, '-').replace(/^-+|-+$/g, ''); }

/* ───── §1 SCREEN ENGINE ───── */
// ═══ SCREEN ENGINE — BEGIN (canonical in Echo; tools/sync_screen_engine.py copies it into Hit Finder) ═══
// Pure functions over a RESULT ROW (what _fitOne returns and History stores). Nothing here fits a curve and
// nothing reads the page, so the same numbers come out of Echo's export and out of Hit Finder, from a live
// run or from a History entry saved a year ago. Concentrations on a row are log10(M); what is returned is nM.
// Derived, never stored: a stored hook onset would go stale the moment a point is left out in Curves.
var SCR_SCHEMA = 'echo-screen/1';
function scrFin(v) { return (v != null && v !== '' && isFinite(+v)) ? +v : null; }
function scrNM(logM) { var v = scrFin(logM); return v == null ? null : Math.pow(10, v) * 1e9; }
function scrSig(v, n) { v = scrFin(v); return v == null ? null : +v.toPrecision(n || 4); }
function scrRound(v, d) { v = scrFin(v); return v == null ? null : +v.toFixed(d == null ? 1 : d); }
// The flag text is the one place Echo says why a curve was flagged; this turns it back into facts.
function scrFlags(row) {
  var s = String((row && row.Flag_Reason) || ''), m;
  return { noEffect: /No effect/.test(s), rangeHi: /EC50>range/.test(s), rangeLo: /EC50<range/.test(s),
    botBound: /Bottom at bound/.test(s), topBound: /Top at bound/.test(s),
    hookN: (m = s.match(/Hookx(\d+)/)) ? +m[1] : 0, fewPts: /n=\d+ \((no df|df=\d+)\)/.test(s),
    r2: (m = s.match(/R2=([\d.]+)/)) ? +m[1] : null, sd: (m = s.match(/SD=([\d.]+)/)) ? +m[1] : null };
}
// The replicate readings grouped by concentration (tolerance 0.002 log), highest concentration first.
function scrGroupReps(reps) {
  var pts = (reps || []).filter(function (p) { return p && scrFin(p.x) != null && scrFin(p.y) != null; })
    .slice().sort(function (a, b) { return b.x - a.x; });
  var g = [];
  pts.forEach(function (p) {
    var last = g[g.length - 1];
    if (last && Math.abs(last.x - p.x) < 0.002) last.ys.push(+p.y); else g.push({ x: +p.x, ys: [+p.y] });
  });
  g.forEach(function (c) { c.mean = c.ys.reduce(function (s, v) { return s + v; }, 0) / c.ys.length; });
  return g;
}
// Echo's own hook rule (_fitOne): from the top, a concentration is a hook when its mean sits more than `thr`
// points ABOVE the mean two concentrations down; at most three, and the first that is not stops the walk.
function scrDetectHook(g, thr) {
  var out = [];
  for (var i = 0; i < Math.min(3, g.length - 2); i++) { if (g[i].mean > g[i + 2].mean + thr) out.push(g[i].x); else break; }
  return out;
}
// Hook state of one curve. opt = { hookEnabled, hookThr } is what the analysis's settings said, for a row saved
// before the threshold was stamped on it (_hookThr). States: excluded (detected, left out of the fit) · included
// (detected, then put back in the fit by the user) · none (looked, found none) · off (not looked for) ·
// n/a (this assay has no hook) · unknown (an old row and no settings to ask).
function scrHook(row, opt) {
  var at = row._assayType, out = { state: 'unknown', thr: null, concs: [], onset_nM: null, lastProductive_nM: null,
    nadir: null, depth: null, recovery: null, dmaxObs: null };
  if (at === 'gain' || at === 'displacement') { out.state = 'n/a'; return out; }
  var thr = row._hookThr !== undefined ? scrFin(row._hookThr)
    : (opt && opt.hookEnabled !== undefined ? (opt.hookEnabled ? scrFin(opt.hookThr) : null) : undefined);
  var g = scrGroupReps(row._reps), H = null;
  var hc = (row._hook_concs || []).map(Number).filter(isFinite);
  out.thr = thr == null ? null : thr;
  if (row._is_hook && hc.length) { out.state = 'excluded'; H = hc; }
  else if (row._hookIn) { out.state = 'included'; H = thr == null ? [] : scrDetectHook(g, thr); }
  else if (thr != null) { out.state = 'none'; H = []; }
  else if (thr === null) { out.state = 'off'; }
  if (!g.length) return out;
  var isH = function (x) { return (H || []).some(function (h) { return Math.abs(h - x) < 0.002; }); };
  var N = out.state === 'included' ? g : g.filter(function (c) { return !isH(c.x); });
  if (!N.length) return out;
  var nad = N.reduce(function (a, c) { return c.mean < a.mean ? c : a; });
  out.nadir = nad.mean;
  out.lastProductive_nM = scrNM(N[0].x);
  var top = scrFin(row.Top_val); if (top == null) top = scrFin(row._tc); if (top == null) top = 100;
  out.dmaxObs = Math.max(0, top - nad.mean);
  if (H && H.length) {
    out.concs = H.slice().sort(function (a, b) { return b - a; });
    out.onset_nM = scrNM(Math.min.apply(null, H));
    out.depth = g[0].mean - nad.mean;
    var span = top - nad.mean;
    out.recovery = span > 0 ? Math.min(1, Math.max(0, out.depth / span)) : null;
    if (out.state === 'included') out.lastProductive_nM = scrNM(g.filter(function (c) { return !isH(c.x); }).map(function (c) { return c.x; })[0]);
  }
  return out;
}
// How much of the curve was actually measured: points on each side of the midpoint, and whether the plateaus
// were reached. A half-curve fits its own half beautifully (R² 0.997) — this is what says it is a half.
function scrCoverage(row, hook) {
  var g = scrGroupReps(row._reps), H = (hook && hook.state === 'excluded') ? hook.concs : [];
  var N = g.filter(function (c) { return !H.some(function (h) { return Math.abs(h - c.x) < 0.002; }); });
  var bot = scrFin(row._bot), top = scrFin(row._tc), ec = scrFin(row._logec50), gain = !!row._gainMode;
  var o = { nConc: N.length, nLo: null, nHi: null, plateauLow: null, plateauHigh: null, cat: 'unknown' };
  if (bot == null || top == null || ec == null || !N.length) return o;
  o.nLo = N.filter(function (c) { return c.x <= ec - 0.5; }).length;
  o.nHi = N.filter(function (c) { return c.x >= ec + 0.5; }).length;
  var mid = N.some(function (c) { return Math.abs(c.x - ec) <= 0.5; });
  var lowRef = gain ? bot : top, highRef = gain ? top : bot;
  o.plateauHigh = Math.abs(N[0].mean - highRef) <= 10;
  o.plateauLow = Math.abs(N[N.length - 1].mean - lowRef) <= 10;
  o.cat = (N.length < 6 || !mid) ? 'sparse' : (o.plateauLow && o.plateauHigh) ? 'complete'
    : o.plateauHigh ? 'no-low-plateau' : o.plateauLow ? 'no-high-plateau' : 'no-plateaus';
  return o;
}

  // ── what any page can offer ────────────────────────────────────────────────────────────────
  function say(m){ (window.hubToast || window.toast || window.showToast || console.log)(m); }

        } },

  function cellText(c){ return (c.innerText || c.textContent || '').replace(/\s+/g, ' ').trim(); }

    var row = cell.closest('tr'), rows = Array.prototype.slice.call(tb.rows), ci = Array.prototype.indexOf.call(row.cells, cell);

      { label: 'Copy column', act: function(){ copyText(rows.map(function(r){ return r.cells[ci] ? cellText(r.cells[ci]) : ''; }).join('\n'), 'Column copied.'); } },

    items.push({ label: dark ? 'Light mode' : 'Dark mode', act: toggleTheme });
    if (P && typeof P.backToHub === 'function') items.push({ label: 'Back to the Hub', act: function(){ P.backToHub(); } });
    return items;
  }
  ctxApp = function(resolve, opts){
    opts = opts || {};

      var t = e.target, items = [], own = resolve ? resolve(e, t) : null;

        return { label: a.l, k: a.k, danger: a.danger, act: function(){ window[a.f].apply(null, a.args || []); } };

  document.addEventListener('pointerdown', function(e){ if (el && !el.contains(e.target)) ctxClose(); }, true);

  window.addEventListener('resize', ctxClose);
  document.addEventListener('scroll', function(e){ if (el && !el.contains(e.target)) ctxClose(); }, true);
})();
