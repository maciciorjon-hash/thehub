<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Labbook</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fs-1:10px;--fs-2:11px;--fs-3:12px;--fs-4:13px;--fs-5:15px;--fs-6:17px;--fs-7:20px;--fs-8:26px;--fs-9:38px;--r-1:6px;--r-2:10px;--r-3:14px;--r-4:20px;--r-full:999px;}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f4f5f8;--surface:#ffffff;--surface2:#f0f1f5;--surface3:#e4e6ee;
  --border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.13);
  --text:#1a1d2e;--text2:#5a5f7a;--text3:#9ca0b8;
  --brand:#3f6fa8;--accent:#5e87c5;--accent-dim:rgba(94,135,197,0.12);--accent-soft:rgba(94,135,197,0.22);
  --warn:#c47818;--danger:#c04040;--good:#2d9462;
  --sans:'IBM Plex Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow-xs:0 1px 4px rgba(0,0,0,.04);--shadow-sm:0 2px 8px rgba(0,0,0,.06);
  --shadow-md:0 6px 24px rgba(0,0,0,.09);--shadow-lg:0 16px 48px rgba(0,0,0,.14);
  --glass:rgba(255,255,255,0.66);--glass-solid:rgba(255,255,255,0.9);--glass-brd:rgba(255,255,255,0.7);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.7);--glass-shadow:0 10px 30px -12px rgba(32,44,84,.26);
  --r2:12px;--r3:16px;--ease:cubic-bezier(.2,.8,.3,1);
}
[data-theme="dark"]{
  --bg:#0d0f14;--surface:#13161e;--surface2:#1c2030;--surface3:#252a3a;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e8eaf2;--text2:#8b90a8;--text3:#4e5368;
  --brand:#7fa6dc;--accent:#8aaee0;--accent-dim:rgba(138,174,224,0.16);--accent-soft:rgba(138,174,224,0.26);
  --warn:#f0b060;--danger:#f08a84;--good:#6ddca8;
  --shadow-xs:0 1px 4px rgba(0,0,0,.30);--shadow-sm:0 2px 8px rgba(0,0,0,.40);
  --shadow-md:0 6px 24px rgba(0,0,0,.50);--shadow-lg:0 16px 48px rgba(0,0,0,.55);
  --glass:rgba(28,32,46,0.62);--glass-solid:rgba(22,26,38,0.92);--glass-brd:rgba(255,255,255,0.1);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.07);--glass-shadow:0 12px 36px -12px rgba(0,0,0,.6);
}
input::placeholder,textarea::placeholder{color:var(--text3);opacity:1;}
html,body{height:100%;overflow:hidden;}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:var(--fs-5);-webkit-font-smoothing:antialiased;position:relative;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:radial-gradient(50% 45% at 6% 4%,var(--accent-dim),transparent 70%),radial-gradient(46% 44% at 96% 96%,var(--accent-dim),transparent 70%);}
[data-theme="dark"] body::before{opacity:.7;}
body>*{position:relative;z-index:1;}
.pane{transition:width .26s var(--ease);}
body.lb-rz .pane{transition:none;}

header{border-bottom:1px solid var(--border);padding:0 18px;display:flex;align-items:center;gap:12px;background:var(--surface);min-height:48px;flex-shrink:0;}
/* Floating on mobile (bottom-left) so it never collides with the ribbon, and stays reachable
   when dHUB hides the app header. Hidden entirely on desktop. */
#mobile-nav-btn{display:none;position:fixed;left:12px;bottom:14px;z-index:47;border:1px solid var(--border2);background:var(--surface);color:var(--text);width:46px;height:46px;border-radius:50%;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-lg);}
#mobile-nav-btn:hover{background:var(--surface2);}
#mobile-nav-btn svg{width:22px;height:22px;}
body.mobile-drawer-open #mobile-nav-btn{opacity:0;pointer-events:none;}
#mobile-backdrop{display:none;}
.mobile-drawer{display:contents;}
.logo{width:28px;height:28px;border-radius:var(--r-1);background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo svg{width:17px;height:17px;}
.app-name{font-size:var(--fs-5);font-weight:600;letter-spacing:-0.2px;}
.app-sub{font-size:var(--fs-2);color:var(--text2);}
@media(max-width:760px){.app-sub{display:none;}}

.backup-note{font-size:var(--fs-2);color:var(--text3);cursor:pointer;padding:3px 8px;border-radius:var(--r-full);white-space:nowrap;}
.backup-note:hover{color:var(--text2);background:var(--surface2);}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-2);color:var(--text2);padding:3px 9px;border-radius:var(--r-4);background:var(--surface2);white-space:nowrap;}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:background .3s;flex-shrink:0;}
.status-pill.online{color:var(--good);}
.status-pill.online .dot{background:var(--good);}
.status-pill.saving .dot{background:var(--warn);}
.status-pill.offline{color:var(--warn);}
.status-pill.offline .dot{background:var(--warn);}

/* ── Ribbon ─────────────────────────────────────────────────────────────── */
#ribbon{display:block;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border-bottom:1px solid var(--glass-brd);flex-shrink:0;}
.rb-tabbar{display:flex;align-items:center;gap:2px;padding:4px 10px 0;border-bottom:1px solid var(--border);}
.rb-tab{border:none;background:none;color:var(--text2);font-family:var(--sans);font-size:var(--fs-3);font-weight:600;padding:7px 14px;cursor:pointer;border-radius:8px 8px 0 0;position:relative;transition:color .12s,background .12s;}
.rb-tab:hover{color:var(--text);background:var(--surface2);}
.rb-tab.on{color:var(--accent);}
.rb-tab.on::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2.5px;background:var(--accent);border-radius:var(--r-1);}
.rb-tab-spacer{flex:1;}
/* min-height, never height: a fixed 76px row cannot grow, so a button whose content needs
   more room is clipped against a ceiling instead of the row expanding to fit it. */
.rb-pane{display:flex;align-items:center;gap:4px;padding:6px 12px;overflow-x:auto;min-height:80px;position:relative;}
/* The tab row alone is ~30px against ~120px with the tools open, and it is the switch. */
body.lb-rb-closed .rb-pane{display:none;}
/* The selection bubble — formatting where the text is, instead of a permanent strip at the top
   of the window. It is the reason the pane can default to closed. */
#lb-bubble{position:fixed;z-index:960;display:none;align-items:center;gap:2px;padding:4px;
  border-radius:var(--r-2);background:var(--surface);border:1px solid var(--border2);
  box-shadow:0 8px 26px rgba(0,0,0,.20);white-space:nowrap;}
#lb-bubble.on{display:flex;}
#lb-bubble button{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid transparent;background:none;color:var(--text2);border-radius:var(--r-1);cursor:pointer;
  font-family:var(--sans);font-size:var(--fs-3);font-weight:700;padding:0;}
#lb-bubble button:hover{background:var(--surface2);color:var(--text);}
#lb-bubble button svg{width:17px;height:17px;}
#lb-bubble .sep{width:1px;height:18px;background:var(--border2);margin:0 3px;flex:none;}
.rb-core{display:flex;align-items:center;gap:3px;flex-wrap:nowrap;}
.tb-grouplbl{font-size:var(--fs-1);font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);margin:0 6px 0 2px;flex-shrink:0;}
.tb{width:34px;height:34px;border:none;background:none;border-radius:var(--r-2);color:var(--text2);cursor:pointer;font-size:var(--fs-5);display:inline-flex;align-items:center;justify-content:center;transition:background .12s,color .12s;font-family:var(--sans);flex-shrink:0;}
.tb:hover{background:var(--surface2);color:var(--text);}
.tb.active{background:var(--accent-dim);color:var(--accent);}
/* labelled buttons (Insertar / Vista tabs) */
.rb-labelled{gap:4px;flex-wrap:nowrap;min-height:62px;align-items:center;}
.rb-lbtn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:76px;min-width:76px;min-height:66px;padding:7px 4px;border:1px solid transparent;border-radius:var(--r-2);background:none;color:var(--text2);cursor:pointer;transition:background .12s,color .12s,border-color .12s;font-family:var(--sans);flex:0 0 76px;}
.rb-lbtn:hover{background:var(--surface2);color:var(--text);border-color:var(--border);}
.rb-lbtn-ico{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;}
.rb-lbtn-ico svg{width:24px;height:24px;}
.rb-lbtn-lbl{font-size:var(--fs-1);font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tb b,.tb i,.tb u,.tb s{pointer-events:none;}
.tb svg{width:20px;height:20px;pointer-events:none;}
.rb-tabbar .status-pill{margin-right:2px;}
.tb .sb{font-size:var(--fs-3);font-weight:600;}
.tb .sb sub{font-size:var(--fs-1);vertical-align:-3px;}
.tb .sb sup{font-size:var(--fs-1);vertical-align:5px;}
.tb-sep{width:1px;height:20px;background:var(--border2);margin:0 4px;flex-shrink:0;}
.tb-sel{height:32px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);border-radius:var(--r-1);font-family:var(--sans);font-size:var(--fs-3);padding:0 8px;cursor:pointer;outline:none;flex-shrink:0;}
/* fast custom tooltip (native title is too slow) */
#lb-tip{position:fixed;z-index:400;background:var(--text);color:var(--bg);font-size:var(--fs-2);font-weight:500;padding:5px 9px;border-radius:var(--r-1);box-shadow:var(--shadow-md);pointer-events:none;opacity:0;transition:opacity .12s;max-width:260px;white-space:normal;line-height:1.35;}
#lb-tip.on{opacity:1;}
.tb-sel:focus{border-color:var(--accent);}
.tb-color{position:relative;}
.tb-swatch{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-2);box-shadow:var(--shadow-md);padding:9px;display:none;width:184px;}
.tb-color.open .tb-swatch{display:block;}
.tb-swatch .sw-lbl{font-size:var(--fs-1);font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);margin:0 0 7px 2px;}
.tb-swatch .sw-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.tb-swatch .sw{width:22px;height:22px;border-radius:var(--r-1);cursor:pointer;border:1px solid var(--border2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);transition:transform .1s;}
.tb-swatch .sw:hover{transform:scale(1.12);}
.tb-swatch .sw-none{grid-column:1/-1;margin-top:7px;font-size:var(--fs-2);color:var(--text2);border:1px dashed var(--border2);border-radius:var(--r-1);padding:5px;text-align:center;cursor:pointer;}
.tb-swatch .sw-none:hover{color:var(--text);border-color:var(--accent);}

/* ── Movable panels ─────────────────────────────────────────────────────── */
.panel{flex-shrink:0;}
#rightdock .panel{width:100%;margin-bottom:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);}
#rightdock .panel-h{display:flex;align-items:center;gap:5px;padding:5px 8px;font-size:var(--fs-1);font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);cursor:grab;border-bottom:1px solid var(--border);}
#rightdock .panel-h .ptitle{flex:1;}
#rightdock .panel-body{display:flex;flex-direction:column;align-items:stretch;gap:5px;padding:8px;}

.body{flex:1;display:flex;min-height:0;position:relative;}
.pane-sec{width:210px;flex-shrink:0;background:var(--surface);overflow-y:auto;padding:10px 9px;}
.pane-lbl{font-size:var(--fs-1);font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--text3);margin:10px 8px 6px;}
.sec-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-2);cursor:pointer;font-size:var(--fs-4);color:var(--text2);transition:background .12s;position:relative;}
.sec-item:hover{background:var(--surface2);color:var(--text);}
.sec-item.active{background:var(--accent-dim);color:var(--accent);font-weight:600;}
.sec-item .dot{width:8px;height:8px;border-radius:var(--r-1);flex-shrink:0;background:var(--accent);}
.sec-item .del{margin-left:auto;opacity:.5;color:var(--text3);font-size:var(--fs-6);line-height:1;padding:2px 5px;border-radius:var(--r-1);cursor:pointer;flex-shrink:0;}
.sec-item:hover .del{opacity:.85;}
.sec-item .del:hover{color:var(--danger);opacity:1;background:var(--surface3);}
.add-row{display:flex;gap:6px;margin:8px 8px 4px;}
.add-row input{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-2);padding:6px 9px;font-family:var(--sans);font-size:var(--fs-3);color:var(--text);outline:none;}
.add-row input:focus{border-color:var(--accent);}
.add-row button{background:var(--accent);border:none;color:#fff;border-radius:var(--r-2);width:30px;font-size:var(--fs-5);cursor:pointer;flex-shrink:0;}
.proj-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-2);cursor:pointer;font-size:var(--fs-4);color:var(--text);font-weight:600;transition:background .12s;}
.proj-row:hover{background:var(--surface2);}
.proj-row .chev{color:var(--text3);transition:transform .15s;display:inline-flex;align-items:center;justify-content:center;width:12px;flex-shrink:0;}
.proj-row .chev.open{transform:rotate(90deg);}
.proj-row .pcolor{width:9px;height:9px;border-radius:var(--r-1);flex-shrink:0;}
.proj-row .proj-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.proj-row .del{opacity:.5;color:var(--text3);font-size:var(--fs-6);line-height:1;padding:2px 5px;border-radius:var(--r-1);cursor:pointer;flex-shrink:0;}
.proj-row:hover .del{opacity:.85;}
.proj-row .del:hover{color:var(--danger);opacity:1;background:var(--surface3);}
.sec-item.sub{margin-left:15px;padding-left:12px;font-size:var(--fs-3);border-left:1px solid var(--border);border-radius:0 9px 9px 0;}
.sec-item.sub .dot{width:6px;height:6px;border-radius:50%;background:var(--text3);}
.sec-item.sub.active .dot{background:var(--accent);}
.add-row.sub{margin-left:19px;}

.splitter{width:6px;flex-shrink:0;cursor:col-resize;background:var(--border);opacity:.5;transition:opacity .15s,background .15s;touch-action:none;}
.splitter:hover,.splitter.drag{opacity:1;background:var(--accent);}
.pane-sec,.pane-pages{border-right:1px solid var(--border);}
.pane.collapsed{width:34px!important;padding:0;overflow:hidden;}
.rail{display:none;flex-direction:column;align-items:center;padding-top:12px;height:100%;}
.pane.collapsed .rail{display:flex;}
.pane.collapsed .pane-inner{display:none;}
.rail-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:5px;border-radius:var(--r-1);writing-mode:vertical-rl;font-size:var(--fs-2);letter-spacing:.5px;}
.rail-btn:hover{color:var(--accent);background:var(--surface2);}
.collapse-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:var(--fs-4);padding:2px 5px;border-radius:var(--r-1);margin-left:auto;}
.collapse-btn:hover{color:var(--accent);background:var(--surface2);}

.pane-pages{width:280px;flex-shrink:0;background:var(--surface);overflow-y:auto;display:flex;flex-direction:column;}
.pages-hd{padding:11px 13px 9px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2;}
.pages-hd .t{font-size:var(--fs-4);font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pages-new{background:var(--accent);border:none;color:#fff;border-radius:var(--r-2);padding:6px 11px;font-family:var(--sans);font-size:var(--fs-3);font-weight:600;cursor:pointer;white-space:nowrap;}
.icon-btn{background:none;border:1px solid var(--border2);color:var(--text2);border-radius:var(--r-1);width:28px;height:28px;cursor:pointer;font-size:var(--fs-4);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-btn:hover{color:var(--accent);border-color:var(--accent);}
.pages-filter.on{padding:8px 13px;border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.filter-chip{font-size:var(--fs-2);padding:2px 9px;border-radius:var(--r-4);background:var(--accent-dim);color:var(--accent);font-weight:600;display:inline-flex;gap:5px;align-items:center;}
.filter-chip .x{cursor:pointer;}
.grp-lbl{font-size:var(--fs-1);font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text3);padding:11px 14px 4px;}
.page-item{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.page-item:hover{background:var(--surface2);}
.page-item.active{background:var(--accent-dim);}
.page-body{flex:1;min-width:0;}
.page-del{opacity:0;background:none;border:none;color:var(--text3);cursor:pointer;padding:3px;border-radius:var(--r-1);flex-shrink:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;transition:opacity .12s,color .12s,background .12s;}
.page-item:hover .page-del{opacity:.55;}
.page-del:hover{opacity:1;color:var(--danger);background:var(--surface3);}
.page-del svg{width:14px;height:14px;}
.page-code{font-family:var(--sans);font-size:var(--fs-2);color:var(--accent);font-weight:600;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.page-title{overflow-wrap:anywhere;}
.page-title{font-size:var(--fs-4);font-weight:600;margin-top:3px;color:var(--text);line-height:1.35;}
.page-meta{font-size:var(--fs-1);color:var(--text3);margin-top:4px;font-family:var(--sans);display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.page-kind{font-size:var(--fs-1);font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);}
.pg-status{padding:1px 7px;border-radius:var(--r-2);font-weight:600;text-transform:uppercase;letter-spacing:.4px;font-size:var(--fs-1);}
.pg-status.planned{background:var(--surface3);color:var(--text2);}
.pg-status.ongoing{background:rgba(94,135,197,.16);color:#5075b5;}
.pg-status.done{background:rgba(45,148,98,.15);color:var(--good);}
/* paused and abandoned are decisions, not stages, so they read as muted rather than as
   another point on the planned->done track. */
.pg-status.paused{background:rgba(201,154,78,.16);color:#a3762f;}
.pg-status.abandoned{background:var(--surface3);color:var(--text3);text-decoration:line-through;}
.exh-arch{margin-left:8px;padding:1px 7px;border-radius:var(--r-2);background:var(--surface3);color:var(--text3);
  font-size:var(--fs-1);text-transform:uppercase;letter-spacing:.4px;font-weight:600;align-self:center;}
.pages-empty{padding:36px 20px;text-align:center;color:var(--text3);font-size:var(--fs-3);line-height:1.6;}

.pane-ed{flex:1;overflow-y:auto;min-width:0;background:var(--bg);}
/* Theme-aware scrollbars (the default macOS bar reads as a bright slab in dark mode) */
*{scrollbar-width:thin;scrollbar-color:var(--border2) transparent;}
::-webkit-scrollbar{width:11px;height:11px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:var(--r-1);border:3px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--text3);}
::-webkit-scrollbar-corner{background:transparent;}
.ed-wrap{width:min(1400px,100%);margin:0 auto;padding:22px clamp(20px,2.4vw,44px) 90px;}
@media(max-width:900px){.ed-wrap{padding:18px 20px 80px;}}
.ed-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);text-align:center;padding:40px;}
.ed-empty svg{width:44px;height:44px;opacity:.5;margin-bottom:14px;}
.ed-empty .t{font-size:var(--fs-5);font-weight:600;color:var(--text2);margin-bottom:6px;}

#rightdock{width:250px;flex-shrink:0;border-left:1px solid var(--glass-brd);background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);overflow-y:auto;padding:12px;}
#rightdock.hidden{display:none;}
.dock-empty{color:var(--text3);font-size:var(--fs-2);text-align:center;padding:14px 8px;line-height:1.5;}
.outline-item{font-size:var(--fs-3);color:var(--text2);padding:5px 8px;border-radius:var(--r-1);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.outline-item:hover{background:var(--surface2);color:var(--text);}
.tagchip-btn{font-size:var(--fs-2);padding:3px 9px;border-radius:var(--r-4);background:var(--accent-dim);color:var(--accent);font-weight:600;cursor:pointer;border:none;}
.meta-line{font-size:var(--fs-2);color:var(--text2);display:flex;justify-content:space-between;gap:8px;padding:3px 0;}
.meta-line b{color:var(--text);font-weight:600;}

/* Experiment header */
.exh{background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);border:1px solid var(--glass-brd);border-radius:var(--r3);padding:16px 20px;margin-bottom:16px;box-shadow:var(--glass-shadow),var(--glass-hi);position:relative;}
.exh-top{display:flex;align-items:center;gap:8px;}
.exh-code{font-family:var(--sans);font-size:var(--fs-4);font-weight:500;color:var(--accent);background:none;border:none;outline:none;flex:1;padding:0;letter-spacing:.5px;}
.exh-acts{display:flex;gap:5px;}
.exh-act{background:none;border:1px solid var(--border2);color:var(--text2);border-radius:var(--r-1);width:30px;height:28px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
.exh-act:hover{color:var(--accent);border-color:var(--accent);}
.exh-act.danger:hover{color:var(--danger);border-color:var(--danger);}
.exh-act svg{width:15px;height:15px;}
.exh-title{font-size:var(--fs-8);font-weight:700;letter-spacing:-.4px;color:var(--text);border:none;background:none;outline:none;width:100%;padding:4px 0 2px;font-family:var(--sans);}
.exh-title.code-big{font-family:var(--sans);color:var(--text);font-size:var(--fs-8);}
.exh-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px 16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.exh-fld{display:flex;flex-direction:column;gap:4px;}
.exh-fld label{font-size:var(--fs-1);font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);}
.exh-fld input,.exh-fld select{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-1);padding:6px 9px;font-family:var(--sans);font-size:var(--fs-3);color:var(--text);outline:none;}
.exh-fld input:focus,.exh-fld select:focus{border-color:var(--accent);}
.exh-chips{display:flex;flex-wrap:wrap;gap:5px;}
.exh-chips:empty{display:none;}
.exh-chip{font-size:var(--fs-2);font-weight:600;background:var(--surface3);color:var(--text2);border-radius:var(--r-1);padding:2px 8px;cursor:pointer;white-space:nowrap;}
.exh-chip[data-kind="plasmid"]{color:#6d7bd0;background:rgba(109,123,208,.14);}
.exh-chip[data-kind="cell"]{color:#5e87c5;background:rgba(94,135,197,.14);}
.exh-chip:hover{filter:brightness(1.08);}

.blk{background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);border:1px solid var(--glass-brd);border-radius:var(--r2);margin-bottom:12px;box-shadow:var(--glass-shadow),var(--glass-hi);overflow:hidden;transition:box-shadow .2s var(--ease),transform .18s var(--ease);}
.blk:hover{box-shadow:var(--glass-shadow),0 4px 12px -4px rgba(32,44,84,.18),var(--glass-hi);}
.blk-hd{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--surface2);border-bottom:1px solid var(--border);}
.day-group{margin-bottom:16px;}
.day-group-hd{display:flex;align-items:center;gap:9px;margin:2px 0 8px;padding:0 2px;}
.day-group-hd::after{content:"";flex:1;height:1px;background:var(--border);}
.dg-day{font-size:var(--fs-1);font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:var(--r-1);padding:3px 9px;flex-shrink:0;}
.dg-day.dg-nodate{background:var(--text3);}
.dg-date{font-size:var(--fs-3);font-weight:600;color:var(--text2);flex-shrink:0;}
.day-group .blk{margin-bottom:8px;}
.blk-date{font-family:var(--sans);font-size:var(--fs-3);color:var(--text);background:none;border:1px solid var(--border2);border-radius:var(--r-1);padding:3px 8px;outline:none;}
.blk-date:focus{border-color:var(--accent);}
.blk-title{font-size:var(--fs-3);font-weight:600;color:var(--text2);border:none;background:none;outline:none;flex:1;font-family:var(--sans);}
/* The date, the snooze pill and the delete sit on one line and were 26, 23 and 23 tall. The
   round tick and the borderless title stay as they are on purpose: one is a checkbox, the
   other is meant to read as text. */
.blk-del{margin-left:auto;background:none;border:none;color:var(--text3);cursor:pointer;font-size:var(--fs-5);padding:3px 6px;border-radius:var(--r-1);min-height:26px;}
.blk-del:hover{color:var(--danger);background:var(--surface3);}
.rt{padding:12px 16px;font-family:var(--sans);font-size:var(--fs-4);line-height:1.7;color:var(--text);outline:none;min-height:40px;}
.rt:focus{background:var(--surface);}
.rt p{margin:0 0 6px;}
.rt ul,.rt ol{margin:0 0 6px 22px;}
.rt li{margin:2px 0;}
.rt h1{font-size:var(--fs-7);font-weight:700;margin:10px 0 6px;}
.rt h2{font-size:var(--fs-6);font-weight:700;margin:9px 0 5px;}
.rt h3{font-size:var(--fs-5);font-weight:700;margin:8px 0 5px;}
.rt blockquote{border-left:3px solid var(--border2);margin:6px 0;padding:2px 12px;color:var(--text2);}
.rt pre{background:var(--surface2);border-radius:var(--r-2);padding:10px 12px;font-family:var(--sans);font-size:var(--fs-3);overflow-x:auto;margin:6px 0;}
.rt table{border-collapse:collapse;margin:8px 0;min-width:220px;}
.rt td,.rt th{border:1px solid var(--border2);padding:6px 10px;min-width:48px;vertical-align:top;}
.rt th{background:var(--surface2);font-weight:700;text-align:left;}
.rt hr{border:none;border-top:1px solid var(--border2);margin:12px 0;}
.rt sub{vertical-align:sub;font-size:.75em;line-height:0;}
.rt sup{vertical-align:super;font-size:.75em;line-height:0;}
.rt a.lb-link{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none;border-bottom:1px dashed var(--accent);}
.rt a.lb-link.proto{color:#a56983;border-bottom-color:#a56983;}
/* Protocol callouts carried over from Archive. A warning must not read as prose — it is
   the sentence that stops the experiment failing. */
.rt .lb-note{margin:8px 0;padding:8px 12px;border-left:3px solid var(--border2);background:var(--surface2);border-radius:0 6px 6px 0;font-size:var(--fs-4);color:var(--text2);}
.rt .lb-note-warn{border-left-color:#e0803a;color:var(--text);}
.rt .lb-note-tip{border-left-color:#5e87c5;}
.rt .lb-table{border-collapse:collapse;margin:8px 0;font-size:var(--fs-3);}
.rt .lb-table th,.rt .lb-table td{border:1px solid var(--border2);padding:4px 9px;text-align:left;}
.rt .lb-table th{background:var(--surface2);font-weight:600;}
/* A protocol parameter rendered inside a copied step. */
.rt .pparam{border-bottom:1px dotted var(--border2);}
/* ── Protocol-driven step block ────────────────────────────────────────────────────────
   The prose is the protocol's and is not editable. What you can touch is a parameter, a
   tick, and a note — so the record always says what the protocol said, plus what you did
   differently, and never quietly loses the difference between the two. */
.pblk{border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface);padding:2px 14px 10px;}
.pblk-src{display:flex;align-items:center;gap:10px;padding:9px 0 7px;border-bottom:1px solid var(--border);margin-bottom:8px;}
.pblk-src .lb-link.proto{font-size:var(--fs-3);}
.pblk-count{font-family:var(--mono);font-size:var(--fs-2);color:var(--text3);}
.pblk-free{margin-left:auto;background:none;border:1px solid var(--border2);color:var(--text3);
  font-size:var(--fs-2);padding:3px 9px;border-radius:var(--r-1);cursor:pointer;}
.pblk-free:hover{color:var(--text);border-color:var(--text3);}
.psteps{margin:6px 0 6px 4px;padding-left:20px;}
.psteps>li{margin:0 0 7px;line-height:1.6;position:relative;padding-left:2px;}
.psteps>li.pstep-done .pstep-t{opacity:.45;text-decoration:line-through;text-decoration-color:var(--text3);}
.pstep-t{cursor:default;}
.pstep-tick{position:absolute;left:-38px;top:2px;width:17px;height:17px;border-radius:var(--r-1);
  border:1.5px solid var(--border2);background:var(--surface2);color:#fff;font-size:var(--fs-2);
  line-height:1;cursor:pointer;padding:0;}
.pstep-tick:hover{border-color:var(--accent);}
.pstep-tick.on{background:var(--accent);border-color:var(--accent);}
.pstep-noteb{margin-left:7px;background:none;border:none;color:var(--text3);font-size:var(--fs-2);
  cursor:pointer;opacity:0;transition:opacity .12s;padding:0 2px;}
.psteps>li:hover .pstep-noteb{opacity:1;}
.pstep-noteb:hover{color:var(--accent);}
.pstep-note{margin:5px 0 8px;padding:6px 10px;border-left:2px solid var(--accent);
  background:var(--surface2);border-radius:0 6px 6px 0;font-size:var(--fs-3);min-height:1.4em;}
.pblk-note{margin-top:10px;padding-top:9px;border-top:1px solid var(--border);}
.pblk-note-lbl{font-size:var(--fs-1);font-weight:600;letter-spacing:.4px;text-transform:uppercase;
  color:var(--text3);margin-bottom:4px;}
/* A parameter you can change. It has to read as part of the sentence, not as a form field —
   the step is still prose. */
.rt .pparam,.pblk .pparam{border-bottom:1px dotted var(--border2);}
.pblk .pparam.live{border-bottom:none;white-space:nowrap;}
.pblk .pparam.changed .pchip{border-color:var(--accent);color:var(--accent);font-weight:600;}
.pchip{font:inherit;font-family:var(--mono);font-size:.92em;text-align:center;
  background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-1);
  padding:0 3px;color:var(--text);min-width:1.7em;}
.pchip:hover{border-color:var(--text3);}
.pchip:focus{outline:none;border-color:var(--accent);background:var(--surface);}
.punit{color:var(--text2);}
.rt a.lb-link.plasmid{color:#6d7bd0;border-bottom-color:#6d7bd0;}
.rt a.lb-url{color:var(--accent2);text-decoration:underline;cursor:pointer;}
.rt img.lb-att{max-width:100%;height:auto;border-radius:var(--r-2);margin:6px 0;display:block;box-shadow:var(--shadow-xs);border:1px solid var(--border);}
.rt img.lb-att.att-missing{min-width:120px;min-height:70px;border:1px dashed var(--border2);background:var(--surface2);}
.rt .lb-proto-hd{margin:8px 0 2px;}
.rt .lb-tag{color:#5e72c4;background:rgba(94,114,196,.14);border-radius:var(--r-1);padding:0 5px;font-weight:600;font-size:var(--fs-3);}
.rt .lb-ab{color:#c47818;background:rgba(196,120,24,.13);border-radius:var(--r-1);padding:0 5px;font-weight:600;font-size:var(--fs-3);cursor:pointer;}
.rt .lb-todo{display:flex;align-items:flex-start;gap:8px;margin:3px 0;}
.rt .lb-box{width:15px;height:15px;border:1.6px solid var(--border2);border-radius:var(--r-1);flex-shrink:0;margin-top:2px;cursor:pointer;}
.rt .lb-todo.done .lb-box{background:var(--accent);border-color:var(--accent);}
.rt .lb-todo.done{opacity:.6;text-decoration:line-through;}
/* Checklist = real list, checkbox drawn on the marker */
.rt ul.lb-check{list-style:none;margin:2px 0 6px 4px;padding-left:0;}
.rt ul.lb-check ul{list-style:none;margin:2px 0 2px 10px;padding-left:0;}
.rt ul.lb-check li{position:relative;list-style:none;padding-left:26px;margin:3px 0;}
.rt ul.lb-check li::before{content:'';position:absolute;left:0;top:2px;width:15px;height:15px;border:1.6px solid var(--border2);border-radius:var(--r-1);background:var(--surface);cursor:pointer;}
.rt ul.lb-check li.done::before{background:var(--accent);border-color:var(--accent);}
.rt ul.lb-check li.done::after{content:'';position:absolute;left:5px;top:4px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);pointer-events:none;}
.rt ul.lb-check li.done{opacity:.62;text-decoration:line-through;}
/* ── Floating images (OneNote-style picture objects) ── */
.lb-canvas{position:relative;}
.lb-float-layer{position:absolute;left:0;top:0;right:0;min-height:100%;pointer-events:none;z-index:5;}
.lb-float-img{position:absolute;pointer-events:auto;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
.lb-float-img.dragging,.lb-float-img.resizing,.lb-float-img.rotating{cursor:grabbing;z-index:999!important;}
.lb-float-img .lf-body{position:relative;width:100%;height:100%;border-radius:var(--r-2);overflow:hidden;box-shadow:var(--shadow-xs);border:1px solid var(--border);background:var(--surface2);}
.lb-float-img img{width:100%;height:100%;object-fit:contain;display:block;background:#fff;pointer-events:none;}
.lb-float-img.selected .lf-body{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim,rgba(94,135,197,.35));}
.lb-float-img.locked .lf-body{border-style:dashed;}
.lf-cap{font-size:var(--fs-2);line-height:1.3;color:var(--text2);background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 7px 7px;padding:3px 7px;min-height:16px;outline:none;cursor:text;}
.lf-cap[data-ph]:empty::before{content:attr(data-ph);color:var(--text3);pointer-events:none;}
.lf-annot{position:absolute;inset:0;pointer-events:none;}
.lb-float-img.annotating .lf-annot{pointer-events:auto;cursor:crosshair;}
.lf-handle{position:absolute;width:11px;height:11px;background:var(--accent);border:1.5px solid #fff;border-radius:var(--r-1);z-index:2;display:none;}
.lb-float-img.selected:not(.locked) .lf-handle{display:block;}
.lf-h-nw{left:-6px;top:-6px;cursor:nwse-resize;} .lf-h-ne{right:-6px;top:-6px;cursor:nesw-resize;}
.lf-h-sw{left:-6px;bottom:-6px;cursor:nesw-resize;} .lf-h-se{right:-6px;bottom:-6px;cursor:nwse-resize;}
.lf-h-rot{left:50%;top:-26px;margin-left:-8px;width:16px;height:16px;border-radius:50%;cursor:grab;background:#fff;border:1.5px solid var(--accent);}
.lf-h-rot::after{content:'';position:absolute;left:50%;top:100%;width:1.5px;height:12px;background:var(--accent);margin-left:-.75px;}
.lb-float-img .lf-mini{position:absolute;top:-30px;left:0;display:none;gap:2px;background:var(--glass-solid,var(--surface));border:1px solid var(--border2);border-radius:var(--r-2);padding:2px;box-shadow:var(--shadow-sm,0 2px 8px rgba(0,0,0,.15));}
.lb-float-img.selected .lf-mini{display:flex;}
.lb-float-img .lf-mini button.on{background:var(--accent-dim);color:var(--accent);}
.lf-mini button{border:none;background:none;color:var(--text2);width:22px;height:22px;border-radius:var(--r-1);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.lf-mini button:hover{background:var(--surface3);color:var(--text);}
.lf-crop-rect{position:absolute;border:1.5px dashed #fff;box-shadow:0 0 0 2000px rgba(0,0,0,.45);cursor:move;}
@media print{ .lb-float-img .lf-mini,.lb-float-img .lf-handle{display:none!important;} }
.add-blk{width:100%;border:1.5px dashed var(--border2);background:none;color:var(--text3);border-radius:var(--r-2);padding:11px;font-family:var(--sans);font-size:var(--fs-3);cursor:pointer;transition:color .15s,border-color .15s;}
.add-blk:hover{color:var(--accent);border-color:var(--accent);}
.blk-addrow{display:flex;gap:8px;margin-top:2px;}.blk-addrow .add-blk{flex:1;}
.blk-addrow.drop{outline:2px dashed var(--accent);outline-offset:3px;border-radius:var(--r-2);}
/* The palette lives where the steps go, not in a panel you have to open. */
.stepbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.stepbar-t{font-size:var(--fs-1);color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-right:4px;}
.stepchip{display:inline-flex;align-items:center;gap:5px;font-family:var(--sans);font-size:var(--fs-2);
  background:var(--surface2);border:1px solid var(--border2);color:var(--text2);border-radius:var(--r-3);
  padding:4px 10px;cursor:grab;}
.stepchip:hover{color:var(--text);border-color:var(--accent);}
.stepchip.has-calc{color:var(--accent);}
.stepchip:active{cursor:grabbing;}
.blk-grip{display:inline-flex;align-items:center;color:var(--text3);cursor:grab;flex:none;margin-right:2px;}
.blk-grip:active{cursor:grabbing;}
.blk-dragging{opacity:.45;}
/* Where it will land, drawn on the block it will land against. */
.blk-drop-before{box-shadow:inset 0 3px 0 0 var(--accent);}
.blk-drop-after{box-shadow:inset 0 -3px 0 0 var(--accent);}
.add-step:hover{color:#a56983;border-color:#a56983;}
/* Live prep calculators inside experiment steps */
.blk-calcbtn{display:inline-flex;align-items:center;gap:4px;background:none;border:1px solid var(--border2);color:var(--accent);cursor:pointer;font-size:var(--fs-2);font-weight:600;padding:3px 9px;border-radius:var(--r-1);font-family:var(--sans);margin-right:4px;}
.blk-calcbtn:hover{background:var(--surface3);}
/* Step completion */
.blk-done{width:20px;height:20px;flex-shrink:0;border:1.5px solid var(--border2);background:none;border-radius:50%;cursor:pointer;color:#fff;font-size:var(--fs-3);line-height:1;display:flex;align-items:center;justify-content:center;padding:0;margin-right:2px;}
.blk-done:hover{border-color:#5e87c5;}
.blk-done.on{background:#5e87c5;border-color:#5e87c5;}
.blk.blk-is-done > .blk-hd .blk-title{text-decoration:line-through;opacity:.6;}
.blk.blk-is-done{opacity:.72;}
.blk.blk-is-done:hover{opacity:1;}
.pg-prog{font-size:var(--fs-1);color:var(--text3);}
.blk-calc{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--border2);border-left:3px solid #5e87c5;border-radius:var(--r-2);padding:9px 11px;margin:6px 0 8px;}
.cc-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.cc-tag{font-size:var(--fs-1);font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#5e87c5;}
.blk-calc.archive{border-left-color:#a56983;}
.blk-calc.archive .cc-tag{color:#a56983;}
.cc-src{font-size:var(--fs-1);font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#a56983;background:rgba(165,105,131,.14);border-radius:var(--r-1);padding:2px 5px;}
.cc-box-t{font-size:var(--fs-1);font-weight:600;color:var(--text2);margin:9px 0 5px;padding-bottom:3px;border-bottom:1px dashed var(--border);}
.cc-box-t:first-of-type{margin-top:2px;}
.cc-load{color:var(--text3);font-style:italic;font-size:var(--fs-3);}
.cc-x{background:none;border:none;color:var(--text3);cursor:pointer;font-size:var(--fs-5);line-height:1;padding:0 4px;border-radius:var(--r-1);}.cc-x:hover{color:var(--danger);background:var(--surface3);}
.cc-inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px 10px;}
/* The label sits at the top of the cell and the control at the bottom, so a row of fields whose
   labels are different lengths still lines its controls up: "FuGENE HD : DNA (µL:µg)" wrapping
   to two lines used to push its input a line below every other input beside it. */
.ci-f{display:flex;flex-direction:column;gap:3px;justify-content:space-between;}
.ci-f span{font-size:var(--fs-1);font-weight:600;color:var(--text2);letter-spacing:.2px;}
.ci-f input,.ci-f select{min-height:30px;border:1px solid var(--border2);background:var(--surface);color:var(--text);border-radius:var(--r-1);padding:5px 7px;font-family:var(--sans);font-size:var(--fs-3);}
.ci-f input:focus,.ci-f select:focus{outline:none;border-color:#5e87c5;box-shadow:0 0 0 2px rgba(94,135,197,.18);}
.cc-recipe{margin-top:9px;background:var(--surface);border:1px dashed var(--border2);border-radius:var(--r-2);padding:9px 12px;font-size:var(--fs-3);line-height:1.55;color:var(--text);}
.cc-tblwrap{overflow-x:auto;margin-top:8px;}
.cc-tbl{border-collapse:collapse;width:100%;font-size:var(--fs-2);}
.cc-tbl th{text-align:left;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;
  font-size:var(--fs-1);padding:4px 8px 4px 0;border-bottom:1px solid var(--border);white-space:nowrap;}
.cc-tbl td{padding:6px 8px 6px 0;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.45;}
.cc-tbl tr:last-child td{border-bottom:none;}
.cc-dim{color:var(--text3);font-size:var(--fs-1);}
.cc-note{margin-top:8px;color:var(--text2);font-size:var(--fs-2);line-height:1.5;}
.cc-warn{margin-top:8px;padding:7px 10px;border-radius:var(--r-1);background:rgba(217,83,79,.10);
  border:1px solid rgba(217,83,79,.35);color:#b23c38;font-size:var(--fs-2);line-height:1.5;}
.cc-fix{margin-left:6px;border:1px solid rgba(217,83,79,.5);background:var(--surface);color:#b23c38;
  font-family:var(--sans);font-size:var(--fs-1);font-weight:600;border-radius:var(--r-1);padding:2px 8px;cursor:pointer;}
.cc-fix:hover{background:rgba(217,83,79,.12);}
.cc-recipe b,.cc-recipe strong{color:#2b7d6e;}
.cc-recipe p{margin:8px 0 2px;font-weight:600;}
.cc-recipe p:first-child{margin-top:0;}
.cc-recipe ul{margin:2px 0 6px;padding-left:18px;list-style:disc;}
.cc-recipe li{margin:1px 0;font-weight:400;}
.cc-grp{font-size:var(--fs-1);font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#a56983;margin:9px 0 5px;}
.cc-grp:first-of-type{margin-top:3px;}
.dfx-recipe,.pd-recipe{background:#eef2f9;border-left:3px solid #5e87c5;border-radius:0 8px 8px 0;padding:7px 11px;margin:4px 0 6px;font-size:var(--fs-3);line-height:1.55;}
.dfx-recipe b{color:#2b7d6e;}
.ps-calc{margin:4px 0 6px;}.ps-calc-add{background:none;border:1px dashed var(--border2);color:#5e87c5;cursor:pointer;font-size:var(--fs-2);padding:5px 10px;border-radius:var(--r-2);font-family:var(--sans);margin:4px 0;}.ps-calc-add:hover{border-color:#5e87c5;}
/* Experiment free canvas + collapsible dated sections */
.exp-canvas{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);padding:16px 18px;box-shadow:var(--shadow-xs);min-height:180px;margin:6px 0 14px;}
.rt[data-ph]:empty::before{content:attr(data-ph);color:var(--text3);pointer-events:none;}
.exp-dated-body{margin-top:6px;}

.nb-body,.pg-body{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);padding:16px 18px;box-shadow:var(--shadow-xs);min-height:200px;}
/* Embedded Archive: parked off-screen (not display:none — its bridge scrapes a laid-out DOM,
   and an unrendered document measures nothing). */
#arc-host{position:fixed;left:-10000px;top:0;width:1200px;height:900px;overflow:hidden;pointer-events:none;}
#arc-frame{width:100%;height:100%;border:0;display:block;background:var(--bg);}
.arc-view{position:absolute;inset:0;display:flex;}
.arc-mount{flex:1;min-width:0;display:flex;}
#arc-frame.arc-visible{pointer-events:auto;}
.nb-free{margin-bottom:14px;}
/* Planner tasks shown inside the daily notebook */
.nbt-list{border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface2);padding:6px 4px;}
.nbt{display:flex;align-items:flex-start;gap:8px;padding:5px 9px;font-size:var(--fs-3);line-height:1.45;}
.nbt.done{opacity:.5;}
.nbt.done .nbt-tx>span[contenteditable]{text-decoration:line-through;}
.nbt-tx{flex:1;min-width:0;}
.nbt-tx>span[contenteditable]:focus{outline:none;}
.nbt .wk-cb{flex:none;width:15px;height:15px;margin-top:1px;border:1.5px solid var(--border2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--fs-1);color:#fff;cursor:pointer;}
.nbt.done .wk-cb{background:#5e87c5;border-color:#5e87c5;}
.nbt .wk-del{opacity:0;cursor:pointer;color:var(--text3);font-size:var(--fs-5);line-height:1;padding:0 3px;}
.nbt:hover .wk-del{opacity:.6;}
.nbt-lnk{font-size:var(--fs-1);color:var(--accent);cursor:pointer;margin-left:6px;white-space:nowrap;}
.nbt-add{padding:3px 9px 4px;}
.nbt-add input{width:100%;border:none;background:none;color:var(--text);font-family:var(--sans);font-size:var(--fs-3);padding:3px 0;}
.nbt-add input:focus{outline:none;}
@media (hover:none){ .nbt .wk-del{opacity:.55;} }
.day-from-lbl{font-size:var(--fs-1);font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin:0 4px 8px;}
.day-exp{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);margin-bottom:12px;box-shadow:var(--shadow-xs);overflow:hidden;}
.day-exp-hd{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--surface2);border-bottom:1px solid var(--border);}
.day-exp-hd .pdot{width:9px;height:9px;border-radius:var(--r-1);flex-shrink:0;}
.dfx-code{font-family:var(--sans);color:var(--accent);font-weight:600;font-size:var(--fs-3);}
.dfx-title{color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-3);}
.dfx-open{background:none;border:1px solid var(--border2);color:var(--text2);border-radius:var(--r-1);font-size:var(--fs-2);padding:3px 8px;cursor:pointer;}
.dfx-open:hover{color:var(--accent);border-color:var(--accent);}
.dfx-blk{border-top:1px solid var(--border);}
.dfx-blk:first-child{border-top:none;}
.dfx-blk-hd{display:flex;align-items:center;gap:8px;padding:8px 16px 0;flex-wrap:wrap;}
.dfx-blk-t{font-size:var(--fs-2);font-weight:600;color:var(--text3);cursor:pointer;}
.dfx-blk-t:hover{color:var(--accent);}
.dfx-blk-t.dim{cursor:default;opacity:.6;}
/* Snooze — push a step (and everything after it) one day forward */
.dfx-snooze{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-1);font-weight:600;color:var(--text2);background:var(--surface3);border:none;border-radius:var(--r-1);padding:3px 9px;cursor:pointer;font-family:var(--sans);}
.dfx-snooze svg{width:14px;height:14px;flex-shrink:0;}
.dfx-snooze:hover{color:var(--text);background:var(--border2);}
.blk-snooze{display:inline-flex;align-items:center;gap:4px;background:none;border:1px solid var(--border2);color:var(--text2);cursor:pointer;font-size:var(--fs-2);font-weight:600;padding:3px 9px;border-radius:var(--r-1);font-family:var(--sans);margin-right:4px;min-height:26px;}
.blk-snooze svg,.blk-calcbtn svg{width:14px;height:14px;flex-shrink:0;}
.blk-snooze:hover{background:var(--surface3);color:var(--text);}
/* Carried-over unfinished work */
.day-carry-lbl{color:var(--accent);opacity:.85;}
.day-exp.day-carry{border-style:dashed;border-color:var(--border2);background:var(--surface2);}
.day-carry-hd{display:flex;align-items:center;gap:8px;padding:8px 16px 0;flex-wrap:wrap;}
.carry-from{font-size:var(--fs-1);font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--accent);opacity:.85;border-radius:var(--r-1);padding:2px 7px;}
.dfx-blk-t2{font-size:var(--fs-2);font-weight:600;color:var(--text3);cursor:pointer;}
.dfx-blk-t2:hover{color:var(--accent);}
.carry-move{margin-left:auto;font-size:var(--fs-1);font-weight:600;color:var(--accent);background:var(--accent-dim);border:none;border-radius:var(--r-1);padding:3px 9px;cursor:pointer;}
.carry-move:hover{filter:brightness(1.05);}
.dfx-blk-link{opacity:.55;font-size:var(--fs-1);}
.dfx-proj{font-size:var(--fs-2);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px;}
.dfx-sep{color:var(--text3);font-size:var(--fs-2);}
.dfx-code.dfx-codelink{cursor:pointer;text-decoration:none;border-bottom:1px dashed var(--accent);}
.dfx-code.dfx-codelink:hover{filter:brightness(1.12);}

/* Ongoing overview */


/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-back.open{display:flex;}
.modal-back{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
.modal{background:var(--glass-solid);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--glass-brd);border-radius:var(--r3);width:100%;max-width:460px;padding:22px;box-shadow:var(--glass-shadow),var(--glass-hi);max-height:88vh;max-height:88dvh;overflow-y:auto;}
.modal.wide{max-width:660px;}
.modal-t{font-size:var(--fs-5);font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.mrow{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;}
.mrow label{font-size:var(--fs-2);font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--text3);}
.mrow input,.mrow select{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-2);padding:9px 11px;font-family:var(--sans);font-size:var(--fs-4);color:var(--text);outline:none;}
.mrow input:focus,.mrow select:focus{border-color:var(--accent);}
.mcode{font-family:var(--sans);font-size:var(--fs-4);color:var(--accent);background:var(--accent-dim);border-radius:var(--r-2);padding:8px 11px;letter-spacing:.5px;}
.modal-act{display:flex;gap:9px;margin-top:18px;align-items:center;}
.btn{background:var(--accent);border:1px solid transparent;color:#fff;border-radius:var(--r-2);padding:8px 18px;font-family:var(--sans);font-size:var(--fs-4);font-weight:600;cursor:pointer;}
.btn:hover{filter:brightness(1.06);}
.btn.ghost{background:none;border-color:var(--border2);color:var(--text2);font-weight:500;}
.btn.ghost:hover{background:var(--surface2);color:var(--text);}
.btn.sm{padding:6px 11px;font-size:var(--fs-3);border-radius:var(--r-2);}
.btn.danger{background:var(--danger);}
.grow{flex:1;}
/* Custom dialogs (confirm / prompt / picker) */
.dlg-msg{font-size:var(--fs-4);color:var(--text2);line-height:1.6;}
.dlg-search{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-2);padding:9px 11px;font-size:var(--fs-4);color:var(--text);outline:none;margin-bottom:10px;font-family:var(--sans);}
.dlg-search:focus{border-color:var(--accent);}
.dlg-list{max-height:44vh;max-height:44dvh;overflow:auto;display:flex;flex-direction:column;gap:3px;}
.dlg-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-2);cursor:pointer;font-size:var(--fs-4);color:var(--text2);}
.dlg-item:hover,.dlg-item.sel{background:var(--surface2);color:var(--text);}
.dlg-item .ic{width:20px;height:20px;border-radius:var(--r-1);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:var(--fs-2);color:#fff;font-weight:700;}
/* The label is what you are choosing; the subtitle is why. The label had flex:1 and the
   subtitle no limit at all, so a long "why" pushed the "what" into an ellipsis — backwards.
   The subtitle shrinks first and truncates; the label keeps the room it needs. */
.dlg-item .l{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dlg-item .s{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-align:right;font-size:var(--fs-2);color:var(--text3);font-family:var(--sans);}
.dlg-empty{padding:20px;text-align:center;color:var(--text3);font-size:var(--fs-3);}
/* Preset editor redesign */
.ps-blk{border:1px solid var(--border2);border-radius:var(--r-2);margin-bottom:11px;background:var(--surface);overflow:hidden;}
.ps-blk-hd{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--surface2);border-bottom:1px solid var(--border);}
.ps-blk-hd .ps-day{width:120px!important;flex-shrink:0;}
.ps-blk-hd .ps-day input{width:44px;text-align:center;}
.ps-day-lbl{font-size:var(--fs-1);font-weight:700;text-transform:uppercase;color:var(--text3);}
.ps-blk-hd .ps-title{flex:1;background:none;border:none;font-size:var(--fs-4);font-weight:600;color:var(--text);outline:none;font-family:var(--sans);}
.ps-move{background:none;border:none;color:var(--text3);cursor:pointer;font-size:var(--fs-4);padding:2px 5px;}
.ps-move:hover{color:var(--accent);}
.ps-rt{padding:10px 12px;font-size:var(--fs-4);line-height:1.6;outline:none;min-height:44px;}
/* The published sentence sits under the bench text it replaces, marked as a different register
   so it is obvious which one is written to be followed and which one is written to be read. */
.ps-pub{border-top:1px dashed var(--border2);background:var(--surface2);padding:8px 12px 10px;}
.ps-pub-lbl{display:flex;align-items:center;gap:6px;font-size:var(--fs-1);font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;color:var(--text3);margin-bottom:5px;}
.ps-pub textarea{width:100%;min-height:52px;resize:vertical;background:var(--surface);
  border:1px solid var(--border2);border-radius:var(--r-1);padding:7px 9px;color:var(--text);
  font-family:var(--sans);font-size:var(--fs-3);line-height:1.55;outline:none;}
.ps-pub textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(94,135,197,.18);}
.ps-pub-hint{margin-top:5px;font-size:var(--fs-1);color:var(--text3);line-height:1.5;}

/* Popups */
.pop{position:fixed;z-index:200;background:var(--glass-solid);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--glass-brd);border-radius:var(--r2);box-shadow:var(--glass-shadow),var(--glass-hi);padding:5px;max-height:300px;overflow:auto;width:250px;display:none;}
.pop.open{display:block;}
.pop-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r-1);cursor:pointer;font-size:var(--fs-3);color:var(--text2);}
.pop-item.sel,.pop-item:hover{background:var(--surface2);color:var(--text);}
.pop-item.danger:hover{color:var(--danger);}
.fx-ico-svg svg{width:20px;height:20px;stroke-width:1.7;color:var(--text3);}
#tbl-tools button svg{width:15px;height:15px;}
.hd-ico{display:inline-flex;width:14px;height:14px;vertical-align:-2px;margin-right:6px;}
.hd-ico svg{width:100%;height:100%;stroke-width:2.1;}
.ptimer svg{width:11px;height:11px;vertical-align:-1px;}
#spot-res .ic.ic-svg{padding:3px;}
#spot-res .ic.ic-svg svg{width:100%;height:100%;stroke-width:2.2;}
.pop-item .ic.ic-svg,.dlg-item .ic.ic-svg{padding:3px;}
.dlg-item .ic.ic-svg svg{width:100%;height:100%;display:block;stroke-width:2.2;}
.pop-item .ic.ic-svg svg{width:100%;height:100%;display:block;stroke-width:2.2;}
.pop-item .ic{width:18px;height:18px;border-radius:var(--r-1);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:var(--fs-2);color:#fff;font-weight:700;}
.pop-item .sub{font-size:var(--fs-1);color:var(--text3);margin-left:auto;font-family:var(--sans);}
.pop-sep{height:1px;background:var(--border);margin:4px 0;}

/* Table size picker + table toolbar */
#tbl-grid{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-2);box-shadow:var(--shadow-md);padding:10px;display:none;}
#tbl-grid.open{display:block;}
.tg-grid{display:grid;grid-template-columns:repeat(8,17px);grid-auto-rows:17px;gap:3px;}
.tg-cell{border:1px solid var(--border2);border-radius:var(--r-1);background:var(--surface2);cursor:pointer;}
.tg-cell.on{background:var(--accent);border-color:var(--accent);}
.tg-label{margin-top:8px;font-size:var(--fs-2);color:var(--text2);text-align:center;font-family:var(--sans);}
#tbl-tools{position:fixed;z-index:150;display:none;gap:1px;background:var(--glass-solid);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--glass-brd);border-radius:var(--r2);box-shadow:var(--glass-shadow),var(--glass-hi);padding:3px;}
#tbl-tools.open{display:flex;align-items:center;}
#tbl-tools button{border:none;background:none;color:var(--text2);border-radius:var(--r-1);padding:4px 7px;font-size:var(--fs-2);cursor:pointer;font-family:var(--sans);display:inline-flex;align-items:center;gap:3px;white-space:nowrap;}
#tbl-tools button:hover{background:var(--surface2);color:var(--text);}
#tbl-tools button.danger:hover{color:var(--danger);}
#tbl-tools .sep{width:1px;align-self:stretch;background:var(--border2);margin:2px 3px;}

/* Cmd+K spotlight */
#spot-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:flex-start;justify-content:center;padding-top:14vh;}
#spot-back.open{display:flex;}
#spot{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-3);box-shadow:var(--shadow-lg);overflow:hidden;}
#spot input{width:100%;border:none;background:none;padding:16px 18px;font-size:var(--fs-6);color:var(--text);outline:none;font-family:var(--sans);border-bottom:1px solid var(--border);}
#spot-res{max-height:56vh;max-height:56dvh;overflow-y:auto;padding:6px;}
.spot-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-2);cursor:pointer;color:var(--text2);}
.spot-item.sel,.spot-item:hover{background:var(--surface2);color:var(--text);}
.spot-item .ic{width:22px;height:22px;border-radius:var(--r-1);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:var(--fs-2);color:#fff;font-weight:700;}
.spot-item .m{flex:1;overflow:hidden;}
.spot-item .m .a{font-size:var(--fs-4);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.spot-item .m .b{font-size:var(--fs-2);color:var(--text3);}
.spot-item .k{font-size:var(--fs-1);color:var(--text3);font-family:var(--sans);text-transform:uppercase;}
.spot-empty{padding:26px;text-align:center;color:var(--text3);font-size:var(--fs-4);}

@media print{ body>*{display:none!important;} #print-root{display:block!important;position:static;} }
#print-root{display:none;color:#111;background:#fff;font-family:'IBM Plex Sans',sans-serif;}

/* ── Mobile ─────────────────────────────────────────────────────────────── */
/* Touch devices: anything revealed only on hover is unreachable, and hover transforms stick. */
@media (hover:none){
  .page-del{opacity:.55!important;}
  .wk-task .wk-del{opacity:.7!important;}
  .sec-item .del{opacity:.7!important;}
  .card:hover{transform:none!important;}
}
@media(max-width:760px){
  header{padding:0 12px;min-height:44px;}
  /* Docked into the ribbon's tab row, not floating over the document: as a FAB it sat on the
     bottom-left of every screen for ever, covering whatever was under it — on an experiment,
     its own tab strip. It stays OUTSIDE <header> (see the comment on the element): dHUB hides
     the app's header when embedded, and display:none on the parent takes the button with it. */
  #mobile-nav-btn{display:flex;position:fixed;left:6px;top:5px;bottom:auto;width:34px;height:34px;
    border-radius:var(--r-2);box-shadow:none;background:var(--surface2);z-index:48;}
  .rb-tabbar{padding-left:44px;}
  #ribbon{padding:4px 8px;gap:3px;}
  /* (The closed state is now global — see .rb-pane below.) */
  /* Inside an experiment the tab strip IS the navigation, so it stays put while you scroll a
     long protocol, and clears the floating pane button rather than sitting under it. */
  .exp-tabs{position:sticky;top:0;z-index:12;background:var(--bg);}
  /* Closed by default on mobile (it used to always cover ~80% of the screen with no way to dismiss it) — slide-in overlay via body.mobile-dock-open, same toggle button as desktop. */
  #rightdock{position:fixed;right:0;top:0;bottom:0;z-index:46;width:82%;max-width:300px;box-shadow:var(--shadow-lg);transform:translateX(101%);transition:transform .22s var(--ease);}
  body.mobile-dock-open #rightdock{transform:translateX(0);}
  /* Tree + page-list collapse into one slide-out drawer; editor becomes the full-width primary view. */
  .mobile-drawer{display:flex!important;position:fixed;left:0;top:0;bottom:0;z-index:45;width:86%;max-width:320px;background:var(--surface);box-shadow:var(--shadow-lg);transform:translateX(-101%);transition:transform .22s var(--ease);}
  body.mobile-drawer-open .mobile-drawer{transform:translateX(0);}
  body.mobile-drawer-open #mobile-backdrop,body.mobile-dock-open #mobile-backdrop{display:block;position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.35);}
  .pane-sec,.pane-pages{width:auto!important;flex:1 1 0;min-width:0;}
  /* A pane collapsed on desktop persists in lb_layout. Without this it stays a 34px sliver
     inside the drawer forever, because .pane.collapsed is more specific than .pane-sec. */
  .pane.collapsed{width:auto!important;flex:1 1 0!important;}
  .pane.collapsed .pane-inner{display:flex!important;}
  .pane.collapsed .rail{display:none!important;}
  .splitter{display:none;}
  .pane-ed{width:100%;flex:1;}
  /* Same trap for the right dock: applyLayout() sets display:none, which beats the slide-in
     transform, so Outline/Tags/Info become permanently unreachable on a phone. */
  #rightdock.hidden{display:block!important;}
  /* The Insert ribbon wraps to ~4 rows and eats the editor — scroll it instead. */
  .rb-labelled{flex-wrap:nowrap!important;}
  .rb-tabbar{overflow-x:auto;}
  .ed-wrap{padding:16px 14px 80px;}
  .tb{width:32px;height:32px;}
  .exh-title{font-size:var(--fs-7);}
  .status-pill #lb-status-txt{display:none;}
}
/* ── Week planner ── */
.wk-wrap{display:flex;flex-direction:column;height:100%;min-height:0;}
.wk-top{display:flex;align-items:center;gap:12px;padding:14px 20px 10px;flex-wrap:wrap;}
.wk-top .wk-h{font-size:var(--fs-7);font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;}
.wk-range{color:var(--text2);font-size:var(--fs-4);font-weight:500;}
.wk-nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
/* .wk-top wraps but this row did not, so on a phone Export PDF sat past the right edge —
   clipped rather than overflowing, which is worse: the page looked fine and the button
   was simply unreachable. */
.wk-nav button{border:1px solid var(--border2);background:var(--surface);color:var(--text);border-radius:var(--r-2);padding:6px 12px;font-size:var(--fs-4);cursor:pointer;}
.wk-nav button:hover{background:var(--surface2);}
.wk-nav button.wk-today{font-weight:600;}
.wk-nav button.wk-export{display:inline-flex;align-items:center;gap:5px;font-weight:600;background:var(--accent,#5e87c5);color:#fff;border-color:var(--accent,#5e87c5);}
.wk-nav button.wk-export:hover{filter:brightness(1.06);background:var(--accent,#5e87c5);}
.wk-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:4px 20px 20px;overflow:auto;}
.wk-col{display:flex;flex-direction:column;min-width:0;border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface);overflow:hidden;}
.wk-col.wk-is-today{border-color:var(--accent,#5e87c5);box-shadow:0 0 0 1px var(--accent,#5e87c5) inset;}
.wk-col.wk-weekend{background:var(--surface2);}
.wk-chd{padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;gap:1px;}
.wk-chd:hover{background:var(--surface2);}
.wk-chd .wk-dow{font-size:var(--fs-2);text-transform:uppercase;letter-spacing:.5px;color:var(--text2);font-weight:600;}
.wk-chd .wk-dnum{font-size:var(--fs-5);font-weight:700;color:var(--text);}
.wk-col.wk-is-today .wk-chd .wk-dnum{color:var(--accent,#5e87c5);}
.wk-body{flex:1;min-height:80px;padding:8px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;}
.wk-blk{font-size:var(--fs-2);padding:4px 7px;border-radius:var(--r-1);border-left:3px solid var(--pc,#5e87c5);background:var(--surface2);cursor:grab;line-height:1.3;display:flex;align-items:flex-start;gap:5px;}
.wk-blk:active{cursor:grabbing;}
.wk-blk-main{flex:1;min-width:0;cursor:pointer;}
.wk-blk .wk-cb{flex:none;width:14px;height:14px;margin-top:1px;border:1.5px solid var(--border2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--fs-1);color:#fff;cursor:pointer;}
.wk-blk .wk-cb:hover{border-color:#5e87c5;}
.wk-blk.done .wk-cb{background:#5e87c5;border-color:#5e87c5;}
.wk-blk.done{opacity:.55;}
.wk-blk.done .wk-code,.wk-blk.done .wk-bt{text-decoration:line-through;}
.wk-sn{flex:none;display:inline-flex;align-items:center;opacity:0;cursor:pointer;color:var(--text3);padding:0 1px;}
.wk-sn svg{width:13px;height:13px;}
.wk-blk:hover .wk-sn{opacity:.75;}
.wk-sn:hover{opacity:1!important;color:var(--accent);}
.wk-from{display:block;font-size:var(--fs-1);color:var(--text3);margin-top:1px;}
.wk-empty{font-size:var(--fs-2);color:var(--text3);text-align:center;padding:6px 0;}
/* Drop target while dragging a step or task */
.wk-col.wk-over{outline:2px dashed #5e87c5;outline-offset:-2px;border-radius:var(--r-2);background:var(--accent-dim);}
/* Outstanding-before-this-week strip */
.wk-od{border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-2);background:var(--surface2);padding:9px 12px 11px;margin-bottom:12px;}
.wk-od-t{font-size:var(--fs-1);font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
.wk-od-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;}
.wk-hint{font-size:var(--fs-1);color:var(--text3);margin-top:10px;text-align:center;}
@media (hover:none){ .wk-sn{opacity:.7;} }
.wk-blk:hover{background:var(--surface3);}
/* The experiment code is the identifier — let it wrap rather than truncate in a narrow column. */
.wk-blk .wk-code{font-weight:700;color:var(--text);display:block;font-size:var(--fs-1);overflow-wrap:anywhere;}
.wk-blk .wk-bt{color:var(--text2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wk-task{display:flex;align-items:flex-start;gap:6px;font-size:var(--fs-3);padding:4px 6px;border-radius:var(--r-1);background:var(--surface2);position:relative;}
.wk-task:hover{background:var(--surface3);}
.wk-task .wk-tx{flex:1;min-width:0;cursor:text;word-break:break-word;}
.wk-task.done .wk-tx{text-decoration:line-through;color:var(--text3);}
.wk-task .wk-cb{width:15px;height:15px;flex:none;border:1.6px solid var(--border2);border-radius:var(--r-1);cursor:pointer;margin-top:1px;display:flex;align-items:center;justify-content:center;}
.wk-task.done .wk-cb{background:var(--accent,#5e87c5);border-color:var(--accent,#5e87c5);color:#fff;}
.wk-task .wk-lnk{display:inline-block;margin-top:2px;font-size:var(--fs-1);font-weight:600;color:#5e87c5;cursor:pointer;}
.wk-task .wk-del{position:absolute;top:2px;right:2px;opacity:0;cursor:pointer;color:var(--text3);font-size:var(--fs-5);line-height:1;padding:1px 3px;}
.wk-task:hover .wk-del{opacity:1;}
.wk-task .wk-del:hover{color:#ef4444;}
.wk-add{margin-top:auto;}
.wk-add input{width:100%;border:1px dashed var(--border2);background:transparent;color:var(--text);border-radius:var(--r-1);padding:5px 7px;font-size:var(--fs-3);}
.wk-add input:focus{border-style:solid;border-color:var(--accent,#5e87c5);outline:none;}
@media(max-width:900px){
  .wk-grid{grid-auto-flow:row;grid-template-columns:repeat(2,1fr);align-items:start;}
  /* A day with four steps was cut off mid-row at the height of an empty Sunday: the cells are
     equal-height in a grid row, and the body scrolled inside 80px nobody could see. */
  .wk-body{overflow:visible;max-height:none;}
  .wk-col{overflow:visible;}
}
/* ── New-experiment preview ── */
.nm-preview{margin:4px 0 2px;}
.nm-preview .nm-pv-hd{font-size:var(--fs-2);text-transform:uppercase;letter-spacing:.4px;color:var(--text2);font-weight:600;margin-bottom:6px;}
.nm-preview .nm-pv-list{display:flex;flex-direction:column;gap:5px;max-height:200px;overflow-y:auto;}
.nm-preview .nm-pv-row{display:flex;gap:8px;align-items:flex-start;font-size:var(--fs-3);padding:5px 8px;background:var(--surface2);border-radius:var(--r-1);border-left:3px solid var(--accent,#5e87c5);}
.nm-preview .nm-pv-day{font-weight:700;color:var(--accent,#5e87c5);white-space:nowrap;font-size:var(--fs-2);}
.nm-pv-dow{font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;}
.nm-pv-row.weekend .nm-pv-day,.nm-pv-row.weekend .nm-pv-dow{color:#c07a2e;}
.nm-pv-we{margin:8px 0 2px;padding:7px 10px;border-radius:var(--r-1);font-size:var(--fs-2);line-height:1.5;
  background:rgba(217,158,79,.13);border:1px solid rgba(217,158,79,.36);color:var(--text2);}
.blk-date.weekend{color:#c07a2e;border-color:rgba(217,158,79,.5);}
.nm-preview .nm-pv-t{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nm-preview .nm-pv-steps{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;}
.nm-preview .nm-pv-dur{font-size:var(--fs-1);color:var(--text3);background:var(--surface3);border-radius:var(--r-1);padding:0 5px;margin-left:5px;white-space:nowrap;}
.nm-pv-ref{font-size:var(--fs-1);background:var(--surface3);color:var(--text3);border-radius:var(--r-1);padding:1px 5px;text-transform:uppercase;letter-spacing:.3px;}
/* ── Plate maps ── */
/* Inline read-only card (experiment, step, notebook) */
.blk-plate{border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface2);padding:9px 12px 11px;margin:0 0 10px;}
.cc-tag.plate{color:#6d7bd0;}
.pp-n{font-size:var(--fs-1);color:var(--text3);}
.plate-act{font-size:var(--fs-1);font-weight:600;padding:2px 8px;border-radius:var(--r-1);}
.pp-two{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
.pp-grid-wrap{overflow-x:auto;padding:2px 0;flex:0 1 auto;}
.pp-grid{display:grid;gap:1px;}
.pp-w{aspect-ratio:1;border-radius:50%;background:var(--surface3);}
.pp-w.empty{background:transparent;box-shadow:inset 0 0 0 1px var(--border);}
.pp-note{font-size:var(--fs-2);color:var(--text2);margin:2px 0 8px;line-height:1.45;}
.pp-cl{font-size:var(--fs-1);font-weight:700;color:var(--text3);text-align:center;overflow:hidden;white-space:nowrap;}
.pp-gl{display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.28);border-radius:var(--r-1);}
.pp-gl span{font-size:var(--fs-1);font-weight:700;color:#1a1d2e;background:rgba(255,255,255,.72);border-radius:var(--r-1);padding:0 4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pp-grid.txt{gap:2px;}
.pp-grid.txt .pp-w{display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:var(--fs-1);line-height:1.05;color:#243;font-weight:600;text-align:center;}
.pp-grid.txt .pp-w span{padding:0 1px;overflow:hidden;max-height:100%;}
/* The readable record — ranges → what was in them */
.pp-sum{flex:1 1 260px;min-width:240px;overflow-x:auto;}
.pl-sum-t{border-collapse:collapse;width:100%;font-size:var(--fs-2);}
.pl-sum-t td{padding:3px 8px 3px 0;vertical-align:top;border-bottom:1px solid var(--border);}
.pl-sum-r{white-space:nowrap;font-family:var(--mono);font-size:var(--fs-2);color:var(--text);font-weight:600;}
.pl-sum-r i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.pl-sum-d{color:var(--text2);}
.pl-sum-n{text-align:right;color:var(--text3);font-size:var(--fs-1);white-space:nowrap;padding-right:0;}
.pp-leg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;}
.pp-leg-i{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-1);color:var(--text2);}
.pp-leg-i i{width:9px;height:9px;border-radius:50%;display:inline-block;}
/* Editor modal */
.modal.plate-modal{max-width:min(1060px,96vw);}
.pl-count{font-size:var(--fs-2);font-weight:600;color:var(--text3);}
.pl-hint{font-size:var(--fs-1);font-weight:400;color:var(--text3);}
.pl-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,320px);gap:16px;align-items:start;}
.pl-left{min-width:0;display:flex;flex-direction:column;max-height:66vh;max-height:66dvh;}
.pl-gridwrap{overflow:auto;padding:2px;flex:0 1 auto;width:max-content;max-width:100%;}
.pl-grid{display:grid;gap:2px;user-select:none;line-height:1;}
.pl-corner{width:26px;}
.pl-cl{display:flex;align-items:flex-end;justify-content:center;font-size:var(--fs-1);font-weight:600;color:var(--text2);padding-bottom:2px;overflow:hidden;white-space:nowrap;}
.pl-cltitle{display:flex;align-items:flex-end;justify-content:center;font-size:var(--fs-1);font-weight:700;color:var(--text3);padding-bottom:2px;}
.pl-gl{display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.3);border-radius:var(--r-1);}
.pl-gl span{font-size:var(--fs-2);font-weight:700;color:#1a1d2e;background:rgba(255,255,255,.8);border-radius:var(--r-1);padding:1px 7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pl-colh,.pl-rowh{display:flex;align-items:center;justify-content:center;font-size:var(--fs-1);font-weight:700;color:var(--text3);cursor:pointer;border-radius:var(--r-1);}
.pl-colh:hover,.pl-rowh:hover{color:var(--accent);background:var(--surface3);}
.pl-w{aspect-ratio:1;border-radius:50%;background:var(--surface3);box-shadow:inset 0 0 0 1px var(--border2);cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#243;font-weight:600;text-align:center;}
.pl-w.empty{background:transparent;}
.pl-w.sel{box-shadow:inset 0 0 0 2px var(--accent),0 0 0 1px var(--accent);}
.pl-wt{padding:0 1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.pl-sum{margin-top:12px;border-top:1px solid var(--border);padding-top:9px;overflow-y:auto;flex:1 1 auto;min-height:88px;}
.pl-sum-empty{font-size:var(--fs-3);color:var(--text3);}
.pl-side{width:290px;flex:none;max-height:64vh;max-height:64dvh;overflow-y:auto;}
.pl-sec{border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface2);padding:9px 11px 11px;margin-bottom:10px;}
.pl-sec-t{font-size:var(--fs-1);font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text2);margin-bottom:7px;}
.pl-types{display:flex;flex-wrap:wrap;gap:5px;}
.pl-modes,.pl-quick{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.pl-mode{flex:1 1 72px;}
.pl-quick .pl-btn{min-width:0;flex:1 1 72px;}
.pl-type{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-2);font-family:var(--sans);background:var(--surface);border:1px solid var(--border2);color:var(--text2);border-radius:var(--r-3);padding:3px 10px;cursor:pointer;}
.pl-type:hover{color:var(--text);}
.pl-type.on{border-color:var(--accent);color:var(--text);font-weight:600;}
.pl-type i{width:10px;height:10px;border-radius:50%;display:inline-block;}
/* A flag is drawn on the well, not instead of it: the colour still says which pair is in
   there, and the hatch says the ligand or the substrate is missing. */
.pl-w.noLig{background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.16) 0 2px,transparent 2px 5px);}
.pl-w.noSub{box-shadow:inset 0 0 0 2px rgba(0,0,0,.28);}
.pl-flags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.pl-flag{font-family:var(--sans);font-size:var(--fs-2);border:1px solid var(--border2);background:var(--surface);
  color:var(--text2);border-radius:var(--r-3);padding:3px 10px;cursor:pointer;}
.pl-flag.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:600;}
.pl-flag.mixed{border-style:dashed;}
/* Donor / acceptor next to a plasmid in the header. */
.exh-roles{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.exh-role{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-2);color:var(--text2);
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-3);padding:2px 4px 2px 9px;}
.exh-role .rl{width:20px;height:20px;border-radius:var(--r-1);border:1px solid var(--border2);background:var(--surface);
  color:var(--text3);font:700 10px/1 var(--sans);cursor:pointer;}
.exh-role .rl.on.d{background:#5e87c5;border-color:#5e87c5;color:#fff;}
.exh-role .rl.on.a{background:#c47818;border-color:#c47818;color:#fff;}
.pl-type-add{font-weight:700;color:var(--text3);padding:3px 11px;}
.pl-type-add:hover{color:var(--accent);border-color:var(--accent);}
.pl-row2{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.pl-btn{font-size:var(--fs-2);font-weight:600;font-family:var(--sans);background:var(--surface);border:1px solid var(--border2);color:var(--text2);border-radius:var(--r-1);padding:4px 11px;cursor:pointer;}
.pl-btn:hover:not(:disabled){color:var(--text);background:var(--surface3);}
.pl-btn.on{border-color:#5e87c5;color:#5e87c5;font-weight:700;}
/* Stop the browser panning/zooming while painting a well selection with a finger. */
.pl-grid{touch-action:none;}
.pl-btn:disabled{opacity:.45;cursor:default;}
.pl-btn.danger{color:var(--danger);}
@media(max-width:820px){ .pl-body{grid-template-columns:1fr;} .pl-side{width:100%;max-height:none;} .pl-gridwrap{max-height:46vh;max-height:46dvh;width:100%;} }
/* ── Files pane (data dump) ── */
.fx-pane{padding:2px 0 20px;}
.fx-drop{border:2px dashed var(--border2);border-radius:var(--r-3);padding:26px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;}
.fx-drop:hover{border-color:#5e87c5;background:var(--surface2);}
.fx-drop.over{border-color:#5e87c5;background:var(--surface2);border-style:solid;}
.fx-drop-t{font-size:var(--fs-5);font-weight:600;color:var(--text);margin-bottom:5px;}
.fx-drop-s{font-size:var(--fs-2);color:var(--text3);max-width:460px;margin:0 auto;line-height:1.5;}
.fx-list-hd{font-size:var(--fs-1);font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text2);margin:18px 0 8px;}
.fx-empty{font-size:var(--fs-3);color:var(--text3);margin-top:16px;text-align:center;}
.fx-list{display:flex;flex-direction:column;gap:8px;}
.fx-row{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface2);padding:10px 12px;}
.fx-thumb{width:52px;height:52px;object-fit:cover;border-radius:var(--r-1);flex:none;background:var(--surface3);}
.fx-ico{width:52px;height:52px;border-radius:var(--r-1);flex:none;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:var(--fs-7);}
.fx-main{flex:1;min-width:0;}
.fx-name{font-size:var(--fs-4);font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fx-meta{font-size:var(--fs-1);color:var(--text3);margin:2px 0 6px;}
.fx-cap{width:100%;border:1px solid var(--border2);background:var(--surface);color:var(--text);border-radius:var(--r-1);padding:4px 8px;font-family:var(--sans);font-size:var(--fs-3);}
.fx-cap:focus{outline:none;border-color:#5e87c5;}
.fx-acts{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex:none;}
.fx-inc{display:flex;align-items:center;gap:5px;font-size:var(--fs-1);color:var(--text2);cursor:pointer;white-space:nowrap;}
.fx-inc input{width:14px;height:14px;accent-color:#5e87c5;cursor:pointer;}
@media(max-width:640px){ .fx-row{flex-wrap:wrap;} .fx-acts{flex-direction:row;width:100%;justify-content:flex-end;} }
/* Experiment header — setup summary chips */
.exh-setup{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.exh-setup-i{font-size:var(--fs-2);color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-3);padding:3px 10px;}
.exh-setup-i b{color:var(--text3);font-weight:600;margin-right:4px;}
/* New-experiment setup parameters */
.nm-setup{margin:10px 0 2px;border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface2);padding:10px 12px 12px;}
.nm-setup-hd{font-size:var(--fs-1);font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#5e87c5;margin-bottom:8px;}
.exh-overdue{display:inline-flex;align-items:center;gap:5px;margin-right:6px;padding:2px 9px;
  border-radius:var(--r-4);background:rgba(217,83,79,.13);border:1px solid rgba(217,83,79,.42);
  color:var(--danger);font-size:var(--fs-1);font-weight:700;letter-spacing:.3px;text-transform:uppercase;}
.exh-imported{display:inline-flex;align-items:center;gap:5px;margin-right:6px;padding:2px 9px;
  border-radius:var(--r-4);background:rgba(217,158,79,.14);border:1px solid rgba(217,158,79,.4);
  color:var(--text2);font-size:var(--fs-1);font-weight:700;letter-spacing:.3px;text-transform:uppercase;}
.exh-setup-edit{margin-left:6px;padding:1px 8px;border-radius:var(--r-2);border:1px solid var(--border2);
  background:var(--surface2);color:var(--text2);font-size:var(--fs-1);cursor:pointer;}
.exh-setup-edit:hover{color:var(--accent);border-color:var(--accent);}
.lb-remote{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:900;max-width:min(560px,92vw);
  padding:9px 14px;border-radius:var(--r-2);background:var(--surface2);color:var(--text);border:1px solid var(--border2);
  box-shadow:0 8px 28px rgba(0,0,0,.18);font-size:var(--fs-2);cursor:pointer;}
.rp-opts{display:flex;gap:14px;margin:12px 0 6px;font-size:var(--fs-3);color:var(--text2);}
.rp-opts label{display:flex;align-items:center;gap:5px;cursor:pointer;}
.rp-count{font-size:var(--fs-2);color:var(--text3);border-top:1px solid var(--border);padding-top:9px;}
.es-diffwrap{margin-top:14px;border-top:1px solid var(--border);padding-top:10px;max-height:38vh;max-height:38dvh;overflow:auto;}
.es-sec{font-size:var(--fs-1);font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);margin:10px 0 5px;}
