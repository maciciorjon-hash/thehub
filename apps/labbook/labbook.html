  __seq:{name:'Sequencing verification', html:'<p><strong>Sequencing verification</strong></p><ul class="lb-check"><li>Sanger-sequence the insert &amp; cloning junctions with sequencing primers</li><li>Whole-plasmid sequencing (Plasmidsaurus) to confirm the full construct</li></ul><p><em>No dedicated Archive protocol — reference your sequencing SOP / provider.</em></p>'},
  __nanobret:{name:'NanoBRET target engagement', html:'<p><strong>NanoBRET target-engagement assay</strong></p><ul class="lb-check"><li>Transfect cells with the NanoLuc–target fusion</li><li>Add NanoBRET tracer + test compound; incubate</li><li>Add NanoBRET substrate; read donor &amp; acceptor; compute the BRET ratio</li></ul><p><em>No dedicated Archive protocol — use the Beacon app for analysis.</em></p>'}
};
function archiveCalc(pid){ try{ var _w=_arcWin(); if(_w && _w.ARCHIVE_CALC) return _w.ARCHIVE_CALC(pid); }catch(e){} return null; }
// Render a calculator's computed recipe ({label,bullets}[]) as editable HTML.
function calcRecipeHtml(calc){ if(!calc||!calc.steps||!calc.steps.length) return ''; return calc.steps.map(function(s){ var b=(s.bullets||[]).map(function(x){return '<li>'+x+'</li>';}).join(''); return '<p><strong>'+esc(s.label||'')+'</strong></p>'+(b?'<ul>'+b+'</ul>':''); }).join(''); }
// Build one dated-block's html for a protocol part: concise protocol prose + calculator recipe + a link to the live calc.
function partBlockHtml(pid,calc,steps){ var h='';
  if(steps&&steps.length){ steps.forEach(function(seg){
    if(seg.type==='section'){ h+='<p><strong>'+esc(seg.text)+'</strong></p>'; }
    // Archive now hands over its notes, warnings, tips and tables too. They used to be
    // dropped on the floor, so a protocol arrived here without the warning that stops the
    // experiment failing. A warning is styled so it cannot be mistaken for prose.
    else if(seg.type==='note'){ var pre=seg.kind==='warn'?'⚠ ':(seg.kind==='tip'?'Tip — ':'');
      h+='<blockquote class="lb-note lb-note-'+esc(seg.kind||'note')+'">'+pre+seg.html+'</blockquote>'; }
    else if(seg.type==='table'){
      h+='<table class="lb-table">'+((seg.headers||[]).length?'<thead><tr>'+seg.headers.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr></thead>':'')
        +'<tbody>'+(seg.rows||[]).map(function(r){return '<tr>'+r.map(function(x){return '<td>'+x+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>'; }
    else if(seg.items){ var tag=seg.ordered?'ol':'ul'; h+='<'+tag+'>'+seg.items.map(function(x){return '<li>'+x+'</li>';}).join('')+'</'+tag+'>'; }
  }); }
  var nm=(calc&&calc.name)||''; var link='<a class="lb-link proto" data-app="protocols" data-pid="'+esc(pid)+'" data-tab="calc" contenteditable="false">open '+esc(nm||'calculator')+' &#8599;</a>';
  if(calc&&calc.steps&&calc.steps.length){ h+='<p><strong>Recipe (from Archive calculator)</strong> '+link+'</p>'+calcRecipeHtml(calc); }
  else if(calc&&calc.hasCalc){ h+='<p>'+link+'</p>'; }
  return h||'<p></p>'; }
// ── Protocol-driven step blocks ────────────────────────────────────────────────────────────
// A protocol stage becomes one dated block. The prose is locked; only its typed parameters,
// a per-step tick and a per-step annotation are writable. The stage is snapshotted into the
// block at creation rather than looked up live, because a notebook entry is evidence: it has
// to render the same years later even if the protocol was edited or retired. `proto.v` records
// which version it came from, so a later protocol change can still be offered as an update.
//
// b.html is kept as a DERIVED cache of the same content, refreshed on every edit, so the PDF
// export, publication text, search and tag filter keep reading blocks the way they always have.

function _pnum(n){
  if(typeof n!=='number'||!isFinite(n)) return String(n);
  var r=Math.round(n*1e6)/1e6;
  if(Math.abs(r-Math.round(r))>=1e-9) return (r<0?'−':'')+String(Math.abs(r));
  var sign=(r<0)?'−':''; r=Math.abs(Math.round(r));
  return sign+((r>=10000)?r.toLocaleString('en-US'):String(r));
}
function _pgap(u){ return (u==='°C'||u==='%'||!u||u.charAt(0)==='×')?'':' '; }
function _pval(v,ov){ return {value:(ov&&ov.value!=null)?ov.value:v.value,
                              max:(ov&&ov.max!=null)?ov.max:v.max}; }
function protoParamText(v,ov){
  var e=_pval(v,ov);
  if(v.type==='ratio') return '1:'+_pnum(e.value);
  var t=_pnum(e.value);
  if(v.type==='range'&&e.max!=null) t+='–'+_pnum(e.max);
  return t+_pgap(v.unit)+(v.unit||'');
}
function _chip(bId,key,field,val){
  var t=String(val); var w=Math.max(1.7,t.length*0.62+0.8);
  return '<input class="pchip" style="width:'+w.toFixed(2)+'em" value="'+esc(t)+'"'
    +' onchange="setProtoParam(\''+bId+'\',\''+key+'\',\''+field+'\',this.value)"'
    +' onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur();}">';
}
function protoParamHtml(b,key,v,live){
  var ov=(b.params||{})[key], e=_pval(v,ov);
  var changed=ov?' changed':'';
  var lbl=esc(v.label||key)+(ov?' — changed from the protocol':'');
  if(!live) return '<span class="pparam'+changed+'" title="'+lbl+'">'+protoParamText(v,ov)+'</span>';
  var unit=v.unit?('<span class="punit">'+_pgap(v.unit)+esc(v.unit)+'</span>'):'';
  var inner;
  if(v.type==='ratio') inner='1:'+_chip(b.id,key,'value',_pnum(e.value));
  else if(v.type==='range'&&e.max!=null)
    inner=_chip(b.id,key,'value',_pnum(e.value))+'–'+_chip(b.id,key,'max',_pnum(e.max))+unit;
  else inner=_chip(b.id,key,'value',_pnum(e.value))+unit;
  // A duration is the one parameter the notebook can act on rather than just record.
  if(v.type==='time'||(v.type==='range'&&/^(min|s|h|hr|hrs|hours|d|days)$/i.test(v.unit||'')))
    inner+='<button class="ptimer" title="Start a timer for this" onclick="startTimer(\''+b.id+'\',\''+key+'\')">'+tbSvg(P_PLAY)+'</button>';
  return '<span class="pparam live'+changed+'" title="'+lbl+'">'+inner+'</span>';
}
function protoSubst(b,html,params,live){
  return String(html||'').replace(/\{\{p\.([A-Za-z0-9_]+)\}\}/g,function(m,k){
    var v=params&&params[k]; if(!v) return m;
    return protoParamHtml(b,k,v,live);
  });
}
function protoItemHtml(b,it,live){
  var sid=it.id;
  var text='<span class="pstep-t">'+protoSubst(b,it.html,it.params,live)+'</span>';
  var note=((b.stepNotes||{})[sid]||'');
  if(!live) return '<li>'+text+(note?'<div class="pstep-note">'+note+'</div>':'')+'</li>';
  var on=!!(b.stepDone||{})[sid];
  return '<li'+(on?' class="pstep-done"':'')+' data-step="'+esc(sid)+'">'
    +'<button class="pstep-tick'+(on?' on':'')+'" title="'+(on?'Done — click to reopen':'Mark this step done')
      +'" onclick="toggleProtoStep(\''+b.id+'\',\''+esc(sid)+'\')">'+(on?'✓':'')+'</button>'
    +text
    +'<button class="pstep-noteb" title="Add a note to this step" onclick="addProtoNote(\''+b.id+'\',\''+esc(sid)+'\')">+ note</button>'
    +((note!==''||b._openNote===sid)
       ? '<div class="rt pstep-note" contenteditable="true" data-ph="Note on this step…" data-ctx="pstep:'+b.id+':'+esc(sid)+'"'
         +' oninput="setProtoNote(\''+b.id+'\',\''+esc(sid)+'\',this.innerHTML)" onfocus="_activeEd=this">'+note+'</div>'
       : '')
    +'</li>';
}
function protoBodyHtml(b,x,live){
  // A body item carried over from the protocol's preamble explains what the method *is* — "Gibson
  // Assembly joins linearised DNA fragments that share overlapping sequences" — which is a
  // textbook paragraph inside a Methods section. It stays on the bench page and is marked so the
  // published prose drops it, the same way pub-skip works everywhere else.
  var _sk = x.fromPreamble ? ' pub-skip' : '';
  if(x.t==='steps'){
    if(x.fromPreamble) return '<div class="pub-skip">'+protoBodyHtml(b,{t:'steps',ordered:x.ordered,items:x.items},live)+'</div>';
    var tag=x.ordered?'ol':'ul';
    return '<'+tag+' class="psteps">'+(x.items||[]).map(function(it){return protoItemHtml(b,it,live);}).join('')+'</'+tag+'>';
  }
  if(x.t==='warn') return '<blockquote class="lb-note lb-note-warn'+_sk+'">⚠ '+x.html+'</blockquote>';
  if(x.t==='tip')  return '<blockquote class="lb-note lb-note-tip'+_sk+'">Tip — '+x.html+'</blockquote>';
  if(x.t==='note') return '<blockquote class="lb-note'+_sk+'">'+x.html+'</blockquote>';
  if(x.t==='table'){
    if(!(x.headers||[]).length&&!(x.rows||[]).length) return x.html||'';
    return '<table class="lb-table'+_sk+'">'
      +((x.headers||[]).length?'<thead><tr>'+x.headers.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead>':'')
      +'<tbody>'+(x.rows||[]).map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';
  }
  return '';
}
function protoRenderHtml(b,live){
  var P=b.proto; if(!P) return b.html||'';
  return (P.body||[]).map(function(x){ return protoBodyHtml(b,x,live); }).join('');
}
function refreshProtoHtml(b){
  if(!b.proto) return;
  b.html=protoRenderHtml(b,false)
    +((b.note&&_plain(b.note))?('<div class="pblk-note"><strong>Notes</strong>'+b.note+'</div>'):'');
}
function setProtoBlockNote(bId,html){
  var f=_findBlk(bId); if(!f) return; var b=f.blk;
  b.note=_persistImgHtml(html); refreshProtoHtml(b); f.exp.updated=Date.now(); queueSave();
}

function _findBlk(bId){
  var ids=Object.keys(LB.data.experiments);
  for(var i=0;i<ids.length;i++){ var e=LB.data.experiments[ids[i]];
    var bs=e.blocks||[]; for(var j=0;j<bs.length;j++) if(bs[j].id===bId) return {exp:e,blk:bs[j]}; }
  return null;
}
function setProtoParam(bId,key,field,raw){
  var f=_findBlk(bId); if(!f||!f.blk.proto) return; var b=f.blk;
  var n=parseFloat(String(raw).replace(/,/g,'').replace(/−/g,'-'));
  b.params=b.params||{};
  if(isNaN(n)){ delete b.params[key]; }
  else { b.params[key]=b.params[key]||{}; b.params[key][field]=n; }
  refreshProtoHtml(b); f.exp.updated=Date.now(); save(); renderEditor();
}
function toggleProtoStep(bId,sid){
  var f=_findBlk(bId); if(!f) return; var b=f.blk;
  b.stepDone=b.stepDone||{}; if(b.stepDone[sid]) delete b.stepDone[sid]; else b.stepDone[sid]=true;
  f.exp.updated=Date.now(); save(); renderEditor();
}
function addProtoNote(bId,sid){
  var f=_findBlk(bId); if(!f) return; f.blk._openNote=sid; renderEditor();
  setTimeout(function(){ var n=document.querySelector('[data-ctx="pstep:'+bId+':'+sid+'"]'); if(n) n.focus(); },30);
}
function setProtoNote(bId,sid,html){
  var f=_findBlk(bId); if(!f) return; var b=f.blk;
  b.stepNotes=b.stepNotes||{}; b.stepNotes[sid]=_persistImgHtml(html);
  refreshProtoHtml(b); f.exp.updated=Date.now(); queueSave();
}
// The escape hatch. Sometimes the experiment genuinely leaves the protocol, and a locked pane
// is then in the way. One-way on purpose: the block becomes ordinary rich text and stops
// following the protocol, which is recorded so the entry still says where it came from.
function freeEditBlock(bId){
  var f=_findBlk(bId); if(!f||!f.blk.proto) return;
  lbConfirm('Unlock this step for free editing? It stops following the protocol and cannot be re-locked.',
            {title:'Edit freely'}).then(function(ok){
    if(!ok) return; var b=f.blk;
    b.html=protoRenderHtml(b,false);
    b.freedFrom={pid:b.proto.pid,stageId:b.proto.stageId,v:b.proto.v};
    delete b.proto; delete b.params; delete b.stepNotes; delete b.stepDone; delete b._openNote;
    f.exp.updated=Date.now(); save(); renderEditor();
  });
}
// ── When the protocol changes underneath a recorded experiment ──────────────────────────────
// The block renders the version it was created from, always — an entry is evidence and must not
// change under you. But you should be told the protocol moved on, and be able to take the new
// one deliberately. b.proto.v is what makes that possible.
function _protoCurrent(pid){
  try{ var W=_arcWin(); if(W&&W.ARCHIVE_PROTOCOL) return W.ARCHIVE_PROTOCOL(pid); }catch(e){}
  return null;
}
function protoOutdated(b){
  if(!b||!b.proto) return null;
  var P=_protoCurrent(b.proto.pid); if(!P) return null;
  if(!(P.version>b.proto.v)) return null;
  var st=(P.stages||[]).filter(function(x){ return x.id===b.proto.stageId; })[0];
  if(!st) return {gone:true, from:b.proto.v, to:P.version};
  return {from:b.proto.v, to:P.version, stage:st, proto:P};
}
function _stepIds(body){ var o={}; (body||[]).forEach(function(x){ if(x.t!=='steps') return;
  (x.items||[]).forEach(function(it){ o[it.id]=it; }); }); return o; }

      var stages=(P.stages||[]).filter(function(st){ return !st.variant||st.variant===variant; });
      var pre=(P.preamble||[]).filter(function(x){ return x.t!=='variantPicker'; })
        .map(function(x){ var c=JSON.parse(JSON.stringify(x)); c.fromPreamble=true; return c; });
      stages.forEach(function(st,si){
        var body=(si===0&&pre.length)?pre.concat(st.body||[]):(st.body||[]);
        var d=off+(st.day||0);
        var b={id:uid(), date:addDays(startDate,d), dayOffset:d,
               title:_deEnt(st.name)||p.name||p.id, part:_deEnt(st.part)||p.name||p.id, sourcePid:p.id,
               proto:{pid:p.id, protoName:P.name, stageId:st.id, v:P.version,
                      name:_deEnt(st.name), badge:st.badge||null, variant:st.variant||null, body:body},
               // A stage may ship its own past-tense Methods sentence. Snapshotted like the
               // rest of the stage, so the entry still publishes correctly years later.
               pub:st.pub||'', noPub:!!st.noPub,
               params:{}, stepNotes:{}, stepDone:{}, html:'', done:false, completedAt:null};
        refreshProtoHtml(b);
        extra.push(b);
      });
    });
    finish(extra,protos);
  });
}
function newNote(kind){ var e={ id:uid(), kind:'note', noteType:kind, projectId:SEL.node.projectId, sectionId:SEL.node.sectionId, title:'', date:todayStr(), html:'<p></p>', created:Date.now(), updated:Date.now() };
  LB.data.experiments[e.id]=e; save(); SEL.page=e.id; renderAll(); }
function dupExperiment(id){ var e=LB.data.experiments[id]; if(!e) return; var c=JSON.parse(JSON.stringify(e)); c.id=uid(); c.title=(e.title||'')+' (copy)'; if(e.code) c.code=e.code+'_copy'; if(c.blocks) c.blocks.forEach(function(b){b.id=uid();}); c.created=Date.now(); c.updated=Date.now(); LB.data.experiments[c.id]=c; save(); SEL.page=c.id; renderAll(); }
function delExperiment(id){ var e=LB.data.experiments[id]; if(!e) return; lbConfirm('Delete "'+(e.title||e.code||'this entry')+'"? This cannot be undone.',{danger:true,title:'Delete entry'}).then(function(ok){ if(!ok) return; delete LB.data.experiments[id]; if(SEL.page===id) SEL.page=null; save(); renderAll(); }); }

// ══════════════════════════════════════════════════════════════════════════
// HOME — the dashboard you land on
//
// Labbook used to open on "Nothing open — pick an entry on the left", with Today, Week planner
// and Projects as equal leaves in a text tree: nothing on that screen said what was running,
// what was late, or what had come back from Echo. This is that screen.
//
// One implementation, used twice: it is the workspace's Home (the shell opens this app at
// kind:'home') and it is what labbook-standalone lands on. Everything below reads data that
// already exists — no schema was added for any of it. A card whose source cannot be read is
// NOT DRAWN, rather than drawn as a zero.
// ══════════════════════════════════════════════════════════════════════════
function renderHome(host){
  var D=todayStr();
  host.innerHTML =
    '<div class="lh-wrap">'
      + homeTodayBand(D)
      + '<div class="lh-grid">'
        + homeWeekCard(D)
        + homeProjectsCard()
        + homeRunningCard(D)
        + homeRecentCard()
        + homeResultsCard()
        + homeDeviationsCard()
        + homeCulturesCard()
      + '</div>'
    + '</div>';
  lbWatchCultures();
  renderDockPanels();
}
// ── the band: what today actually asks of you ──
function homeTodayBand(D){
  var due=blocksForDate(D), done=due.filter(function(x){ return x.block.done; }).length;
  var carry=carryoverForDate(D), nCarry=0;
  carry.order.forEach(function(id){ nCarry+=carry.byExp[id].blocks.length; });
  var pct=due.length?Math.round(100*done/due.length):0;
  var C=2*Math.PI*31, off=C*(1-(due.length?done/due.length:0));
  var chips=due.filter(function(x){ return !x.block.done; }).slice(0,4).map(function(x){
    return '<span class="lh-step" onclick="openExp(\''+x.exp.id+'\')" title="Open '+esc(x.exp.code||'')+'">'
      +'<span class="lh-cb-box"></span><span class="lh-code">'+esc(x.exp.code||x.exp.title||'')+'</span>'
      +esc(x.block.title||x.block.part||'Step')+'</span>';
  }).join('');
  var carryChips=carry.order.slice(0,2).map(function(id){
    var g=carry.byExp[id], b=g.blocks[0];
    return '<span class="lh-step warn" onclick="openExp(\''+g.exp.id+'\')" title="Carried over from '+esc(fmtDate(b.date))+'">'
      +'<span class="lh-cb-box"></span><span class="lh-code">'+esc(g.exp.code||'')+'</span>'
      +esc(b.title||'Step')+' — carried over</span>';
  }).join('');
  var sub=[];
  if(due.length) sub.push((due.length-done)+' step'+((due.length-done)===1?'':'s')+' left today');
  if(nCarry) sub.push(nCarry+' carried over');
  var running=Object.keys(LB.data.experiments).filter(function(k){
    var e=LB.data.experiments[k]; return expLive(e); }).length;
  if(running) sub.push(running+' experiment'+(running===1?'':'s')+' running');
  if(!sub.length) sub.push('Nothing scheduled — a good day to plan one');
  var side=homeAlertsHtml();
  return '<div class="lh-band">'
    +'<div class="lh-ring"><svg width="74" height="74">'
      +'<circle cx="37" cy="37" r="31" fill="none" stroke="var(--surface3)" stroke-width="7"/>'
      +'<circle cx="37" cy="37" r="31" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round"'
      +' stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 37 37)"/></svg>'
      +'<div class="lh-rn"><b>'+done+'/'+due.length+'</b><span>STEPS</span></div></div>'
    +'<div class="lh-bmain"><div class="lh-date" onclick="selectNode(\'today\')" title="Open today">'
      +esc(new Date(D+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}))+'</div>'
      +'<div class="lh-sub">'+esc(sub.join(' · '))+'</div>'
      +((chips||carryChips)?('<div class="lh-steps">'+carryChips+chips+'</div>'):'')
    +'</div>'
    + side
  +'</div>';
}
// Cultures come from the shell's Incubator store; with no shell there is nothing to say, so
// the whole column is omitted rather than shown empty.
function homeAlertsHtml(){
  var list=lbCultures(); if(!list||!list.length) return '';
  return '<div class="lh-bside">'+list.slice(0,3).map(function(x){
    var msg=x.alerts.length?x.alerts[0].msg:'Healthy';
    return '<div class="lh-alert '+x.worst+'" onclick="openIncubatorLink('+JSON.stringify(esc(x.c.line||'')).replace(/"/g,'&quot;')+')">'
      +'<span class="lh-dot"></span><span class="lh-al-line">'+esc(x.c.line||'—')+'</span>'
      +'<span class="lh-al-msg">'+esc(msg)+'</span></div>';
  }).join('')+'</div>';
}
// ── this week ──
function homeWeekCard(D){
  var mon=wkMonday(D), cols='';
  for(var i=0;i<7;i++){
    var day=addDays(mon,i), d=new Date(day+'T00:00:00');
    var blks=blocksForDate(day), tks=tasksForDate(day);
    var pills=blks.slice(0,3).map(function(x){
      return '<div class="lh-pill" style="border-left-color:'+projColor(x.exp.projectId)+'" title="'+esc((x.exp.code||'')+' · '+(x.block.title||''))+'">'
        +esc(x.exp.code||x.exp.title||'')+'</div>'; }).join('');
    var tpills=tks.slice(0,2).map(function(t){
      return '<div class="lh-pill task'+(t.done?' done':'')+'" title="'+esc(t.text)+'">'+esc(t.text)+'</div>'; }).join('');
    var more=(blks.length+tks.length)>5?('<div class="lh-more">+'+(blks.length+tks.length-5)+'</div>'):'';
    cols+='<div class="lh-day'+(day===D?' is-today':'')+(i>=5?' we':'')+'" onclick="selectNode(\'notebook\');selectPage(\''+day+'\')">'
      +'<div class="lh-dow">'+WK_DOW[i]+'</div><div class="lh-dnum">'+d.getDate()+'</div>'
      +pills+tpills+more+'</div>';
  }
  return '<div class="lh-card w8">'
    +'<div class="lh-ch"><span class="lh-t">This week</span><span class="grow"></span>'
    +'<span class="lh-lnk" onclick="selectNode(\'week\')">Week planner &rsaquo;</span></div>'
    +'<div class="lh-cb"><div class="lh-week">'+cols+'</div></div></div>';
}
// ── running experiments ──
function homeRunningCard(D){
  var out=[];
  Object.keys(LB.data.experiments).forEach(function(k){
    var e=LB.data.experiments[k]; if(!expLive(e)) return;
    var q=expProgress(e);
    var next=(e.blocks||[]).filter(function(b){ return b.date&&!b.done&&b.date>=D; })
                           .sort(function(a,b){ return a.date.localeCompare(b.date); })[0];
    var late=(e.blocks||[]).filter(function(b){ return b.date&&!b.done&&b.date<D; })
                           .sort(function(a,b){ return a.date.localeCompare(b.date); })[0];
    out.push({e:e,q:q,next:next,late:late});
  });
  if(!out.length) return '<div class="lh-card w8">'
    +'<div class="lh-ch"><span class="lh-t">Running experiments</span></div>'
    +'<div class="lh-cb"><div class="lh-empty">Nothing running. Open a project folder and use <b>+ Add</b>.</div></div></div>';
  out.sort(function(a,b){ return (a.next?a.next.date:'9999').localeCompare(b.next?b.next.date:'9999')
    || prioRank(a.e)-prioRank(b.e); });
  var rows=out.slice(0,6).map(function(x){
    var col=projColor(x.e.projectId), pct=x.q.total?Math.round(100*x.q.done/x.q.total):0;
    var when = x.late ? ('<span class="late">overdue '+esc(fmtDate(x.late.date))+'</span>')
             : (x.next ? esc(_homeWhen(x.next.date,D)) : 'nothing scheduled');
    return '<div class="lh-exp" onclick="openExp(\''+x.e.id+'\')" oncontextmenu="ctxExp(event,\''+x.e.id+'\')">'
      +prioMark(x.e)
      +'<span class="lh-x-code" style="color:'+col+'">'+esc(x.e.code||'')+'</span>'
      +'<span class="lh-x-ti">'+esc(x.e.title||'')+'</span>'
      +'<span class="lh-bar"><i style="width:'+pct+'%;background:'+col+'"></i></span>'
      +'<span class="lh-x-n">'+x.q.done+'/'+x.q.total+'</span>'
      +'<span class="lh-x-nx">'+when+'</span></div>';
  }).join('');
  return '<div class="lh-card w8"><div class="lh-ch"><span class="lh-t">Running experiments</span>'
    +'<span class="grow"></span><span class="lh-lnk" onclick="selectNode(\'today\')">Today &rsaquo;</span></div>'
    +'<div class="lh-cb">'+rows+'</div></div>';
}
function _homeWhen(date,D){
  if(date===D) return 'next today';
  if(date===addDays(D,1)) return 'next tomorrow';
  return 'next '+fmtDate(date);
}

// ── Experiments: projects expand into their experiments, in place ──────────
// The notebook's section/page tree stored the same science the experiment already owns.
// This is the surface that replaces it: a project opens into its folders and experiments
// without leaving the page, and picking one drops into the day-block editor unchanged.
var XV={open:{}, q:'', filter:'all'};
function xvToggle(pid){ XV.open[pid]=!XV.open[pid]; renderEditor(); }
// Dragging a row onto a folder header is the gesture for the same move the menu offers. The
// week planner already drags steps between days; this is the same idea one level up, and it
// deliberately does NOT accept a drop on a project header — "which folder" would be a guess.
var XV_DRAG=null;
function xvDragStart(ev,id){ XV_DRAG=id;
  try{ ev.dataTransfer.setData('text/plain',id); ev.dataTransfer.effectAllowed='move'; }catch(_e){} }
function xvDragEnd(){ XV_DRAG=null;
  Array.prototype.forEach.call(document.querySelectorAll('.xv-fold.xv-drop'),function(n){ n.classList.remove('xv-drop'); }); }
function xvDragOver(ev){ if(!XV_DRAG) return; ev.preventDefault();
  try{ ev.dataTransfer.dropEffect='move'; }catch(_e){}
  ev.currentTarget.classList.add('xv-drop'); }
function xvDragLeave(ev){ ev.currentTarget.classList.remove('xv-drop'); }
function xvDrop(ev,pid,sid){
  ev.preventDefault();
  var id=XV_DRAG; try{ id=id||ev.dataTransfer.getData('text/plain'); }catch(_e){}
  xvDragEnd();
  var e=LB.data.experiments[id]; if(!e) return;
  if(e.projectId===pid && e.sectionId===sid) return;
  e.projectId=pid; e.sectionId=sid; e.updated=Date.now();
  XV.open[pid]=true; save(); renderAll();
  var p=projById(pid), sc=p&&(p.sections||[]).filter(function(x){return x.id===sid;})[0];
  toast('Moved to '+((p?p.name:'')+' › '+(sc?sc.name:'')));
}
function xvSetQ(v){ XV.q=v||''; var host=el('pane-ed'); if(host) renderExperiments(host, true); }
function xvSetFilter(f){ XV.filter=f; renderEditor(); }
function xvMatch(e,q){
  if(!q) return true;
  return ((e.code||'')+' '+(e.title||'')+' '+(e.type||'')).toLowerCase().indexOf(q)>=0;
}
function xvKeep(e){
  // Archived rows are hidden everywhere except their own filter — otherwise "archive" would
  // just mean "lose", and nobody would trust the button.
  if(XV.filter==='archived') return expArchived(e);
  if(expArchived(e)) return false;
  if(XV.filter==='running') return expLive(e);
  if(XV.filter==='done')    return e.status==='done';
  return true;
}
function xvRow(e,p){
  var q=expProgress(e), pct=q.total?Math.round(q.done/q.total*100):0, D=todayStr();
  var next=(e.blocks||[]).filter(function(b){ return b.date&&!b.done&&b.date>=D; })
                         .sort(function(a,b){ return a.date.localeCompare(b.date); })[0];
  var late=(e.blocks||[]).filter(function(b){ return b.date&&!b.done&&b.date<D; })
                         .sort(function(a,b){ return a.date.localeCompare(b.date); })[0];
  var when = late ? '<span class="xv-late">overdue '+esc(fmtDate(late.date))+'</span>'
                  : (next ? esc(_homeWhen(next.date,D)) : '');
  var st=(e.status==='done'?' xv-done':'')+(expArchived(e)?' xv-arch':'')+(expPrio(e)==='low'?' xv-lowp':'');
  return '<div class="xv-row'+st+'" onclick="openExp(\''+e.id+'\')" oncontextmenu="ctxExp(event,\''+e.id+'\')"'
    +' draggable="true" ondragstart="xvDragStart(event,\''+e.id+'\')" ondragend="xvDragEnd()">'
    +prioMark(e)
    +'<span class="xv-dot" style="background:'+((p&&p.color)||'var(--accent)')+'"></span>'
    +'<span class="xv-code">'+esc(e.code||'')+'</span>'
    +'<span class="xv-name">'+esc(e.title||(isCoded(e)?'':'Untitled'))+'</span>'
    +(e.type?'<span class="xv-type">'+esc(typeName(e.type))+'</span>':'')
    +(q.total?'<span class="xv-prog" title="'+q.done+' of '+q.total+' steps done"><span class="xv-bar"><i style="width:'+pct+'%"></i></span><b>'+q.done+'/'+q.total+'</b></span>':'')
    +'<span class="xv-when">'+when+'</span>'
    +menuBtn("ctxExp(event,'"+e.id+"')",'Entry menu')
    +'<span class="xv-arw">'+tbIco(P_CHEV_R,13)+'</span></div>';
}
function xvProjectBody(p,q){
  var all=Object.keys(LB.data.experiments).map(function(k){ return LB.data.experiments[k]; })
    .filter(function(e){ return e.projectId===p.id && xvKeep(e) && xvMatch(e,q); })
    // Priority sorts the browsing list, where you are choosing what to work on. It does NOT
    // sort Today or Running: there the date is the fact, and putting an experiment whose next
    // step is in a fortnight above one due this morning would be a lie about the day.
    .sort(function(a,b){ return prioRank(a)-prioRank(b)
      || (b.startDate||b.date||'').localeCompare(a.startDate||a.date||'')||(b.created||0)-(a.created||0); });
  // With every folder now drawn, "add a folder" was printed above the folders it said were
  // missing. The advice only applies to a project that really has none.
  var out = all.length ? '' : '<div class="xv-empty">'
    +(q||XV.filter!=='all' ? 'Nothing here matches.'
      : ((p.sections||[]).length ? 'No experiments yet — use + Add in a folder.'
                                 : 'No experiments yet — add a folder, then use + Add.'))+'</div>';
  // Every folder shows when you are browsing, even an empty one: it is a place to file into —
  // both the drop target and its own + Add — and hiding it made an empty folder unreachable
  // from here. Under a search or a filter it goes back to matches only, because there you
  // asked for a subset.
  var showEmpty = !q && XV.filter==='all';
  (p.sections||[]).forEach(function(sc){
    var inSec=all.filter(function(e){ return e.sectionId===sc.id; });
    if(!inSec.length && !showEmpty) return;
    out+='<div class="xv-fold" oncontextmenu="ctxFolder(event,\''+p.id+'\',\''+sc.id+'\')"'
       +' ondragover="xvDragOver(event)" ondragleave="xvDragLeave(event)" ondrop="xvDrop(event,\''+p.id+'\',\''+sc.id+'\')"><span class="xv-fname">'+esc(sc.name)+'</span>'
       +'<button class="xv-add" onclick="event.stopPropagation();xvAddTo(\''+p.id+'\',\''+sc.id+'\')">+ Add</button>'
       +menuBtn("ctxFolder(event,'"+p.id+"','"+sc.id+"')",'Folder menu')+'</div>'
       +inSec.map(function(e){ return xvRow(e,p); }).join('');
  });
  var loose=all.filter(function(e){ return !(p.sections||[]).some(function(sc){ return sc.id===e.sectionId; }); });
  if(loose.length) out+='<div class="xv-fold"><span class="xv-fname">Unfiled</span></div>'+loose.map(function(e){ return xvRow(e,p); }).join('');
  out+='<div class="add-row xv-newsec"><input id="new-sec-'+p.id+'" placeholder="New folder…" autocomplete="off" onkeydown="if(event.key===\'Enter\')addSection(\''+p.id+'\')"><button onclick="addSection(\''+p.id+'\')">+</button></div>';
  return out;
}
function xvAddTo(pid,sid){ selectNode('expsec',pid,sid); setTimeout(function(){ openNew(); },0); }
function renderExperiments(host, qOnly){
  var q=(XV.q||'').toLowerCase();
  var body=LB.data.projects.map(function(p){
    // A search already forces projects open, and a filter is the same act: you asked to see a
    // subset, so showing collapsed headers and no rows answers a question you did not ask.
    // (The Archived tab counted 1 and displayed nothing until you expanded a project.)
    var open = !!q || XV.filter!=='all' || !!XV.open[p.id];
    var n=Object.keys(LB.data.experiments).filter(function(k){
      var e=LB.data.experiments[k]; return e.projectId===p.id && xvKeep(e) && xvMatch(e,q); }).length;
    var run=Object.keys(LB.data.experiments).filter(function(k){
      var e=LB.data.experiments[k]; return e.projectId===p.id && expLive(e); }).length;
    if((q || XV.filter!=='all') && !n) return '';
    return '<div class="xv-proj'+(open?' open':'')+'">'
      +'<div class="xv-ph" onclick="xvToggle(\''+p.id+'\')" oncontextmenu="ctxProject(event,\''+p.id+'\')">'
        +'<span class="xv-chev">'+tbIco(P_CHEV_R,13)+'</span>'
        +'<span class="xv-pc" style="background:'+(p.color||'var(--accent)')+'"></span>'
        +'<span class="xv-pn">'+esc(p.name)+'</span>'
        // n counts what the filter shows; run counts what is actually running. Printing both
        // under a filter reads as one sentence about one set and is not — "1 experiment · 1
        // running" on the Archived tab meant one archived and one running, a different one.
        +'<span class="xv-pm">'+n+(XV.filter==='all'?(' experiment'+(n===1?'':'s')):' shown')
          +((run&&XV.filter==='all')?(' · '+run+' running'):'')+'</span>'
        +menuBtn("ctxProject(event,'"+p.id+"')",'Project menu')
        +'<span class="xv-parw">'+tbIco(P_CHEV_D,13)+'</span></div>'
      +(open?'<div class="xv-pb">'+xvProjectBody(p,q)+'</div>':'')+'</div>';
  }).join('');
  if(!LB.data.projects.length) body='<div class="xv-empty">No projects yet. Name one above to start.</div>';
  var f=['all','running','done','archived'], flbl={all:'All',running:'Running',done:'Done',archived:'Archived'};
  // Count it in the tab: an archive you cannot see the size of is a place things go missing.
  var nArch=Object.keys(LB.data.experiments).filter(function(k){ return expArchived(LB.data.experiments[k]); }).length;
  if(nArch) flbl.archived='Archived · '+nArch;
  host.innerHTML='<div class="xv-wrap"><div class="xv-top">'
    +'<div class="xv-h">Experiments</div>'
    +'<input class="xv-q" id="xv-q" placeholder="Search code, title or type…" value="'+esc(XV.q)+'" oninput="xvSetQ(this.value)" autocomplete="off">'
    +'<div class="xv-filters">'+f.map(function(x){ return '<button class="xv-f'+(XV.filter===x?' on':'')+'" onclick="xvSetFilter(\''+x+'\')">'+flbl[x]+'</button>'; }).join('')+'</div>'
    +'<button class="xv-f" title="Report across experiments — project or date range" onclick="openReport()">Report</button>'
    +'<div class="add-row xv-newproj"><input id="new-proj" placeholder="New project…" autocomplete="off" onkeydown="if(event.key===\'Enter\')addProject()"><button onclick="addProject()">+</button></div>'
    +'</div>'+body+'</div>';
  if(qOnly){ var i=el('xv-q'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } }
  renderDockPanels();
}

// ── projects: the drill-in happens inside the card ──
var HOME_PROJ=null;      // {projectId, sectionId} — how deep you are, without leaving Home
function homeProjOpen(pid,sid){ HOME_PROJ = pid ? {projectId:pid, sectionId:sid||null} : null; renderEditor(); }

function homeRecentCard(){

    items.push({t:e.updated||e.created||0, label:(e.code||e.title||'Untitled'), go:"openExp('"+e.id+"')", ctx:"ctxExp(event,'"+e.id+"')"});
  });
  Object.keys(LB.data.pages).forEach(function(k){
    var pg=LB.data.pages[k];
    items.push({t:pg.updated||pg.created||0, label:(pg.title||'Untitled page'), go:"selectPage('"+pg.id+"')", ctx:"ctxPage(event,'"+pg.id+"')"});
  });
  items=items.filter(function(x){ return x.t; }).sort(function(a,b){ return b.t-a.t; }).slice(0,6);
  if(!items.length) return '';
  var rows=items.map(function(x){
    return '<div class="lh-rec" onclick="'+x.go+'" oncontextmenu="'+x.ctx+'"><span class="w">'+esc(x.label)+'</span>'
      +'<span class="ago">'+esc(_homeAgo(x.t))+'</span></div>'; }).join('');

    +'<div class="lh-cb">'+rows+'</div></div>';

function _homeAgo(ts){
  var m=Math.floor((Date.now()-ts)/60000);
  if(m<60) return Math.max(1,m)+'m';
  var h=Math.floor(m/60); if(h<24) return h+'h';
  var d=Math.floor(h/24); if(d<14) return d+'d';
  return Math.floor(d/7)+'w';
}
// ── results in from Echo, and the deviations the typed parameters give us for free ──
// This read e.results, which nothing has ever written — the only writer is _mergeDHubContext,
// and it writes e.integration.results. rows was therefore always empty and the card returned ''
// on the next line, so "Results in from Echo" could not appear however many results you had.
// The shape differs too: integration.results[] holds result SETS, each with a .rows[] array;
// the card was reading set objects as if they were rows. Flatten, exactly as resultsPaneHtml does.
function homeResultsCard(){
  var rows=[];
  Object.keys(LB.data.experiments).forEach(function(k){
    var e=LB.data.experiments[k];
    ((e.integration&&e.integration.results)||[]).forEach(function(set){
      (set.rows||[]).forEach(function(r){ rows.push({r:r,e:e,set:set,t:set.createdAt||''}); });
    });
  });
  if(!rows.length) return '';
  // Newest set first. createdAt is an ISO string, so a plain string compare is the right order.
  rows.sort(function(a,b){ return String(b.t).localeCompare(String(a.t)); });
  rows=rows.slice(0,6);
  var body=rows.map(function(x){
    // potencyLabel arrives as "DC50 (nM)" — it already carries the unit, so pairing the whole
    // label with the unit again reads "DC50 (nM) 12.4 nM". Take the name, and let the value
    // carry the unit, the way pubResultsSentence does.
    var name=String(x.set.potencyLabel||'Potency').split(' ')[0];
    var pot=(x.r.potency===undefined||x.r.potency===null||x.r.potency==='')
      ? '' : (name+' '+_rn(x.r.potency)+' '+(x.set.potencyUnit||'nM'));
    // Echo sends flag as a boolean (Flag === 'Yes'), so printing it rendered the word "true".
    // A flag means the fit was questionable; say that, and pass a text flag through if one comes.
    var fl=(x.r.flag===true)?'flagged':(x.r.flag?String(x.r.flag):'');
    return '<div class="lh-res" onclick="openExp(\''+x.e.id+'\')" title="'+esc((x.e.code||x.e.title||'')+' · '+(x.set.label||x.set.source||''))+'">'
      +'<span class="cmp">'+esc(x.r.compound||'—')+'</span>'
      +'<span class="tgt">'+esc(x.r.target||x.set.label||'')+'</span>'
      +'<span class="val">'+esc(pot)+'</span>'
      +(fl?('<span class="lh-flag" title="Echo was not happy with this fit">'+esc(fl)+'</span>'):'')+'</div>';
  }).join('');
  return '<div class="lh-card w4"><div class="lh-ch"><span class="lh-t">Results in from Echo</span></div>'
    +'<div class="lh-cb">'+body+'</div></div>';
}

function pickFiles(key){ var inp=el('lb-file-input'); if(!inp) return; inp._key=key; inp.value=''; inp.click(); }

// The global dragover handler only preventDefaults inside .rt, so the drop zone needs its own —
// otherwise the browser navigates away from the app when you let go.
function wireFileDrop(root){
  var z=(root||document).querySelector('#fx-drop'); if(!z||z._wired) return; z._wired=true;
  ['dragenter','dragover'].forEach(function(ev){ z.addEventListener(ev,function(e){
    e.preventDefault(); e.stopPropagation(); z.classList.add('over'); }); });
  ['dragleave','dragend'].forEach(function(ev){ z.addEventListener(ev,function(e){
    e.preventDefault(); e.stopPropagation(); if(e.target===z) z.classList.remove('over'); }); });
  z.addEventListener('drop',function(e){
    e.preventDefault(); e.stopPropagation(); z.classList.remove('over');
    var dt=e.dataTransfer; if(dt&&dt.files&&dt.files.length) addFilesTo(z.getAttribute('data-key'),dt.files); });
}
// Read-only reminder of the answers this experiment was set up with. The blocks themselves are
// the live copy — this is just so you can see the plan at a glance.
// ── Editing the setup after the experiment exists ───────────────────────────────────────────
// applySetupToBlocks — and the volume rescaling that is the most useful thing in this file —
// ran exactly once, at creation. Changing your mind about 96 vs 384, cells/well or the number
// of plates meant editing every calculator by hand, so in practice nobody did and the record
// drifted from the run.
//
// It shows what it is about to change before it changes it. Re-applying rewrites numbers the
// experiment already carries, so this is one of the few places in Labbook where a preview
// earns its keep.
var ES_SETUP=null, ES_EXP=null;
function openSetupEditor(expId){
  var e=LB.data.experiments[expId]; if(!e) return;
  var S=setupSchema(e.type);
  var _f=e.presetKey?setupFieldsFor(e.presetKey):(S.fields||[]);
  if(!_f.length){ toast('This experiment type has no setup parameters.'); return; }
  ES_EXP=expId;
  ES_SETUP=JSON.parse(JSON.stringify(e.setup||setupDefaults(e.type)));
  el('es-modal').classList.add('open');
  esRender();
}
function closeSetupEditor(){ el('es-modal').classList.remove('open'); ES_SETUP=null; ES_EXP=null; }
function esRender(){
  var e=LB.data.experiments[ES_EXP]; if(!e) return;
  var S=setupSchema(e.type);
  // The same questions the experiment was created with. A preset's setupHide dropped a field
  // because that variant has no such step — bringing it back here as an empty box asks about
  // something the experiment does not have.
  var flds=e.presetKey?setupFieldsFor(e.presetKey):(S.fields||[]);
  var fields=flds.map(function(f,i){ return nmSetupField(f,i===0&&f.t==='format',ES_SETUP,'esSetupUpd'); }).join('');
  el('es-fields').innerHTML=fields;
  el('es-diff').innerHTML=esDiffHtml(e);
}
function esSetupUpd(reRender){
  var host=el('es-fields'); if(!host) return;
  host.querySelectorAll('[data-sf]').forEach(function(n){ var k=n.getAttribute('data-sf');
    ES_SETUP[k]=(n.type==='checkbox')?n.checked:((n.type==='number')?(n.value===''?'':parseFloat(n.value)):n.value); });
  if(reRender&&ES_SETUP.cellLine!=null){ var d=cellLineDef(ES_SETUP.cellLine); if(d&&d.cpw&&ES_SETUP.cellsPerWell!=null) ES_SETUP.cellsPerWell=d.cpw; esRender(); return; }
  el('es-diff').innerHTML=esDiffHtml(LB.data.experiments[ES_EXP]);
}
// Dry-run against a clone: the diff is the real result of the real function, not a second
// implementation of it that could disagree with what actually happens.
function esPreview(e){
  var clone=JSON.parse(JSON.stringify(e.blocks||[]));
  clone=applySetupToBlocks(e.type,ES_SETUP,clone,e.setup||setupDefaults(e.type));
  return clone;
}
function esDiffHtml(e){
  if(!e||!ES_SETUP) return '';
  var S=setupSchema(e.type), old=e.setup||{}, rows=[];
  (S.fields||[]).forEach(function(f){
    var a=old[f.f], b=ES_SETUP[f.f];
    if(String(a==null?'':a)===String(b==null?'':b)) return;

// One sentence of methods prose from the potencies, so the numbers reach the paragraph the

function pubResultsSentence(e){
  var rs=(e.integration&&e.integration.results)||[];
  var rows=[]; var pl='DC50', el2='Dmax', pu='nM', eu='%';
  rs.forEach(function(r){ (r.rows||[]).forEach(function(x){ if(!x.flag&&!x.excluded&&isFinite(parseFloat(x.potency))) rows.push(x); });
    if(r.potencyLabel) pl=String(r.potencyLabel).split(' ')[0];
    if(r.effectLabel) el2=String(r.effectLabel).split(' ')[0];

function expDeviations(e){

    // CTG, i.e. most of them — had a structurally empty deviation report, and changing a

function repSiblings(e){

function repeatExperiment(id){

// ── Bench timers ────────────────────────────────────────────────────────────────────────────
// Every time in a protocol step is now a typed value, which means the notebook can run the

function _tsec(v,ov){

function startTimer(bId,key,label){

function _fmtLeft(ms){

function renderTimers(){

  if(!LB_TIMERS.length){ host.innerHTML=''; host.style.display='none'; if(_timerTick){ clearInterval(_timerTick); _timerTick=null; } return; }
  host.style.display='';
  host.innerHTML=LB_TIMERS.map(function(t){
    var left=t.ends-Date.now(), done=left<=0;
    var pct=Math.max(0,Math.min(100,100*(1-left/(t.total*1000))));
    return '<div class="tmr'+(done?' done':'')+'"><div class="tmr-bar" style="width:'+pct+'%"></div>'
      +'<span class="tmr-time">'+(done?'done':_fmtLeft(left))+'</span>'
      +'<span class="tmr-lbl">'+esc(t.label)+(t.sub?('<span class="tmr-sub">'+esc(t.sub)+'</span>'):'')+'</span>'

function tasksForDate(D){ var t=plannerTasks(); return Object.keys(t).map(function(k){return t[k];}).filter(function(x){return x&&x.date===D;}).sort(function(a,b){ return (a.done?1:0)-(b.done?1:0) || (a.created||0)-(b.created||0); }); }

function linkPlannerTask(id){ var t=plannerTasks()[id]; if(!t) return;
  var items=Object.keys(LB.data.experiments).map(function(k){return LB.data.experiments[k];}).filter(function(e){return isCoded(e);})
    .map(function(e){ var p=projById(e.projectId); return {id:e.id,label:e.code||e.title||'Untitled',sub:(p?p.name:'')+(e.title?(' · '+e.title):''),ic:(e.type||'E').slice(0,2).toUpperCase(),c:(p&&p.color)||'#5e87c5'}; });
  items.unshift({id:'__none__',label:'— No experiment —',sub:'Unlink',ic:'—',c:'#888'});
  lbPicker('Link task to experiment',items,function(it){
    if(it.id==='__none__'){ t.expId=null; t.blockId=null; t.updated=Date.now(); save(); renderEditor(); return; }
    t.expId=it.id; t.blockId=null; t.updated=Date.now(); save();

    var e=LB.data.experiments[it.id]; var bs=(e&&e.blocks)||[];
    if(!bs.length){ renderEditor(); return; }
    var steps=bs.map(function(b){ return {id:b.id,label:b.title||('Day '+(b.dayOffset||0)),sub:(b.date?fmtDate(b.date):'no date')+(b.done?' · done':''),ic:'D'+(b.dayOffset||0),c:(projById(e.projectId)||{}).color||'#5e87c5'}; });

// ── One-time hand-off of the old local antibody list ────────────────────────────────────────
// The catalogue is Archive's now; Labbook no longer has a screen for it. This stays because
// restoring a backup taken before the move must still carry those records across. It is
// non-destructive on purpose: LB.data.antibodies is left exactly as it was.
function _abShared(){
  try{ var H=(window.parent&&window.parent!==window)?window.parent:null;
    if(H&&H.JournalStore&&H.JournalStore.libAdd) return H.JournalStore; }catch(e){}
  return null;
}
function _abNorm(n){ return String(n||'').trim().toLowerCase().replace(/\s+/g,' '); }
function migrateAntibodiesToLibrary(){
  var S=_abShared(); if(!S) return;
  if(LB.data._abMigrated) return;
  var mine=LB.data.antibodies||{}, ids=Object.keys(mine);
  if(!ids.length){ LB.data._abMigrated=true; return; }
  var there={}; try{ var t=S.get().antibodies||{};
    Object.keys(t).forEach(function(k){ there[_abNorm(t[k].name)]=1; }); }catch(e){ return; }
  var n=0;
  ids.forEach(function(k){ var a=mine[k]; if(!a||!a.name) return;
    if(there[_abNorm(a.name)]) return;
    // The Library keys an antibody by its target now. The old local record only had a name,
    // so derive one — and keep the name too, so nothing is lost if the derivation is wrong.
    var tgt=a.target||String(a.name||'').replace(/^\s*(?:anti|α)\s*[-\u2010-\u2015]?\s*|^\s*a\s*[-\u2010-\u2015]\s*/i,'').trim();
    S.libAdd('antibodies',{target:tgt,name:a.name||'',host:a.host||'',clonality:'',
      vendor:'',catalog:a.catalog||'',lot:'',dilution:a.dilution||'',location:'',
      usedIn:(a.usedIn||[]).slice(),created:a.created||Date.now()});
    n++; });
  LB.data._abMigrated=true; save();
  if(n) toast(n+' antibod'+(n===1?'y':'ies')+' copied into the shared Library');
}
// The catalogue is Archive's. Labbook keeps only what it needs to *mention* an antibody:
// read the shared list, and record the use against the record that already exists there.
function libAntibodies(){
  try{ var W=_arcWin(); if(W&&W.ARCHIVE_LIB) return W.ARCHIVE_LIB('antibodies')||{}; }catch(e){}
  return {};
}
// An antibody is a target now — the name is "α-" plus that, written in one place. Records
// from before the change kept their name, so fall back to it rather than showing nothing.
function abName(a){
  if(!a) return '';
  var t=a.target ? String(a.target).trim()
                 : String(a.name||'').replace(/^\s*(?:anti|α)\s*[-\u2010-\u2015]?\s*|^\s*a\s*[-\u2010-\u2015]\s*/i,'').trim();
  return t ? ('α-'+t) : (a.name||'');
}
// The plasmid catalogue moved into Archive's Library with the app. Reading the retired app's
// localStorage would show a list that has stopped being edited.
function libPlasmids(){
  try{ var W=_arcWin(); if(W&&W.ARCHIVE_LIB) return W.ARCHIVE_LIB('plasmids')||{}; }catch(e){}
  return {};
}
function libAbUse(id){
  var e=_curExp(); if(!e||!e.id) return;
  try{ var W=_arcWin(); if(W&&W.ARCHIVE_LIB_USE) W.ARCHIVE_LIB_USE('antibodies',id,e.id); }catch(err){}
}
// Show the Archive view FIRST, then ask it to open the record. In the standalone build the
// frame is parked off-screen and moved into place on switching, which rebuilds its contents —
// so opening the record before navigating threw the highlight away.
function openLibRecord(kind,id){
  var W=null; try{ W=_arcWin(); }catch(e){}
  if(!W||!W.ARCHIVE_LIB_OPEN){ toast('Open Archive to see the Library'); return; }
  function go(){ try{ W.ARCHIVE_LIB_OPEN(kind,id); }catch(e){} }
  if(archiveEmbedded()){ selectNode('archive'); setTimeout(go,60); return; }
  try{ if(window.parent&&window.parent.openApp) window.parent.openApp('protocols'); }catch(e){}
  setTimeout(go,60);
}

// Ordered, not just filtered. A name that starts with what you typed is a different answer
// from the same letters buried in a paragraph, and .slice(0,40) over an unsorted list threw
// the first away whenever the notebook was big.
function _spotScore(x,q){
  var a=(x.a||'').toLowerCase(), b=(x.b||'').toLowerCase();
  var i=a.indexOf(q);
  if(i===0) return 100;
  if(i>0) return (a.charAt(i-1)===' '||a.charAt(i-1)==='-') ? 84 : 68;
  i=b.indexOf(q); if(i>=0) return 52;
  if(x.t){ i=x.t.indexOf(q); if(i>=0) return 34-Math.min(14,i/300); }
  return -1;
}
// Nobody types a substring of a sentence. "gibson incubated" is two words that appear in one
// step in that order but not adjacently, and a plain indexOf answers "no matches" — which
// reads as the search being broken rather than as the query being a phrase it never was.
function _spotScoreQ(x,toks){
  var lo=1e9, hi=-1;
  for(var i=0;i<toks.length;i++){ var v=_spotScore(x,toks[i]); if(v<0) return -1; if(v<lo) lo=v; if(v>hi) hi=v; }
  return (lo+hi)/2;
}
// Show the sentence the hit is in, not the generic kind label.
function _spotSnip(x,q,toks){
  if(!x.raw) return x.b||'';
  var i=x.t.indexOf(q);
  if(i<0 && toks) for(var n=0;n<toks.length&&i<0;n++){ i=x.t.indexOf(toks[n]); if(i>=0) q=toks[n]; }
  if(i<0) return x.b||'';
  var st=Math.max(0,i-38), en=Math.min(x.raw.length,i+q.length+52);
  return (st?'…':'')+x.raw.slice(st,en).trim()+(en<x.raw.length?'…':'');

function pdPlate(p){ if(!p) return '';
  var d=plateDims(p), rows='', boxes=plateGroupBoxes(p), lblAt={}, skip={};

    for(var r=b.r1;r<=b.r2;r++) for(var c=b.c1;c<=b.c2;c++) if(!(r===b.r1&&c===b.c1)) skip[r+':'+c]=1; });
  for(var r=0;r<d.r;r++){ var tds='';
    for(var c=0;c<d.c;c++){ var key=r+':'+c; if(skip[key]) continue;
      var w=(p.wells||{})[wellIdOf(r,c)], col=plateWellColor(p,w), b=lblAt[key];
      var span=b?(' colspan="'+(b.c2-b.c1+1)+'" rowspan="'+(b.r2-b.r1+1)+'"'):'';
      var txt=b?b.label:(plateWellShort(w)||'');
      tds+='<td'+span+(col?' style="background:'+col+'"':'')+(b?' class="pd-pgl"':'')+'>'+esc(txt)+'</td>'; }
    rows+='<tr><th>'+PLATE_ROWS.charAt(r)+'</th>'+tds+'</tr>'; }
  var head='<tr><th></th>'; for(var c2=0;c2<d.c;c2++) head+='<th>'+(c2+1)+'</th>'; head+='</tr>';
  if(plateHasColLabels(p)){ var ch='<tr><th>'+esc(p.colTitle||'')+'</th>';
    for(var c3=0;c3<d.c;c3++) ch+='<th class="pd-pcl">'+esc((p.colLabels||{})[c3]||'')+'</th>';
    head=ch+'</tr>'+head; }
  var leg=plateUsedTypes(p).map(function(t){ return '<span class="pd-pleg-i"><i style="background:'+t.color+'"></i>'+esc(t.name)+'</span>'; }).join('');
  // The grid shows the shape; the summary underneath is what you actually read it back from.
  var sum=plateSummary(p).map(function(g){
    return '<tr><td class="pd-psum-r">'+(g.type?'<i style="background:'+g.type.color+'"></i>':'')+esc(g.range)+'</td><td>'+esc(g.desc)+'</td><td class="pd-psum-n">'+g.n+'</td></tr>'; }).join('');
  return '<div class="pd-plate"><div class="pd-plate-t">'+esc(p.title||'Plate map')+' · '+(d.r*d.c)+'-well</div>'
    +(p.note?'<div class="pd-pnote">'+esc(p.note)+'</div>':'')

    +(leg?'<div class="pd-pleg">'+leg+'</div>':'')
    +(sum?'<table class="pd-psum">'+sum+'</table>':'')+'</div>'; }

function exportReportCSV(){

  function q(v){ var t=(v==null?'':String(v)); return /[",\n\r]/.test(t)?('"'+t.replace(/"/g,'""')+'"'):t; }
  xs.forEach(function(e){
    var base=[e.code||'',e.title||'',typeName(e.type),e.startDate||'',e.status||'',expArchived(e)?'yes':'no'];
    var any=false;

          (x.effect==null?'':x.effect)+(r.effectUnit?(' '+r.effectUnit):''),
          x.hill==null?'':x.hill, x.r2==null?'':x.r2, x.flag?'flagged':'']).map(q).join(','));

// ── OneNote ─────────────────────────────────────────────────────────────────────────────────
// OneNote's paste keeps inline style and throws stylesheets away, which is the whole reason a
// plain copy out of here arrives as unstyled runs of text. buildPrintDoc already resolves
// whichever entry you are on into static HTML, so the work is not building a second document —
// it is moving the CSS onto the elements before the clipboard sees it.
var _ON_PROPS = ['font-family','font-size','font-weight','font-style','color','background-color',
  'text-align','text-decoration','line-height','margin-top','margin-right','margin-bottom','margin-left',
  'padding-top','padding-right','padding-bottom','padding-left','border-top','border-right',
  'border-bottom','border-left','border-radius','border-collapse','vertical-align','white-space','list-style-type'];
// Defaults are noise: written out they triple the payload and make the paste harder for
// OneNote to reconcile, not easier.
var _ON_SKIP = {'text-align':'start','vertical-align':'baseline','border-collapse':'separate',
  'border-radius':'0px','margin-top':'0px','margin-right':'0px','margin-bottom':'0px','margin-left':'0px',
  'padding-top':'0px','padding-right':'0px','padding-bottom':'0px','padding-left':'0px'};
var _ON_LIST = {UL:1,OL:1,LI:1};
// Checkbox squares are drawn with ::before, and a pseudo-element cannot be inlined — the
// ticks would silently become ordinary bullets. Swap in the characters before measuring, so
// what arrives in OneNote still says which steps were done.
function _onCheckboxes(root){
  Array.prototype.forEach.call(root.querySelectorAll('ul.lb-check > li, li.lb-todo'), function(li){
    var done=li.classList.contains('done');
    li.insertBefore(document.createTextNode(done?'\u2611\u00a0':'\u2610\u00a0'), li.firstChild);
    li.style.listStyleType='none';
  });
  Array.prototype.forEach.call(root.querySelectorAll('ul.lb-check'), function(ul){
    ul.style.listStyleType='none'; ul.style.paddingLeft='0px'; ul.style.marginLeft='0px';
  });
  Array.prototype.forEach.call(root.querySelectorAll('.lb-box'), function(b){ b.remove(); });
}
function _inlineStyles(root){
  var all=Array.prototype.slice.call(root.querySelectorAll('*'))
    .filter(function(n){ var t=n.tagName.toLowerCase(); return t!=='script' && t!=='style'; });
  // Read every element's computed style BEFORE touching the DOM. Removing the <style> block
  // as we walked stripped the CSS out from under everything measured after it, which is why
  // the tables came out unruled — measured, correctly, with no stylesheet left to measure.
  var reads=all.map(function(n){
    var cs=getComputedStyle(n), out=[];
    _ON_PROPS.forEach(function(prop){
      var v=cs.getPropertyValue(prop);
      // list-style-type:none is the one place "none" is the value we mean — it is what stops
      // a checkbox list also carrying a bullet.
      if(prop==='list-style-type'){ if(!_ON_LIST[n.tagName]) return; out.push(prop+':'+v); return; }
      if(!v || v==='none' || v==='normal' || v==='auto') return;
      if(_ON_SKIP[prop]===v) return;
      if(prop==='background-color' && /^rgba\(0, 0, 0, 0\)$/.test(v)) return;
      if(prop.indexOf('border-')===0 && /^0px none/.test(v)) return;
      if(prop==='text-decoration' && /^none /.test(v)) return;
      out.push(prop+':'+v);
    });
    return out.join(';');
  });
  Array.prototype.forEach.call(root.querySelectorAll('script,style'), function(n){ n.remove(); });
  all.forEach(function(n, i){
    n.setAttribute('style', reads[i]);
    n.removeAttribute('class');
    n.removeAttribute('data-ctx');
  });
  // SVG (plate maps, icons) does not survive OneNote's paste. Losing the plate silently is
  // worse than saying it is not there.
  Array.prototype.forEach.call(root.querySelectorAll('svg'), function(sv){
    var note=document.createElement('p');
    note.setAttribute('style','font-family:sans-serif;font-size:11px;color:#777;font-style:italic');
    note.textContent='[diagram — see the PDF export]';
    sv.parentNode.replaceChild(note, sv);
  });
  return root;
}
// Render off-screen but laid out: getComputedStyle on a display:none tree returns nothing
// usable, so the container is positioned away rather than hidden.
function buildOneNoteHtml(){
  var stage=document.createElement('div');
  stage.id='onenote-stage';
  stage.style.cssText='position:fixed;left:-10000px;top:0;width:820px;background:#fff;color:#111;'
    +"font-family:'IBM Plex Sans',sans-serif;";

    return new Promise(function(res){ setTimeout(function(){

function _download(name,text){ try{ var b=new Blob([text],{type:'application/json'}); var u=URL.createObjectURL(b); var a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },500); }catch(e){} }

function _dl(name,text,mime){

    var a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },500);

function _parentBackup(){ try{ if(window.parent && window.parent!==window && window.parent.lbBackup) return window.parent.lbBackup; }catch(e){} return null; }
var _selfDir=null;
function _idb(){ return new Promise(function(res,rej){ var r=indexedDB.open('lb_backup',1); r.onupgradeneeded=function(){ r.result.createObjectStore('h'); }; r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); }

function _rotateSelfBackups(prefix,keep){ return (_selfDir?Promise.resolve(_selfDir):_idbGet()).then(function(h){ if(!h||!h.keys||!h.removeEntry) return; return _verify(h).then(function(ok){ if(!ok) return; return _drainKeys(h.keys(),[]).then(function(names){ names=names.filter(function(n){return n.indexOf(prefix)===0;}).sort(); var extra=names.length-keep; if(extra<=0) return; return Promise.all(names.slice(0,extra).map(function(n){ return h.removeEntry(n).catch(function(){}); })); }); }); }).catch(function(){}); }
function chooseBackupDir(){ var pb=_parentBackup(); if(pb&&pb.pickDir){ return pb.pickDir().then(function(n){ toast('Backup folder: '+n); }).catch(function(){ toast('Could not open folder picker — backups will download.'); }); }
  if(typeof window.showDirectoryPicker==='function'){ return window.showDirectoryPicker({mode:'readwrite'}).then(function(h){ _selfDir=h; return _idbSet(h).then(function(){ toast('Backup folder: '+h.name); }); }).catch(function(){ toast('Folder picker unavailable — backups will download.'); }); }

// A backup that omits the image bytes is not a backup — restoring it on another machine used

function _buildBackupPayload(){

    .then(function(pairs){

function doBackup(manual){ var name='labbook-'+todayStr()+'.json'; var pb=_parentBackup();

    .catch(function(){ return _doBackupWrite(name,JSON.stringify({_lbBackup:2,savedAt:Date.now(),data:LB.data,blobs:{}},null,2),manual,null,pb); });
}
function _doBackupWrite(name,text,manual,info,pb){
  var note=info?(' ('+info.count+' attachment'+(info.count!==1?'s':'')+', '+_fmtBytes(text.length)+')'):'';
  var chain = pb&&pb.writeFile ? pb.writeFile(name,text).then(function(){return 'fs';})
    : (function(){ if(typeof window.showDirectoryPicker!=='function') return Promise.reject(); return (_selfDir?Promise.resolve(_selfDir):_idbGet()).then(function(h){ if(!h) return Promise.reject(); _selfDir=h; return _verify(h).then(function(v){ if(!v) return Promise.reject(); return h.getFileHandle(name,{create:true}).then(function(fh){ return fh.createWritable().then(function(w){ return w.write(text).then(function(){ return w.close(); }); }); }).then(function(){return 'fs';}); }); }); })();

    .catch(function(){

      // it was appearing on the first load of every day when no folder had been chosen. Only a

      // snapshot instead and says so once.

function _fmtBytes(n){ if(n<1024) return n+' B'; if(n<1048576) return (n/1024).toFixed(0)+' KB';

// ── Restore from a backup JSON (labbook-YYYY-MM-DD.json / dhub-backup-*.json) — REPLACES everything ──
function openRestoreBackup(){ var inp=el('lb-restore-input'); if(!inp) return; inp.value=''; inp.click(); }

    var parsed; try{ parsed=JSON.parse(reader.result); }catch(e){ toast('Could not parse that file — not valid JSON.'); return; }
    // Accept three shapes: the v2 backup ({_lbBackup:2, data, blobs}), a raw LB.data dump
    // (Labbook's own pre-v2 backups), or the hub-shell wrapper ({journal:{labbook:{...}}}).
    var blobs=(parsed && parsed._lbBackup && parsed.blobs) ? parsed.blobs : null;
    var data = (parsed && parsed._lbBackup && parsed.data) ? parsed.data

    if(!data || typeof data!=='object' || !('experiments' in data)){ toast('That file doesn\'t look like a Labbook backup.'); return; }
    var nBlob=blobs?Object.keys(blobs).length:0;

      ? ('It contains '+nBlob+' attachment'+(nBlob!==1?'s':'')+', which will be restored too.')
      : 'This is an older backup with no attachment data — images and files will come back as empty placeholders.';
    lbConfirm('Restore this backup? This REPLACES your entire current notebook — anything added since this backup was made will be lost unless it\'s in another backup.\n\n'+warn,{danger:true,title:'Restore from backup',ok:'Replace everything'}).then(function(ok){
      if(!ok) return;

      // reload finds them already in place.

        var failed=results.filter(function(x){ return x===false; }).length;
        LB.data=data; save();

        toast('Restored'+(ids.length?(' with '+ids.length+' attachment'+(ids.length!==1?'s':'')):'')+' — reloading…');
        setTimeout(function(){ location.reload(); },600);
      });
    });
  };
  reader.onerror=function(){ toast('Could not read that file.'); };
  reader.readAsText(file);
}
// Daily safety net.
//
// Two things were wrong here. It only ran when the File System Access API existed, so on
// Firefox and Safari — where the backup file is the ONLY durability guarantee — no automatic
// backup ever happened, silently. And when a folder had never been chosen it fell through to
// _download(), so a fresh install spat a JSON file into Downloads on first load with no user
// action. Now: write to the folder if we have one, otherwise keep a rolling snapshot in
// IndexedDB and ask (once) for somewhere real to put it.
function maybeAutoBackup(){
  var last=''; try{ last=localStorage.getItem('lb_last_backup')||''; }catch(e){}
  if(last===todayStr()) return;
  var pb=_parentBackup();
  // window.lbBackup always exposes writeFile; that says nothing about whether a folder was ever
  // chosen. Asking dirName() first is what stops the "nodir" rejection turning into a download.
  var haveDir = (pb && pb.dirName) ? pb.dirName().catch(function(){ return null; })
    : (typeof window.showDirectoryPicker==='function' ? _idbGet().catch(function(){ return null; })
                                                      : Promise.resolve(null));
  haveDir.then(function(h){
    if(h){ doBackup(false); return; }            // folder configured — write a real file
    return _snapshotBackup().then(function(ok){ if(ok) _nudgeBackupFolder(); });
  });
}
// Rolling local snapshot: not a substitute for a real backup file, but it means a browser that
// can't write to disk still has yesterday's notebook recoverable.
function _snapshotBackup(){
  return _buildBackupPayload().then(function(r){
    return _idb().then(function(db){
      return new Promise(function(res){
        try{
          var tx=db.transaction('h','readwrite').objectStore('h');
          tx.put({at:Date.now(),date:todayStr(),json:JSON.stringify(r.payload)},'snapshot:'+todayStr());
          // Keep the last 3 days only — this data is large.
          var all=tx.getAllKeys?tx.getAllKeys():null;
          if(all) all.onsuccess=function(){
            var keys=(all.result||[]).filter(function(k){ return String(k).indexOf('snapshot:')===0; }).sort();
            var extra=keys.length-3;
            for(var i=0;i<extra;i++){ try{ db.transaction('h','readwrite').objectStore('h').delete(keys[i]); }catch(e){} }
          };
          tx.transaction.oncomplete=function(){ _markBackup('snapshot'); res(true); };
          tx.transaction.onerror=function(){ res(false); };
        }catch(e){ res(false); }
      });
    });
  }).catch(function(){ return false; });
}
// Ask once — never on every load — for a folder to keep real backup files in.
// Where the last backup went and when. Shown on the Backup button, because a safety net you
// cannot see is one you cannot trust.
function _markBackup(kind){
  try{ localStorage.setItem('lb_last_backup',todayStr());
       localStorage.setItem('lb_last_backup_kind',kind);
       localStorage.setItem('lb_last_backup_at',String(Date.now())); }catch(e){}
}
function backupStatus(){
  var d='',k='',at=0;
  try{ d=localStorage.getItem('lb_last_backup')||''; k=localStorage.getItem('lb_last_backup_kind')||'';
       at=parseInt(localStorage.getItem('lb_last_backup_at')||'0',10); }catch(e){}
  if(!d) return {text:'No backup yet', detail:'No backup yet.'};
  var where = k==='folder' ? 'to your backup folder'
            : k==='download' ? 'as a download'
            : 'as a snapshot in this browser only';
  var when = (d===todayStr()) ? 'today' : fmtDate(d);
  return {text:'Last backup '+when, detail:'Saved '+when+' '+where+'.'};
}
function _nudgeBackupFolder(){
  try{ if(localStorage.getItem('lb_backup_nudged')==='1') return; localStorage.setItem('lb_backup_nudged','1'); }catch(e){}
  var canPick=(typeof window.showDirectoryPicker==='function');
  lbAlert(canPick
    ? 'Nothing was downloaded — a daily snapshot is kept inside this browser instead.\n\nThat snapshot lives on this one device, so it does not survive a wiped browser or a lost laptop. To get real backup files, right-click Backup in the View tab and pick a folder once. After that it writes there quietly, every day, with no dialogs.'
    : 'Nothing was downloaded — a daily snapshot is kept inside this browser instead.\n\nThat snapshot lives on this one device, and this browser cannot write files to a folder on its own. Press Backup in the View tab now and then to download one you can keep.',
    {title:'Your notebook is backed up here only'});
}
// Recover from the rolling snapshot when there is no backup file to hand.
function analysisSoftware(){ return (LB.data.settings&&LB.data.settings.analysisSoftware)||''; }
function setAnalysisSoftware(){
  lbPrompt('Which software turned the numbers into results? It closes every Methods paragraph.',
    analysisSoftware(), {title:'Analysis software', ok:'Save',
      ph:'e.g. GraphPad Prism 10.2'}).then(function(v){
    if(v==null) return;
    LB.data.settings=LB.data.settings||{};
    LB.data.settings.analysisSoftware=String(v).trim();
    save(); renderEditor();
    toast(LB.data.settings.analysisSoftware?('Methods will end with "'+LB.data.settings.analysisSoftware+'"'):'Cleared');
  });
}
// ── Selection bubble ───────────────────────────────────────────────────────────────────────
// Everything here is also in the Home pane. The point is not new commands, it is that the eight
// you actually use follow the text, so a 120px strip does not have to sit above every screen
// waiting to be needed. Anything rarer is still a tab click away.
var BUBBLE_ITEMS=[
  ['bold','Bold','<b>B</b>'], ['italic','Italic','<i>I</i>'], ['underline','Underline','<u>U</u>'],
  ['strikeThrough','Strikethrough','<s>S</s>'], ['sep'],
  ['hiliteColor','Highlight','<span style="background:#ffe08a;padding:0 3px;border-radius:3px">H</span>'],
  ['removeFormat','Clear formatting','<span style="font-weight:600">T&#215;</span>'], ['sep'],
  ['insertUnorderedList','Bullets','&#8226;&#8801;'], ['link','Link','&#128279;']
];
function _bubbleEl(){
  var b=el('lb-bubble');
  if(!b){ b=document.createElement('div'); b.id='lb-bubble';
    b.innerHTML=BUBBLE_ITEMS.map(function(x){
      if(x[0]==='sep') return '<span class="sep"></span>';
      return '<button title="'+esc(x[1])+'" data-cmd="'+x[0]+'" onmousedown="event.preventDefault();bubbleCmd(\''+x[0]+'\')">'+x[2]+'</button>';
    }).join('');
    document.body.appendChild(b); }
  return b;
}
function bubbleCmd(cmd){
  if(cmd==='hiliteColor'){ try{ document.execCommand('hiliteColor',false,'#ffe08a'); }catch(e){} }
  else if(cmd==='link'){ hideBubble(); if(typeof openLinkIns==='function') openLinkIns(); return; }
  else { try{ document.execCommand(cmd,false,null); }catch(e){} }
  // The command changed the document; the caller's oninput fires on its own.
  positionBubble();
}
function hideBubble(){ var b=el('lb-bubble'); if(b) b.classList.remove('on'); }
function positionBubble(){
  var sel; try{ sel=window.getSelection(); }catch(e){ return hideBubble(); }
  if(!sel || sel.isCollapsed || !sel.rangeCount) return hideBubble();
  var node=sel.anchorNode; node=node&&(node.nodeType===1?node:node.parentElement);
  // Only inside our own rich text: a selection in an input, a table of results or the page
  // chrome must not be offered bold.
  var host=node&&node.closest?node.closest('[contenteditable="true"]'):null;
  if(!host || !host.closest('.rt, .ps-rt, .lb-note-body')){ if(!host) return hideBubble(); }
  if(!host) return hideBubble();
  var r; try{ r=sel.getRangeAt(0).getBoundingClientRect(); }catch(e){ return hideBubble(); }
  if(!r || (!r.width && !r.height)) return hideBubble();
  var b=_bubbleEl(); b.classList.add('on');
  var bw=b.offsetWidth||260, bh=b.offsetHeight||38;
  // Measured, then clamped by its real edges — pinning the centre says nothing about where the
  // box lands, which is the bug #lb-tip had.
  var left=Math.round(r.left+r.width/2-bw/2);
  left=Math.max(8, Math.min(left, window.innerWidth-bw-8));
  var top=Math.round(r.top-bh-8);
  if(top<8) top=Math.round(r.bottom+8);          // no room above: flip below the selection
  b.style.left=left+'px'; b.style.top=top+'px';
}
(function initBubble(){
  var t=null;
  function later(){ clearTimeout(t); t=setTimeout(positionBubble,10); }
  document.addEventListener('selectionchange',later);
  document.addEventListener('mouseup',later);
  document.addEventListener('keyup',function(e){ if(e.key==='Escape'){ hideBubble(); return; } later(); });
  window.addEventListener('scroll',hideBubble,true);
  window.addEventListener('resize',hideBubble);
})();
function restoreFromSnapshot(){
  _idb().then(function(db){
    var os=db.transaction('h','readonly').objectStore('h');
    if(!os.getAllKeys){ toast('No snapshots available in this browser.'); return; }
    var rq=os.getAllKeys();
    rq.onsuccess=function(){
      var keys=(rq.result||[]).filter(function(k){ return String(k).indexOf('snapshot:')===0; }).sort().reverse();
      if(!keys.length){ toast('No local snapshots yet.'); return; }
      var items=keys.map(function(k){ return {id:k,label:fmtDate(String(k).slice(9)),sub:'local snapshot',ic:'↻',c:'#5e87c5'}; });
      lbPicker('Restore a local snapshot',items,function(it){
        db.transaction('h','readonly').objectStore('h').get(it.id).onsuccess=function(ev){
          var rec=ev.target.result; if(!rec||!rec.json){ toast('That snapshot could not be read.'); return; }
          var blob=new Blob([rec.json],{type:'application/json'});
          restoreFromBackupFile(new File([blob],'snapshot-'+String(it.id).slice(9)+'.json'));
        };
      });
    };
  }).catch(function(){ toast('Could not open local snapshots.'); });
}

var _toastT=null; function toast(msg){ var t=el('lb-toast'); if(!t){ t=document.createElement('div'); t.id='lb-toast'; t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--text);border:1px solid var(--border2);box-shadow:var(--shadow-md);border-radius:10px;padding:10px 16px;font-size:13px;z-index:400;opacity:0;transition:opacity .2s'; document.body.appendChild(t); } t.textContent=msg; t.style.opacity='1'; clearTimeout(_toastT); _toastT=setTimeout(function(){t.style.opacity='0';},2600); }
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
  var next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{ localStorage.setItem('hub_theme',next); }catch(e){}
  renderRibbon();
}
function _themeIsDark(){ return document.documentElement.getAttribute('data-theme')==='dark'; }
function updateNet(){ updateStatus(); }
window.addEventListener('online',updateNet); window.addEventListener('offline',updateNet);

// ── Init ──
function renderAll(){ renderPages(); renderEditor(); }   // renderPages() calls renderSections()
var _seedChanged=maybeSeed();
var _semanticTitlesChanged=migrateSemanticExperimentTitles();
if(_seedChanged||_semanticTitlesChanged) save();
applyLayout(); renderPanels(); renderAll();
lbInitSync();
setTimeout(maybeAutoBackup,1500);
setTimeout(gcAttachments,4000);
setTimeout(migrateAntibodiesToLibrary,2500);
setTimeout(cleanupAntibodySection,2600);
function _mergeDHubContext(ctx){
  ctx=ctx||{}; var e=(ctx.experiment&&LB.data.experiments[ctx.experiment.id])||_curExp();
  // Nothing open to attach to. Telling the user to go back and press Send again *after* opening
  // the right experiment throws away a whole analysis for a reason they could not have known
  // about — and this is the path most people are on, because you fit curves in Echo with
  // Labbook on the dashboard. Ask which experiment instead.
  if(!e){ _pickExpForContext(ctx); return; }
  e.integration=e.integration||{sources:[],cellLines:[],compounds:[],plateMaps:[],protocols:[],results:[]};
  ['cellLines','compounds','plateMaps','protocols','results'].forEach(function(k){ var incoming=Array.isArray(ctx[k])?ctx[k]:[]; e.integration[k]=e.integration[k]||[]; incoming.forEach(function(item){ var sig=JSON.stringify(item); if(!e.integration[k].some(function(old){return JSON.stringify(old)===sig;})) e.integration[k].push(item); }); });
  if(ctx.source){ e.integration.sources=e.integration.sources||[]; if(e.integration.sources.indexOf(ctx.source)<0) e.integration.sources.push(ctx.source); }
  e.updated=Date.now(); save(); renderEditor(); toast('Context attached to '+(e.code||e.title||'experiment'));
}
// Newest first, because the run you just analysed is the one you just worked on. Closed and
// archived entries are still offered — reanalysing an old plate is a real thing — but they sort
// below the live ones.
function _pickExpForContext(ctx){
  var n=((ctx.results||[]).reduce(function(a,r){ return a+((r.rows||[]).length||0); },0));
  var what=n?(n+' result row'+(n===1?'':'s')):'this data';
  var items=Object.keys(LB.data.experiments).map(function(k){ return LB.data.experiments[k]; })
    .filter(function(x){ return x && x.kind!=='note'; })
    .sort(function(a,b){
      var la=(a.archived||a.status==='abandoned')?1:0, lb=(b.archived||b.status==='abandoned')?1:0;
      return (la-lb) || ((b.updated||0)-(a.updated||0)); })
    .slice(0,60)
    .map(function(x){
      var pj=projById(x.projectId)||{};
      return {id:x.id, label:(x.code?(x.code+' · '):'')+(x.title||'Untitled'),
              sub:[pj.name, x.startDate?fmtDate(x.startDate):'', x.status||''].filter(Boolean).join(' · '),
              ic:'E', c:pj.color||'#5e87c5'};
    });
  if(!items.length){ lbAlert('There is no experiment to attach these results to yet. Create one, then send them again from '
    +esc(ctx.source||'the other app')+'.',{title:'Nothing to attach to'}); return; }
  lbPicker('Attach '+what+' from '+(ctx.source||'the other app')+' to…', items, function(it){
    var target=LB.data.experiments[it.id]; if(!target) return;
    openExp(target.id);
    _mergeDHubContext(Object.assign({}, ctx, {experiment:{id:target.id}}));
    EXP_TAB='res'; renderEditor();
  }, function(){ toast('Not attached — the results are still in '+(ctx.source||'the other app')); });
}
function _dhubAck(e){ try{ if(e&&e.data&&e.data.requestId&&window.parent&&window.parent!==window) window.parent.postMessage({type:'dhub:ack',requestId:e.data.requestId,app:'labbook'},'*'); }catch(err){} }
// Deep-link: another app (e.g. Plasmids "Used in") can open a specific experiment/page.
window.addEventListener('message', function(e){
  // The workspace rail drives Labbook from outside: Home is this app's dashboard and Labbook
  // is the notebook, so the shell needs a way to say which one without knowing our internals.
  if(e.data && e.data.type==='lb:go'){
    var v=e.data.view;
    if(v==='home') selectNode('home');
    else if(v==='exps') selectNode('exps');
    else if(v==='journal') selectNode('journal');
    // 'notebook' is what the rail used to say for "the notebook, wherever I left it".
    else if(v==='notebook') selectNode(SEL.node && SEL.node.kind!=='home' ? SEL.node.kind : 'journal',
                                       SEL.node&&SEL.node.projectId, SEL.node&&SEL.node.sectionId);
    else if(v==='today') selectNode('today');
    else if(v==='week') selectNode('week');
    else if(v==='exp' && e.data.id) openExp(e.data.id);
    else if(v==='day' && e.data.date){ selectNode('journal'); selectPage(e.data.date); }
    _dhubAck(e); return;
  }
  if(e.data && e.data.type==='dhub:context' && e.data.version===1){ _mergeDHubContext(e.data.context||{}); _dhubAck(e); return; }
  if(e.data && e.data.type==='switchTab' && e.data.item){ var id=String(e.data.item);
    if(LB.data.experiments[id]){ openExp(id); }
    else if(LB.data.pages[id]){ selectPage(id); }
    else { jumpCode(id); }
    _dhubAck(e);
  }
});

// Fast custom tooltips — native title= lags ~1.5s; show ours after 140ms.
(function(){ var tip=null, showT=null;
  function ensure(){ if(!tip){ tip=document.createElement('div'); tip.id='lb-tip'; document.body.appendChild(tip); } return tip; }
  document.addEventListener('mouseover', function(e){ var b=e.target.closest && e.target.closest('[title]'); if(!b) return; var txt=b.getAttribute('title'); if(!txt) return;
    b.setAttribute('data-otitle', txt); b.removeAttribute('title');
    clearTimeout(showT); showT=setTimeout(function(){ var t=ensure(); t.textContent=b.getAttribute('data-otitle')||txt;
      // Place it off-screen first so we can measure the wrapped box, then clamp its real
      // edges to the viewport and flip above the trigger when there is no room below.
      t.style.left='0px'; t.style.top='-9999px'; t.classList.add('on');
      var r=b.getBoundingClientRect(), tw=t.offsetWidth, th=t.offsetHeight, M=8;
      var left=r.left+r.width/2-tw/2;
      left=Math.max(M, Math.min(left, window.innerWidth-tw-M));
      var top=r.bottom+7;
      if(top+th>window.innerHeight-M) top=Math.max(M, r.top-th-7);
      t.style.left=left+'px'; t.style.top=top+'px'; }, 140);
  });
  document.addEventListener('mouseout', function(e){ var b=e.target.closest && e.target.closest('[data-otitle]'); if(!b) return; clearTimeout(showT); if(tip) tip.classList.remove('on'); var o=b.getAttribute('data-otitle'); if(o!=null){ b.setAttribute('title',o); b.removeAttribute('data-otitle'); } });
})();
