function _concDesc(p,ids){
  var byR={}, byC={};
  ids.forEach(function(id){ var x=wellRC(id); if(!x) return; var v=(p.wells[id].conc||'');
    (byR[x.r]=byR[x.r]||[]).push([x.c,v]); (byC[x.c]=byC[x.c]||[]).push([x.r,v]); });
  function seqs(map){ return Object.keys(map).map(Number).sort(function(a,b){return a-b;})
    .map(function(k){ return map[k].slice().sort(function(a,b){return a[0]-b[0];}).map(function(e){ return e[1]; }); }); }
  function uniformSeq(list){ if(!list.length) return null; var s=JSON.stringify(list[0]);
    return list.every(function(x){ return JSON.stringify(x)===s; })?list[0]:null; }
  var rS=seqs(byR), cS=seqs(byC);
  var seq=uniformSeq(rS), reps=rS.length;
  if(!seq){ seq=uniformSeq(cS); reps=cS.length; }
  if(!seq){ // ragged selection — just list what's there
    var all={}; ids.forEach(function(id){ var v=p.wells[id].conc; if(v) all[v]=1; });
    var ks=Object.keys(all); return ks.length?(ks.length<=6?ks.join(', '):(ks.length+' concentrations')):''; }
  var r=_seriesText(seq);
  if(!r.text) return '';
  return r.text+((r.varies&&reps>1)?(' ×'+reps+' replicates'):'');
}
// Distinct shade levels → "gradient · 10 levels", for layouts where the real numbers live in a
// picklist or in the column headers rather than in the wells.
function _shadeDesc(p,ids){ var s={}, any=false;
  ids.forEach(function(id){ var w=p.wells[id]||{}; if(w.shade==null) return; any=true; s[+w.shade||0]=1; });
  var n=Object.keys(s).length; return (any&&n>1)?('gradient · '+n+' levels'):''; }
function plateSummary(p){
  if(!p||!p.wells) return [];
  var groups={}, order=[];
  Object.keys(p.wells).forEach(function(id){ var w=p.wells[id]; if(!w) return;
    // A labelled block is always its own entry, however its wells are otherwise filled in.
    var k=w.groupId?('grp:'+w.groupId):[w.typeId||'',w.cellLine||'',w.compound||'',w.label||'',plateWellFlags(w)].join('');
    if(!groups[k]){ groups[k]={w:w,ids:[],gid:w.groupId||null}; order.push(k); }
    groups[k].ids.push(id); });
  return order.map(function(k){ var g=groups[k], w=g.w;
    // Sort along whichever axis the group runs, so the series reads in order.
    var rs={},cs={}; g.ids.forEach(function(id){ var x=wellRC(id); if(x){ rs[x.r]=1; cs[x.c]=1; } });
    var byRow=Object.keys(rs).length===1;
    g.ids.sort(function(a,b){ var A=wellRC(a), B=wellRC(b);
      return byRow?(A.c-B.c):((A.r-B.r)||(A.c-B.c)); });
    var t=plateTypeById(p,w.typeId);
    var bits=[];
    // The type is rendered beside the range already, so a block label or a well label that
    // only repeats it is noise: "No HT ligand · No HT ligand" is one fact printed twice.
    var _tn=(plateTypeById(p,w.typeId)||{}).name||'';
    function _new(x){ return x && String(x).trim().toLowerCase()!==String(_tn).trim().toLowerCase(); }
    var _gl=(g.gid&&p.groups&&p.groups[g.gid])?(p.groups[g.gid].label||''):'';
    if(_new(_gl)) bits.push(_gl);
    if(w.cellLine) bits.push(w.cellLine); if(w.compound) bits.push(w.compound);
    var cd=_concDesc(p,g.ids); if(cd) bits.push(cd); if(_new(w.label)) bits.push(w.label);
    // Name the well type unless something more specific already identifies these wells — but a
    // condition like "pNL + pHT" is never redundant with a cell line, so a derived type
    // (an experiment's own condition) is always named, and first.
    var generic=PLATE_TYPES.some(function(x){ return x.id===w.typeId; });
    if(t && (!bits.length || !generic)) bits.unshift(t.name);
    // A well missing its ligand or its substrate is a different well, and a sheet you take to
    // the bench is exactly where that must not be silently merged into the row above.
    PLATE_FLAGS.forEach(function(f){ if(w[f.k]) bits.push(f.lbl); });
    var sd=_shadeDesc(p,g.ids); if(sd) bits.push(sd);
    return {range:_compactRanges(g.ids), type:t, n:g.ids.length, desc:bits.join(' · ')};
  }).sort(function(a,b){ var A=wellRC(a.range.split(/[–,]/)[0]), B=wellRC(b.range.split(/[–,]/)[0]);
    if(!A||!B) return 0; return (A.r-B.r)||(A.c-B.c); });
}
// Column headers are part of the record too — "Cols 2–12 · 1000 → 0.02 nM".
function plateColSummary(p){
  if(!plateHasColLabels(p)) return [];
  var cl=p.colLabels, cols=Object.keys(cl).map(Number).sort(function(a,b){return a-b;});
  var runs=[], s=cols[0], pv=cols[0];
  for(var i=1;i<cols.length;i++){ if(cols[i]===pv+1) pv=cols[i]; else { runs.push([s,pv]); s=cols[i]; pv=cols[i]; } }
  runs.push([s,pv]);
  return runs.map(function(r){
    var seq=[]; for(var c=r[0];c<=r[1];c++) seq.push(cl[c]);
    var unit=p.colTitle?(' '+p.colTitle):'';
    // A header row that repeats (two dose blocks side by side) is described once, ×N.
    var cyc=seq.length;
    for(var d2=1;d2<seq.length;d2++){ if(seq.length%d2) continue;
      var ok=true; for(var i=0;i<seq.length;i++) if(seq[i]!==seq[i%d2]){ ok=false; break; }
      if(ok){ cyc=d2; break; } }
    var reps=seq.length/cyc;
    var t=_seriesText(seq.slice(0,cyc).map(function(v){ return v+unit; }));
    return {range:'Cols '+(r[0]+1)+'–'+(r[1]+1), desc:t.text+(reps>1?(' ×'+reps+' blocks'):''), n:seq.length}; });
}
function plateSummaryHtml(p){ var s=plateColSummary(p).concat(plateSummary(p)); if(!s.length) return '';
  return '<table class="pl-sum-t">'+s.map(function(g){
    return '<tr><td class="pl-sum-r">'+(g.type?'<i style="background:'+g.type.color+'"></i>':'')+esc(g.range)+'</td>'
      +'<td class="pl-sum-d">'+esc(g.desc)+'</td><td class="pl-sum-n">'+g.n+'</td></tr>'; }).join('')+'</table>'
    +(function(){ var nt=plateNotes(p); if(!nt.length) return '';
        return '<div class="pl-notes"><span class="pl-notes-h">Notes</span>'
          +nt.map(function(x){ return '<span class="pl-note"><b>'+esc(x.well)+'</b> '+esc(x.note)+'</span>'; }).join('')+'</div>'; })(); }
function plateNotes(p){
  if(!p||!p.wells) return [];
  return Object.keys(p.wells).filter(function(id){ return (p.wells[id]||{}).note; })
    .sort(function(a,b){ var A=wellRC(a),B=wellRC(b); return (A.r-B.r)||(A.c-B.c); })
    .map(function(id){ return {well:id, note:String(p.wells[id].note)}; });
}
function plateNotesText(p){
  var n=plateNotes(p); if(!n.length) return '';
  return n.map(function(x){ return x.well+' — '+x.note; }).join('; ');
}
function plateSummaryText(p){
  var body=plateColSummary(p).concat(plateSummary(p))
    .map(function(g){ return g.range+'  '+g.desc+'  ('+g.n+')'; }).join('\n');
  var nt=plateNotesText(p);
  // Notes go into the copied text and therefore into the Cmd+K content index: an annotation
  // nobody can find later is not an annotation.
  return nt?(body+'\nNotes: '+nt):body; }
function copyPlateSummary(key){ var p=plateOf(key); if(!p) return;
  var txt=(p.title?p.title+'\n':'')+plateDims(p).r*plateDims(p).c+'-well plate\n'+plateSummaryText(p);
  try{ navigator.clipboard.writeText(txt); toast('Plate layout copied'); }
  catch(e){ toast('Could not copy'); } }
// A plate map goes into a slide deck and a lab meeting, and CSV and PDF are neither. Drawn on
// a canvas rather than screenshotted, so it does not depend on what is scrolled into view and
// comes out at print resolution.
function plateToPNG(p,name){
  if(!p) return;
  var d=plateDims(p), W=Math.max(18,Math.round(760/d.c)), HDR=26, PAD=18, S=2;
  var hasCL=plateHasColLabels(p);
  var titleH=(p.title?26:0), clH=hasCL?18:0;
  var used=plateUsedTypes(p), legH=used.length?30:0;
  var cw=PAD*2+HDR+d.c*W, ch=PAD*2+titleH+clH+HDR+d.r*W+legH;
  var cv=document.createElement('canvas');
  cv.width=cw*S; cv.height=ch*S;
  var x=cv.getContext('2d'); x.scale(S,S);
  var ink='#1a1d2e', faint='#9ca0b8', line='rgba(0,0,0,0.13)';
  x.fillStyle='#ffffff'; x.fillRect(0,0,cw,ch);
  x.textBaseline='middle'; x.textAlign='center';
  var y0=PAD;
  if(p.title){ x.fillStyle=ink; x.textAlign='left'; x.font='600 15px ui-sans-serif,system-ui,sans-serif';
    x.fillText(p.title,PAD,y0+11); x.textAlign='center'; y0+=titleH; }
  if(hasCL){
    x.fillStyle=faint; x.font='500 9px ui-sans-serif,system-ui,sans-serif';
    if(p.colTitle){ x.textAlign='right'; x.fillText(p.colTitle,PAD+HDR-3,y0+9); x.textAlign='center'; }
    for(var ci=0;ci<d.c;ci++){ var cl=(p.colLabels||{})[ci]; if(cl) x.fillText(String(cl),PAD+HDR+ci*W+W/2,y0+9); }
    y0+=clH;
  }
  x.fillStyle=faint; x.font='600 10px ui-sans-serif,system-ui,sans-serif';
  for(var c=0;c<d.c;c++) x.fillText(String(c+1),PAD+HDR+c*W+W/2,y0+HDR/2);
  var top=y0+HDR;
  for(var r=0;r<d.r;r++){
    x.fillStyle=faint; x.fillText(PLATE_ROWS.charAt(r),PAD+HDR/2,top+r*W+W/2);
    for(var c2=0;c2<d.c;c2++){
      var id=wellIdOf(r,c2), w=(p.wells||{})[id];
      var col=plValueColor(p,id)||plateWellColor(p,w);
      var wx=PAD+HDR+c2*W, wy=top+r*W;
      x.fillStyle=col||'#f4f5f8';
      _plRoundRect(x,wx+1,wy+1,W-2,W-2,Math.min(4,W/6)); x.fill();
      x.strokeStyle=line; x.lineWidth=0.7; x.stroke();
      var vv=(p.values&&p.values.data)?p.values.data[id]:null;
      var txt=(vv!=null)?_plTrim(vv):((w&&w.groupId&&(p.groups||{})[w.groupId])?'':plateWellShort(w));
      if(txt && W>=22){ x.fillStyle=ink; x.font='500 '+Math.max(6,Math.round(W/4.2))+'px ui-sans-serif,system-ui,sans-serif';
        x.fillText(_plFit(x,String(txt),W-4),wx+W/2,wy+W/2); }
    }
  }
  // Block labels are written once across their wells, exactly as the editor draws them.
  plateGroupBoxes(p).forEach(function(b){
    var bx=PAD+HDR+b.c1*W, by=top+b.r1*W, bw=(b.c2-b.c1+1)*W, bh=(b.r2-b.r1+1)*W;
    x.strokeStyle='rgba(0,0,0,0.28)'; x.lineWidth=1.1;
    _plRoundRect(x,bx+1,by+1,bw-2,bh-2,4); x.stroke();
    x.fillStyle=ink; x.font='600 '+Math.max(9,Math.min(15,Math.round(bw/6)))+'px ui-sans-serif,system-ui,sans-serif';
    x.fillText(_plFit(x,b.label,bw-8),bx+bw/2,by+bh/2);
  });
  if(used.length){
    var lx=PAD, ly=top+d.r*W+16;
    x.textAlign='left'; x.font='500 10px ui-sans-serif,system-ui,sans-serif';
    used.forEach(function(t){
      x.fillStyle=t.color; _plRoundRect(x,lx,ly-5,10,10,2); x.fill();
      x.strokeStyle=line; x.lineWidth=0.7; x.stroke();
      x.fillStyle=faint; x.fillText(t.name,lx+15,ly);
      lx+=15+x.measureText(t.name).width+14;
    });
  }
  cv.toBlob(function(bl){
    if(!bl){ toast('Could not draw the plate'); return; }
    var u=URL.createObjectURL(bl), a=document.createElement('a');
    a.href=u; a.download=name||('plate_'+p.format+'well.png'); document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(u); },800);
    toast('Plate map saved as PNG');
  },'image/png');
}
function _plRoundRect(x,a,b,w,h,r){ x.beginPath();
  if(x.roundRect){ x.roundRect(a,b,w,h,r); return; }
  x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r);
  x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }
// Truncate to what the well can hold, measured rather than guessed at a character count.
function _plFit(x,t,max){ t=String(t||''); if(x.measureText(t).width<=max) return t;
  while(t.length>1 && x.measureText(t+'…').width>max) t=t.slice(0,-1);
  return t+'…'; }
function exportPlatePNG(key){ var p=plateOf(key); if(!p){ toast('No plate map here yet'); return; }
  plateToPNG(p,'plate_'+p.format+'well.png'); }

function _plDownload(name,text,mime){ try{
  var b=new Blob([text],{type:mime||'text/csv'}), u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(u); },800);
}catch(e){ toast('Could not download'); } }

// Owner routing — same shape as the editors' data-ctx strings.
//   exp:<expId>            → the experiment-level plate map
//   blk:<expId>:<blockId>  → a day-block's plate map
function _plateOwner(key){ var p=String(key||'').split(':');
  if(p[0]==='exp'){ var e=LB.data.experiments[p[1]]; return e?{obj:e,exp:e}:null; }
  if(p[0]==='blk'){ var e2=LB.data.experiments[p[1]]; if(!e2) return null;
    var b=(e2.blocks||[]).filter(function(x){return x.id===p[2];})[0]; return b?{obj:b,exp:e2}:null; }
  return null; }
function plateOf(key){ var o=_plateOwner(key); return o?(o.obj.plate||null):null; }
// Drawing the plate IS saying how many wells each condition gets, so the calculators take their
// counts from it rather than asking you the same question twice. Only the counts: everything
// you have set about amounts — ng per well, ratio, stocks, overage — is left exactly as it is.
function plateConditionCounts(e){
  var p=e&&e.plate; if(!p) return null;
  var c={pair:0,donor:0,acceptor:0,mock:0,untr:0,noLig:0,noSub:0,total:0,transfected:0};
  Object.keys(p.wells||{}).forEach(function(k){
    var w=p.wells[k]; if(!w||!w.typeId) return;
    var id=String(w.typeId);
    c.total++;
    if(w.noLig) c.noLig++;
    if(w.noSub) c.noSub++;
    if(id.indexOf('p:')===0){ c.pair++; c.transfected++; }
    else if(id.indexOf('d:')===0){ c.donor++; c.transfected++; }
    else if(id.indexOf('a:')===0){ c.acceptor++; c.transfected++; }
    else if(id==='mock'){ c.mock++; c.transfected++; }
    else if(id==='untr'){ c.untr++; }
  });
  return c;
}
function syncPlateToCalcs(e){
  var c=plateConditionCounts(e); if(!c||!c.total) return null;
  var hit=[];
  (e.blocks||[]).forEach(function(b){
    var I=b.calc&&b.calc.inputs; if(!I) return;
    if(b.calc.kind==='nbtx'){
      if(I.nPair!==c.pair||I.nDonor!==c.donor||I.nAcceptor!==c.acceptor||I.nMock!==c.mock){
        I.nPair=c.pair; I.nDonor=c.donor; I.nAcceptor=c.acceptor; I.nMock=c.mock;
        hit.push('transfection mixes');
      }
    } else if(b.calc.kind==='nbsusp'){
      // A well with no ligand is still a transfected well: it belongs to the − ligand
      // suspension, not to a different DNA condition.
      var plus=Math.max(0,c.transfected-c.noLig), minus=c.noLig;
      if(I.nPlus!==plus||I.nMinus!==minus){ I.nPlus=plus; I.nMinus=minus; hit.push('cell suspensions'); }
    }
  });
  return hit.length?hit:null;
}
function platePersist(key){ var o=_plateOwner(key); if(!o) return;
  var changed=syncPlateToCalcs(o.exp);
  o.exp.updated=Date.now(); queueSave();
  if(changed) toast('Well counts from the plate → '+changed.join(' and '));
  return changed; }
function addPlateTo(key,fmt){ var o=_plateOwner(key); if(!o) return;
  if(!o.obj.plate) o.obj.plate=newPlate(fmt||(o.exp.setup&&o.exp.setup.format)||'96');
  o.exp.updated=Date.now(); save(); renderEditor(); openPlateEditor(key); }
function removePlateFrom(key){ var o=_plateOwner(key); if(!o||!o.obj.plate) return;
  lbConfirm('Remove this plate map? The wells you laid out will be lost.',{danger:true,title:'Remove plate map'}).then(function(ok){
    if(!ok) return; delete o.obj.plate; o.exp.updated=Date.now(); save(); renderEditor(); }); }
// ── Echo picklist → plate map ───────────────────────────────────────────────────────────────
// The picklist already records exactly what a plate map is for: which compound went into which
// well, and at what concentration. Retyping it by hand is both tedious and the most likely
// place for the record to stop matching the plate that was actually run. Parsed here rather
// than fetched from Echo, so it works from the file alone with Echo closed.

// Echo writes concentrations in molar, often as 2.001E-05. Show them the way they are spoken.
function _echoConc(v,unit){
  var n=parseFloat(v); if(!isFinite(n)) return '';
  unit=String(unit||'M').trim();
  if(unit!=='M') return _plTrim(n)+' '+unit;
  if(n>=1e-3)  return _plTrim(n*1e3)+' mM';
  if(n>=1e-6)  return _plTrim(n*1e6)+' µM';
  if(n>=1e-9)  return _plTrim(n*1e9)+' nM';
  return _plTrim(n*1e12)+' pM';
}
function _plTrim(n){ var r=Math.round(n*1000)/1000; return String(r); }
// Minimal CSV row splitter — Echo quotes fields containing commas.
function _csvRow(line){
  var out=[],cur='',q=false;
  for(var i=0;i<line.length;i++){ var ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ out.push(cur); cur=''; }
    else cur+=ch; }
  out.push(cur); return out;
}
function parseEchoPicklist(text){
  var lines=String(text||'').split(/\r?\n/);
  // The preamble names the Echo protocol and the run date, which is enough to date the
  // experiment and guess its type instead of asking for both again.
  var meta={};
  for(var h=0;h<lines.length&&h<12;h++){
    var kv=_csvRow(lines[h]); if(kv.length<2) continue;
    var k=(kv[0]||'').trim().toLowerCase();
    if(k==='protocol name') meta.protocol=(kv[1]||'').trim();
    else if(k==='run date/time') meta.runDate=(kv[1]||'').trim().slice(0,10);
    else if(k==='application name') meta.app=(kv[1]||'').trim();
  }
  var hdr=-1;
  for(var i=0;i<lines.length;i++){ if(/destination\s+well/i.test(lines[i])){ hdr=i; break; } }
  if(hdr<0) return {error:'This does not look like an Echo picklist — no "Destination Well" column.'};
  var cols=_csvRow(lines[hdr]).map(function(c){ return c.trim().toLowerCase(); });
  function col(){ for(var a=0;a<arguments.length;a++){ var k=cols.indexOf(arguments[a]); if(k>=0) return k; } return -1; }
  var iWell=col('destination well'), iConc=col('destination concentration'),
      iUnit=col('destination concentration units'),
      iName=col('sample name','sample id'), iPlate=col('destination plate name'),
      iStat=col('transfer status'), iVol=col('actual volume','transfer volume'),
      iFluid=col('fluid type');
  var plates={}, skipped=0, bad=0;
  for(var r=hdr+1;r<lines.length;r++){
    var L=lines[r]; if(!L.trim()) continue;
    var f=_csvRow(L); if(f.length<3) continue;
    var w=(f[iWell]||'').trim().toUpperCase();
    if(!/^[A-P]\d{1,2}$/.test(w)){ bad++; continue; }
    // A failed transfer never reached the plate; recording it would be a lie.
    if(iStat>=0 && (f[iStat]||'').trim() && !/^ok$/i.test((f[iStat]||'').trim())){ skipped++; continue; }
    var pl=(iPlate>=0?(f[iPlate]||'').trim():'')||'(plate)';
    var b=plates[pl]||(plates[pl]={name:pl,wells:{},n:0});
    var name=(iName>=0?(f[iName]||'').trim():'');
    var fluid=(iFluid>=0?(f[iFluid]||'').trim():'');
    var conc=(iConc>=0?_echoConc(f[iConc], iUnit>=0?f[iUnit]:'M'):'');
    var vol =(iVol>=0?parseFloat(f[iVol]):NaN);
    var cell=b.wells[w]||(b.wells[w]={compound:'',conc:'',vol:0,dmsoOnly:true});
    if(isFinite(vol)) cell.vol+=vol;
    // DMSO backfill transfers carry no compound — they must not overwrite the real one.
    var isVeh=(!name)||/^dmso$/i.test(name)||(!name&&/dmso/i.test(fluid));
    if(!isVeh){ cell.compound=name; cell.conc=conc; cell.dmsoOnly=false; }
    b.n++;
  }
  var list=Object.keys(plates).map(function(k){ return plates[k]; })
             .sort(function(a,b){ return b.n-a.n; });
  if(!list.length) return {error:'No usable transfers found in this picklist.'};
  return {plates:list, skipped:skipped, bad:bad, meta:meta};
}
// Apply one parsed destination plate onto the plate map, keeping everything it does not touch.
// PLATE_FORMATS is {r,c}; this compared dims.rows/dims.cols, so both sides were undefined and
// `n >= undefined` is always false — the guard never fired once. A 384 picklist dropped onto a
// 96 plate wrote I1-P24: invisible to plRenderGrid, which only draws cells inside the format,
// but counted by plateCount, summarised by plateSummary and exported to CSV. The record said
// things about wells that were not on the plate. (Blueprint uses {rows,cols}; Labbook uses
// {r,c}, and porting between them without translating fails silently — same trap as pdParseValues.)
function applyEchoToPlate(plate,dest){
  var n=0, dm=0, out=0;
  var dims=plateDims(plate);
  Object.keys(dest.wells).forEach(function(w){
    var rc=wellRC(w);
    if(!rc) return;                                 // not a well id at all
    if(rc.r>=dims.r||rc.c>=dims.c){ out++; return; } // real well, wrong plate — do not record it
    var src=dest.wells[w];
    var cur=plate.wells[w]||(plate.wells[w]={});

// 384 uses rows past H or columns past 12; anything smaller is a 96.
function echoGuessFormat(dest){
  var mr=0, mc=0;
  Object.keys(dest.wells).forEach(function(w){ var rc=wellRC(w); if(!rc) return;
    mr=Math.max(mr,rc.r+1); mc=Math.max(mc,rc.c+1); });
  // '1536' is not in PLATE_FORMATS, so newPlate() silently fell back to 96 — the largest
  // picklist we can honestly hold becomes a 384, and the caller is told what was clipped.
  if(mr>16||mc>24) return '384';
  if(mr>8||mc>12) return '384';
  if(mr>6||mc>8) return '96';
  return '96';
}
// Experiment type from the Echo protocol name — HB20260504_BET.edr is a HiBiT run.
function echoGuessType(meta){
  var n=String((meta&&meta.protocol)||'').toUpperCase();
  if(/^HB|HIBIT/.test(n)) return 'HB';
  if(/^CTG|VIAB/.test(n)) return 'CTG';
  if(/^D2B|DTB/.test(n)) return 'D2B';
  if(/^NB|NANOBRET/.test(n)) return 'NB';
  if(/^WB/.test(n)) return 'WB';
  return null;
}

// ── Plate-reader values on the map ──────────────────────────────────────────────────────────
// Paste the reader's grid and see the numbers in their wells. An edge effect or a dead column
// is obvious here and invisible in a fitted curve, so this belongs before analysis, not after.
// The grid parser is Blueprint's pdParseValues, ported rather than reinvented.
function plParseValues(text,fmt){
  // Labbook's formats are {r,c}, not Blueprint's {rows,cols} — the port has to translate.
  var d=PLATE_FORMATS[String(fmt)]||PLATE_FORMATS['96'], cols=d.c, rl=PLATE_ROWS.slice(0,d.r);
  var lines=String(text||'').trim().split(/\r?\n/).filter(function(l){ return l.trim()!==''; });
  var grid=lines.map(function(l){ return l.split(/[\t,;]+/).map(function(x){ return x.trim(); }); });
  function isColHeader(c){
    var off=(/^[A-P]$/i.test(c[0]||'')||(c[0]||'')==='')?1:0;
    for(var i=0;i<cols;i++){ if(parseInt(c[off+i],10)!==i+1) return false; }
    return true;
  }
  if(grid.length&&(isColHeader(grid[0])||(isNaN(parseFloat(grid[0][0]))&&!/^[A-P]$/i.test(grid[0][0]||'')))) grid=grid.slice(1);
  var vals={}, n=0;
  grid.forEach(function(c,ri){
    var start=/^[A-P]$/i.test(c[0]||'')?1:0;
    var letter=start===1?c[0].toUpperCase():rl[ri];
    if(!letter||rl.indexOf(letter)<0) return;
    for(var i=0;i<cols;i++){ var raw=c[start+i], v=parseFloat(raw);
      if(raw!=null&&raw!==''&&!isNaN(v)){ vals[letter+(i+1)]=v; n++; } }
  });
  return n?vals:null;
}

      if(!v){ lbAlert('Could not read a value grid from that. Expected one row per plate row.',{title:'Plate values'}); return; }
      var ks=Object.keys(v).map(function(k){ return v[k]; });

// Selection
function plSetMode(mode){ PL.mode=mode||'paint'; PL.painted={}; plRenderSide(); }
function plPaintWell(id){ var p=plCur(); if(!p||PL.painted[id]) return; PL.painted[id]=1; PL.sel[id]=1;

  if(!(ev&&(ev.ctrlKey||ev.metaKey))) PL.sel={};

function plSelectCol(c,ev){ var p=plCur(); if(!p) return; var d=plateDims(p);
  if(!(ev&&(ev.ctrlKey||ev.metaKey))) PL.sel={};

function plSelectAll(){ var p=plCur(); if(!p) return; var d=plateDims(p); PL.sel={};

function plClearSel(){ PL.sel={}; PL.anchor=null; plRender(); }
// The selection is a single row or a single column (→ a dose series can run along it).
function plSelAxis(){ var ids=plSelIds(); if(ids.length<2) return null;
  var rs={}, cs={}; ids.forEach(function(id){ var x=wellRC(id); if(x){ rs[x.r]=1; cs[x.c]=1; } });
  if(Object.keys(rs).length===1) return 'row';
  if(Object.keys(cs).length===1) return 'col';
  return null; }

// Writing into wells
function _plWell(p,id){ if(!p.wells) p.wells={}; if(!p.wells[id]) p.wells[id]={typeId:PL.type}; return p.wells[id]; }

var PLATE_TYPE_COLORS=['#9fc3e8','#8fd3d8','#b9a9e0','#f4b98f','#f2a3a1','#d2d5dd',

function _plOwnTypes(p){

function plAddType(){

}
function plRenameType(id){

}
function plCycleTypeColor(id){

  var i=PLATE_TYPE_COLORS.indexOf(t.color);

}
function plDelType(id){
  var p=plCur(); if(!p) return; var ts=_plOwnTypes(p);

  var n=Object.keys(p.wells||{}).filter(function(k){ return p.wells[k] && p.wells[k].typeId===id; }).length;
  // Removing a type must not silently blank the record of what was in those wells: only the
  // colour goes, everything typed into them stays.
  lbConfirm(n ? ('“'+t.name+'” is used by '+n+' well'+(n===1?'':'s')+'. Removing it leaves those wells and everything written in them, but they lose their colour.')
              : ('Remove the well type “'+t.name+'”?'),
    {danger:true,title:'Remove well type',ok:'Remove'}).then(function(ok){
    if(!ok) return;
    p.types=ts.filter(function(x){ return x.id!==id; });
    Object.keys(p.wells||{}).forEach(function(k){ if(p.wells[k] && p.wells[k].typeId===id) delete p.wells[k].typeId; });
    if(PL.type===id) PL.type=(plateTypes(p)[0]||{}).id;
    platePersist(PL.key); plRender();
  });
}
function ctxPlType(ev,id){ ctxAt(ev,[
  {label:'Rename…',fn:function(){ plRenameType(id); }},
  {label:'Change colour',fn:function(){ plCycleTypeColor(id); }},
  {sep:true},{label:'Remove type',danger:true,fn:function(){ plDelType(id); }}
]); }
function plSetType(tid){ var p=plCur(); if(!p) return; PL.type=tid;
  plSelIds().forEach(function(id){ _plWell(p,id).typeId=tid; });
  platePersist(PL.key); plRender(); }
function plApplyFields(){ var p=plCur(), host=el('pl-side'); if(!p||!host) return;
  var ids=plSelIds(); if(!ids.length) return;
  host.querySelectorAll('[data-pf]').forEach(function(n){ var k=n.getAttribute('data-pf'), v=n.value;
    // Blank + placeholder "Mixed…" means "leave each well's own value alone".
    if(v===''&&n.placeholder==='Mixed…') return;
    ids.forEach(function(id){ var w=_plWell(p,id); if(v==='') delete w[k]; else w[k]=v; }); });
  platePersist(PL.key); plRenderGrid(); plRenderSum();
  var t=el('pl-count'); if(t) t.textContent=plateCount(p)+' / '+(plateDims(p).r*plateDims(p).c)+' wells used'; }
function plEraseSel(){ var p=plCur(); if(!p) return; plSelIds().forEach(function(id){ delete p.wells[id]; });
  platePersist(PL.key); plRender(); }
function plSetTitle(v){ var p=plCur(); if(!p) return; p.title=v; platePersist(PL.key); }
// Block labels
function plSelGroupLabel(){ var p=plCur(); if(!p) return ''; var ids=plSelIds(); if(!ids.length) return '';
  var v=null; for(var i=0;i<ids.length;i++){ var w=(p.wells||{})[ids[i]]||{};
    var lab=(w.groupId&&p.groups&&p.groups[w.groupId])?(p.groups[w.groupId].label||''):'';
    if(v===null) v=lab; else if(v!==lab) return null; }
  return v||''; }
function plGroupLabel(v){ var p=plCur(); if(!p) return; var ids=plSelIds(); if(ids.length<2) return;
  if(!String(v||'').trim()){ plUngroup(); return; }
  if(!p.groups) p.groups={};
  // Reuse the group if the selection already is one, so re-labelling doesn't orphan it.
  var cur=null, single=true;
  ids.forEach(function(id){ var g=((p.wells||{})[id]||{}).groupId||null; if(cur===null) cur=g; else if(cur!==g) single=false; });
  var gid=(single&&cur)?cur:('g'+Date.now().toString(36));
  ids.forEach(function(id){ _plWell(p,id).groupId=gid; });
  p.groups[gid]={label:String(v).trim()};
  _plGcGroups(p); platePersist(PL.key); plRender(); }
function plUngroup(){ var p=plCur(); if(!p) return;
  plSelIds().forEach(function(id){ var w=(p.wells||{})[id]; if(w) delete w.groupId; });
  _plGcGroups(p); platePersist(PL.key); plRender(); }
function _plGcGroups(p){ if(!p.groups) return; var live={};
  Object.keys(p.wells||{}).forEach(function(id){ var g=p.wells[id].groupId; if(g) live[g]=1; });
  Object.keys(p.groups).forEach(function(g){ if(!live[g]) delete p.groups[g]; }); }
// Shading
function plApplyShade(dir){ var p=plCur(); if(!p) return; var ids=plSelIds(); if(!ids.length) return;
  if(!dir){ ids.forEach(function(id){ var w=(p.wells||{})[id]; if(w) delete w.shade; }); platePersist(PL.key); plRender(); return; }
  var rs=[], cs=[]; ids.forEach(function(id){ var x=wellRC(id); if(x){ rs.push(x.r); cs.push(x.c); } });
  var lo, hi, byCol=(dir!=='down');
  if(byCol){ lo=Math.min.apply(null,cs); hi=Math.max.apply(null,cs); }
  else { lo=Math.min.apply(null,rs); hi=Math.max.apply(null,rs); }
  var span=Math.max(1,hi-lo);
  ids.forEach(function(id){ var x=wellRC(id); var pos=(byCol?x.c:x.r)-lo;
    var t=(dir==='left')?(1-pos/span):(pos/span);
    _plWell(p,id).shade=Math.round(t*0.8*1000)/1000; });
  platePersist(PL.key); plRender(); }
// Column headers
function plSetColTitle(v){ var p=plCur(); if(!p) return; p.colTitle=String(v||''); platePersist(PL.key); plRender(); }
function plSetColLabel(v){ var p=plCur(); if(!p) return; var cols={};
  plSelIds().forEach(function(id){ var x=wellRC(id); if(x) cols[x.c]=1; });
  var ks=Object.keys(cols); if(!ks.length) return;
  if(!p.colLabels) p.colLabels={};
  ks.forEach(function(c){ if(String(v||'').trim()) p.colLabels[c]=String(v).trim(); else delete p.colLabels[c]; });
  platePersist(PL.key); plRender(); }
// Write the dose series into the column headers instead of every well — the compact style
// where the concentration is stated once per column.
function plDoseToCols(dir){ var p=plCur(); if(!p) return; if(plSelAxis()!=='row') return;
  var ids=plSelIds().slice().sort(function(a,b){ return wellRC(a).c-wellRC(b).c; });
  if(dir<0) ids.reverse();
  var fold=+((el('pl-dose-fold')||{}).value)||3;
  var top=_toNM((el('pl-dose-top')||{}).value,(el('pl-dose-unit')||{}).value||'nM');
  if(!p.colLabels) p.colLabels={};
  if(!p.colTitle) p.colTitle=(el('pl-dose-unit')||{}).value||'nM';
  var unit=p.colTitle;
  ids.forEach(function(id,i){ var nM=top/Math.pow(fold,i);
    p.colLabels[wellRC(id).c]=_cn(unit==='µM'?nM/1e3:(unit==='mM'?nM/1e6:nM)); });
  platePersist(PL.key); plRender();
  toast(ids.length+' column headers written'); }
// Switching format keeps every well that still fits the new grid (Blueprint wipes them — don't).
function plSetFormat(f){ var p=plCur(); if(!p) return; var d=PLATE_FORMATS[String(f)]; if(!d) return;
  var kept={}, lost=0;
  Object.keys(p.wells||{}).forEach(function(id){ var x=wellRC(id);
    if(x&&x.r<d.r&&x.c<d.c) kept[id]=p.wells[id]; else lost++; });
  p.format=String(f); p.wells=kept; PL.sel={}; PL.anchor=null;
  platePersist(PL.key); plRender();
  if(lost) toast(lost+' well'+(lost!==1?'s':'')+' fell outside the '+f+'-well grid and '+(lost!==1?'were':'was')+' dropped'); }
// Concentration formatting — nM/µM/mM chosen automatically as the series steps down.
function _toNM(v,unit){ return (+v||0)*(unit==='mM'?1e6:(unit==='µM'?1e3:1)); }
function _cn(x){ var v=+x; if(!isFinite(v)) return '0';
  var s=(v>=100)?v.toFixed(0):((v>=10)?v.toFixed(1):v.toFixed(2));
  return s.indexOf('.')<0?s:s.replace(/0+$/,'').replace(/\.$/,''); }
// Steps right down to fM so a long series never collapses to "0 nM".
function _fmtConc(nM){ if(!isFinite(nM)||nM<=0) return '0';
  if(nM>=1e6) return _cn(nM/1e6)+' mM';
  if(nM>=1e3) return _cn(nM/1e3)+' µM';
  if(nM>=1)   return _cn(nM)+' nM';
  if(nM>=1e-3)return _cn(nM*1e3)+' pM';

function plApplyDose(dir){ var p=plCur(); if(!p) return; var axis=plSelAxis(); if(!axis) return;
  var ids=plSelIds().slice(); var fold=+((el('pl-dose-fold')||{}).value)||3;
  var top=_toNM((el('pl-dose-top')||{}).value,(el('pl-dose-unit')||{}).value||'nM');
  ids.sort(function(a,b){ var A=wellRC(a), B=wellRC(b); return axis==='row'?(A.c-B.c):(A.r-B.r); });
  if(dir<0) ids.reverse();
  ids.forEach(function(id,i){ var fresh=!(p.wells||{})[id]; var w=_plWell(p,id);
    // Wells you hadn't touched become "Dose series"; ones you already typed keep their type.
    if(fresh||!w.typeId||w.typeId==='blank') w.typeId='dose';
    w.conc=_fmtConc(top/Math.pow(fold,i)); });
  platePersist(PL.key); plRender();
  toast(ids.length+'-point series, '+fold+'-fold, from '+_fmtConc(top)); }
// Drag-select ends wherever the mouse comes up, even outside the grid.
document.addEventListener('mouseup',function(){ if(PL.drag){ PL.drag=false; plRenderSide(); } });
// Touch: mouseenter never fires, and there is no shift/ctrl on a phone, so without this you
// can only ever select one well at a time. Drag across the grid to paint a selection.
(function(){
  function wellAt(t){ if(!t) return null; var n=document.elementFromPoint(t.clientX,t.clientY);
    n=n&&n.closest?n.closest('.pl-w[data-w]'):null; return n?n.getAttribute('data-w'):null; }
  var grid=null;
  document.addEventListener('touchstart',function(e){
    var g=e.target.closest&&e.target.closest('#pl-grid'); if(!g) return;
    var id=wellAt(e.touches[0]); if(!id) return;
    grid=g; e.preventDefault();
    // A fresh touch starts a new selection unless "add" mode is on (the range toggle).
    if(!PL.touchAdd) PL.sel={};
    PL.sel[id]=1; PL.anchor=id; PL.painted={}; PL.drag=true;
    if(PL.mode==='paint'||PL.mode==='erase') plPaintWell(id);
    plRenderGrid();
  },{passive:false});
  document.addEventListener('touchmove',function(e){
    if(!PL.drag||!grid) return; e.preventDefault();
    var id=wellAt(e.touches[0]); if(id&&!PL.sel[id]){ if(PL.mode==='paint'||PL.mode==='erase') plPaintWell(id); else PL.sel[id]=1; plRenderGrid(); }
  },{passive:false});
  document.addEventListener('touchend',function(){
    if(!PL.drag) return; PL.drag=false; grid=null; plRenderSide();
  });
})();
function plToggleTouchAdd(){ PL.touchAdd=!PL.touchAdd; plRenderSide(); }
document.addEventListener('keydown',function(ev){
  if(!PL.key||!el('plate-modal').classList.contains('open')) return;
  if(ev.key==='Escape'){ if(plSelIds().length) plClearSel(); else closePlateEditor(); }
  else if((ev.key==='Delete'||ev.key==='Backspace')&&plSelIds().length&&!/^(INPUT|SELECT|TEXTAREA)$/.test((ev.target.tagName||''))){ ev.preventDefault(); plEraseSel(); }
});

if(!LB.data.planner||typeof LB.data.planner!=='object') LB.data.planner={tasks:{}};

Object.keys(LB.data.experiments).forEach(function(k){ var e=LB.data.experiments[k];
  if(e.projectId && !e.sectionId){ var p=LB.data.projects.filter(function(x){return x.id===e.projectId;})[0];
    if(p){ var u=(p.sections||[]).filter(function(s){return s.name==='Unclassified';})[0];
      if(!u){ u={id:uid(),name:'Unclassified',created:Date.now()}; p.sections.push(u); } e.sectionId=u.id; } } });
// One-time backfill of the explicit `done` flag. Carry-over used to be inferred from unticked
// checkboxes; every template block ships with a checklist, so without this every historical
// step in an existing notebook would land in carry-over on the first load after the upgrade.
// Anything already past the lookback window is treated as settled.
if(!LB.data._doneV1){
  var _cutoff=addDays(todayStr(),-CARRY_LOOKBACK_DAYS);
  Object.keys(LB.data.experiments).forEach(function(k){ var e=LB.data.experiments[k];
    (e.blocks||[]).forEach(function(b){
      if(b.done!==undefined) return;
      // Old enough to be history, or its checklist is fully ticked → done.
      b.done = (!b.date || b.date<_cutoff) ? true : !_legacyHasUnchecked(b.html);
      b.completedAt = b.done?(e.updated||Date.now()):null;
    });
    if(e.status==='done') (e.blocks||[]).forEach(function(b){ if(b.done===false){ b.done=true; b.completedAt=e.updated||Date.now(); } });
  });
  LB.data._doneV1=true;
}
// Only used by the migration above, to read the pre-existing checkbox state once.
function _legacyHasUnchecked(html){
  if(!html || html.indexOf('lb-check')<0) return false;
  try{ var d=document.createElement('div'); d.innerHTML=html;
    var lis=d.querySelectorAll('ul.lb-check > li, ul.lb-check ul > li');
    for(var i=0;i<lis.length;i++){ if(!lis[i].classList.contains('done')) return true; }
  }catch(e){}
  return false;
}
// preset instantiation from a seed (carries live calculators)
function presetFromSeed(seed,name,baseType){ return {name:name,baseType:baseType,title:seed.title,blocks:(seed.blocks||[]).map(function(b){ var o={dayOffset:b.d,title:b.title,html:b.html}; if(b.pub) o.pub=b.pub; if(b.calc) o.calc=JSON.parse(JSON.stringify(b.calc)); return o; })}; }
function seedPresets(){
  // One-time upgrade: refresh built-in presets to the calc-enabled, correctly-dated versions.
  // (Only rewrites the built-in type presets; user-added custom presets are never touched.)
  // A version bump used to overwrite every built-in preset unconditionally, edits included.
  // That was survivable while the only way to change one was to edit the file; it is not now
  // that the preset editor has a Methods box in it. From this version on a built-in carries the
  // same signature the extra presets do: bump it and an untouched preset is refreshed, while one
  // you have changed is left alone. (This upgrade itself is still a blunt refresh — no built-in
  // can have been edited through the new field before the field existed — and it is what stamps
  // the signatures that make every later bump safe.)
  var upgrade=!LB.data._presetV5;
  EXP_TYPES.forEach(function(t){
    var cur=LB.data.presets[t.id];
    var edited = cur && cur._seedSig && cur._seedSig!==_presetSig(cur);
    if(!cur || (upgrade && !edited)){
      var s=PRESET_SEED[t.id]||PRESET_SEED.EXP;
      var np=presetFromSeed(s,(cur&&cur.name)||t.name,t.id);
      np._seedSig=_presetSig(np);
      LB.data.presets[t.id]=np;
    } else {
      if(!cur.baseType) cur.baseType=t.id;
      if(!cur._seedSig) cur._seedSig=_presetSig(cur);   // stamp what is there, whatever it is
    }
  });
  if(upgrade) LB.data._presetV5=true;
  // The one-time flag meant a preset added later could never reach an existing notebook. The
  // inner check is what makes this safe to run every load: it only fills in what is missing and
  // never touches a preset you have edited.
  // An untouched seeded preset follows the seed; one you have edited is yours. The signature is
  // stamped at seed time and compared against the preset as it stands, so "has the user touched
  // this" is answered by the data rather than guessed — which is what lets a correction reach a
  // notebook that already has the preset. A block's prose and its calculator disagreeing (80 ng
  // total in the text, 81.6 ng in the table) is exactly the case that needs it.
  Object.keys(EXTRA_PRESET_SEED).forEach(function(k){
    var s=EXTRA_PRESET_SEED[k], cur=LB.data.presets[k];
    // A preset seeded before signatures existed carries none, and "no signature" cannot mean
    // "untouched" — that would overwrite real edits. The one exception is stamped explicitly:
    // NanoBRET_SPARK_Reverse_96 shipped this morning with `ngPerWell` in its calculator, so a
    // stored copy carrying that key can only be that build's, and its prose says 80 ng total
    // while its own table says 81.6.
    if(cur && !cur._seedSig && k==='NB_SPARK_RTX96'
       && cur.blocks && cur.blocks[0] && cur.blocks[0].calc && cur.blocks[0].calc.inputs
       && cur.blocks[0].calc.inputs.ngPerWell!=null) cur=null;
    // The general form of that exception. A preset seeded before signatures existed carries no
    // stamp, and "no stamp" cannot mean "untouched" — but it can be *proved* untouched: if its
    // title and every block's title and html are letter-for-letter what an earlier seed
    // produced, nobody has edited it, and a correction is safe to deliver. Without this, every
    // notebook older than the stamp is frozen on whatever it was first given.
    if(cur && !cur._seedSig && _seedUnedited(cur,s)) cur=null;
    if(cur && !(cur._seedSig && cur._seedSig===_presetSig(cur))) return;   // edited — leave it
    var np={name:s.name,baseType:s.baseType,title:s.title,
      blocks:s.blocks.map(function(b){ var o={dayOffset:b.d,title:b.title,html:b.html};
        if(b.pub) o.pub=b.pub;
        if(b.calc) o.calc=JSON.parse(JSON.stringify(b.calc)); return o; })};
    if(s.setup) np.setup=JSON.parse(JSON.stringify(s.setup));
    // A curated preset may also answer "does this assay have a plate map" and "which one".
    // They are copied onto the stored preset so nothing has to consult the seed table at
    // creation time — presetSetupHide already falls back to the seed, and these follow it.
    if(s.setupHide) np.setupHide=s.setupHide.slice();
    if(s.plateOn!=null) np.plateOn=!!s.plateOn;
    if(s.layout) np.layout=s.layout;
    np._seedSig=_presetSig(np);
    LB.data.presets[k]=np;
  });
}
// Same shape, same words: the block list matches the seed except for fields the seed has since
// gained (pub, and anything added later). Calculator *inputs* are deliberately not compared —
// they are the numbers, and a preset whose prose is untouched but whose defaults moved is still
// the shipped preset.
function _seedUnedited(cur,seed){
  try{
    var a=cur.blocks||[], b=seed.blocks||[];
    if(a.length!==b.length) return false;
    if(String(cur.title||'')!==String(seed.title||'')) return false;
    for(var i=0;i<a.length;i++){
      if(String(a[i].title||'')!==String(b[i].title||'')) return false;
      if(String(a[i].html||'')!==String(b[i].html||'')) return false;
      if((a[i].dayOffset||0)!==(b[i].d||0)) return false;
    }
    return true;
  }catch(e){ return false; }
}
// preset key helpers (built-in types + user-added custom presets)
function isBuiltinPreset(k){ return EXP_TYPES.some(function(t){return t.id===k;}); }
function allPresetKeys(){ var built=EXP_TYPES.map(function(t){return t.id;}).filter(function(k){return LB.data.presets[k];}); var custom=Object.keys(LB.data.presets).filter(function(k){return !isBuiltinPreset(k);}).sort(function(a,b){ return ((LB.data.presets[a].name||a)).localeCompare(LB.data.presets[b].name||b); }); return built.concat(custom); }
// A curated preset can declare its own plate map and the layout to start it from — the type's
// default answers for the generic version of the assay, which is still the right default for it.
function presetPlateOn(key,S){ var p=LB.data.presets[key], sd=EXTRA_PRESET_SEED[key];
  var v=(p&&p.plateOn!=null)?p.plateOn:((sd&&sd.plateOn!=null)?sd.plateOn:null);
  return v!=null?!!v:!!(S&&S.plateOn); }
function presetLayout(key,fmt){ var p=LB.data.presets[key], sd=EXTRA_PRESET_SEED[key];
  var id=(p&&p.layout)||(sd&&sd.layout); if(!id) return null;
  var L=PLATE_LAYOUTS.filter(function(x){ return x.id===id; })[0]||null;
  // A layout drawn for a 96-well plate is not a starting point for a 384 one: if the setup
  // moved the format, a blank plate of the right size is the honest answer.
  if(L&&fmt!=null&&String(L.format)!==String(fmt)) return null;
  return L; }
function presetBase(k){ var p=LB.data.presets[k]; return (p&&p.baseType)||k; }
// presets seed / refresh (adds RTX for existing users)
seedPresets();

function maybeSeed(){
  // The Antibodies section used to be re-inserted here on every load if missing, so deleting it
  // did nothing — it came straight back. The catalogue lives in Archive's Library now, and a
  // book that still has the old section can simply be deleted like any other section.
  if(LB.data._seeded) return false;
  if(LB.data.projects.length||Object.keys(LB.data.experiments).length||LB.data.generalSections.length||Object.keys(LB.data.pages).length){ LB.data._seeded=true; return false; }
  SEED_GENERAL.forEach(function(g){ LB.data.generalSections.push({id:uid(),name:g.name,kind:g.kind,created:Date.now()}); });
  SEED_PROJECTS.forEach(function(sp,i){ var p={id:uid(),name:sp.name,created:Date.now(),color:PROJ_COLORS[i%PROJ_COLORS.length],sections:[]};
    sp.sections.forEach(function(sn){ p.sections.push({id:uid(),name:sn,created:Date.now()}); }); LB.data.projects.push(p); });
  LB.data._seeded=true; return true;
}
// ── The Antibodies section people still see ─────────────────────────────────────────────────
// It is data, not code. An older seed created it; the seed stopped, but every notebook that
// already had one kept it, and nothing ever took it away. The catalogue lives in Archive's
// Library now, so an *empty* one is just a dead tab and goes. One that has pages in it is
// somebody's writing — that stays, and says where the catalogue went instead.
function cleanupAntibodySection(){
  if(LB.data._abSecCleaned) return;
  var secs=(LB.data.generalSections||[]).filter(function(sc){
    return sc.kind==='antibodies' || /^antibod(y|ies)$/i.test(String(sc.name||'').trim());
  });
  if(!secs.length){ LB.data._abSecCleaned=true; return; }
  var pages=LB.data.pages||{}, removed=0;
  secs.forEach(function(sc){
    var has=Object.keys(pages).some(function(k){ return pages[k].sectionId===sc.id; });
    if(has) return;
    LB.data.generalSections=LB.data.generalSections.filter(function(x){ return x.id!==sc.id; });
    if(SEL && SEL.node && SEL.node.sectionId===sc.id) SEL={node:{kind:'notebook',projectId:null,sectionId:null},page:null};
    removed++;
  });
  LB.data._abSecCleaned=true;
  save();
  if(removed){ renderAll(); toast('Removed the empty Antibodies section — the catalogue is in Archive → Library'); }
}

var _lbFbRef=null;
function lbFb(){ if(_lbFbRef!==null) return _lbFbRef; try{ if(window.parent && window.parent.firebase){ _lbFbRef=window.parent.firebase.database().ref('journal/labbook'); } else _lbFbRef=undefined; }catch(e){ _lbFbRef=undefined; } return _lbFbRef; }
var _syncT=null,_adopting=false,_synced=true;
// The local write and the cloud write are different promises and must be reported separately.
// They were not: save()'s .catch() called setSync(true), so a rejected r.set() rendered as
// "Saved ✓ / Saved and synced". The work WAS on this device — that part was true — but the
// pill claimed a durability that had just failed. _cloudFailed carries the difference.
var _cloudFailed=false;
function setSync(ok,cloudOk){ _synced=ok; if(cloudOk!==undefined) _cloudFailed=!cloudOk; updateStatus(); }
// True only when there is a real cloud target. Standalone there is none, and the status pill
// must not claim otherwise — "Saved and synced" on a build that syncs nowhere is the kind of
// false durability promise that loses somebody's data.
function hasCloud(){ return !!lbFb(); }
function updateStatus(){ var p=el('lb-status'); if(!p) return; var txt=el('lb-status-txt'); var on=navigator.onLine;
  // Backup state sits beside save state, not inside a ribbon button: this is the one place you
  // already look to find out whether your work is safe.
  var bn=el('lb-backup-note');
  if(bn){ var bs=backupStatus(); bn.textContent=bs.text; bn.title=bs.detail+' Back up now · right-click for the folder'; }
  p.classList.remove('online','offline','saving');
  // A storage failure outranks everything else — never show "Saved ✓" when it isn't true.
  if(_storageBroken){ p.classList.add('offline'); if(txt) txt.textContent='Not saved!'; p.title='Browser storage rejected a write — see the warning. Export a backup now.'; return; }
  if(!hasCloud()){
    // No cloud configured at all (standalone build): saved, but only here.
    p.classList.add(_synced?'online':'saving');
    if(txt) txt.textContent=_synced?'Saved on this device':'Saving…';
    p.title=_synced?'Saved to this browser. There is no cloud sync in this build — use Backup to move your notebook between machines.':'Saving to this browser…';
    return;
  }
  if(!on){ p.classList.add('offline'); if(txt) txt.textContent='Offline'; p.title='Offline — changes saved locally'; }
  else if(_synced && _cloudFailed){
    // Saved here, not saved there. Say the smaller true thing rather than the bigger false one.
    p.classList.add('offline'); if(txt) txt.textContent='Saved on this device';
    p.title='Saved to this browser, but the cloud write was rejected — this notebook is not synced right now. Export a backup if it persists.';
  }
  else if(_synced){ p.classList.add('online'); if(txt) txt.textContent='Saved ✓'; p.title='Saved and synced'; }
  else { p.classList.add('saving'); if(txt) txt.textContent='Saving…'; p.title='Saving changes…'; }
}
var _lsT=null,_lsDirty=false;
function _flushLocal(){ if(!_lsDirty) return; _lsDirty=false; clearTimeout(_lsT); _lsT=null;
  try{ localStorage.setItem('hub_labbook', JSON.stringify(LB.data)); }
  // Silently dropping this means the notebook stops persisting and nobody finds out until a
  // reload wipes the day's work. Always surface it.
  catch(e){ _storageFailed(e); } }
// ── Cloud sync: per record, not the whole notebook ──────────────────────────────────────────
// save() used to r.set(LB.data) — the entire tree, every 1.2 s. Two people, or two tabs, meant
// last-writer-wins over everything: you did not lose the paragraph you were both editing, you
// lost every experiment the other person had touched since your page loaded. And lbInitSync
// read once at load and never listened, so neither side ever found out.
//
// Nothing at the ~200 save() call sites changes. The unit of a write is derived here by
// comparing a per-record fingerprint against what we last knew the cloud to hold, so only the
// records that actually moved are sent, as one multi-path update().
var _cloudSeen=null;      // path -> JSON string, as last written or received
var _cloudOn=false;

// Firebase path segments cannot contain . # $ [ ] or /. Ids from uid() and ISO dates are safe,
// but a key from an older import might not be, and a bad path fails the WHOLE update.
function _pathOk(k){ return !!k && !/[.#$\[\]\/]/.test(k); }

var _CLOUD_ROOTS=['projects','generalSections','tags','presets','antibodies','attachments','planner','protoDays','_extraPresets','_seeded'];
var _CLOUD_MAPS=['experiments','notebook','pages'];
var _cloudSkipWarned=false;
function _cloudFingerprint(){
  var m={}, skipped=[];
  _CLOUD_ROOTS.forEach(function(k){ if(LB.data[k]!==undefined) m[k]=JSON.stringify(LB.data[k]); });
  _CLOUD_MAPS.forEach(function(coll){
    var o=LB.data[coll]||{};
    Object.keys(o).forEach(function(id){
      if(_pathOk(id)) m[coll+'/'+id]=JSON.stringify(o[id]);
      else skipped.push(coll+'/'+id);
    });
  });
  // A record whose id cannot be a Firebase path can never sync. Saying nothing would make it
  // a record that looks saved on this device and quietly exists nowhere else.
  if(skipped.length && !_cloudSkipWarned && hasCloud()){
    _cloudSkipWarned=true;
    _remoteNote=(skipped.length===1
      ? '1 record cannot sync — its id contains characters a cloud path cannot hold ('+esc(skipped[0])+'). It is safe on this device and in backups.'
      : skipped.length+' records cannot sync — their ids contain characters a cloud path cannot hold (e.g. '+esc(skipped[0])+'). They are safe on this device and in backups.');
    try{ _cloudBanner(); }catch(e){}
  }
  return m;
}
// Records that changed since the last successful write. A record that disappeared is sent as
// null, which is how Firebase spells "delete this child" in a multi-path update.
function _cloudDelta(now){
  var out={}, n=0;
  Object.keys(now).forEach(function(p){ if(!_cloudSeen || _cloudSeen[p]!==now[p]){ out[p]=JSON.parse(now[p]); n++; } });
  if(_cloudSeen) Object.keys(_cloudSeen).forEach(function(p){ if(now[p]===undefined){ out[p]=null; n++; } });
  return n?out:null;
}
function _cloudPush(){
  var r=lbFb(); if(!r){ setSync(true,true); return; }
  var now=_cloudFingerprint();
  var delta=_cloudDelta(now);
  if(!delta){ setSync(true,true); return; }
  delta.updated=LB.data.updated||Date.now();
  try{
    r.update(delta).then(function(){
      // Only now is this what the cloud holds. Recording it before the write lands would make
      // a failed write invisible to the next diff, and the record would never be retried.
      _cloudSeen=now; setSync(true,true);
    }).catch(function(){ setSync(true,false); });
  }catch(e){ setSync(true,false); }
}

// ── Hearing about someone else's change ─────────────────────────────────────────────────────
// Applying a remote record to the one you have open would move the caret out from under you —
// the same reason lbWatchCultures patches a single node instead of re-rendering. So: apply it
// to the data always, re-render only when you are not standing on it, and say so when you are.
var _remoteNote=null;
function _openRecordPath(){
  var k=SEL.node&&SEL.node.kind;
  if(SEL.page && LB.data.experiments[SEL.page]) return 'experiments/'+SEL.page;
  if(SEL.page && LB.data.pages[SEL.page]) return 'pages/'+SEL.page;
  if(k==='journal'||k==='today'||k==='notebook'){ var D=SEL.page||DAY_VIEW||todayStr(); return 'notebook/'+D; }
  return null;
}
function _applyRemote(coll,id,val){
  var path=coll+'/'+id;
  var incoming=val==null?undefined:JSON.stringify(val);
  // Our own write coming back. Nothing to do, and re-rendering on it would make every
  // keystroke's round trip repaint the screen.
  if(_cloudSeen && _cloudSeen[path]===incoming) return;
  // A record we have edited since our last successful push. Theirs must not silently win.
  var mine=LB.data[coll] && LB.data[coll][id]!==undefined ? JSON.stringify(LB.data[coll][id]) : undefined;
  var dirty=_cloudSeen ? (_cloudSeen[path]!==mine) : (mine!==undefined);
  if(dirty && incoming!==undefined){
    _remoteNote='This record was changed elsewhere too. Your version is kept here; export a backup before merging.';
    _cloudBanner();
    return;
  }
  if(val==null){ if(LB.data[coll]) delete LB.data[coll][id]; }
  else { LB.data[coll]=LB.data[coll]||{}; LB.data[coll][id]=val; }
  if(_cloudSeen) { if(incoming===undefined) delete _cloudSeen[path]; else _cloudSeen[path]=incoming; }
  _lsDirty=true; clearTimeout(_lsT); _lsT=setTimeout(_flushLocal,150);
  if(_openRecordPath()===path){
    _remoteNote='Updated elsewhere — reopen this entry to see the new version.';
    _cloudBanner();
  } else {
    renderAll();
  }
}
function _cloudBanner(){
  var b=el('lb-remote');
  if(!b){ b=document.createElement('div'); b.id='lb-remote'; b.className='lb-remote';
    b.onclick=function(){ b.remove(); }; document.body.appendChild(b); }
  b.textContent=_remoteNote||'';
  clearTimeout(b._t); b._t=setTimeout(function(){ if(b.parentNode) b.remove(); }, 9000);
}
function _cloudListen(r){
  if(_cloudOn) return; _cloudOn=true;
  _CLOUD_MAPS.forEach(function(coll){
    var c=r.child(coll);
    try{
      c.on('child_changed',function(s){ _applyRemote(coll,s.key,s.val()); });
      c.on('child_added',  function(s){ _applyRemote(coll,s.key,s.val()); });
      c.on('child_removed',function(s){ _applyRemote(coll,s.key,null); });
    }catch(e){}
  });
}

function save(){
  if(_adopting) return;
  LB.data.updated=Date.now();
  // Coalesce the (potentially large) full-tree stringify: a burst of save() calls from a
  // multi-step structural op serialises once. Keystrokes already arrive via queueSave (600ms).
  _lsDirty=true; clearTimeout(_lsT); _lsT=setTimeout(_flushLocal,150);
  setSync(false); clearTimeout(_syncT);
  // No cloud configured is not a cloud failure; hasCloud() renders that case.
  _syncT=setTimeout(function(){ _flushLocal(); _cloudPush(); }, 1200);
}
// Never lose a pending local write if the tab is hidden/closed before the 150ms flush.
window.addEventListener('pagehide',_flushLocal);
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') _flushLocal(); });
function lbInitSync(){
  var r=lbFb(); if(!r) return;
  try{ r.once('value').then(function(s){
    var v=s.val();
    var remoteHas = v && ((v.projects||[]).length || Object.keys(v.experiments||{}).length || (v.generalSections||[]).length || Object.keys(v.pages||{}).length || Object.keys(v.notebook||{}).length);
    if(v && typeof v==='object' && remoteHas && (v.updated||0) > (LB.data.updated||0)){
      // Adoption replaces the local tree wholesale, so anything done offline since the last
      // successful push is about to be overwritten. Take a snapshot first: it costs nothing
      // and it is the difference between "the cloud won" and "the work is gone".
      try{ _snapshotBackup(); }catch(e){}
      _adopting=true;
      // The reconstruction below names every key it keeps, so anything not on that list —
      // one-time migration flags like _abMigrated and _abSecCleaned, and any key a newer build
      // adds — was dropped on every adopt, and the migrations then ran again. Carry the rest
      // across first, then let the named keys overwrite what they cover.
      var _carry={}; Object.keys(LB.data).forEach(function(k){ _carry[k]=LB.data[k]; });
      Object.keys(v).forEach(function(k){ _carry[k]=v[k]; });
      LB.data=Object.assign(_carry,{projects:v.projects||[],generalSections:v.generalSections||[],experiments:v.experiments||{},pages:v.pages||{},notebook:v.notebook||{},tags:v.tags||[],presets:v.presets||LB.data.presets,antibodies:v.antibodies||{},attachments:v.attachments||{},planner:(v.planner&&typeof v.planner==='object'&&v.planner.tasks)?v.planner:{tasks:{}},protoDays:v.protoDays||{},_seeded:(v._seeded===undefined?true:v._seeded),_extraPresets:v._extraPresets,updated:v.updated||Date.now()});
      LB.data.projects.forEach(function(p,i){ p.sections=p.sections||[]; if(!p.color) p.color=PROJ_COLORS[i%PROJ_COLORS.length]; });
      seedPresets();
      try{ localStorage.setItem('hub_labbook',JSON.stringify(LB.data)); }catch(e){}
      _adopting=false; maybeSeed(); renderAll();
    }
    // What we now believe the cloud holds. Without this the first push after load would send
    // the whole tree again and undo whatever arrived in between.
    _cloudSeen=_cloudFingerprint();
    setSync(true,true);
    _cloudListen(r);
  }).catch(function(){ setSync(true,false); }); }catch(e){}
}

// ── Pages ──
function isCoded(e){ return e.kind!=='note'; }
function allBlockDates(){ var set={}; Object.keys(LB.data.experiments).forEach(function(k){ (LB.data.experiments[k].blocks||[]).forEach(function(b){ if(b.date) set[b.date]=1; }); }); return set; }
function blocksForDate(D){ var out=[]; Object.keys(LB.data.experiments).forEach(function(k){ var e=LB.data.experiments[k]; if(expArchived(e)) return; (e.blocks||[]).forEach(function(b){ if(b.date===D) out.push({exp:e,block:b}); }); }); return out; }
// A block is "unfinished" if it holds a checklist item that isn't ticked (done).
// ── Step completion ──
// A step is done when you say so — `b.done` is set explicitly, never inferred from
// checkboxes. Every template block ships with a checklist, so inference made every
// experiment permanently "unfinished" and grew the carry-over list without bound.
// It also lets a prose-only step be completed, which inference could never express.
function blockFinder(expId,blockId){
  var e=LB.data.experiments[expId]; if(!e) return null;
  var b=(e.blocks||[]).filter(function(x){return x.id===blockId;})[0];
  return b?{exp:e,block:b}:null;
}
function setBlockDone(expId,blockId,done,silent){
  var f=blockFinder(expId,blockId); if(!f) return;
  f.block.done=!!done; f.block.completedAt=done?Date.now():null;
  syncExpStatus(f.exp); f.exp.updated=Date.now(); save();
  if(!silent) renderAll();
  if(done && !silent) _offerSlip(expId,blockId);
}
// ── The slip ───────────────────────────────────────────────────────────────────────────────
// The failure mode of a multi-day experiment: you do Tuesday's step on Thursday, tick it, and
// every step after it is still scheduled from a day that did not happen. Nothing said so, and
// two days later the plate is read 48 h early.
//
// snoozeBlock already moves a step and everything after it, preserving the spacing. This is the
// same move, offered by the fact instead of waiting for you to remember — and it is an offer,
// never automatic: a step ticked late is often a step you did on time and recorded later.
function _laterUndone(e,b){
  return (e.blocks||[]).filter(function(x){ return x.id!==b.id && x.date && b.date && x.date>=b.date && !x.done; });
}
function _offerSlip(expId,blockId){
  var e=LB.data.experiments[expId]; if(!e) return;
  var b=(e.blocks||[]).filter(function(x){return x.id===blockId;})[0];
  if(!b||!b.date||b.slipAsked) return;
  var slip=daysBetween(b.date, todayStr());
  if(!slip) return;                              // done on the day it was planned for
  if(slip<0) return;                             // done early: nothing downstream is at risk yet
  var later=_laterUndone(e,b);
  if(!later.length) return;                      // it was the last step
  b.slipAsked=true; save();
  var next=later.slice().sort(function(x,y){ return (x.date||'').localeCompare(y.date||''); })[0];
  lbConfirm('<b>'+esc(b.title||'This step')+'</b> was planned for '+esc(fmtDate(b.date))
    +' and ticked today — <b>'+slip+' day'+(slip===1?'':'s')+' later</b>.<br><br>'
    +'The '+later.length+' step'+(later.length===1?'':'s')+' after it '+(later.length===1?'is':'are')
    +' still dated from the original plan, so <b>'+esc(next.title||'the next step')+'</b> is due '
    +esc(fmtDate(next.date))+'. Move them all forward by '+slip+' day'+(slip===1?'':'s')
    +' to keep the intervals you designed?<br><br>'
    +'<span class="cc-dim">Say no if you did the work on time and are only recording it now.</span>',
    {title:'This step slipped', ok:'Move the rest', html:true}).then(function(ok){
      if(!ok){ toast('Left as planned'); return; }
      var moved=0;
      (e.blocks||[]).forEach(function(x){ if(x.id!==b.id && x.date && x.date>=b.date && !x.done){ x.date=addDays(x.date,slip); moved++; } });
      recomputeDayOffsets(e); e.updated=Date.now(); save(); renderAll();
      toast(moved+' step'+(moved===1?'':'s')+' moved — next is '+fmtDate(_laterUndone(e,b).sort(function(x,y){return (x.date||'').localeCompare(y.date||'');})[0].date));
    });
}
function toggleDone(expId,blockId){
  var f=blockFinder(expId,blockId); if(!f) return;
  setBlockDone(expId,blockId,!f.block.done);
}
// carryoverForDate looks back CARRY_LOOKBACK_DAYS and no further, which is right for a list you
// read every morning — three weeks of misses would be noise. But a step that falls off the back
// of that window has not been done and nothing anywhere said so again. The experiment itself is
// where that belongs: it is the thing that is stuck.
function expOverdue(e){
  if(!e || expArchived(e) || e.status==='abandoned' || e.status==='paused') return null;
  var T=todayStr(), late=(e.blocks||[]).filter(function(b){ return b.date && b.date<T && !b.done; });
  if(!late.length) return null;
  late.sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
  return {n:late.length, oldest:late[0].date, days:daysBetween(late[0].date,T), blocks:late};
}
function expProgress(e){
  var bs=(e.blocks||[]); var done=0;
  bs.forEach(function(b){ if(b.done) done++; });
  return {done:done,total:bs.length};
}
// Status used to be a manual dropdown that silently drifted out of truth. Derive it from the
// steps instead, so "ongoing" always means what it says. With no steps done we leave the
// status alone — that's the one case where the user's own choice carries information.
// planned/ongoing/done are derived from the steps. paused and abandoned never can be — no
// pattern of ticks means "we stopped". Without them an experiment that ended early stayed
// "ongoing" for ever: in Home's running list, in the project counter, and nagging from
// carry-over for 21 days before vanishing unresolved.
var EXP_STATUSES=['planned','ongoing','paused','done','abandoned'];
// States that are a decision rather than a consequence. Derivation must not overwrite these,
// which is what silently reverted a manually-set "done" on the next step you ticked.
var EXP_DECIDED={paused:1,abandoned:1,done:1};
// Archived is not a status: a finished experiment and an abandoned one are both worth filing
// away, and both keep whatever they ended as. It only means "stop putting this in front of me".
function expArchived(e){ return !!(e && e.archived); }
// Live = still expected to produce work. The single predicate every time-based view asks.
function expLive(e){ return isCoded(e) && !expArchived(e) && e.status==='ongoing'; }
function syncExpStatus(e){
  if(!e || !isCoded(e) || !(e.blocks||[]).length) return;
  if(e.statusLocked || expArchived(e)) return;   // you said so; do not argue with it
  var p=expProgress(e);
  if(!p.total || !p.done) return;
  e.status = (p.done===p.total) ? 'done' : 'ongoing';
}
// Set from the UI. Choosing a decided state locks it; going back to planned/ongoing hands
// control back to the steps.
function setExpStatus(id,st){
  var e=LB.data.experiments[id]; if(!e) return;
  if(EXP_STATUSES.indexOf(st)<0) return;
  e.status=st;
  e.statusLocked = !!EXP_DECIDED[st];
  e.updated=Date.now(); save(); renderAll();
}
function setExpArchived(id,on){
  var e=LB.data.experiments[id]; if(!e) return;
  e.archived=!!on; e.updated=Date.now(); save(); renderAll();
  toast(on ? 'Archived — out of Home, the planner and the counters. Still in Experiments and in reports.'
           : 'Unarchived.');
}
// Closing an experiment is a small conversation, because the unticked steps mean something.
function closeExperiment(id){
  var e=LB.data.experiments[id]; if(!e) return;
  var p=expProgress(e), left=p.total-p.done;
  var opts=[{id:'done',label:'Completed',sub:'It finished. '+(left?(left+' step'+(left===1?'':'s')+' left unticked'):'All steps ticked'),ic:'C',c:'#3f9d76'},
            {id:'paused',label:'On hold',sub:'Coming back to it — keep it out of the way meanwhile',ic:'P',c:'#c99a4e'},
            {id:'abandoned',label:'Abandoned',sub:'It stopped and is not coming back',ic:'A',c:'#b06a6a'}];
  lbPicker('How did '+(e.code||e.title||'this experiment')+' end?',opts,function(it){
    setExpStatus(id,it.id);
    // Steps are never auto-ticked here. A step you did not do must not become a step you did:
    // that is exactly the lie the record exists to prevent.
    setExpArchived(id,true);
  });
}
// How far back carry-over looks. Without a bound it scans all history for ever.
var CARRY_LOOKBACK_DAYS=21;
// Blocks dated before D that are still outstanding, grouped by experiment, most recent first.
function carryoverForDate(D){
  var byExp={}, order=[], floor=addDays(D,-CARRY_LOOKBACK_DAYS);
  Object.keys(LB.data.experiments).forEach(function(k){ var e=LB.data.experiments[k];
    if(expArchived(e)) return;   // a closed experiment stops nagging the moment you close it
    (e.blocks||[]).forEach(function(b){
      if(b.date && b.date<D && b.date>=floor && !b.done && !b.carryDismissed){
        if(!byExp[e.id]){ byExp[e.id]={exp:e,blocks:[]}; order.push(e.id); }
        byExp[e.id].blocks.push(b);
      }
    });
  });
  order.forEach(function(id){ byExp[id].blocks.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }); });
  return {byExp:byExp, order:order};
}
// Stop nagging about a step without claiming it was done.
function dismissCarry(expId,blockId){
  var f=blockFinder(expId,blockId); if(!f) return;
  f.block.carryDismissed=true; f.exp.updated=Date.now(); save(); renderAll();
  toast('Removed from carry-over — the step itself is unchanged.');
}
// Re-date an outstanding block onto day D so it physically moves into that day's notebook.
function carryBlockToToday(expId,blockId,D){
  var f=blockFinder(expId,blockId); if(!f) return;
  f.block.date=D;
  // Peers (setBlock('date'), snoozeBlock) both do this; omitting it left dayOffset stale, so
  // the wrong "Day N" printed in the outline and the PDF.
  recomputeDayOffsets(f.exp); f.exp.updated=Date.now(); save(); renderAll();
}
// Snooze: didn't get to this step today? Push it n days forward. Every later-dated step in the
// same experiment moves with it, so the day spacing you designed stays intact.
function snoozeBlock(expId,blockId,n){
  var e=LB.data.experiments[expId]; if(!e) return;
  var b=(e.blocks||[]).filter(function(x){return x.id===blockId;})[0]; if(!b||!b.date) return;
  var from=b.date, days=n||1, moved=0;
  (e.blocks||[]).forEach(function(x){ if(x.date && x.date>=from && x.id!==b.id){ x.date=addDays(x.date,days); moved++; } });
  b.date=addDays(b.date,days);
  recomputeDayOffsets(e); e.updated=Date.now(); save(); renderAll();
  toast('Snoozed to '+fmtDate(b.date)+(moved?(' — '+moved+' later step'+(moved!==1?'s':'')+' moved too'):''));
}
function entryMatchesTag(html,tag){ return (html||'').indexOf('data-tag="'+tag+'"')>=0; }
function typeName(id){ var t=EXP_TYPES.filter(function(x){return x.id===id;})[0]; return t?t.name:id; }
function pageItemExp(e){ var code=isCoded(e)?('<div class="page-code">'+esc(e.code||'')+'</div>'):('<div class="page-kind">'+esc(e.noteType||'note')+'</div>');
  var pgp=isCoded(e)?expProgress(e):null;

function renderPages(){
  var host=el('pane-pages'); var node=SEL.node;
  var ppw=el('pane-pages-wrap'), spg=el('split-pages'); if(ppw) ppw.style.display=''; if(spg) spg.style.display='';
  var psw=el('pane-sec-wrap'), ssec=el('split-sec');
  document.body.classList.toggle('lb-on-home', node.kind==='home');
  document.body.classList.toggle('lb-dash', node.kind==='home'||node.kind==='exps'||node.kind==='week');
  _rbOpen=null;   // each surface gets its own answer; a choice made on one does not follow you
  // Home is full width inside the workspace, where the shell's rail is the navigation. In the
  // standalone build there is no rail, so the tree stays — otherwise the home would be a room
  // with no doors.
  var hasTree = renderSections();
  if(psw) psw.style.display = hasTree ? '' : 'none';

    var dset=allBlockDates(); Object.keys(LB.data.notebook).forEach(function(k){dset[k]=1;});

    var items=days.map(function(k){ var pg=LB.data.notebook[k]; var nblk=blocksForDate(k).length;

    host.innerHTML='<div class="pages-hd"><span class="t">Notebook</span><button class="icon-btn" title="Sort days" onclick="toggleDaySort()">'+(LAYOUT.daysDesc?'&#8595;':'&#8593;')+'</button><button class="pages-new" onclick="newNotebookDay()">+ Day</button></div>'
      +(days.length?items:'<div class="pages-empty">No days yet. Use <b>+ Day</b> or open <b>Ongoing</b>.</div>');

    var fbar=TAGFILTER?'<div class="pages-filter on"><span class="filter-chip">#'+esc(TAGFILTER)+'<span class="x" onclick="TAGFILTER=null;renderAll()">&times;</span></span></div>':'';

    var items=pgs.map(function(pg){ var delx='<button class="page-del" title="Delete" onclick="event.stopPropagation();delPage(\''+pg.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
      if(sec.kind==='seminars') return '<div class="page-item'+(SEL.page===pg.id?' active':'')+'" onclick="selectPage(\''+pg.id+'\')" oncontextmenu="ctxPage(event,\''+pg.id+'\')"><div class="page-body"><div class="page-title">'+esc(pg.title||'Untitled seminar')+'</div><div class="page-meta">'+(pg.speaker?('<span>'+esc(pg.speaker)+'</span>'):'')+'<span>'+esc(fmtDate(pg.date||''))+'</span></div></div>'+delx+'</div>';
      var preview=(pg.html||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,60);
      return '<div class="page-item'+(SEL.page===pg.id?' active':'')+'" onclick="selectPage(\''+pg.id+'\')" oncontextmenu="ctxPage(event,\''+pg.id+'\')"><div class="page-body"><div class="page-title">'+esc(pg.title||'Untitled')+'</div><div class="page-meta">'+esc(preview||'empty')+'</div></div>'+delx+'</div>'; }).join('');

    return;

  if(node.kind==='expsec'){

    if(!sec2){ host.innerHTML='<div class="pages-empty">Pick a folder inside a project.</div>'; return; }

    if(TAGFILTER) exps=exps.filter(function(e){return (e.blocks||[]).some(function(b){return entryMatchesTag(b.html,TAGFILTER);})||entryMatchesTag(e.html,TAGFILTER);});
    exps.sort(function(a,b){return (b.startDate||b.date||'').localeCompare(a.startDate||a.date||'')||(b.created||0)-(a.created||0);});
    var fbar2=TAGFILTER?'<div class="pages-filter on"><span class="filter-chip">#'+esc(TAGFILTER)+'<span class="x" onclick="TAGFILTER=null;renderAll()">&times;</span></span></div>':'';
    // auto-classify by type when >1 distinct type among coded experiments
    var coded=exps.filter(isCoded), notes=exps.filter(function(e){return !isCoded(e);});
    var types={}; coded.forEach(function(e){ types[e.type||'EXP']=1; });
    var body='';
    if(Object.keys(types).length>1){
      var order=EXP_TYPES.map(function(t){return t.id;});
      order.filter(function(tid){return types[tid];}).forEach(function(tid){
        body+='<div class="grp-lbl">'+esc(typeName(tid))+'</div>'+coded.filter(function(e){return (e.type||'EXP')===tid;}).map(pageItemExp).join('');
      });
    } else { body+=coded.map(pageItemExp).join(''); }
    if(notes.length){ body+='<div class="grp-lbl">Notes &amp; meetings</div>'+notes.map(pageItemExp).join(''); }
    host.innerHTML='<div class="pages-hd"><span class="t">'+esc(sec2.name)+'</span><button class="pages-new" onclick="openAddMenu(event)">+ Add</button></div>'+fbar2+(exps.length?body:'<div class="pages-empty">Nothing yet.<br>Use <b>+ Add</b>.</div>');
    return;
  }
  host.innerHTML='<div class="pages-empty">Pick something on the left.</div>';
}

// ── Protocol-sourced experiments ─────────────────────────────────────────
// __seq / __nanobret are synthetic parts (no dedicated Archive protocol) → reference blocks.
// Default day-offset per protocol part (fallback = sequential index). Dates stay editable.
var PROTO_OFFSET={ gibson:0,redigest:0,transfo:0,miniprep:1,nucleospin:0,__seq:2, bca:0,westernblot:0,ctg2:0,revtx:0,hibitlytic:1,transfection:0, strap:0,diann:1,perseus:2,__nanobret:0 };
