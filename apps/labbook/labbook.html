.es-row{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:baseline;padding:3px 0;font-size:var(--fs-3);}
.es-k{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.es-a{color:var(--text3);text-decoration:line-through;font-family:var(--mono);}
.es-ar{color:var(--text3);}
.es-b{color:var(--accent);font-family:var(--mono);font-weight:600;}
.es-note{font-size:var(--fs-2);color:var(--text2);line-height:1.55;}
.nm-setup .ci-f.lead span{color:#5e87c5;}
.nm-setup .ci-f.lead select{border-color:#5e87c5;font-weight:600;}
.nm-setup-plate{display:flex;align-items:flex-start;gap:8px;margin-top:12px;padding-top:11px;border-top:1px dashed var(--border);font-size:var(--fs-3);line-height:1.5;color:var(--text2);cursor:pointer;}
/* Two lines of label: centring the box puts it in the gap between them. It belongs on the
   first line, which is the one the sentence starts on. */
.nm-setup-plate input{accent-color:#5e87c5;width:15px;height:15px;flex:none;margin-top:2px;cursor:pointer;}
/* A checkbox wears its label beside it, not above it, so on its own it is half the height of a
   labelled field and the grid centred it — landing between its neighbours' label row and their
   inputs. It is pinned to the bottom of the cell instead, at the height of an input, so it
   reads as one more control on the same line. */
.ci-f.chk{flex-direction:row;align-items:flex-start;justify-content:flex-start;gap:7px;align-self:end;padding:7px 0;
  grid-column:span 2;}
/* A checkbox's label is a sentence ("MG132 pre-treatment"), not a two-word caption over an
   input, so it needs the width of two fields. In a single-column grid the span is clamped and
   nothing changes. */
/* padding, not min-height: a one-line label comes to the height of an input and centres against
   it, and a label that wraps grows downward with the box staying on the line the sentence
   starts on rather than drifting into the gap between the two lines. */
.ci-f.chk input{width:15px;height:15px;flex:none;margin-top:1px;accent-color:#5e87c5;}
.ci-f.chk span{font-size:var(--fs-2);font-weight:600;line-height:1.45;color:var(--text);}
/* New-experiment source-protocol chips */
.nm-protocols{margin:4px 0 2px;}
.nm-proto-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.nm-proto-chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-3);background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-3);padding:4px 6px 4px 10px;}
.nm-proto-n{font-family:var(--mono);font-size:var(--fs-1);color:var(--text3);}
.nm-pv-dayin{width:2.8em;font:inherit;font-family:var(--mono);font-size:var(--fs-2);text-align:center;
  background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-1);padding:0 2px;color:var(--text2);}
.nm-pv-dayin:focus{outline:none;border-color:var(--accent);color:var(--text);}
.nm-pv-dayin.own{border-color:var(--accent);color:var(--accent);}
.nm-pv-reset{background:none;border:none;color:var(--text3);font-size:var(--fs-1);cursor:pointer;
  text-decoration:underline;padding:0 0 0 6px;}
.nm-pv-reset:hover{color:var(--accent);}
/* ── Results handed over from an analysis app ─────────────────────────────────────────── */
.res-empty{padding:52px 22px;text-align:center;color:var(--text3);font-size:var(--fs-4);line-height:1.7;}
.res-empty .t{font-size:var(--fs-5);font-weight:600;color:var(--text2);margin-bottom:6px;}
.res-card{border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface);margin-bottom:14px;overflow:hidden;}
.res-hd{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--border);
  font-size:var(--fs-3);font-weight:600;}
.res-src{font-family:var(--mono);font-size:var(--fs-1);text-transform:uppercase;letter-spacing:.5px;
  background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-1);padding:1px 6px;color:var(--text3);}
.res-when{margin-left:auto;font-family:var(--mono);font-size:var(--fs-1);color:var(--text3);font-weight:400;}
.res-flag{font-size:var(--fs-1);color:#e0803a;font-weight:600;}
.res-del{background:none;border:none;color:var(--text3);font-size:var(--fs-6);cursor:pointer;line-height:1;padding:0 2px;}
.res-del:hover{color:var(--danger);}
/* 630px of table inside a 467px card with overflow:hidden — the exclude button was simply not
   reachable. docs/UI.md: a wide table scrolls inside its own container, never the page. */
.pl-notes{display:flex;flex-wrap:wrap;gap:5px 10px;align-items:baseline;margin-top:8px;padding-top:8px;
  border-top:1px dashed var(--border);font-size:var(--fs-2);color:var(--text2);line-height:1.5;}
.pl-notes-h{font-size:var(--fs-1);font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);}
.pl-note b{font-family:var(--mono);color:var(--text);font-weight:600;margin-right:3px;}
.res-scroll{overflow-x:auto;}
.res-tbl{width:100%;min-width:560px;border-collapse:collapse;font-size:var(--fs-3);}
.res-tbl th{text-align:left;font-weight:600;color:var(--text3);font-size:var(--fs-1);text-transform:uppercase;
  letter-spacing:.4px;padding:7px 13px;border-bottom:1px solid var(--border);}
.res-tbl td{padding:6px 13px;border-bottom:1px solid var(--border);}
.res-tbl td.num{font-family:var(--mono);text-align:right;}
.res-tbl tr:last-child td{border-bottom:none;}
.res-tbl tr.excluded td{opacity:.45;text-decoration:line-through;}
.res-tbl tr.excluded td.res-note,.res-tbl tr.excluded td.res-x{opacity:1;text-decoration:none;}
.res-note input{width:100%;min-width:130px;min-height:26px;background:none;border:1px solid transparent;
  border-radius:var(--r-1);padding:3px 6px;font-family:var(--sans);font-size:var(--fs-2);color:var(--text);}
.res-note input:hover{border-color:var(--border);}
.res-note input:focus{outline:none;background:var(--surface);border-color:var(--accent);}
.res-x button{min-height:26px;padding:3px 9px;border-radius:var(--r-1);border:1px solid var(--border2);
  background:none;color:var(--text3);font-family:var(--sans);font-size:var(--fs-1);font-weight:600;
  cursor:pointer;white-space:nowrap;}
.res-x button:hover{color:var(--danger);border-color:var(--danger);}
.res-tbl tr.excluded .res-x button{color:var(--danger);border-color:var(--danger);}
.res-tbl tr.flagged td{color:var(--text3);}
.res-tbl tr.flagged td:first-child::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#e0803a;margin-left:6px;vertical-align:.1em;}
.res-raw{font-family:var(--mono);font-size:var(--fs-2);padding:10px 13px;margin:0;white-space:pre-wrap;color:var(--text2);}
/* ── Deviations from the protocol ─────────────────────────────────────────────────────── */
.dev-pane{border:1px solid #e0a06a;border-radius:var(--r-2);background:var(--surface);margin-bottom:14px;overflow:hidden;}
.dev-hd{padding:8px 14px;border-bottom:1px solid var(--border);font-size:var(--fs-3);font-weight:600;color:#c8752f;}
.dev-sub{font-weight:400;color:var(--text3);margin-left:8px;font-size:var(--fs-2);}
.dev-row{display:flex;align-items:baseline;gap:9px;padding:6px 14px;font-size:var(--fs-3);cursor:pointer;
  border-bottom:1px solid var(--border);}
.dev-row:last-child{border-bottom:none;}
.dev-row:hover{background:var(--surface2);}
.dev-step{font-family:var(--mono);font-size:var(--fs-1);color:var(--text3);min-width:120px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dev-lbl{flex:1 1 auto;color:var(--text2);}
.dev-from{font-family:var(--mono);color:var(--text3);text-decoration:line-through;}
.dev-arw{color:var(--text3);}
.dev-to{font-family:var(--mono);color:#c8752f;font-weight:600;}
/* ── Biological replicates ────────────────────────────────────────────────────────────── */
.rep-chip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 10px;
  border:1px solid var(--border2);border-radius:var(--r-3);background:var(--surface2);font-size:var(--fs-2);}
.rep-t{color:var(--text2);font-weight:600;}
.rep-l{font-family:var(--mono);font-size:var(--fs-2);width:19px;height:19px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;background:var(--surface);
  border:1px solid var(--border2);color:var(--text2);cursor:pointer;}
.rep-l:hover{border-color:#5e87c5;color:#5e87c5;}
.rep-l.on{background:#5e87c5;border-color:#5e87c5;color:#fff;font-weight:700;}
/* Publication-ready: sections and the toggles that decide which of them exist. */
.exp-pub .pub-h{font-size:var(--fs-2);font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--accent,#5e87c5);margin:14px 0 4px;}
.exp-pub .pub-h:first-child{margin-top:0;}
.pub-secs{display:flex;flex-wrap:wrap;gap:4px;margin-left:10px;}
.pub-sec{font-family:var(--sans);font-size:var(--fs-1);border:1px solid var(--border2);background:var(--surface);
  color:var(--text3);border-radius:var(--r-3);padding:3px 9px;cursor:pointer;}
.pub-sec.on{background:var(--accent-dim);border-color:var(--accent,#5e87c5);color:var(--accent,#5e87c5);font-weight:600;}
.rep-of{color:var(--text2);}
.rep-of a{color:var(--accent,#5e87c5);font-family:var(--mono);cursor:pointer;text-decoration:none;}
.rep-of a:hover{text-decoration:underline;}
.rep-when{color:var(--text3);}
/* ── Bench timers ─────────────────────────────────────────────────────────────────────── */
.ptimer{background:none;border:none;color:var(--text3);font-size:var(--fs-1);cursor:pointer;padding:0 0 0 3px;
  vertical-align:baseline;}
.ptimer:hover{color:#5e87c5;}
#lb-timers{position:fixed;right:16px;bottom:16px;z-index:900;display:flex;flex-direction:column;
  gap:7px;width:246px;}
.tmr{position:relative;overflow:hidden;display:flex;align-items:center;gap:9px;padding:9px 11px;
  border-radius:var(--r-2);background:var(--surface);border:1px solid var(--border2);
  box-shadow:0 6px 20px rgba(0,0,0,.16);font-size:var(--fs-3);}
.tmr-bar{position:absolute;left:0;top:0;bottom:0;background:rgba(94,135,197,.14);transition:width 1s linear;}
.tmr.done{border-color:#5e87c5;}
.tmr.done .tmr-bar{background:rgba(94,135,197,.3);}
.tmr-time{position:relative;font-family:var(--mono);font-weight:700;font-size:var(--fs-4);color:#5e87c5;min-width:56px;}
.tmr-lbl{position:relative;flex:1 1 auto;overflow:hidden;line-height:1.3;}
.tmr-sub{display:block;font-size:var(--fs-1);color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tmr-x{position:relative;background:none;border:none;color:var(--text3);font-size:var(--fs-6);cursor:pointer;line-height:1;}
.tmr-x:hover{color:var(--danger);}
/* ── Day view: date nav, live cultures, running experiments ───────────────────────────── */
.day-nav{display:flex;align-items:center;gap:5px;margin-left:14px;}
.day-arw{width:24px;height:24px;border-radius:var(--r-1);border:1px solid var(--border);background:var(--surface2);
  color:var(--text2);cursor:pointer;font-size:var(--fs-5);line-height:1;padding:0;}
.day-arw:hover{color:var(--text);border-color:var(--border2);}
.day-pick{font:inherit;font-size:var(--fs-3);background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-1);padding:3px 7px;color:var(--text2);}
.day-today{font:inherit;font-size:var(--fs-2);background:var(--surface2);border:1px solid var(--border2);
  border-radius:var(--r-1);padding:3px 9px;color:var(--text2);cursor:pointer;}
.day-today:hover{color:var(--accent);border-color:var(--accent);}
.cul-sum{font-size:var(--fs-3);color:var(--text2);margin:2px 0 7px;}
.cul-need{color:#e0803a;}
.cul-empty{font-size:var(--fs-3);color:var(--text3);padding:8px 2px;}
.cul-list{display:flex;flex-direction:column;gap:4px;}
.cul-row{display:flex;align-items:center;gap:9px;padding:6px 11px;border-radius:var(--r-2);
  background:var(--surface);border:1px solid var(--border);cursor:pointer;font-size:var(--fs-3);}
.cul-row:hover{border-color:var(--border2);}
.cul-dot{width:7px;height:7px;border-radius:50%;background:var(--accent3);flex:0 0 auto;}
.cul-row.warn .cul-dot{background:#e0803a;} .cul-row.soft .cul-dot{background:#d9b23a;}
.cul-line{font-weight:600;}
.cul-meta{font-family:var(--mono);font-size:var(--fs-2);color:var(--text3);}
.cul-msg{margin-left:auto;color:var(--text2);font-size:var(--fs-2);text-align:right;}
.cul-row.warn .cul-msg{color:#e0803a;}
.ong-list{display:flex;flex-direction:column;gap:4px;}
.ong-row{display:flex;align-items:center;gap:10px;padding:6px 11px;border-radius:var(--r-2);
  background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border2);
  cursor:pointer;font-size:var(--fs-3);}
.ong-row:hover{border-color:var(--border2);}
.ong-code{font-family:var(--mono);font-size:var(--fs-2);color:var(--text2);flex:0 0 auto;}
.ong-title{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ong-bar{width:70px;height:5px;border-radius:var(--r-1);background:var(--surface3);flex:0 0 auto;overflow:hidden;}
.ong-bar i{display:block;height:100%;border-radius:var(--r-1);}
.ong-n{font-family:var(--mono);font-size:var(--fs-1);color:var(--text3);flex:0 0 auto;}
.ong-next{font-size:var(--fs-2);color:var(--text3);flex:0 0 auto;min-width:92px;text-align:right;}
.nm-proto-var{font:inherit;font-size:var(--fs-2);background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--r-2);padding:1px 4px;color:var(--text2);max-width:150px;}
.nm-proto-off{display:inline-flex;align-items:center;gap:3px;font-size:var(--fs-1);color:var(--text3);}
.nm-proto-off input{width:3.1em;font:inherit;font-family:var(--mono);font-size:var(--fs-2);text-align:center;
  background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-1);padding:1px 2px;color:var(--text);}
.nm-proto-add.echo{border-color:#ff5760;color:#ff5760;}
.nm-echo{display:flex;align-items:center;gap:8px;font-size:var(--fs-2);color:var(--text2);
  border:1px solid #ff5760;border-radius:var(--r-2);padding:6px 11px;margin-bottom:9px;}
.nm-echo-t{font-size:var(--fs-1);font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#ff5760;}
.nm-echo-x{margin-left:auto;background:none;border:none;color:var(--text3);font-size:var(--fs-5);cursor:pointer;line-height:1;}
.pl-wv{font-family:var(--mono);font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);}
.pl-vals{display:flex;align-items:center;gap:9px;font-size:var(--fs-2);color:var(--text2);
  padding:7px 10px;margin-bottom:9px;border:1px solid var(--border2);border-radius:var(--r-2);}
.pl-vals-t{font-size:var(--fs-1);font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);}
.pl-vals-sc{display:inline-flex;border-radius:var(--r-1);overflow:hidden;}
.pl-vals-sc i{width:16px;height:9px;display:block;}
.pl-vals-sc .lo{background:rgb(40,90,200);} .pl-vals-sc .mid{background:rgb(148,150,125);} .pl-vals-sc .hi{background:rgb(255,90,50);}
.pl-vals-r{font-family:var(--mono);}
.pl-vals-n{color:var(--text3);margin-left:auto;}
.mrow.col{flex-direction:column;align-items:stretch;gap:6px;}
/* ── Protocol moved on under a recorded step ──────────────────────────────────────────── */
.pupd{display:flex;align-items:center;gap:9px;margin:0 0 9px;padding:6px 11px;border-radius:var(--r-2);
  background:var(--surface2);border:1px solid var(--border2);font-size:var(--fs-2);color:var(--text2);}
.pupd.gone{color:var(--text3);}
.pupd-t{font-size:var(--fs-1);font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#5e72c4;}
.pupd-b{margin-left:auto;background:none;border:1px solid var(--border2);border-radius:var(--r-1);
  padding:2px 9px;font:inherit;font-size:var(--fs-2);color:var(--text2);cursor:pointer;}
.pupd-b:hover{border-color:#5e72c4;color:#5e72c4;}
.pupd-b.keep{margin-left:0;}
.pupd-diff{max-height:46vh;max-height:46dvh;overflow:auto;font-size:var(--fs-3);line-height:1.55;}
.pupd-diff ul{margin:4px 0 10px 18px;} .pupd-diff li{margin-bottom:3px;color:var(--text2);}
.pupd-diff p{margin:8px 0 2px;}
.pupd-warn{margin-top:12px;padding:9px 12px;border-left:3px solid #e0803a;background:var(--surface2);
  border-radius:0 7px 7px 0;font-size:var(--fs-3);}
.nm-proto-chip.synth{border-style:dashed;color:var(--text2);}
.nm-proto-chip .x{cursor:pointer;color:var(--text3);font-size:var(--fs-5);line-height:1;padding:0 3px;border-radius:var(--r-2);}
.nm-proto-chip .x:hover{color:var(--danger);}
.nm-proto-add{font-size:var(--fs-3);background:transparent;border:1px dashed var(--border2);color:var(--accent);border-radius:var(--r-3);padding:4px 12px;cursor:pointer;}
.nm-proto-add:hover{background:var(--surface2);}
/* Experiment tabs (Dated · Observations · Publication ready) */
.exp-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:10px 0 0;}
.exp-tab{position:relative;background:none;border:none;color:var(--text2);font-size:var(--fs-4);font-weight:600;padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px;}
.exp-tab:hover{color:var(--text);}
.exp-tab.on{color:var(--accent);border-bottom-color:var(--accent);}
.exp-tab-n{font-size:var(--fs-1);background:var(--surface3);color:var(--text2);border-radius:var(--r-2);padding:1px 6px;font-weight:700;}
.exp-tab.on .exp-tab-n{background:var(--accent-dim);color:var(--accent);}
.exp-tab-body{padding-top:14px;}
.exp-tab-body .exp-canvas{margin-top:0;}
.exp-dated-empty{font-size:var(--fs-4);color:var(--text3);font-style:italic;padding:6px 2px 12px;}
.blk-part{font-size:var(--fs-1);font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--accent);background:var(--accent-dim);border-radius:var(--r-1);padding:2px 7px;white-space:nowrap;}
.exp-pub-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;min-height:34px;}
.exp-pub-lbl{font-size:var(--fs-3);color:var(--text2);font-weight:600;}
.pub-btn{font-size:var(--fs-3);border:1px solid var(--border2);background:var(--surface);color:var(--text);border-radius:var(--r-2);padding:5px 12px;min-width:92px;min-height:34px;cursor:pointer;}
.pub-btn:hover{background:var(--surface2);}
.pub-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.pub-btn.primary:hover{filter:brightness(1.06);}
.pub-stale{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:9px 0 0;padding:8px 11px;
  border-radius:var(--r-1);background:rgba(217,158,79,.12);border:1px solid rgba(217,158,79,.35);
  font-size:var(--fs-2);color:var(--text2);line-height:1.5;}
.pub-stale button{border:1px solid var(--border2);background:var(--surface);color:var(--text);
  border-radius:var(--r-1);padding:3px 9px;font-family:var(--sans);font-size:var(--fs-2);
  font-weight:600;cursor:pointer;min-height:26px;}
.pub-stale button:hover{border-color:var(--accent);color:var(--accent);}
.exp-pub-src{font-size:var(--fs-2);color:var(--text3);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.exp-pub{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);padding:16px 18px;box-shadow:var(--shadow-xs);min-height:160px;font-family:var(--sans);font-size:var(--fs-5);line-height:1.72;overflow-wrap:anywhere;}
.exp-pub p{margin:0 0 12px;max-width:92ch;}
.exp-pub p:last-child{margin-bottom:0;}
/* One height for every action in a dialog footer, whatever variant it is. */
.modal-act .btn,.pl-btn{min-height:35px;}
.pl-btn{min-width:88px;}
.lb-float-img.selected.snap-active::after{content:'';position:absolute;inset:-8px;border:1px dashed var(--accent);border-radius:var(--r-2);pointer-events:none;}
body.lb-on-home #ribbon,body.lb-on-home #rightdock,body.lb-dash #ribbon,body.lb-dash #rightdock{display:none;}
body.lb-on-home #mobile-nav-btn,body.lb-dash #mobile-nav-btn{display:none!important;}

/* ══ HOME — the dashboard ══════════════════════════════════════════════════
   A card is a place, not a link: Projects opens its folders and then its experiments in
   place, and you only change screen when you open an actual entry. */
/* ── Experiments surface ─────────────────────────────────────────────── */
.xv-wrap{padding:20px clamp(16px,2.2vw,40px) 48px;display:flex;flex-direction:column;gap:12px;}
.xv-top{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px;}
.xv-h{font-size:var(--fs-7);font-weight:700;letter-spacing:-.4px;color:var(--text);}
.xv-q{flex:1;min-width:180px;max-width:420px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-2);padding:7px 12px;font-family:var(--sans);font-size:var(--fs-3);color:var(--text);outline:none;transition:border-color .15s;}
.xv-q:focus{border-color:var(--accent);}
.xv-filters{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-2);padding:2px;}
.xv-f{background:none;border:none;color:var(--text2);font-family:var(--sans);font-size:var(--fs-2);font-weight:600;padding:5px 12px;border-radius:var(--r-1);cursor:pointer;}
.xv-f.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-xs);}
.xv-proj{flex:none;border:1px solid var(--border);border-radius:var(--r-3);background:var(--surface);overflow:hidden;}
.xv-ph{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none;}
.xv-ph:hover{background:var(--surface2);}
.xv-chev{display:inline-flex;color:var(--text3);transition:transform .15s;}
.xv-proj.open .xv-chev{transform:rotate(90deg);}
.xv-pc{width:9px;height:9px;border-radius:50%;flex:none;}
.xv-pn{font-size:var(--fs-5);font-weight:650;color:var(--text);}
.xv-pm{font-size:var(--fs-2);color:var(--text3);margin-left:auto;}
.xv-parw{display:none;}
.xv-pb{border-top:1px solid var(--border);}
.xv-fold{display:flex;align-items:center;gap:8px;padding:9px 16px 5px;}
.xv-fname{font-size:var(--fs-1);font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--text3);}
.xv-add{margin-left:auto;background:none;border:1px solid var(--border2);color:var(--text2);font-family:var(--sans);font-size:var(--fs-1);font-weight:600;padding:3px 9px;border-radius:var(--r-1);cursor:pointer;}
.xv-add:hover{color:var(--accent);border-color:var(--accent);}
.xv-row{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;border-top:1px solid var(--border);}
.xv-row:hover{background:var(--accent-dim);}
.xv-dot{width:6px;height:6px;border-radius:50%;flex:none;}
.xv-code{font-family:var(--mono);font-size:var(--fs-2);font-weight:600;color:var(--text);flex:none;}
.xv-name{font-size:var(--fs-3);color:var(--text2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.xv-type{font-size:var(--fs-1);color:var(--text3);background:var(--surface2);border-radius:var(--r-1);padding:2px 7px;flex:none;}
.xv-prog{display:flex;align-items:center;gap:7px;flex:none;}
.xv-bar{width:64px;height:4px;border-radius:2px;background:var(--surface3);overflow:hidden;display:block;}
.xv-bar i{display:block;height:100%;background:var(--accent);}
.xv-prog b{font-size:var(--fs-1);color:var(--text3);font-weight:600;font-variant-numeric:tabular-nums;}
.xv-when{font-size:var(--fs-1);color:var(--text3);flex:none;min-width:96px;text-align:right;}
.xv-late{color:var(--accent);font-weight:600;}
.xv-arw{display:inline-flex;color:var(--text3);flex:none;}
.xv-fold.xv-drop{background:var(--accent-dim);outline:1px dashed var(--accent);border-radius:var(--r-1);}
/* The ⋯ is the touch doorway to the same menu the right button opens. It is always in the
   DOM — appearing on hover only would put it on exactly the devices that have no hover. */
.lb-mbtn{flex:none;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;
  border:0;background:none;color:var(--text3);border-radius:var(--r-1);cursor:pointer;padding:0;opacity:.55;}
.lb-mbtn:hover{opacity:1;color:var(--accent);background:var(--surface3);}
/* A thumb is not a cursor: 26px is a comfortable click and a miss on a phone. */
@media (hover:none){ .lb-mbtn{width:36px;height:36px;opacity:.7;} }
.xv-prio{display:inline-flex;color:#d9534f;flex:none;}
.xv-row.xv-lowp .xv-code,.xv-row.xv-lowp .xv-name{color:var(--text3);}
/* iOS pops its own selection callout on a long press, which lands on top of the menu the
   long press just opened. */
[oncontextmenu]{-webkit-touch-callout:none;}
.xv-row.xv-done .xv-code,.xv-row.xv-done .xv-name{color:var(--text3);}
.xv-row.xv-arch{opacity:.62;}
.xv-row.xv-arch .xv-code{text-decoration:line-through;}
.xv-empty{padding:16px;font-size:var(--fs-3);color:var(--text3);}
.xv-newproj{flex:none;width:190px;margin:0;}
.xv-newsec{margin:8px 16px 12px;width:220px;}
/* Day / Week toggle — Journal is one surface with two zooms, not two destinations. */
.jr-seg{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-2);padding:2px;margin-left:8px;}
.jr-seg button{background:none;border:none;color:var(--text2);font-family:var(--sans);font-size:var(--fs-2);font-weight:600;padding:4px 11px;border-radius:var(--r-1);cursor:pointer;}
.jr-seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-xs);}
@media(max-width:760px){
  .xv-wrap{padding:14px 12px 40px;}
  .xv-type,.xv-when{display:none;}
  .xv-bar{width:40px;}
}

.lh-wrap{padding:20px clamp(16px,2.2vw,40px) 40px;display:flex;flex-direction:column;gap:16px;}
.lh-band{display:flex;align-items:center;gap:22px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r3);padding:18px 22px;box-shadow:var(--shadow-xs);}
.lh-ring{width:74px;height:74px;flex-shrink:0;position:relative;}
.lh-rn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.lh-rn b{font-family:var(--mono);font-size:var(--fs-6);line-height:1;color:var(--text);}
.lh-rn span{font-size:var(--fs-1);color:var(--text3);letter-spacing:.4px;}
.lh-bmain{flex:1;min-width:0;}
.lh-date{font-size:var(--fs-6);font-weight:700;letter-spacing:-.3px;cursor:pointer;}
.lh-date:hover{color:var(--accent);}
.lh-sub{font-size:var(--fs-3);color:var(--text2);margin-top:3px;}
.lh-steps{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;}
.lh-step{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface2);
  border-radius:var(--r-2);padding:6px 11px;font-size:var(--fs-3);cursor:pointer;transition:border-color .15s;}
.lh-step:hover{border-color:var(--accent-soft);}
.lh-step.warn{border-color:rgba(196,120,24,.4);}
.lh-cb-box{width:15px;height:15px;border-radius:var(--r-1);border:1.6px solid var(--border2);flex-shrink:0;}
.lh-code{font-family:var(--mono);font-size:var(--fs-2);color:var(--accent);font-weight:600;}
.lh-bside{display:flex;flex-direction:column;gap:7px;flex-shrink:0;border-left:1px solid var(--border);padding-left:20px;}
.lh-alert{display:flex;align-items:center;gap:8px;font-size:var(--fs-3);color:var(--text2);cursor:pointer;}
.lh-alert:hover{color:var(--text);}
.lh-al-line{font-weight:600;color:var(--text);}
.lh-dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex-shrink:0;}
.lh-alert.warn .lh-dot{background:var(--warn);}
.lh-alert.soft .lh-dot{background:var(--accent);}

.lh-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;}
.lh-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r3);
  box-shadow:var(--shadow-xs);display:flex;flex-direction:column;overflow:hidden;}
.lh-card.w4{grid-column:span 4;} .lh-card.w8{grid-column:span 8;}
.lh-ch{display:flex;align-items:center;gap:9px;padding:14px 16px 0;}
.lh-ch .grow{flex:1;}
.lh-t{font-size:var(--fs-2);font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--text3);}
.lh-lnk{font-size:var(--fs-2);color:var(--accent);cursor:pointer;font-weight:600;}
.lh-lnk:hover{text-decoration:underline;}
.lh-cb{padding:12px 16px 16px;}
.lh-empty{font-size:var(--fs-3);color:var(--text3);padding:8px 0;}

/* week strip */
.lh-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
.lh-day{border:1px solid var(--border);border-radius:var(--r-2);padding:8px 6px;min-height:112px;
  background:var(--surface2);cursor:pointer;transition:border-color .15s;}
.lh-day:hover{border-color:var(--accent-soft);}
.lh-day.is-today{border-color:var(--accent);background:var(--accent-dim);}
.lh-day.we{opacity:.62;}
.lh-dow{font-size:var(--fs-1);font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);text-align:center;}
.lh-dnum{font-family:var(--mono);font-size:var(--fs-3);text-align:center;margin-bottom:6px;color:var(--text);}
.lh-pill{font-size:var(--fs-1);border-radius:var(--r-1);padding:3px 5px;margin-bottom:4px;line-height:1.3;
  border-left:3px solid var(--accent);background:var(--surface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lh-pill.task{border-left-color:var(--text3);}
.lh-pill.task.done{opacity:.5;text-decoration:line-through;}
.lh-more{font-size:var(--fs-1);color:var(--text3);text-align:center;}

/* running experiments */
.lh-exp{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.lh-exp:last-child{border-bottom:none;}
.lh-exp:hover .lh-x-ti{color:var(--text);}
.lh-x-code{font-family:var(--mono);font-size:var(--fs-3);font-weight:600;width:78px;flex-shrink:0;}
.lh-x-ti{flex:1;min-width:0;font-size:var(--fs-3);color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lh-bar{width:92px;height:5px;border-radius:var(--r-full);background:var(--surface3);flex-shrink:0;overflow:hidden;}
.lh-bar i{display:block;height:100%;}
.lh-x-n{font-family:var(--mono);font-size:var(--fs-2);color:var(--text3);width:34px;text-align:right;flex-shrink:0;}
.lh-x-nx{font-size:var(--fs-2);color:var(--text2);width:104px;text-align:right;flex-shrink:0;}
.lh-x-nx .late{color:var(--warn);font-weight:600;}

/* projects, recent, results, deviations */
.lh-crumb{display:flex;align-items:center;gap:6px;font-size:var(--fs-2);color:var(--text3);margin-bottom:10px;}
.lh-crumb b{color:var(--text);font-weight:600;}
.lh-crumb .bk{cursor:pointer;color:var(--accent);}
.lh-plist{display:flex;flex-direction:column;gap:7px;}
.lh-prow{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border);
  border-radius:var(--r-2);background:var(--surface2);cursor:pointer;transition:border-color .15s;}
.lh-prow:hover{border-color:var(--accent-soft);}
.lh-pc{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.lh-prow .nm{flex:1;min-width:0;font-size:var(--fs-3);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lh-prow .mt{font-size:var(--fs-2);color:var(--text3);font-family:var(--mono);}
.lh-prow .ar{color:var(--text3);}
.lh-rec{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:var(--fs-3);
  border-bottom:1px solid var(--border);cursor:pointer;}
.lh-rec:last-child{border-bottom:none;}
.lh-rec .w{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lh-rec .ago{font-size:var(--fs-2);color:var(--text3);font-family:var(--mono);flex-shrink:0;}
.lh-res{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);
  font-size:var(--fs-3);cursor:pointer;}
.lh-res:last-child{border-bottom:none;}
.lh-res .cmp{font-family:var(--mono);font-weight:600;width:74px;flex-shrink:0;}
.lh-res .tgt{color:var(--text2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lh-res .val{font-family:var(--mono);font-weight:600;}
.lh-flag{font-size:var(--fs-1);font-family:var(--mono);font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  padding:2px 6px;border-radius:var(--r-4);background:rgba(196,120,24,.16);color:var(--warn);flex-shrink:0;}
.lh-dev{font-size:var(--fs-3);padding:7px 0;border-bottom:1px solid var(--border);color:var(--text2);cursor:pointer;}
.lh-dev:last-child{border-bottom:none;}
.lh-dev b{color:var(--text);font-family:var(--mono);font-weight:600;}
.lh-dev s{color:var(--text3);}
.lh-dev i{color:var(--accent);font-style:normal;font-weight:600;}

@media(max-width:1240px){
  .lh-card.w4{grid-column:span 6;}
  .lh-card.w8{grid-column:span 12;}
}
@media(max-width:900px){
  .lh-wrap{padding:14px 12px 40px;gap:12px;}
  .lh-card.w4,.lh-card.w8{grid-column:span 12;}
  .lh-band{flex-wrap:wrap;gap:14px;}
  .lh-bmain{flex:1 1 200px;min-width:0;}
  .lh-bside{flex:1 1 100%;border-left:none;padding-left:0;border-top:1px solid var(--border);padding-top:12px;}
  .lh-step{width:100%;}
  .lh-week{grid-template-columns:repeat(4,minmax(0,1fr));}
  .lh-exp{flex-wrap:wrap;}
  .lh-exp .lh-x-ti{flex:1 1 100%;order:3;}
}


/* Motion here is decoration: nothing it conveys is lost when it is switched off, and a
   vestibular disorder is not a preference. Only Cuppa honoured this before 2026-08-23. */
@media (prefers-reduced-motion: reduce){

    transition-duration:1ms!important;scroll-behavior:auto!important;}
}

<script>
// ── Theme ──
(function(){ var t='light'; try{ t=localStorage.getItem('hub_theme')||'light'; }catch(e){} document.documentElement.setAttribute('data-theme',t); })();
window.addEventListener('message', function(e){
  if(e.data==='setTheme:dark') document.documentElement.setAttribute('data-theme','dark');
  if(e.data==='setTheme:light') document.documentElement.setAttribute('data-theme','light');
});
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function el(id){ return document.getElementById(id); }
function uid(){ return 'lb'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function dateCompact(s){ return s? s.replace(/-/g,'') : ''; }
function fmtDate(s){ if(!s) return ''; var p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function addDays(s,n){ if(!s) return s; var d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+(n||0)); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function daysBetween(a,b){ if(!a||!b) return 0; return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
// Earliest dated block = the experiment's Day 0 anchor (falls back to start date).
function expAnchorDate(e){ var ds=(e.blocks||[]).filter(function(b){return b.date;}).map(function(b){return b.date;}).sort(); return ds.length?ds[0]:(e.startDate||todayStr()); }
// The app knows what day of the week a date is and never said so. A protocol that says "day 0
// → day 3" lands on a Sunday one week in seven, and for cell work that is the difference
// between a plan and a plan nobody can execute.
function _isWeekend(d){ if(!d) return false; var t=new Date(d+'T00:00:00');
  if(isNaN(t.getTime())) return false; var n=t.getDay(); return n===0||n===6; }
function _dayShort(d){ if(!d) return ''; try{ var t=new Date(d+'T00:00:00');
  return isNaN(t.getTime())?'':t.toLocaleDateString(undefined,{weekday:'short'}); }catch(e){ return ''; } }
function recomputeDayOffsets(e){ var anc=expAnchorDate(e); (e.blocks||[]).forEach(function(b){ if(b.date) b.dayOffset=daysBetween(anc,b.date); }); }
// Blocks sorted by date (undated last), grouped into { key(date), day, blocks[] } day-groups.
function dayGroups(e){ var idx={}; (e.blocks||[]).forEach(function(b,i){ idx[b.id]=i; });
  var sorted=(e.blocks||[]).slice().sort(function(a,b){ var ad=a.date||'9999-99-99', bd=b.date||'9999-99-99'; return ad!==bd?(ad<bd?-1:1):(idx[a.id]-idx[b.id]); });
  var anc=expAnchorDate(e), groups=[], cur=null;
  sorted.forEach(function(b){ var key=b.date||''; if(!cur||cur.key!==key){ cur={key:key, day:key?daysBetween(anc,key):null, blocks:[]}; groups.push(cur); } cur.blocks.push(b); });
  return groups; }
var PROJ_COLORS=['#4a8fb5','#5e72c4','#c47818','#c04040','#7c6fd4','#2d9462','#a56983','#d17a4a','#0079b9','#8d6e63'];

// ── Types + presets ──
var EXP_TYPES=[
  {id:'WB',name:'Western blot'},{id:'HB',name:'HiBiT degradation'},{id:'CTG',name:'Cell viability'},
  {id:'NB',name:'NanoBRET target engagement'},{id:'KD',name:'Kinetic degradation'},{id:'RTX',name:'Reverse transfection'},
  {id:'D2B',name:'Direct-to-biology'},{id:'PR',name:'Proteomics'},{id:'CLONE',name:'Cloning / plasmid'},{id:'EXP',name:'Custom experiment'}
];
var SEMANTIC_EXPERIMENT_TITLES={
  WB:'Western blot', HB:'HiBiT degradation', CTG:'Cell viability', NB:'NanoBRET target engagement',
  KD:'Kinetic degradation', RTX:'Reverse transfection', D2B:'Direct-to-biology', PR:'Proteomics',
  CLONE:'Cloning / plasmid', EXP:'Custom experiment'
};
var LEGACY_EXPERIMENT_TITLES={
  HB:['HiBiT','HiBiT: seed → overnight → compound → lytic read'],
  CTG:['Cell viability (CTG)','Cell viability (CellTiter-Glo)'],
  NB:['NanoBRET','NanoBRET biosensor'],
  D2B:['Direct-to-Biology','Direct-to-Biology (dose → seed → read)'],
  EXP:['Custom / blank']
};
function semanticExperimentTitle(type){ return SEMANTIC_EXPERIMENT_TITLES[type]||'Custom experiment'; }
function migrateSemanticExperimentTitles(){
  if(LB.data._semanticTitlesV1) return false;
  var changed=false;
  Object.keys(LB.data.experiments||{}).forEach(function(id){
    var e=LB.data.experiments[id], old=(LEGACY_EXPERIMENT_TITLES[e.type]||[]);
    if(!e.title || old.indexOf(String(e.title).trim())>=0){ e.title=semanticExperimentTitle(e.type); e.updated=Date.now(); changed=true; }
  });
  LB.data._semanticTitlesV1=true;
  return changed;
}
var PRESET_SEED={
  WB:{title:'Western blot',blocks:[
    {d:0,title:'Seeding',calc:{kind:'seed',inputs:{cellLine:'HEK293',cellsPerWell:20000,volPerWell:90,format:'96',nPlates:4,excess:1.1}},pub:'{{cellLine}} cells were seeded in {{format}}-well plates and grown to ~80% confluence over 24\u201348 h.',html:'<p>Seed {{cellLine}} into clear {{format}}-well plates (2 compounds/plate). Incubate 24&ndash;48 h until ~80% confluent.</p><ul class="lb-check"><li>Cells counted and diluted</li><li>Plates seeded and labelled</li><li>Back in incubator</li></ul>'},
    {d:2,title:'Compound addition + lysis',pub:'Compounds were serially diluted from 1000&times; DMSO stocks into medium and added to the cells at 10&times; (1/10 volume) for {{treatH}} h. Cells were lysed in 20 &micro;L/well of 2% SDS, 50 mM Tris&middot;HCl with protease inhibitors and benzonase, and stored at &minus;20 &deg;C.',html:'<p><b>Compounds</b>: 1000&times; stocks in DMSO (serial dilution). Add 1 &micro;L stock to 99 &micro;L DMEM (10&times;), then 10 &micro;L of 10&times; to cells. Incubate {{treatH}} h.</p><p><b>Lysis</b>: 20 &micro;L/well, 2% SDS, 50 mM Tris&middot;HCl, 100&times; PI, 1000&times; benzonase. Store &minus;20 &deg;C.</p><ul class="lb-check"><li>Compounds diluted</li><li>Treated &mdash; note start time</li><li>Lysed and frozen</li></ul>'},
    {d:3,title:'Sample prep + gel + transfer + primary',pub:'Lysates were denatured in LDS sample buffer with DTT, resolved on MOPS gels at 145 V for 90 min and wet-transferred at 90 V for 90 min. Membranes were blocked for 1 h at room temperature and probed overnight at 4 &deg;C for {{targets}}.',html:'<p><b>Sample prep</b> (96 samples, +10%): 4&times; LDS 3250 &micro;L + 10&times; DTT 1300 &micro;L &rarr; 43.1 &micro;L/sample. Denature.</p><p><b>Gel</b>: MOPS, 145 V, 90 min. <b>Transfer</b>: wet, 90 V, 90 min (Ponceau). <b>Block</b>: 1 h RT.</p><p><b>Primary</b> (4 &deg;C, overnight) &mdash; targets: <b>{{targets}}</b>. Typical dilutions: &alpha;-BRD4 Rb 1:1000 (CST) &middot; &alpha;-BRD3 Ms 1:500 (Abcam) &middot; &alpha;-BRD2 Rb 1:1000 &middot; &alpha;-CRBN Rb 1:1000 &middot; &alpha;-VHL Rb 1:1000.</p><p><i>Variations (edit as needed): 170 V running &middot; iBlot dry transfer &middot; primary 1 h RT.</i></p><ul class="lb-check"><li>Samples denatured</li><li>Gel run</li><li>Transferred + Ponceau imaged</li><li>Primary on, 4 &deg;C</li></ul>'},
    {d:4,title:'Secondary + image',pub:'Membranes were incubated with fluorescent secondary antibodies for 1 h at room temperature (1:5000) and imaged. Band intensities were quantified and normalised to {{loadCtrl}}.',html:'<p><b>Secondary</b> (1 h RT): {{loadCtrl}} Rho 1:5000 &middot; &alpha;-Rb/Ms 800 1:5000. <b>Image</b>.</p><ul class="lb-check"><li>Washed + secondary on</li><li>Imaged</li></ul><p><b>Results</b></p><p></p>'}]},
  HB:{title:'HiBiT degradation',blocks:[
    {d:0,title:'Seeding',calc:{kind:'seed',inputs:{cellLine:'HEK293',cellsPerWell:3000,volPerWell:30,format:'384',nPlates:1,excess:1.5}},pub:'{{cellLine}} cells were seeded in {{format}}-well plates and left overnight.',html:'<p>Seed {{cellLine}} into {{format}}-well plate(s). Incubate overnight.</p><ul class="lb-check"><li>Cells counted and diluted</li><li>Plates seeded</li></ul>'},
    {d:1,title:'Compound addition',pub:'Compounds were added by {{dosing}}, keeping DMSO at or below 0.25%, and cells were treated for {{treatH}} h.',html:'<p><b>Compound addition &mdash; {{dosing}}</b>. Echo: picklist <code>&lt;code&gt;_Picklist.csv</code>, DMSO &le; 0.25%. Manual: 1000&times; DMSO stocks &rarr; 10&times; in medium &rarr; add 1/10 volume.</p><p>Incubate {{treatH}} h.</p><ul class="lb-check"><li>Picklist / dilutions ready</li><li>Compounds added &mdash; note start time</li></ul>'},
    {d:1,title:'HiBiT Lytic + read',calc:{kind:'lytic',inputs:{format:'384',nPlates:1,cellVolPerWell:30,ratio:2,lgbitDil:100,subDil:50,excess:1.1}},pub:'Luminescence was read on a BMG PHERAstar at 0.2 s per well, normalised to the DMSO control and fitted with a four-parameter logistic model to give DC&#8325;&#8320; and D<sub>max</sub>.',html:'<p><b>Read</b>: PHERAstar, 0.2 s/well.</p><ul class="lb-check"><li>Lytic reagent prepared</li><li>Plate read + data saved</li></ul>'},
    {d:1,title:'Results',html:'<p><b>Results</b></p><p></p>'}]},
  CTG:{title:'Cell viability',blocks:[
    {d:0,title:'Seed + compounds',calc:{kind:'seed',inputs:{cellLine:'SUDHL5',cellsPerWell:30000,volPerWell:90,format:'96',nPlates:4,excess:1.1}},pub:'{{cellLine}} cells were seeded in {{format}}-well plates, one plate per readout, and treated with compound serially diluted from {{topConc}} nM in {{df}}-fold steps over {{nPoints}} points alongside a DMSO control.',html:'<p>Seed {{cellLine}} into {{format}}-well plates &mdash; one copy per readout.</p><p><b>Serial dilution</b>: {{topConc}} nM top, DF={{df}}, {{nPoints}} points + DMSO control. Add compounds; incubate.</p><ul class="lb-check"><li>Cells counted and seeded</li><li>Serial dilution prepared</li><li>Compounds added</li></ul>'},
    {d:1,title:'CTG — 24 h readout',calc:{kind:'ctg',inputs:{format:'96',nPlates:2,volPerWell:50,excess:1.1}},pub:'Viability was measured 24 h after compound addition.',html:'<p>Equilibrate to RT, add CTG, shake, read luminescence. Data analysis (24 h).</p><ul class="lb-check"><li>Plate read + data saved</li></ul>'},
    {d:3,title:'CTG — 72 h readout',calc:{kind:'ctg',inputs:{format:'96',nPlates:2,volPerWell:50,excess:1.1}},pub:'Viability was measured 72 h after compound addition. Luminescence was normalised to the vehicle control and fitted with a four-parameter logistic model.',html:'<p>Equilibrate to RT, add CTG, shake, read luminescence. Data analysis (72 h).</p><ul class="lb-check"><li>Plate read + data saved</li></ul>'}]},
  NB:{title:'NanoBRET target engagement',blocks:[
    {d:0,title:'Seed',calc:{kind:'seed',inputs:{cellLine:'HEK293',cellsPerWell:800000,volPerWell:2000,format:'6',nPlates:1,excess:1.1}},pub:'{{cellLine}} cells were seeded in 6-well plates at 0.8&times;10&#8310; cells per well, with one well left untransfected.',html:'<p>Seed {{cellLine}} in a 6-well plate: {{nTransfect}} transfected + 1 untransfected, 0.8 M/well.</p>'},
    {d:1,title:'Transfection (FuGENE HD)',pub:'Cells were transfected with 0.02 &micro;g of plasmid and 2 &micro;g of carrier DNA per well, complexed with 6 &micro;L FuGENE HD in 100 &micro;L Opti-MEM for 10 min at room temperature, and left ~20 h at 37 &deg;C, 5% CO&#8322;.',html:'<p>Per 6-well: 0.02 &micro;g plasmid + 2 &micro;g carrier DNA &rarr; 100 &micro;L OptiMEM. Add 6 &micro;L FuGENE HD, mix gently (do not vortex), 10 min RT. Add dropwise. Incubate ~20 h at 37 &deg;C, 5% CO&#8322;.</p><ul class="lb-check"><li>Complexes made</li><li>Added dropwise</li></ul>'},
    {d:2,title:'Harvest + replate',pub:'Cells were trypsinized, resuspended in phenol red-free Opti-MEM with 4% FBS at 2.2&times;10&#8309; cells/mL and seeded at 90 &micro;L per well in white {{format}}-well plates, with or without {{ligand}}.',html:'<p>Trypsinize; resuspend in phenol-red-free OptiMEM + 4% FBS; adjust to 2.2&times;10&#8309; cells/mL.</p><p>&minus; ligand: 90 &micro;L/well into a white {{format}}-well plate. + ligand: {{ligand}} at 1 &micro;L/mL suspension, then 90 &micro;L/well.</p>'},
    {d:3,title:'Treat + NanoBRET read',calc:{kind:'reagent',inputs:{name:'NanoBRET substrate',diluent:'OptiMEM',totalVol:2520,dilution:100}},pub:'Cells were pre-treated with MG132 at 10 &micro;M for 1 h, then incubated with test compounds serially diluted 3-fold from 1 &micro;M for 3 h. NanoBRET substrate was added at 25 &micro;L per well, the plate shaken for ~10 s and read at 460 nm (donor) and 618 nm (acceptor). Wells lacking HaloTag ligand were subtracted from the matching wells containing it, and the corrected ratio expressed relative to the DMSO control.',html:'<p><b>MG132</b> pre-treatment: {{mg132}} &mdash; 10 &micro;M final (10&times; in OptiMEM), 1 h. <b>Test compounds</b>: 10&times; serial (1 &micro;M, DF=3) in OptiMEM, add 11 &micro;L (&rarr;110 &micro;L), 3 h.</p><p><b>NanoBRET substrate</b> (prepared above): add 25 &micro;L/well, shake ~10 s, read.</p><ul class="lb-check"><li>Compounds added</li><li>Substrate added + read</li></ul>'}]},
  KD:{title:'Kinetic degradation (live-cell HiBiT)',blocks:[
    {d:0,title:'Seeding',calc:{kind:'seed',inputs:{cellLine:'HEK293-HiBiT',cellsPerWell:20000,volPerWell:75,format:'96',nPlates:2,excess:1.5}},pub:'{{cellLine}} cells were seeded in white {{format}}-well plates.',html:'<p>Seed {{cellLine}} into a <b>WHITE</b> {{format}}-well plate.</p><ul class="lb-check"><li>Cells counted and seeded</li></ul>'},
    {d:1,title:'LgBiT transfection (ViaScript mRNA)',pub:'Cells were transfected with LgBiT mRNA using ViaScript, the medium replaced with 100 &micro;L per well of the transfection medium, and incubated overnight at 37 &deg;C.',html:'<p>Per 2&times;96: 20 &micro;L LgBiT mRNA + 20 &micro;L ViaScript &rarr; 160 &micro;L buffer, 15&ndash;30 min. Dilute with 1800 &micro;L buffer, add to 18 mL media. Aspirate; add 100 &micro;L/well. Incubate overnight at 37 &deg;C.</p>'},
    {d:2,title:'Endurazine + kinetic read',calc:{kind:'reagent',inputs:{name:'Endurazine',diluent:'assay medium',totalVol:9500,dilution:100}},pub:'Medium was replaced with 90 &micro;L per well of CO&#8322;-independent medium containing 10% FBS and Endurazine, and equilibrated for 2.5 h at 37 &deg;C. A pre-read was taken for normalisation, compounds were added at 10&times; (10 &micro;L per well), and luminescence recorded at 37 &deg;C for {{runMin}} min at {{intervalMin}} min intervals. Traces were normalised to the pre-read and to the vehicle control.',html:'<p>Assay medium = CO&#8322;-independent + 10% FBS. Aspirate; add 90 &micro;L Endurazine/well; equilibrate 2.5 h at 37 &deg;C.</p><p>Prepare 10&times; compounds in assay medium. Plate-read before start (normalization). Add 10 &micro;L 10&times;/well. <b>Kinetic read</b> GloMax 37 &deg;C &mdash; {{runMin}} min at {{intervalMin}} min intervals.</p><ul class="lb-check"><li>Endurazine on, equilibrated 2.5 h</li><li>Pre-read done</li><li>Compounds added + kinetic run started</li></ul>'}]},
  RTX:{title:'Reverse transfection (FuGENE)',blocks:[
    {d:0,title:'Master mix + seed (reverse transfection)',pub:'{{cellLine}} cells were reverse-transfected in {{format}}-well plates: {{dnaNg}} ng of DNA per well was complexed with FuGENE HD at a {{fugeneRatio}}:1 ratio (&micro;L:&micro;g DNA) in 100 &micro;L Opti-MEM, left 5&ndash;15 min at room temperature, dispensed into the wells and overlaid with 1.5&ndash;2.0&times;10&#8309; freshly trypsinized cells per well. Plates were incubated at 37 &deg;C, 5% CO&#8322; for {{endpointD}} day(s).',html:'<p><b>Reverse transfection</b> &mdash; see the <b>Reverse Transfection</b> protocol in Archive for the plate-format calculator (6/12/24/96-well).</p><ul><li>Master mix (per {{format}}-well): 100 &micro;L OptiMEM + {{dnaNg}} ng DNA + FuGENE at {{fugeneRatio}}:1 (&micro;L : &micro;g DNA)</li><li>Incubate complexes 5&ndash;15 min RT; dispense 100 &micro;L/well</li><li>Overlay medium + 1.5&ndash;2.0&times;10&#8309; freshly trypsinized {{cellLine}} cells/well</li></ul><p>Incubate 37 &deg;C, 5% CO&#8322; for {{endpointD}} day(s) to endpoint.</p><ul class="lb-check"><li>Master mix made</li><li>Cells overlaid</li></ul>'},
    {d:2,title:'Readout',html:'<p class="pub-skip"><b>Readout</b> at endpoint</p><p></p>'}]},
  D2B:{title:'Direct-to-biology',blocks:[
    {d:0,title:'Reaction setup',pub:'Reactions were assembled by cherry-pick and plate reformat and left to react overnight.',html:'<p><b>Reaction</b>: Cherry Pick + Plate Reformat. React overnight.</p>'},
    {d:1,title:'Compound addition (Echo gradient) + seed',calc:{kind:'seed',inputs:{cellLine:'HEK293',cellsPerWell:3000,volPerWell:20,format:'384',nPlates:19,excess:1.5}},pub:'Compounds were dispensed acoustically as a concentration gradient (2.5 nL drops, 50 nL maximum transfer) with DMSO held at or below {{dmsoMax}}%, {{cellLine}} cells were seeded on top in {{format}}-well plates, and the plates incubated ~{{treatH}} h.',html:'<p><b>Echo gradient</b> (see Echo app): DMSO &le; {{dmsoMax}}%, max transfer 50 nL, drop 2.5 nL. Pre-fill intermediates + backfill wells with 40 &micro;L neat DMSO before the run. <b>Seed {{cellLine}} on top</b> into {{format}}-well plates; incubate ~{{treatH}} h.</p><ul class="lb-check"><li>Backfill + intermediates ready</li><li>Echo run finished</li><li>Cells seeded on top</li></ul>'},
    {d:2,title:'HiBiT Lytic + read',calc:{kind:'lytic',inputs:{format:'384',nPlates:38,cellVolPerWell:20,ratio:2,lgbitDil:100,subDil:50,excess:1.2}},html:'<p><b>Read</b>: PHERAstar, 0.2 s/well.</p>'}]},
  PR:{title:'Proteomics (S-Trap → DIA-NN → Perseus)',blocks:[
    {d:0,title:'BCA + S-Trap digestion',pub:'Protein from {{nSamples}} samples was quantified by BCA and {{proteinUg}} &micro;g per sample digested on S-Trap micro columns: samples were reduced with DTT at 55 &deg;C for 20&ndash;30 min, alkylated with iodoacetamide in the dark for 10 min, acidified with phosphoric acid, loaded, washed three times, and digested with trypsin at 1:{{trypsinRatio}} overnight at 37 &deg;C.',html:'<p><b>BCA</b> protein quantification &mdash; {{nSamples}} samples. <b>S-Trap</b> (micro), take {{proteinUg}} &micro;g: {{proteinUg}}/[conc] &micro;L + water to 50 &micro;L.</p><ul><li>Reduce: DTT 500 mM, 2 &micro;L/tube, 55 &deg;C 20&ndash;30 min</li><li>Alkylate: IAA 375 mM, 2.8 &micro;L/tube, RT 10 min (dark)</li><li>Acidify: 12% phosphoric acid, 1:10</li><li>Trap: 7&times; binding/wash buffer; spin 4000g</li><li>Wash &times;3 (150 &micro;L binding/wash)</li><li>Trypsin 1:{{trypsinRatio}} (40 &micro;L/S-Trap), cap loose, 37 &deg;C overnight</li></ul><ul class="lb-check"><li>BCA done</li><li>Reduced + alkylated</li><li>Trypsin on, 37 &deg;C</li></ul>'},

// Sensible working volume per well (µL) for each plate format — keeps seeding/reagent
// calculators honest when you switch format in the setup panel.
var PLATE_VOL={'6':2000,'12':1000,'24':500,'48':250,'96':90,'384':30};
// Growth area per well (cm²) — the standard flat-bottom figures. Cells scale with area the way
// volume scales with PLATE_VOL, and until now only the volume moved when you changed the plate:
// switching a seeding step from 384 to 6-well rescaled 30 µL to 2000 µL and left 3,000
// cells/well sitting in a well that holds 30× that. The two numbers have to move together or
// the density is a fiction.
var PLATE_AREA={'6':9.6,'12':3.8,'24':1.9,'48':0.95,'96':0.32,'384':0.056};
// The anchor is the lab's own working figure — 0.8 M cells per 6-well — expressed per cm² so
// every other format follows from it: 800000 / 9.6 ≈ 83,000 cells/cm². That is a seed to be
// near-confluent the next day; a longer assay wants less, which is what Archive's seeding
// advisor computes from the line's doubling time.
var SEED_PER_CM2 = 800000/9.6;
function _seedRound(n){ if(!(n>0)) return 0;
  var mag=Math.pow(10, Math.floor(Math.log10(n))-1);
  return Math.round(n/mag)*mag; }
function seedCellsFor(fmt){ var a=PLATE_AREA[String(fmt)]; return a?_seedRound(a*SEED_PER_CM2):null; }
// Keep the density the user chose and move both numbers to the new plate.
function rescaleSeedInputs(I, newFmt){
  if(!I || I.format==null) return;
  var oldF=String(I.format), nf=String(newFmt);
  if(oldF===nf) return;
  var aOld=PLATE_AREA[oldF], aNew=PLATE_AREA[nf];
  var vOld=PLATE_VOL[oldF],  vNew=PLATE_VOL[nf];
  if(I.cellsPerWell!=null && aOld && aNew) I.cellsPerWell=_seedRound((+I.cellsPerWell)*(aNew/aOld));
  if(I.volPerWell!=null && vOld && vNew)   I.volPerWell=Math.round((+I.volPerWell)*(vNew/vOld)*10)/10;
  if(I.cellVolPerWell!=null && vOld && vNew) I.cellVolPerWell=Math.round((+I.cellVolPerWell)*(vNew/vOld)*10)/10;
  I.format=nf;
}
// Say when a density cannot be what you meant. Not a correction — the number is the user's —
// but 3,000 cells in a 6-well is 0.4% of what that plate takes, and nothing on screen said so.
function seedPlausibility(I, fixCall){
  if(!I||I.format==null||I.cellsPerWell==null) return '';
  var a=PLATE_AREA[String(I.format)]; if(!a) return '';
  var usual=seedCellsFor(I.format), c=+I.cellsPerWell;
  if(!(c>0)||!usual) return '';
  var ratio=c/usual;
  if(ratio>=0.04 && ratio<=2.5) return '';
  return '<div class="cc-warn">'+nfmt(c)+' cells/well in a '+esc(String(I.format))+'-well is '
    +(ratio<1 ? ('1/'+Math.round(1/ratio)+' of') : (Math.round(ratio)+'× '))
    +' the usual seed for this plate (~'+nfmt(usual)+'/well, from 0.8 M per 6-well). '
    +'Check the plate format or the cell number.'
    +(fixCall?(' <button class="cc-fix" onclick="'+fixCall+'">Use '+nfmt(usual)+'/well</button>'):'')
    +'</div>';
}
function setupSchema(type){ return SETUP_SCHEMA[type]||SETUP_SCHEMA.EXP; }
function setupDefaults(type){ var o={}; (setupSchema(type).fields||[]).forEach(function(f){ o[f.f]=f.d; }); return o; }
// A preset may answer the setup for you. The schema still decides which questions are asked —
// this only changes what they start at — so a variant preset cannot invent fields its type has
// no idea about.
function presetSetupHide(presetKey){
  var p=LB.data.presets[presetKey], sd=EXTRA_PRESET_SEED[presetKey];
  var h=(p&&p.setupHide)||(sd&&sd.setupHide)||[];
  return Array.isArray(h)?h:[];
}
function setupFieldsFor(presetKey){
  var hide=presetSetupHide(presetKey);
  return (setupSchema(presetBase(presetKey)).fields||[]).filter(function(f){ return hide.indexOf(f.f)<0; });
}
function setupDefaultsFor(presetKey){
  var o={}; setupFieldsFor(presetKey).forEach(function(f){ o[f.f]=f.d; });
  var p=LB.data.presets[presetKey];

// Push the setup answers into the instantiated day-blocks.

  // a multiple of it (e.g. D2B lyses 2 plates per assay plate) keep that ratio.
  var base=null;
  blocks.forEach(function(b){ if(b.calc&&b.calc.kind==='seed'&&base==null&&b.calc.inputs) base=+b.calc.inputs.nPlates||1; });

    // and a second pass has nothing left to fill. Keep the original the first time through.
    // Protocol blocks are excluded: their html is a cache rebuilt by refreshProtoHtml, not prose.

    } else {

      // anything you have typed into is yours and silently regenerating it would be data loss.
      if(b.tpl){

  // deviation. Captured after the setup is applied — answering the setup panel is planning,
  // not deviating — and refreshed when the setup is re-applied for the same reason.
  blocks.forEach(function(b){ if(b.calc&&b.calc.inputs) b.calcSeed=JSON.parse(JSON.stringify(b.calc.inputs)); });

}

// The two numbers you decide are the acceptor amount and how dilute the donor is relative to
// it: 80 ng of HaloTag construct and NanoLuc at 1:50 means 1.6 ng of NanoLuc, and the well
// therefore receives 81.6 ng — the total is an *output*, not an input. (It was the other way

    {key:'donor', name:(v.donorName||'Plasmid 1')+' only',    n:+v.nDonor||0,    d:(full?ng:dNg), a:0},
    {key:'acc',   name:(v.acceptorName||'Plasmid 2')+' only', n:+v.nAcceptor||0, a:(full?ng:aNg), d:0},
    {key:'mock',  name:'Mock (carrier only)', n:+v.nMock||0, d:0, a:0}

function _pipHint(ul){ if(!(ul>0)||ul>=1) return null;
  var f=10; while(ul*f<2 && f<1e6) f*=10;
  return {f:f, ul:ul*f, txt:'dilute 1:'+nfmt(f)+' and take '+nfmt(ul*f)+' µL'}; }
function rtxMixRecipe(v){
  var n=+v.nWells||0, ex=+v.excess||1, W=n*ex;
  var disp=+v.dispenseUL||0, tot=disp*W;
  if(!(n>0)||!(disp>0)) return '<b>Reverse transfection</b> — set the number of wells and the volume of complex per well.';
  var ngw=+v.ngPerWell||0, dnaNg=ngw*W, stock=+v.stockNgUl||0;
  var dnaUL=stock>0?(dnaNg/stock):0;
  var fug=(+v.fugeneRatio||0)*(dnaNg/1000);
  var dil=tot-dnaUL-fug;
  var name=esc(v.plasmid||'plasmid'), dl=esc(v.diluent||'Opti-MEM');
  var naive=tot+dnaUL+fug;
  var out='<b>Master mix</b> — '+nfmt(n)+' well'+(n===1?'':'s')+_ovxL(ex)+', '+nfmt(disp)+' µL of complex per well'
    +'<div class="cc-tblwrap"><table class="cc-tbl"><tr><th>Component</th><th>Amount</th></tr>'
    +'<tr><td>'+dl+'</td><td><b>'+nfmt(dil)+' µL</b></td></tr>'
    +'<tr><td>'+name+' — '+nfmt(dnaNg/1000)+' µg at '+nfmt(stock)+' ng/µL</td><td><b>'+nfmt(dnaUL)+' µL</b></td></tr>'
    +'<tr><td>FuGENE HD — '+nfmt(v.fugeneRatio)+':1 (µL per µg DNA)</td><td><b>'+nfmt(fug)+' µL</b></td></tr>'
    +'<tr><td><b>Total</b></td><td><b>'+nfmt(tot)+' µL</b></td></tr></table></div>'
    +'<div class="cc-note">Add the DNA to the '+dl+' first, then the FuGENE HD straight into the liquid, not down the tube wall. '
    +'Mix gently — do not vortex — and leave 5–15 min at room temperature before dispensing '+nfmt(disp)+' µL per well.<br>'
    +'The '+dl+' is the <b>remainder</b>, which is what makes the well receive '+nfmt(ngw)+' ng. Making up '+nfmt(tot)+' µL of '
    +dl+' and adding the DNA and FuGENE on top gives '+nfmt(naive)+' µL, and '+nfmt(disp)+' µL of that is only '
    +nfmt(dnaNg/naive*disp)+' ng.</div>';
  if(dil<=0) out+='<div class="cc-warn">The DNA and FuGENE alone come to '+nfmt(dnaUL+fug)+' µL — more than the '+nfmt(tot)
    +' µL the mix is meant to be. Use a more concentrated plasmid prep, or dispense more per well.</div>';
  else if(_pipHint(dnaUL)) out+='<div class="cc-warn">'+nfmt(dnaUL)+' µL of plasmid is not a volume to pipette directly — '
    +_pipHint(dnaUL).txt+'.</div>';
  return out;
}
function spikeRecipe(v){
  var V=+v.wellVolUL||0, X=+v.foldX||0, fin=+v.finalUM||0, stock=+v.stockUM||0;
  var n=+v.nWells||0, ex=+v.excess||1, dl=esc(v.diluent||'medium'), name=esc(v.name||'reagent');
  if(!(V>0)||!(X>1)) return '<b>Spike-in</b> — the well has to hold something and the intermediate has to be stronger than 1×.';
  var add=V/(X-1), newV=V+add, inter=fin*X, need=add*n*ex;
  var df=(inter>0&&stock>0)?(stock/inter):0;
  var vs=df>0?(need/df):0, vd=need-vs;
  var out='<b>Add '+nfmt(add)+' µL per well</b> of a '+nfmt(X)+'× intermediate to the '+nfmt(V)+' µL already in the well → '
    +nfmt(newV)+' µL/well'+(fin>0?(' at '+_fmtConc(fin*1000)+' '+name):(' of '+name))+'.'
    +'<div class="cc-tblwrap"><table class="cc-tbl"><tr><th>Step</th><th>Amount</th></tr>'
    +'<tr><td>'+nfmt(X)+'× intermediate'+(inter>0?(' at '+_fmtConc(inter*1000)):'')+' — '+nfmt(n)+' well'+(n===1?'':'s')+_ovxL(ex)+'</td><td><b>'+nfmt(need)+' µL</b></td></tr>'
    +(df>0?('<tr><td>'+name+' stock '+_fmtConc(stock*1000)+', diluted 1:'+nfmt(df)+'</td><td><b>'+nfmt(vs)+' µL</b></td></tr>'
           +'<tr><td>'+dl+'</td><td><b>'+nfmt(vd)+' µL</b></td></tr>'):'')
    +'</table></div>'
    +'<div class="cc-note">V/(X−1), not V/X — the intermediate becomes part of the final volume. Adding a tenth of '+nfmt(V)
    +' µL instead would put '+nfmt(V/X)+' µL in and leave every well at '+nfmt(100*X/(X+1))+'% of the dose you meant'
    +(fin>0?(' — '+_fmtConc(fin*1000*X/(X+1))+' instead of '+_fmtConc(fin*1000)):'')+'.</div>';
  if(df>0&&df<2) out+='<div class="cc-warn">The stock is only '+nfmt(df)+'× the intermediate — barely a dilution. '
    +'Check the stock concentration or make the intermediate weaker.</div>';
  else if(_pipHint(vs)) out+='<div class="cc-warn">'+nfmt(vs)+' µL of stock is not a volume to pipette directly — '
    +_pipHint(vs).txt+' of it into the '+dl+'.</div>';
  return out;
}
function serialRecipe(v){
  var topF=+v.topFinalNM||0, X=+v.foldX||1, df=+v.df||0, np=Math.max(1,Math.round(+v.nPoints||0));
  var keep=+v.volPerPoint||0, stockNM=(+v.stockUM||0)*1000, nc=Math.max(1,Math.round(+v.nCompounds||1));
  var dl=esc(v.diluent||'medium'), name=esc(v.name||'compounds');
  if(!(topF>0)||!(df>1)||!(keep>0)) return '<b>Serial dilution</b> — set a top concentration, a dilution factor above 1 and a volume per point.';
  var topI=topF*X;                       // top of the series as it is actually made
  var T=keep/(df-1);                     // carried down the series
  var first=keep+T;                      // tube 1 has to give one transfer away and still keep `keep`
  var d1=stockNM>0?(stockNM/topI):0;     // stock → tube 1
  var vs=d1>0?(first/d1):0;
  var dmso=(d1>0)?(100/(d1*X)):null;     // DMSO carried into the well, as a %
  var wv=+v.wellVolUL||0, addUL=(X>1&&wv>0)?(wv/(X-1)):0;   // V/(X−1) — the intermediate joins the volume
  var pts=[]; for(var i=0;i<np;i++) pts.push(_fmtConc(topF/Math.pow(df,i)));
  var out='<b>'+nfmt(np)+'-point '+nfmt(df)+'-fold series</b> — '+_fmtConc(topF)+' down to '+pts[np-1]+' <b>in the well</b>, '
    +'made at '+nfmt(X)+'× so the top tube is '+_fmtConc(topI)+'.'
    +'<div class="cc-tblwrap"><table class="cc-tbl"><tr><th>Step</th><th>Amount</th></tr>'
    +'<tr><td>Tube 1 at '+_fmtConc(topI)+' — from the '+_fmtConc(stockNM)+' stock, 1:'+nfmt(d1)+'</td><td><b>'+nfmt(vs)+' µL stock + '+nfmt(first-vs)+' µL '+dl+'</b></td></tr>'
    +'<tr><td>Tubes 2–'+nfmt(np)+' — '+dl+' to receive the transfer</td><td><b>'+nfmt(keep)+' µL each</b></td></tr>'
    +'<tr><td>Transfer down the series (mix, fresh tip each time)</td><td><b>'+nfmt(T)+' µL</b></td></tr>'
    +'<tr><td>Per compound / total for '+nfmt(nc)+'</td><td><b>'+nfmt(first+keep*(np-1))+' µL / '+nfmt((first+keep*(np-1))*nc)+' µL</b></td></tr>'
    +(wv>0?('<tr><td>Add to each well — '+nfmt(wv)+' µL already there</td><td><b>'+nfmt(addUL)+' µL → '+nfmt(wv+addUL)+' µL/well</b></td></tr>'):'')
    +'</table></div>'
    +'<div class="cc-note">Every tube ends holding '+nfmt(keep)+' µL except the last, which keeps '+nfmt(first)+' µL because nothing is taken out of it. '
    +'Series in the well: '+pts.join(' · ')+'.'
    +(dmso!=null?('<br>DMSO reaching the cells at the top point: <b>'+nfmt(dmso)+'%</b>'+(dmso>0.5?' — above the 0.5% most lines tolerate.':'')):'')
    +'</div>';
  // The advice has to keep the vehicle honest. Pre-diluting the DMSO stock in DMSO and then
  // under-diluting *that* into medium is the obvious-looking fix and it multiplies the DMSO
  // reaching the cells by exactly the factor you pre-diluted by.
  if(_pipHint(vs)){ var sc=Math.ceil(1/vs), t1=first*sc;
    out+='<div class="cc-warn">'+nfmt(vs)+' µL of DMSO stock is not a volume to pipette directly, and pre-diluting the stock '
      +'<i>in DMSO</i> would carry that much more vehicle into the well. Either make tube 1 at <b>'+nfmt(t1)+' µL</b> ('
      +nfmt(vs*sc)+' µL of stock into '+nfmt(t1-vs*sc)+' µL '+dl+') and discard the excess, or run the '+nfmt(df)
      +'-fold series in DMSO first and dilute every point 1:'+nfmt(d1)+' into '+dl+' — same '+nfmt(dmso!=null?dmso:0)+'% at every point.</div>'; }
  if(dmso!=null&&dmso>0.5) out+='<div class="cc-warn">'+nfmt(dmso)+'% DMSO at the top point. Use a more concentrated DMSO stock, '
    +'or backfill the lower points so the vehicle is the same across the series.</div>';
  return out;
}

function insertStepBlock(spec, at){
  var e=_curExp(); if(!e) return;
  var n=(e.blocks||[]).length;
  var idx=(at==null||at<0||at>n) ? n : at;
  var prev=(idx>0)?e.blocks[idx-1]:null;
  var d=(prev&&prev.date) || (n?e.blocks[0].date:'') || e.startDate || todayStr();
  var blk={id:uid(), date:d, dayOffset:daysBetween(expAnchorDate(e),d), title:spec.title||'', html:spec.html||'<p></p>', done:false, completedAt:null};
  if(spec.archivePid) blk.calc={kind:'archive',pid:spec.archivePid,inputs:{},recipe:''};
  else if(spec.calc) blk.calc={kind:spec.calc,inputs:calcDefaults(spec.calc)};
  if(spec.part){ blk.part=spec.part; blk.sourcePid=spec.sourcePid; }
  e.blocks.splice(idx,0,blk);
  save(); renderEditor(); setTimeout(function(){ scrollBlk(blk.id); },80);
}
