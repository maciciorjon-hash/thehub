<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Incubator</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f4f5f8;--surface:#ffffff;--surface2:#f0f1f5;--surface3:#e4e6ee;
  --border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.13);
  --text:#1a1d2e;--text2:#5a5f7a;--text3:#9ca0b8;
  --brand:#4a8fb5;--accent:#5e87c5;--accent-dim:rgba(94,135,197,0.12);--accent-soft:rgba(94,135,197,0.22);
  --warn:#c47818;--warn-bg:rgba(224,140,48,.15);
  --soft:#5075b5;--soft-bg:rgba(94,135,197,.15);
  --ok:#2d9462;--ok-bg:rgba(45,148,98,.14);
  --urgent:#d8544d;--urgent-bg:rgba(216,84,77,.14);
  --sans:'IBM Plex Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow-xs:0 1px 4px rgba(0,0,0,.04);--shadow-sm:0 2px 8px rgba(0,0,0,.06);
  --shadow-md:0 6px 24px rgba(0,0,0,.09);
  --glass:rgba(255,255,255,0.64);--glass-brd:rgba(255,255,255,0.7);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.7);--glass-shadow:0 10px 30px -12px rgba(32,44,84,.24);
  --r3:16px;--ease:cubic-bezier(.2,.8,.3,1);
}
[data-theme="dark"]{
  --bg:#0d0f14;--surface:#13161e;--surface2:#1c2030;--surface3:#252a3a;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e8eaf2;--text2:#8b90a8;--text3:#4e5368;
  --brand:#7fb6d0;--accent:#8aaee0;--accent-dim:rgba(138,174,224,0.16);--accent-soft:rgba(138,174,224,0.26);
  --warn:#f0b060;--warn-bg:rgba(224,140,48,.18);
  --soft:#8fb0e0;--soft-bg:rgba(94,135,197,.18);
  --ok:#6ddca8;--ok-bg:rgba(45,148,98,.18);
  --urgent:#f08a84;--urgent-bg:rgba(216,84,77,.18);
  --shadow-xs:0 1px 4px rgba(0,0,0,.30);--shadow-sm:0 2px 8px rgba(0,0,0,.40);
  --shadow-md:0 6px 24px rgba(0,0,0,.50);
  --glass:rgba(28,32,46,0.6);--glass-brd:rgba(255,255,255,0.1);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.07);--glass-shadow:0 12px 36px -12px rgba(0,0,0,.6);
}
input::placeholder,textarea::placeholder{color:var(--text3);opacity:1;}
html,body{height:100%;overflow:hidden;}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;position:relative;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:radial-gradient(48% 42% at 4% 4%,var(--accent-dim),transparent 70%),radial-gradient(46% 42% at 96% 98%,var(--accent-dim),transparent 72%);}
[data-theme="dark"] body::before{opacity:.7;}
body>*{position:relative;z-index:1;}

header{border-bottom:1px solid var(--border);padding:0 28px;display:flex;
  align-items:center;gap:14px;background:var(--surface);min-height:58px;flex-shrink:0;}
.logo{width:32px;height:32px;border-radius:7px;background:var(--accent);display:flex;
  align-items:center;justify-content:center;flex-shrink:0;}
.logo svg{width:20px;height:20px;}
.app-name{font-size:15px;font-weight:600;letter-spacing:-0.2px;}
.app-sub{font-size:11px;color:var(--text2);}
@media(max-width:480px){header .app-sub{display:none;}}

.tabs{display:flex;gap:2px;padding:0 28px;background:var(--surface);
  border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;}
.tab{padding:11px 16px;border:none;background:none;color:var(--text2);
  font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;
  white-space:nowrap;display:inline-flex;align-items:center;gap:7px;}
.tab svg{width:15px;height:15px;flex-shrink:0;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

.scroll{flex:1;overflow-y:auto;}
.wrap{max-width:840px;margin:0 auto;padding:26px 28px 60px;}
.pane{display:none;}
.pane.active{display:block;}

.sec-eyebrow{font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--text3);margin:0 0 14px;}

/* Inputs / buttons */
.inp,.sel,textarea.inp{background:var(--surface2);border:1px solid var(--border2);
  border-radius:8px;padding:8px 11px;font-family:var(--sans);font-size:13px;color:var(--text);
  outline:none;transition:border-color .15s;width:100%;}
.inp:focus,.sel:focus,textarea.inp:focus{border-color:var(--accent);}
textarea.inp{resize:vertical;min-height:52px;line-height:1.5;}
.btn{background:var(--accent);border:none;color:#fff;border-radius:8px;padding:8px 16px;
  font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:filter .15s;white-space:nowrap;}
.btn:hover{filter:brightness(1.06);}
.btn.ghost{background:none;border:1px solid var(--border2);color:var(--text2);font-weight:500;}
.btn.ghost:hover{background:var(--surface2);color:var(--text);}
.btn.sm{padding:5px 11px;font-size:12px;}
.btn.danger{background:none;border:1px solid var(--border2);color:var(--urgent);}
.btn.danger:hover{background:var(--urgent-bg);}

/* Filter pills */
.filters{display:flex;gap:6px;margin-bottom:16px;}
.fpill{padding:5px 13px;border:1px solid var(--border2);border-radius:20px;background:none;
  color:var(--text2);font-family:var(--sans);font-size:12px;cursor:pointer;transition:background .15s;}
.fpill.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* Task add row */
.add-task{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.add-task .inp{flex:1;min-width:180px;}
.add-task .sel{width:auto;flex-shrink:0;}
.add-task input[type=date].inp{width:auto;flex-shrink:0;}

/* Task rows */
.task{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:11px;margin-bottom:8px;box-shadow:var(--shadow-xs);}
.task.done{opacity:.55;}
.task.done .task-txt{text-decoration:line-through;}
.check{width:19px;height:19px;border-radius:6px;border:1.7px solid var(--border2);cursor:pointer;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;}
.check:hover{border-color:var(--accent);}
.check.on{background:var(--accent);border-color:var(--accent);}
.check.on svg{width:11px;height:11px;color:#fff;}
.task-txt{flex:1;font-size:13.5px;line-height:1.4;cursor:text;word-break:break-word;}
.task-due{font-size:11px;font-family:var(--mono);color:var(--text3);white-space:nowrap;}
.task-due.over{color:var(--urgent);}
.pbadge{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;font-family:var(--mono);
  padding:3px 8px;border-radius:20px;cursor:pointer;user-select:none;flex-shrink:0;}
.pbadge.urgent{background:var(--urgent-bg);color:var(--urgent);}
.pbadge.pending{background:var(--surface3);color:var(--text2);}
.icon-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;border-radius:6px;
  display:flex;align-items:center;transition:color .15s,background .15s;flex-shrink:0;}
.icon-btn:hover{color:var(--text);background:var(--surface2);}
.icon-btn svg{width:15px;height:15px;}

/* Incubator */
.inc-bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.inc-search{position:relative;flex:1;min-width:180px;}
.inc-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text3);pointer-events:none;}
.inc-search input{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:9px;
  padding:8px 11px 8px 31px;font-family:var(--sans);font-size:13px;color:var(--text);outline:none;}
.inc-search input:focus{border-color:var(--accent);}
.inc-filters{display:flex;gap:4px;}
.inc-fp{padding:6px 12px;border:1px solid var(--border2);border-radius:20px;background:none;
  color:var(--text2);font-family:var(--sans);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .14s,color .14s,border-color .14s;}
.inc-fp:hover{background:var(--surface2);color:var(--text);}
.inc-fp.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.inc-fp .n{font-family:var(--mono);font-size:10px;opacity:.75;margin-left:5px;}
@media(max-width:1000px){ .inc-search{flex:1 1 100%;} }
@media(max-width:640px){ .inc-filters{flex:1 1 100%;overflow-x:auto;} }
/* ── The list ── */
.clist{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow-xs);}
.clist-hd,.crow{display:grid;grid-template-columns:minmax(150px,2.1fr) 52px minmax(64px,.8fr) minmax(96px,1.3fr) minmax(104px,1.2fr) minmax(96px,1fr) 34px;
  gap:12px;align-items:center;padding:0 14px;}
.clist-hd{height:34px;background:var(--surface2);border-bottom:1px solid var(--border);}
.clist-hd button{background:none;border:none;padding:0;text-align:left;cursor:pointer;font-family:var(--mono);
  font-size:9.5px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--text3);}
.clist-hd button:hover{color:var(--text2);}
.clist-hd button.sorted{color:var(--accent);}
.crow{height:46px;border-bottom:1px solid var(--border);cursor:pointer;background:none;width:100%;
  font-family:var(--sans);text-align:left;color:var(--text);transition:background .12s;}
.crow:last-child{border-bottom:none;}
.crow:hover{background:var(--accent-dim);}
.crow.on{background:var(--accent-dim);box-shadow:inset 3px 0 0 var(--accent);}
.crow.cc-flash{background:var(--accent-dim);box-shadow:inset 3px 0 0 var(--accent),0 0 0 2px var(--accent-soft);}
.cr-line{display:flex;align-items:center;gap:8px;min-width:0;}
.cr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.cr-dot.ok{background:var(--ok);} .cr-dot.soft{background:var(--soft);} .cr-dot.warn{background:var(--urgent);}
.cr-nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cr-p{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--text2);}
.cr-c{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cr-due{font-size:12px;font-weight:600;white-space:nowrap;}
.cr-due.ok{color:var(--text2);} .cr-due.soft{color:var(--soft);} .cr-due.warn{color:var(--urgent);}
.cr-where{font-size:11.5px;font-family:var(--mono);color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cr-go{color:var(--text3);font-size:14px;text-align:right;}
@media(max-width:760px){
  .clist-hd{display:none;}
  .crow{grid-template-columns:1fr auto;grid-auto-rows:auto;height:auto;padding:10px 14px;gap:4px 10px;}
  .cr-c,.cr-where,.cr-go{display:none;}
}
/* ── The drawer ── */
.drw-back{position:fixed;inset:0;background:rgba(16,22,40,.34);opacity:0;pointer-events:none;
  transition:opacity .22s var(--ease);z-index:300;}
.drw-back.open{opacity:1;pointer-events:auto;}
.drw{position:fixed;top:0;right:0;bottom:0;width:min(420px,94vw);background:var(--surface);
  border-left:1px solid var(--border2);box-shadow:-18px 0 48px -18px rgba(20,30,60,.3);
  transform:translateX(102%);transition:transform .26s var(--ease);z-index:301;overflow-y:auto;padding:20px 22px 40px;}
.drw.open{transform:translateX(0);}
.drw-hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px;}
.drw-title{font-size:18px;font-weight:700;letter-spacing:-.3px;flex:1;line-height:1.25;}
.drw-x{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;border-radius:7px;flex-shrink:0;}
.drw-x:hover{color:var(--text);background:var(--surface2);}
.drw-x svg{width:16px;height:16px;display:block;}
.drw-sec{font-size:9.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--text3);
  font-family:var(--mono);margin:20px 0 8px;}
.drw-vessel{display:flex;justify-content:center;padding:4px 0 2px;}
.drw-vessel svg{width:108px;height:108px;}
.inc-top-right{display:flex;align-items:center;gap:10px;}
.inc-viewtoggle{display:inline-flex;background:var(--surface2);border:1px solid var(--border2);border-radius:9px;overflow:hidden;}
.ivt{border:none;background:none;color:var(--text2);font-family:var(--sans);font-size:12px;font-weight:600;padding:6px 12px;cursor:pointer;transition:background .14s,color .14s;}
.ivt.on{background:var(--accent);color:#fff;}
/* ── Vessel grid (flasks / plates) ── */
.cell-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px 12px;align-items:start;}
.vsl{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 4px 10px;border-radius:var(--r3);border:1px solid transparent;transition:background .18s,border-color .18s,box-shadow .25s;}
.vsl:hover{background:var(--glass);border-color:var(--glass-brd);}
.vsl-face{position:relative;background:none;border:none;cursor:pointer;padding:0;width:100%;display:flex;align-items:center;justify-content:center;}
.vsl-svg{width:104px;height:104px;filter:drop-shadow(0 8px 14px rgba(30,40,70,.14));transition:transform .2s var(--ease);}
.vsl-face:hover .vsl-svg{transform:translateY(-4px);}
.vsl-glass{fill:rgba(255,255,255,.14);stroke:var(--border2);stroke-width:1.6;}
[data-theme="dark"] .vsl-glass{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.18);}
/* The flask body is opaque: the neck is drawn behind it, and through a translucent fill it
   showed as a diagonal line straight across the medium. */
.vsl-base{fill:#fbfcfe;}
[data-theme="dark"] .vsl-base{fill:#252b3b;}
.vsl-cap{fill:#6f8fc9;stroke:#4c6ba6;stroke-width:1.1;}
.vsl-capline{stroke:rgba(0,0,0,.18);stroke-width:1;stroke-linecap:round;}
[data-theme="dark"] .vsl-capline{stroke:rgba(0,0,0,.3);}
.vsl-neck{fill:#eef1f7;stroke:rgba(28,38,66,.22);stroke-width:1.6;}
[data-theme="dark"] .vsl-neck{fill:#232838;stroke:rgba(255,255,255,.2);}
.vsl-men{fill:none;stroke:rgba(255,255,255,.62);stroke-width:1.5;}
.vsl-line{stroke:rgba(255,255,255,.5);stroke-width:1.2;}
.vsl-rim{fill:none;stroke:rgba(28,38,66,.26);stroke-width:1.7;}
[data-theme="dark"] .vsl-rim{stroke:rgba(255,255,255,.26);}
.vsl-sheen{fill:rgba(255,255,255,.28);}
/* Dark ink, not white. The medium is pastel now, so white needed a heavy shadow to survive
   on the yellow and still read as a smudge; dark ink is legible on all three. */
.vsl-p{position:absolute;left:0;right:0;bottom:24%;font-size:16px;font-weight:700;color:#4a3b33;text-shadow:0 1px 0 rgba(255,255,255,.45);letter-spacing:.2px;pointer-events:none;}
.vsl-name{font-size:13px;font-weight:700;color:var(--text);margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.vsl-tag{font-size:10.5px;font-weight:600;margin-top:2px;line-height:1.3;color:var(--text3);max-width:100%;}
.vsl-tag.st-ok{color:var(--ok);}
.vsl-tag.st-soft{color:var(--soft);}
.vsl-tag.st-warn{color:var(--urgent);}
.vsl.due .vsl-svg{animation:vslPulse 2.2s ease-in-out infinite;}
@keyframes vslPulse{0%,100%{filter:drop-shadow(0 8px 14px rgba(242,198,60,.22));}50%{filter:drop-shadow(0 8px 20px rgba(242,198,60,.5));}}
.vsl.cc-flash{background:var(--glass);border-color:var(--accent2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent2) 30%,transparent);}
/* expanded tile spans the row: flask on the left, details on the right */
.vsl.open{grid-column:1/-1;flex-direction:row;align-items:flex-start;text-align:left;gap:20px;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--glass-brd);border-radius:var(--r3);box-shadow:var(--glass-shadow),var(--glass-hi);padding:18px;}
.vsl-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:130px;}
.vsl.open .vsl-name{margin-top:8px;}
.vsl-detail{flex:1;min-width:0;}
.vsl-detail-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;}
.vsl-close{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;border-radius:7px;flex-shrink:0;}
.vsl-close:hover{color:var(--text);background:var(--surface2);}
.vsl-close svg{width:16px;height:16px;display:block;}
@media(max-width:560px){ .cell-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));} .vsl-svg{width:88px;height:88px;} .vsl.open{flex-direction:column;} .vsl-col{width:100%;} }
.cell-card{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--glass-brd);border-radius:var(--r3);
  padding:16px 18px;margin-bottom:12px;box-shadow:var(--glass-shadow),var(--glass-hi);transition:box-shadow .25s var(--ease),border-color .25s,transform .18s var(--ease);}
.cell-card:hover{transform:translateY(-2px);}
@keyframes ccFlash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent2) 55%,transparent);}100%{box-shadow:0 0 0 8px transparent;}}
.cell-card.cc-flash{border-color:var(--accent2);animation:ccFlash 1.6s ease-out;}
.cc-head{display:flex;align-items:flex-start;gap:12px;}
.cc-name{font-size:15px;font-weight:700;letter-spacing:-.2px;}
.cc-type{font-size:9.5px;font-family:var(--mono);color:var(--text3);letter-spacing:.5px;
  border:1px solid var(--border2);padding:1px 6px;border-radius:10px;margin-left:8px;vertical-align:middle;}
.cc-passage{margin-left:auto;text-align:right;flex-shrink:0;}
.cc-p-num{font-size:20px;font-weight:700;line-height:1;font-family:var(--mono);}
.cc-p-lbl{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);font-family:var(--mono);margin-top:2px;}
.cc-alerts{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
.alert{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;}
.alert.warn{background:var(--warn-bg);color:var(--warn);}
.alert.soft{background:var(--soft-bg);color:var(--soft);}
.alert.ok{background:var(--ok-bg);color:var(--ok);}
.cc-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px 18px;
  margin-top:13px;padding-top:13px;border-top:1px solid var(--border);}
.cc-meta-item .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);font-family:var(--mono);}
.cc-meta-item .v{font-size:12.5px;color:var(--text);margin-top:2px;}
.cc-notes{font-size:12.5px;color:var(--text2);line-height:1.55;margin-top:11px;padding-top:11px;border-top:1px solid var(--border);white-space:pre-wrap;}
.cc-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;}

/* Form card */
.form-card{background:var(--surface);border:1px solid var(--accent);border-radius:14px;
  padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.form-title{font-size:13px;font-weight:700;margin-bottom:14px;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 14px;}
.fld{display:flex;flex-direction:column;gap:5px;}
.fld.full{grid-column:1/-1;}
.fld label{font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);}
.form-hint{font-size:11.5px;color:var(--accent);margin-top:10px;min-height:1em;font-family:var(--mono);}
.form-actions{display:flex;gap:8px;margin-top:16px;}

/* Split inline panel */
.split-panel{background:var(--surface2);border:1px dashed var(--border2);border-radius:10px;
  padding:13px 15px;margin-top:12px;}
.split-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.split-row .fld{flex:1;min-width:90px;}

/* History */
.hist{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.hist-item{font-size:11.5px;color:var(--text2);font-family:var(--mono);padding:3px 0;display:flex;gap:10px;}
.hist-item .ht-date{color:var(--text3);flex-shrink:0;}

.empty{text-align:center;padding:48px 20px;color:var(--text3);}
.empty svg{width:38px;height:38px;opacity:.5;margin-bottom:12px;}
.empty-title{font-size:14px;font-weight:600;color:var(--text2);margin-bottom:5px;}
.empty-sub{font-size:12.5px;line-height:1.6;}

.confirm-row{display:flex;align-items:center;gap:10px;background:var(--urgent-bg);
  border-radius:8px;padding:8px 12px;margin-top:10px;font-size:12.5px;color:var(--urgent);}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--text);color:var(--bg);font-size:12.5px;font-weight:500;padding:10px 18px;
  border-radius:22px;box-shadow:var(--shadow-md);opacity:0;transition:transform .3s,opacity .3s;z-index:100;pointer-events:none;max-width:90vw;text-align:center;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

.guide-note{font-size:11.5px;color:var(--text3);line-height:1.6;margin-top:24px;padding:14px 16px;
  background:var(--surface2);border-radius:10px;}
.guide-note b{color:var(--text2);}
/* Cell-line picker modal */
.cf-pick-back{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;align-items:flex-start;justify-content:center;padding:48px 16px;overflow:auto;}
.cf-pick-back.open{display:flex;}
.cf-pick-modal{background:var(--surface);border:1px solid var(--border2);border-radius:14px;width:100%;max-width:460px;box-shadow:var(--shadow-md);overflow:hidden;}
.cf-pick-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--border);}
.cf-pick-title{font-size:15px;font-weight:700;}
.cf-pick-desc{font-size:11.5px;color:var(--text2);margin-top:2px;}
.cf-pick-x{background:none;border:none;color:var(--text3);font-size:22px;line-height:1;cursor:pointer;padding:0 4px;}
.cf-pick-x:hover{color:var(--text);}
.cf-pick-list{max-height:52vh;overflow:auto;padding:8px;}
.cf-pick-row{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;border:none;border-radius:8px;
  padding:9px 12px;cursor:pointer;font-family:var(--sans);color:var(--text);}
.cf-pick-row:hover{background:var(--surface2);}
.cf-pick-name{font-size:14px;font-weight:600;}
.cf-pick-sub{font-size:11px;color:var(--text3);}
.cf-pick-rules{margin-left:auto;font-size:11px;color:var(--accent);font-family:var(--mono);flex-shrink:0;}
.cf-pick-new{display:block;width:100%;text-align:center;background:var(--surface2);border:none;border-top:1px solid var(--border);
  padding:12px;font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer;font-family:var(--sans);}
.cf-pick-new:hover{background:var(--surface3);}
</style>

<body>

<header>
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="8.5" stroke="white" stroke-width="1.8"/><circle cx="12" cy="12" r="2.6" fill="white"/><circle cx="7" cy="8" r="1" fill="white"/><circle cx="16" cy="15" r=".9" fill="white"/></svg></div>
  <div>
    <div class="app-name">Incubator</div>
    <div class="app-sub">Cell-culture tracker</div>
  </div>
</header>

<div class="scroll">
  <div class="wrap">

    <div id="tab-incubator" class="pane active">
      <div class="inc-bar">
        <div class="inc-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="inc-q" placeholder="Search line, vessel, media, incubator…" autocomplete="off" oninput="setIncQuery(this.value)">
        </div>

<datalist id="cell-ref-list"></datalist>
<datalist id="cf-inc-list"></datalist>

<div class="cf-pick-back" id="cf-pick-back">
  <div class="cf-pick-modal">
    <div class="cf-pick-hd">
      <div><div class="cf-pick-title">Choose a cell line</div><div class="cf-pick-desc">From the Cell Archive. Splitting rules are applied automatically.</div></div>

    </div>

</div>

<div id="toast"></div>

<script>
// ── Theme (mirror parent / localStorage) ───────────────────────────────────
(function(){
  var t = 'light';
  try { t = localStorage.getItem('hub_theme') || 'light'; } catch(e){}
  document.documentElement.setAttribute('data-theme', t);
})();
window.addEventListener('message', function(e){
  if (e.data === 'setTheme:dark')  document.documentElement.setAttribute('data-theme','dark');
  if (e.data === 'setTheme:light') document.documentElement.setAttribute('data-theme','light');
});

// ── Cell-line reference + alert logic (prefer the shell's shared copy) ──────
var CELL_REF = {
  'HEK293':{ratio:'1:8',intervalDays:3,doublingH:24,passageLimit:35,media:'DMEM + 10% FBS',type:'Adherent'},
  'HEK293T':{ratio:'1:8',intervalDays:3,doublingH:24,passageLimit:35,media:'DMEM + 10% FBS',type:'Adherent'},
  'HeLa':{ratio:'1:6',intervalDays:3,doublingH:24,passageLimit:30,media:'DMEM + 10% FBS',type:'Adherent'},
  'U2OS':{ratio:'1:4',intervalDays:4,doublingH:29,passageLimit:30,media:'DMEM + 10% FBS',type:'Adherent'},
  'A549':{ratio:'1:5',intervalDays:3,doublingH:22,passageLimit:30,media:"Ham's F-12K + 10% FBS",type:'Adherent'},
  'HCT116':{ratio:'1:6',intervalDays:3,doublingH:21,passageLimit:30,media:"McCoy's 5A + 10% FBS",type:'Adherent'},
  'MCF7':{ratio:'1:4',intervalDays:4,doublingH:29,passageLimit:30,media:'EMEM + 10% FBS + insulin',type:'Adherent'},
  'Jurkat':{ratio:'1:4',intervalDays:3,doublingH:24,passageLimit:30,media:'RPMI-1640 + 10% FBS',type:'Suspension'},
  'NIH/3T3':{ratio:'1:6',intervalDays:3,doublingH:20,passageLimit:25,media:'DMEM + 10% BCS',type:'Adherent'},
  'CHO':{ratio:'1:8',intervalDays:3,doublingH:18,passageLimit:40,media:"Ham's F-12 + 10% FBS",type:'Adherent'},
  'Expi293':{ratio:'to 0.5M/mL',intervalDays:3,doublingH:24,passageLimit:40,media:'Expi293 medium',type:'Suspension'}
};
function _localAlerts(cell, now){
  now = now || Date.now(); var DAY=86400000, out=[];
  if (cell.seeded && cell.intervalDays){
    var d=(now-cell.seeded)/DAY;
    if (d>=cell.intervalDays+1) out.push({level:'warn',tag:'split',msg:'Split overdue · '+Math.floor(d)+'d since last split'});
    else if (d>=cell.intervalDays) out.push({level:'warn',tag:'split',msg:'Due to split'});
    else if (d>=cell.intervalDays-1) out.push({level:'soft',tag:'split',msg:'Split due soon'});
  }
  if (cell.passage!=null && cell.passageLimit){
    if (cell.passage>=cell.passageLimit) out.push({level:'warn',tag:'passage',msg:'High passage (P'+cell.passage+') — thaw a fresh vial'});
    else if (cell.passage>=cell.passageLimit*0.8) out.push({level:'soft',tag:'passage',msg:'Approaching passage limit (P'+cell.passage+'/'+cell.passageLimit+')'});
  }
  if (!cell.mycoLast) out.push({level:'soft',tag:'myco',msg:'No mycoplasma test logged'});
  else if ((now-cell.mycoLast)/DAY>30) out.push({level:'warn',tag:'myco',msg:'Mycoplasma test overdue'});
  var rank={warn:0,soft:1,ok:2}; out.sort(function(a,b){return rank[a.level]-rank[b.level];});
  return out;
}
var computeCellAlerts = _localAlerts;
try { if (window.parent && window.parent.CELL_REF) CELL_REF = window.parent.CELL_REF; } catch(e){}
try { if (window.parent && window.parent.computeCellAlerts) computeCellAlerts = window.parent.computeCellAlerts; } catch(e){}

// ── Store (parent JournalStore when embedded, else a local shim) ────────────
function _localStore(){
  var KEY='hub_journal_cache', data={tasks:{},incubator:{}}, subs=[];
  try { var c=JSON.parse(localStorage.getItem(KEY)||'null'); if(c) data={tasks:c.tasks||{},incubator:c.incubator||{}}; } catch(e){}
  function save(){ try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){} }
  function emit(){ subs.slice().forEach(function(f){try{f(data);}catch(e){}}); }
  function id(){ return 'loc-'+Date.now()+'-'+Math.random().toString(36).slice(2,8); }
  return {
    subscribe:function(cb){subs.push(cb);try{cb(data);}catch(e){}return function(){subs=subs.filter(function(f){return f!==cb;});};},
    get:function(){return data;}, attach:function(){}, detach:function(){},
    addTask:function(t){data.tasks[id()]=t;save();emit();},
    updateTask:function(i,p){data.tasks[i]=Object.assign({},data.tasks[i],p);save();emit();},
    deleteTask:function(i){delete data.tasks[i];save();emit();},
    addCell:function(c){data.incubator[id()]=c;save();emit();},
    updateCell:function(i,p){data.incubator[i]=Object.assign({},data.incubator[i],p);save();emit();},
    deleteCell:function(i){delete data.incubator[i];save();emit();}
  };
}
var STORE;
try { STORE = (window.parent && window.parent !== window && window.parent.JournalStore) ? window.parent.JournalStore : _localStore(); }
catch(e){ STORE = _localStore(); }
try { STORE.attach && STORE.attach(); } catch(e){}

// ── Helpers ────────────────────────────────────────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function el(id){ return document.getElementById(id); }
function val(id){ var e=el(id); return e?e.value:''; }
function numOr(id, d){ var v=parseFloat(val(id)); return isNaN(v)?d:v; }
function toDateInput(ts){ if(!ts) return ''; var d=new Date(ts); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function fromDateInput(s){ if(!s) return null; var t=new Date(s+'T00:00:00').getTime(); return isNaN(t)?null:t; }
function daysAgo(ts){ return ts==null?null:Math.floor((Date.now()-ts)/86400000); }
function relDays(ts){ var d=daysAgo(ts); if(d==null) return '—'; return d<=0?'today':(d===1?'yesterday':d+' days ago'); }
function fmtDate(ts){ if(!ts) return '—'; return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function refLookup(name){
  if(!name) return null;
  if(CELL_REF[name]) return CELL_REF[name];
  var lc=String(name).toLowerCase();
  var k=Object.keys(CELL_REF).filter(function(key){return key.toLowerCase()===lc;})[0];
  return k?CELL_REF[k]:null;
}
// Cell lines come from the shared Cell Archive (built-ins + user-added). Falls back to
// the CELL_REF table when standalone (no parent shell).
function incubatorArchive(){
  try{ if(window.parent && window.parent.getCellArchive) return window.parent.getCellArchive()||[]; }catch(e){}
  if(window.parent && window.parent.CELL_ARCHIVE_BUILTIN) { try{ return window.parent.CELL_ARCHIVE_BUILTIN; }catch(e){} }
  return Object.keys(CELL_REF).map(function(k){ var r=CELL_REF[k]; return {name:k,ratio:r.ratio,intervalDays:r.intervalDays,doublingH:r.doublingH,passageLimit:r.passageLimit,media:r.media,type:r.type}; });
}
function archLookup(name){
  if(!name) return null;
  var lc=String(name).trim().toLowerCase();
  var hit=incubatorArchive().filter(function(L){ return String(L.name||'').toLowerCase()===lc; })[0];
  return hit || refLookup(name);
}
var _cfArch=null;   // rules of the currently-chosen base line
function cfArchPrefill(name){
  var ref=archLookup(name); _cfArch=ref||null; var hint=el('cf-hint'); if(!hint) return;
  if(!ref){ hint.textContent=''; return; }
  function fillIf(id,v){ var e=el(id); if(e && !e.value && v!=null && v!=='') e.value=v; }
  fillIf('cf-interval', ref.intervalDays); fillIf('cf-limit', ref.passageLimit); fillIf('cf-media', ref.media);
  hint.textContent='Rules from '+(ref.name||name)+': '+(ref.ratio||'?')+(ref.doublingH?(' · doubling ~'+ref.doublingH+'h'):'')+(ref.passageLimit?(' · limit P'+ref.passageLimit):'')+(ref.type?(' · '+ref.type):'');
}
// ── Cell-line picker (choose a base line already in the system) ──
function openCellPicker(){
  var back=el('cf-pick-back'); if(!back) return;
  var list=el('cf-pick-list');
  var lines=incubatorArchive().slice().sort(function(a,b){ return String(a.name||'').localeCompare(String(b.name||'')); });
  list.innerHTML=lines.map(function(L){
    var sub=[L.tissue,L.catalog].filter(Boolean).join(' · ');
    return '<button type="button" class="cf-pick-row" onclick="pickArchLine(\''+esc(String(L.name||'').replace(/'/g,"\\'"))+'\')">'
      +'<span class="cf-pick-name">'+esc(L.name||'')+'</span>'
      +(sub?'<span class="cf-pick-sub">'+esc(sub)+'</span>':'')
      +(L.ratio?'<span class="cf-pick-rules">'+esc(L.ratio)+(L.intervalDays?(' · '+L.intervalDays+'d'):'')+'</span>':'')
    +'</button>';
  }).join('') || '<div style="padding:14px;color:var(--text2);font-size:13px;">No cell lines yet. Add one in the Cell Archive.</div>';
  back.classList.add('open');
}
function closeCellPicker(){ var b=el('cf-pick-back'); if(b) b.classList.remove('open'); }
function pickArchLine(name){
  var inp=el('cf-baseline'); if(inp){ inp.value=name; }
  cfArchPrefill(name); closeCellPicker();
  var suf=el('cf-suffix'); if(suf) suf.focus();
}
function openCellArchiveApp(){ closeCellPicker(); try{ if(window.parent && window.parent.openApp) window.parent.openApp('cellarchive'); else showToast('Open the Cell Archive app to add a new line'); }catch(e){ showToast('Open the Cell Archive app to add a new line'); } }
var _toastT=null;
function showToast(msg){ var t=el('toast'); if(!t) return; t.textContent=msg; t.classList.add('show'); clearTimeout(_toastT); _toastT=setTimeout(function(){t.classList.remove('show');},2600); }

// ── Tabs ───────────────────────────────────────────────────────────────────
var _tab='incubator';
function switchTab(name){
  _tab=name;
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.dataset.tab===name); });
  document.querySelectorAll('.pane').forEach(function(p){ p.classList.toggle('active', p.id==='tab-'+name); });
}
function _incDHubAck(e){ try{ if(e&&e.data&&e.data.requestId&&window.parent&&window.parent!==window) window.parent.postMessage({type:'dhub:ack',requestId:e.data.requestId,app:'incubator'},'*'); }catch(err){} }
function _incubatorContext(id){
  var c=STORE.get().incubator[id]; if(!c) return null;
  return {source:'incubator',experiment:null,cellLines:[{id:id,label:c.line||'Culture',passage:c.passage||0,type:c.type||'',media:c.media||'',vessel:c.vessel||''}],compounds:[],plateMaps:[],protocols:[],results:[{id:'culture-'+id,source:'incubator',label:'Culture status',data:{passage:c.passage||0,lastSplit:c.seeded||'',alerts:computeCellAlerts(c,Date.now()).map(function(a){return a.msg;})},createdAt:Date.now()}]};
}
function openCultureInLabbook(id){ var ctx=_incubatorContext(id); if(!ctx) return; try{ if(window.parent&&window.parent.openApp) window.parent.openApp('labbook',undefined,undefined,ctx); else showToast('Open Labbook in dHUB to attach this culture'); }catch(e){ showToast('Could not open Labbook'); } }
window.addEventListener('message', function(e){
  if(e.data && e.data.type==='dhub:context' && e.data.version===1){ var cs=e.data.context&&e.data.context.cellLines||[]; if(cs.length){ switchTab('incubator'); focusCulture(cs[0].label||cs[0].id||''); } _incDHubAck(e); return; }
  if(e.data && e.data.type==='switchTab'){ if(e.data.tab) switchTab(e.data.tab); if(e.data.item) focusCulture(String(e.data.item)); _incDHubAck(e); }
});
// Deep-link from a Labbook cell-line chip: scroll to + highlight the matching culture.
function focusCulture(line){
  var want=String(line||'').trim().toLowerCase(); if(!want) return;
  var attempt=0;
  (function go(){ attempt++;
    var cards=document.querySelectorAll('.vsl[data-line],.crow[data-line]');
    var hit=null;
    Array.prototype.forEach.call(cards,function(c){ var dl=c.getAttribute('data-line')||''; if(!hit && (dl===want || dl.indexOf(want)>=0 || want.indexOf(dl)>=0 && dl)) hit=c; });
    if(hit){ hit.scrollIntoView({behavior:'smooth',block:'center'}); hit.classList.remove('cc-flash'); void hit.offsetWidth; hit.classList.add('cc-flash'); setTimeout(function(){ hit.classList.remove('cc-flash'); },1800); return; }
    if(attempt<8) setTimeout(go,150); // wait for a late Firebase adopt to render the card
  })();
}

// ── Incubator ──────────────────────────────────────────────────────────────
var _cellForm=null;   // null | 'new' | <id>
var _splitForm=null;  // <id> | null
var _confirmRemove=null;
var _histOpen={};
var _openCell=null;   // expanded tile id
var _incView='flask'; try{ var _iv=localStorage.getItem('incubator_incview'); if(_iv==='plate'||_iv==='flask') _incView=_iv; }catch(e){}
function setIncView(v){ if(v!==_incView){ _incView=v; try{ localStorage.setItem('incubator_incview',v); }catch(e){} renderIncubator(); } }
function toggleCell(id){ if(_openCell===id) closeDrawer(); else openDrawer(id); }
// Vessel visuals — the medium is phenol-red: healthy culture = RED, and it turns YELLOWER
// (more acidic) the more urgent a split is. All native SVG/CSS.
// ok = healthy media → deep phenol red; soft = "soon to split" → orange; warn = split due/overdue → acidic yellow.
// Phenol red, not a traffic light. Fresh medium is red-pink and acidifies through orange to
// yellow as the culture grows out — so a healthy flask is red and an overdue one is yellow.
// It looks inverted if you read it as a status colour; it is the medium.
function _vslStops(st){ return st==='warn' ? ['#e8d492','#ddc477'] : (st==='soft' ? ['#e8b07a','#dd9a5e'] : ['#d98b86','#c47872']); }
// Reclined T-flask lying on its side (matches Jon's ref image): angled body, blue ribbed
// screw cap on the left neck, media pooled along the bottom. Media colour fills via the clip.
// ── A T-flask, drawn as one object ─────────────────────────────────────────
// The old drawing was a rectangle with a stub stuck on its side, which is why it read as a
// blob rather than a flask. What makes a T-flask recognisable is the canted neck: the body is
// a rounded rectangle with its top-left corner cut away at 45°, and a tube rises out of that
// cut. Neck and cap are drawn in a rotated frame so the geometry stays readable.
var FLASK_BODY = 'M22 50 L38 34 Q40.5 31.5 44 31.5 L84 31.5 Q92 31.5 92 39.5 '
               + 'L92 84 Q92 92 84 92 L30 92 Q22 92 22 84 Z';

function flaskSvg(id, st){
  var s = _vslStops(st), g = 'vg_' + id, cp = 'cvg_' + id, hl = 'vh_' + id;
  // Confluence is not tracked, so the fill level is fixed — it says "there is medium in
  // this flask", not how much.
  var top = 58;
  return '<svg class="vsl-svg" viewBox="0 0 104 104" aria-hidden="true">'
    + '<defs>'
      + '<linearGradient id="' + g + '" x1="0" y1="1" x2="0" y2="0">'
        + '<stop offset="0" stop-color="' + s[1] + '"/><stop offset="1" stop-color="' + s[0] + '"/></linearGradient>'
      + '<linearGradient id="' + hl + '" x1="0" y1="0" x2="1" y2="0">'
        + '<stop offset="0" stop-color="rgba(255,255,255,.55)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></linearGradient>'
      + '<clipPath id="' + cp + '"><path d="' + FLASK_BODY + '"/></clipPath>'
    + '</defs>'
    // Neck and cap, drawn before the body so the join disappears under it. The body needs an
    // opaque base for that to work — with a translucent glass fill the neck showed straight
    // through the medium as a diagonal line.
    + '<g transform="translate(32 44) rotate(45)">'
      + '<rect class="vsl-neck" x="-30" y="-7.5" width="34" height="15" rx="3.5"/>'
      + '<rect class="vsl-cap" x="-39" y="-10" width="11" height="20" rx="3.5"/>'
      + '<line class="vsl-capline" x1="-35.5" y1="-6" x2="-35.5" y2="6"/>'
      + '<line class="vsl-capline" x1="-32" y1="-6" x2="-32" y2="6"/>'
    + '</g>'
    // Body: an opaque base, the medium clipped inside it, then the outline last so nothing
    // paints over it.
    + '<path class="vsl-base" d="' + FLASK_BODY + '"/>'
    + '<g clip-path="url(#' + cp + ')">'
      + '<rect x="20" y="' + top + '" width="74" height="40" fill="url(#' + g + ')"/>'
      + '<path class="vsl-men" d="M20 ' + top + ' Q57 ' + (top - 3) + ' 94 ' + top + '"/>'
      // One soft highlight down the left wall — the only piece of gloss kept. It starts below
      // the chamfer, or the clip cuts its top corner off at an angle and it reads as a smudge.
      + '<rect x="27" y="' + (top - 6) + '" width="7" height="30" rx="3.5" fill="url(#' + hl + ')"/>'
    + '</g>'
    + '<path class="vsl-rim" d="' + FLASK_BODY + '"/>'
  + '</svg>';
}
// Top-down culture dish with real depth: an outer wall ring (bevel-shaded), the medium
// pool, an inner-wall shadow for thickness, a meniscus ring and a lighting sheen.
function plateSvg(id,st){ var s=_vslStops(st), g='vp_'+id, w='vpw_'+id, d='vpd_'+id;
  return '<svg class="vsl-svg" viewBox="0 0 96 104" aria-hidden="true">'
    +'<defs>'

function openCellForm(which){ _cellForm=which; _splitForm=null; closeDrawer(); renderIncubator(); var i=el('cf-baseline'); if(i) i.focus(); }
function closeCellForm(){ _cellForm=null; renderIncubator(); }
function cfPrefill(name){
  var ref=refLookup(name); var hint=el('cf-hint'); if(!hint) return;
  if(!ref){ hint.textContent=''; return; }
  function fillIf(id,v){ var e=el(id); if(e && !e.value) e.value=v; }
  fillIf('cf-interval', ref.intervalDays);
  fillIf('cf-limit', ref.passageLimit);
  fillIf('cf-media', ref.media);
  hint.textContent='Reference: '+ref.ratio+' · doubling ~'+ref.doublingH+'h · limit P'+ref.passageLimit+' · '+ref.type;
}
function saveCellForm(){
  var base=val('cf-baseline').trim();
  if(!base){ el('cf-baseline').focus(); showToast('Choose or type a base cell line'); return; }
  var suffix=val('cf-suffix').trim();
  var line = suffix ? (base+' '+suffix) : base;      // display name (still governed by base rules)
  var ref=_cfArch || archLookup(base);
  var seeded=fromDateInput(val('cf-seeded')) || Date.now();
  var cell={
    line:line,
    baseLine:base,
    titleSuffix:suffix,
    passage:numOr('cf-passage',0),
    vessel:val('cf-vessel').trim(),
    media:val('cf-media').trim(),
    intervalDays:numOr('cf-interval',0)||null,
    passageLimit:numOr('cf-limit',0)||null,
    seeded:seeded,
    mycoLast:fromDateInput(val('cf-myco')),
    incubator:val('cf-incubator').trim(),
    shelf:val('cf-shelf').trim(),
    notes:val('cf-notes').trim(),
    ratio:(ref&&ref.ratio)||'',
    type:(ref&&ref.type)||''
  };
  if(_cellForm==='new'){
    cell.history=[{action:'seeded',passage:cell.passage,ts:seeded}];
    STORE.addCell(cell); showToast(line+' added to the incubator');
  } else {
    var existing=STORE.get().incubator[_cellForm]||{};
    cell.history=existing.history||[];
    if(!cell.ratio) cell.ratio=existing.ratio||'';
    if(!cell.type) cell.type=existing.type||'';
    STORE.updateCell(_cellForm,cell); showToast('Updated '+line);
  }
  _cellForm=null; renderIncubator();
}
function openSplit(id){ _splitForm=id; _cellForm=null; _confirmRemove=null; paintDrawer(); }
function confirmSplit(id){
  var cell=STORE.get().incubator[id]; if(!cell) return;
  var newP=numOr('sp-passage-'+id,(cell.passage||0)+1);
  var when=fromDateInput(val('sp-date-'+id)) || Date.now();
  var ratio=val('sp-ratio-'+id).trim();
  var hist=(cell.history||[]).slice();
  hist.push({action:'split',ratio:ratio,passage:newP,ts:when});
  STORE.updateCell(id,{passage:newP,seeded:when,history:hist});
  _splitForm=null; showToast('Logged split — '+(cell.line||'culture')+' now P'+newP); renderIncubator(); paintDrawer();
}
function logMyco(id){
  var cell=STORE.get().incubator[id]; if(!cell) return;
  var hist=(cell.history||[]).slice();
  hist.push({action:'myco test',passage:cell.passage,ts:Date.now()});
  STORE.updateCell(id,{mycoLast:Date.now(),history:hist});
  showToast('Mycoplasma test logged for '+(cell.line||'culture'));
}
function askRemove(id){ _confirmRemove=id; paintDrawer(); }
function doRemove(id){ var cell=STORE.get().incubator[id]; STORE.deleteCell(id); _confirmRemove=null; closeDrawer(); showToast('Removed '+((cell&&cell.line)||'culture')); renderIncubator(); }
function toggleHist(id){ _histOpen[id]=!_histOpen[id]; paintDrawer(); }

      +'<div class="fld"><label>Passage #</label><input id="cf-passage" class="inp" type="number" min="0" placeholder="0" value="'+(c.passage!=null?c.passage:'')+'"></div>'

// ── State ────────────────────────────────────────────────────────────────
// Layout (how the cultures are laid out) and vessel (what is drawn in a grid tile) are two
// different questions; they used to share one variable, so choosing "Plates" also decided
// whether you got a list.
var _incLayout = 'list', _incQuery = '', _incFilter = 'all', _incSort = 'due';
try { _incLayout = localStorage.getItem('incubator_layout') || 'list'; } catch(e){}
try { _incSort   = localStorage.getItem('incubator_sort')   || 'due'; } catch(e){}
function setIncLayout(v){ _incLayout=v; try{ localStorage.setItem('incubator_layout',v); }catch(e){} renderIncubator(); }
function setIncQuery(v){ _incQuery=String(v||'').toLowerCase().trim(); renderIncubator(); }
function setIncFilter(v){ _incFilter=v; renderIncubator(); }
function setIncSort(v){ _incSort=(_incSort===v?('-'+v):v); try{ localStorage.setItem('incubator_sort',_incSort); }catch(e){} renderIncubator(); }

var DAYMS = 86400000;
// The one number the list is really about: when is this due to be split.
function nextDue(c){
  if (!c || !c.seeded || !c.intervalDays) return null;
  return c.seeded + c.intervalDays*DAYMS;
}
function dueText(c){
  var t = nextDue(c);
  if (t == null) return {text:'—', cls:'ok'};
  var d = Math.round((t - Date.now())/DAYMS);
  if (d < 0)  return {text:Math.abs(d)+'d overdue', cls:'warn'};
  if (d === 0) return {text:'today', cls:'warn'};
  if (d === 1) return {text:'tomorrow', cls:'soft'};
  return {text:'in '+d+'d', cls:(d<=2?'soft':'ok')};
}
function cultureWhere(c){
  return [c && c.incubator, c && c.shelf].filter(Boolean).join(' · ');
}
function statusOf(alerts){
  return alerts.some(function(a){return a.level==='warn';}) ? 'warn'
       : alerts.some(function(a){return a.level==='soft';}) ? 'soft' : 'ok';
}
function _incRows(){
  var cells=STORE.get().incubator, now=Date.now();
  return Object.keys(cells).map(function(id){
    var c=cells[id], alerts=computeCellAlerts(c,now);
    return {id:id, cell:c, alerts:alerts, st:statusOf(alerts), due:nextDue(c)};
  });
}
function _incFiltered(){
  var rows=_incRows();
  if (_incFilter!=='all') rows=rows.filter(function(r){
    if (_incFilter==='overdue') return r.due!=null && r.due < Date.now();
    if (_incFilter==='due')     return r.st!=='ok';
    return r.st==='ok';
  });
  if (_incQuery) rows=rows.filter(function(r){
    var c=r.cell;
    return [c.line,c.vessel,c.media,c.incubator,c.shelf,c.notes,c.type]
      .some(function(x){ return x && String(x).toLowerCase().indexOf(_incQuery)>-1; });
  });
  var dir = _incSort.charAt(0)==='-' ? -1 : 1, key = _incSort.replace(/^-/,'');
  rows.sort(function(a,b){
    var v=0;
    if (key==='due'){
      // Something overdue is the reason you opened this app; it goes first whatever else sorts.
      var av=a.due==null?Infinity:a.due, bv=b.due==null?Infinity:b.due;
      v = av-bv;
    }
    else if (key==='line')    v = String(a.cell.line||'').localeCompare(String(b.cell.line||''));
    else if (key==='passage') v = (a.cell.passage||0)-(b.cell.passage||0);
    else if (key==='vessel')  v = String(a.cell.vessel||'').localeCompare(String(b.cell.vessel||''));
    else if (key==='where')   v = cultureWhere(a.cell).localeCompare(cultureWhere(b.cell));
    return v*dir || String(a.cell.line||'').localeCompare(String(b.cell.line||''));
  });
  return rows;
}

function _incFilterBar(){
  var all=_incRows(), n={
    all: all.length,
    overdue: all.filter(function(r){ return r.due!=null && r.due<Date.now(); }).length,
    due: all.filter(function(r){ return r.st!=='ok'; }).length,
    healthy: all.filter(function(r){ return r.st==='ok'; }).length
  };
  return [['all','All'],['overdue','Overdue'],['due','Needs attention'],['healthy','Healthy']]
    .map(function(f){ return '<button class="inc-fp'+(_incFilter===f[0]?' on':'')+'" onclick="setIncFilter(\''+f[0]+'\')">'
      +f[1]+'<span class="n">'+n[f[0]]+'</span></button>'; }).join('');
}

function _incListHtml(rows){
  function hd(key,label){
    var on=_incSort.replace(/^-/,'')===key;
    return '<button class="'+(on?'sorted':'')+'" onclick="setIncSort(\''+key+'\')">'+label
      +(on?(_incSort.charAt(0)==='-'?' ↑':' ↓'):'')+'</button>';
  }
  var head='<div class="clist-hd">'+hd('line','Cell line')+hd('passage','P')+hd('vessel','Vessel')
    +'<button style="cursor:default">Media</button>'+hd('due','Next split')+hd('where','Where')+'<span></span></div>';
  var body=rows.map(function(r){
    var c=r.cell, d=dueText(c), where=cultureWhere(c);
    return '<button class="crow'+(_openCell===r.id?' on':'')+'" data-id="'+r.id+'" data-line="'+esc(String(c.line||'').toLowerCase())+'" onclick="openDrawer(\''+r.id+'\')">'
      +'<span class="cr-line"><span class="cr-dot '+r.st+'" title="'+esc(r.alerts.length?r.alerts[0].msg:'Healthy')+'"></span>'
        +'<span class="cr-nm">'+esc(c.line||'Culture')+'</span></span>'
      +'<span class="cr-p">P'+(c.passage!=null?c.passage:'?')+'</span>'
      +'<span class="cr-c">'+esc(c.vessel||'—')+'</span>'
      +'<span class="cr-c">'+esc(c.media||'—')+'</span>'
      +'<span class="cr-due '+d.cls+'">'+esc(d.text)+'</span>'
      +'<span class="cr-where">'+esc(where||'—')+'</span>'
      +'<span class="cr-go">›</span></button>';
  }).join('');
  return '<div class="clist">'+head+body+'</div>';
}

function _incGridHtml(rows){
  return '<div class="cell-grid">'+rows.map(function(r){
    var c=r.cell, d=dueText(c);
    var vessel = _incView==='plate' ? plateSvg(r.id,r.st) : flaskSvg(r.id,r.st);
    return '<div class="vsl'+(r.st!=='ok'?' due':'')+'" data-line="'+esc(String(c.line||'').toLowerCase())+'" data-id="'+r.id+'">'
      +'<button class="vsl-face" title="'+esc(r.alerts.length?r.alerts[0].msg:'Healthy')+'" onclick="openDrawer(\''+r.id+'\')">'+vessel
      +'<span class="vsl-p">P'+(c.passage!=null?c.passage:'?')+'</span></button>'
      +'<div class="vsl-name" title="'+esc(c.line||'')+'">'+esc(c.line||'Culture')+'</div>'
      +'<div class="vsl-tag st-'+d.cls+'">'+esc(d.text==='—'?(r.alerts.length?r.alerts[0].msg:'Healthy'):('Split '+d.text))+'</div>'
    +'</div>';
  }).join('')+'</div>';
}

function renderIncubator(){
  var addBtn=el('add-cell-btn'); if(addBtn) addBtn.style.display = _cellForm ? 'none' : '';
  el('cell-form-area').innerHTML = _cellForm ? cellFormHtml() : '';
  if(_cellForm){ var h=el('cf-baseline');
    if(h && h.value){ var _hint=el('cf-hint'); var _r=archLookup(h.value);
      if(_hint&&_r) _hint.textContent='Rules from '+(_r.name||h.value)+': '+(_r.ratio||'?')+(_r.doublingH?(' · doubling ~'+_r.doublingH+'h'):'')+(_r.passageLimit?(' · limit P'+_r.passageLimit):'')+(_r.type?(' · '+_r.type):''); } }

  var fb=el('inc-filters'); if(fb) fb.innerHTML=_incFilterBar();
  var idl=el('cf-inc-list');
  if(idl){ var seen={}; Object.keys(STORE.get().incubator).forEach(function(k){ var v=STORE.get().incubator[k].incubator; if(v) seen[v]=1; });
    idl.innerHTML=Object.keys(seen).map(function(v){ return '<option value="'+esc(v)+'">'; }).join(''); }
  var vt=el('inc-view-toggle');
  if(vt) vt.innerHTML='<button class="ivt'+(_incLayout==='list'?' on':'')+'" onclick="setIncLayout(\'list\')">List</button>'
                     +'<button class="ivt'+(_incLayout==='grid'?' on':'')+'" onclick="setIncLayout(\'grid\')">Grid</button>'
                     +(_incLayout==='grid'
                        ? '<button class="ivt'+(_incView==='flask'?' on':'')+'" onclick="setIncView(\'flask\')">Flask</button>'
                          +'<button class="ivt'+(_incView==='plate'?' on':'')+'" onclick="setIncView(\'plate\')">Plate</button>'
                        : '');

  var host=el('cell-list'), all=_incRows(), rows=_incFiltered();
  host.className='';
  if(!all.length){
    host.innerHTML = _cellForm ? '' : '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg>'
      +'<div class="empty-title">No cultures tracked yet</div>'
      +'<div class="empty-sub">Add a culture, or thaw a vial from the Freezer and it will appear here.</div></div>';
    closeDrawer(); return;
  }
  if(!rows.length){
    host.innerHTML='<div class="empty"><div class="empty-title">Nothing matches</div>'
      +'<div class="empty-sub">'+esc(_incQuery?('No culture matches “'+_incQuery+'”.'):'No culture in that state right now.')+'</div></div>';
    return;
  }
  host.innerHTML = (_incLayout==='grid') ? _incGridHtml(rows) : _incListHtml(rows);
  if(_openCell) paintDrawer();
}

// ── The drawer ───────────────────────────────────────────────────────────
function openDrawer(id){ _openCell=id; _splitForm=null; _confirmRemove=null; renderIncubator(); paintDrawer(); }
function closeDrawer(){

function paintDrawer(){

            ['Passage limit',c.passageLimit?('P'+c.passageLimit):'—'],['Last myco test',c.mycoLast?relDays(c.mycoLast):'never'],

      +'<div class="fld"><label>Date</label><input id="sp-date-'+id+'" class="inp" type="date" value="'+toDateInput(Date.now())+'"></div>'

  var confirm = _confirmRemove===id ? '<div class="confirm-row">Remove '+esc(c.line||'this culture')+' and its history? '
      +'<button class="btn danger sm" onclick="doRemove(\''+id+'\')">Remove</button>'
      +'<button class="btn ghost sm" onclick="_confirmRemove=null;paintDrawer();">Keep</button></div>' : '';

  var hist='';
  var h=(c.history||[]).slice().reverse();
  if(h.length){
    var open=_histOpen[id];
    hist='<div class="hist"><button class="btn ghost sm" onclick="toggleHist(\''+id+'\')">'+(open?'Hide':'Show')+' history ('+h.length+')</button>';

      return '<div class="hist-item"><span class="ht-date">'+esc(fmtDate(e.ts))+'</span><span>'+esc(e.action)+(e.ratio?(' '+e.ratio):'')+(e.passage!=null?(' → P'+e.passage):'')+'</span></div>';
    }).join('')+'</div>'; }
    hist+='</div>';
  }

  d.innerHTML='<div class="drw-hd"><div class="drw-title">'+esc(c.line||'Culture')
      +(c.type?'<span class="cc-type">'+esc(c.type)+'</span>':'')+'</div>'

    +'<div class="drw-vessel">'+vessel+'</div>'
    +'<div class="cc-alerts">'+(alerts.length?alerts:[{level:'ok',msg:'Healthy — nothing due'}])
        .map(function(a){ return '<span class="alert '+a.level+'">'+esc(a.msg)+'</span>'; }).join('')+'</div>'
    +'<div class="drw-sec">Culture</div><div class="cc-meta" style="margin-top:0;padding-top:0;border-top:none;">'+meta+'</div>'

      +'<button class="btn sm" onclick="openSplit(\''+id+'\')">Log split</button>'

      +'<button class="btn ghost sm" onclick="openCultureInLabbook(\''+id+'\')">Open in Labbook</button>'
      +'<button class="btn ghost sm" onclick="openCellForm(\''+id+'\')">Edit</button>'

    +'</div>'
    +hist;
  d.classList.add('open'); d.setAttribute('aria-hidden','false');
  if(b) b.classList.add('open');
}
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && _openCell) closeDrawer(); });

// ── Freeze: a flask becomes vials ────────────────────────────────────────
// The counterpart to Thaw. Doing it by hand means finding a free run of positions in Iceberg
// and retyping the line, passage and media that are already on the screen in front of you.
function freezeCulture(id){
  var c=STORE.get().incubator[id]; if(!c) return;
  var H=null; try{ H=(window.parent&&window.parent!==window)?window.parent:null; }catch(e){}
  if(!H||!H.HUB_FREEZER_BOXES){ showToast('Banking vials needs the dHUB shell (the freezer map lives there)'); return; }
  var boxes=H.HUB_FREEZER_BOXES();
  if(!boxes.length){ showToast('No boxes in the freezer yet — add one in Freezer first'); return; }
  var listing=boxes.map(function(b,i){ return (i+1)+') '+b.storageLabel+' · '+b.rack+' · '+b.box+'  ('+b.filled+'/'+(b.rows*b.cols)+' full)'; }).join('\n');
  var pick=prompt('Freeze '+c.line+' (P'+(c.passage!=null?c.passage:'?')+')\n\nWhich box?\n\n'+listing, '1');
  if(pick===null) return;
  var bi=parseInt(pick,10)-1; var box=boxes[bi];
  if(!box){ showToast('No box '+pick); return; }
  var n=parseInt(prompt('How many vials?','4'),10);
  if(!n || n<1) return;
  // Reading order, so the vials sit where they look like they sit.
  var free=[];
  for(var r=0;r<box.rows && free.length<n;r++)
    for(var col=1;col<=box.cols && free.length<n;col++){
      var pos=String.fromCharCode(65+r)+col;
      if(!box.vials[pos]) free.push(pos);
    }
  if(!free.length){ showToast('That box is full'); return; }
  if(free.length<n && !confirm('Only '+free.length+' free position'+(free.length===1?'':'s')+' in that box. Freeze '+free.length+'?')) return;
  var today=new Date().toISOString().slice(0,10);
  free.forEach(function(pos){
    H.HUB_FREEZER_PLACE({boxId:box.boxId, pos:pos}, {
      kind:'cells', cellLine:c.line, passage:'P'+(c.passage!=null?c.passage:''),
      freezeDate:today, freezeMedia:'', cultureMedia:c.media||'', frozenBy:'',
      notes:'Frozen from culture in '+(c.vessel||'flask')
    });
  });
  var hist=(c.history||[]).slice();
  hist.push({action:'froze '+free.length+' vial'+(free.length===1?'':'s')+' → '+box.box, passage:c.passage, ts:Date.now()});
  STORE.updateCell(id, Object.assign({}, c, {history:hist}));
  showToast(free.length+' vial'+(free.length===1?'':'s')+' banked in '+box.box+' ('+free[0]+(free.length>1?('–'+free[free.length-1]):'')+')');
  paintDrawer();
}

(function(){
  var dl=el('cell-ref-list');
  if(dl) dl.innerHTML=incubatorArchive().map(function(L){return '<option value="'+esc(L.name||'')+'">';}).join('');
})();
STORE.subscribe(function(){ renderIncubator(); });
