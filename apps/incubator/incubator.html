<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Incubator</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  /* the shared type and radius scales — see docs/UI.md */
  --fs-1:10px;--fs-2:11px;--fs-3:12px;--fs-4:13px;--fs-5:15px;--fs-6:17px;--fs-7:20px;--fs-8:26px;--fs-9:38px;
  --r-1:4px;--r-2:6px;--r-3:9px;--r-4:13px;--r-full:999px;--bg:#f4f5f8;--surface:#ffffff;--surface2:#f0f1f5;--surface3:#e4e6ee;
  --border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.13);
  --text:#1a1d2e;--text2:#4f5470;--text3:#5f647e;
  --brand:#4a8fb5;--accent:#5e87c5;--on-accent:#ffffff;--accent-dim:rgba(94,135,197,0.12);--accent-soft:rgba(94,135,197,0.22);
  --warn:#c47818;--warn-bg:rgba(224,140,48,.15);
  --soft:#5075b5;--soft-bg:rgba(94,135,197,.15);
  --ok:#2d9462;--ok-bg:rgba(45,148,98,.14);
  --urgent:#d8544d;--urgent-bg:rgba(216,84,77,.14);
  --good:#2d9462;--danger:#c04040;   /* the Hub's names for the state colours (this app's --ok / --urgent are the same two) */
  --accent-ink:#36609f;--good-ink:#176c42;--warn-ink:#8a4f08;--urgent-ink:#b3403b;   /* the accent and the states AS TEXT: fills keep the plain tokens */
  --sans:'IBM Plex Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow-xs:0 1px 4px rgba(0,0,0,.04);--shadow-sm:0 2px 8px rgba(0,0,0,.06);
  --shadow-md:0 6px 24px rgba(0,0,0,.09);--shadow-lg:0 16px 48px rgba(0,0,0,.14);
  --glass:rgba(255,255,255,0.64);--glass-brd:rgba(255,255,255,0.7);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.7);--glass-shadow:0 10px 30px -12px rgba(32,44,84,.24);
  --ease:cubic-bezier(.2,.8,.3,1);
}
[data-theme="dark"]{
  --bg:#0d0f14;--surface:#13161e;--surface2:#1c2030;--surface3:#252a3a;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e8eaf2;--text2:#a8adc4;--text3:#9096ad;
  --brand:#7fb6d0;--accent:#8aaee0;--on-accent:#0d0f14;--accent-dim:rgba(138,174,224,0.16);--accent-soft:rgba(138,174,224,0.26);
  --warn:#f0b060;--warn-bg:rgba(224,140,48,.18);
  --soft:#8fb0e0;--soft-bg:rgba(94,135,197,.18);
  --ok:#6ddca8;--ok-bg:rgba(45,148,98,.18);
  --urgent:#f08a84;--urgent-bg:rgba(216,84,77,.18);
  --good:#6ddca8;--danger:#f08a84;
  --accent-ink:#8aaee0;--good-ink:#6ddca8;--warn-ink:#f0b060;--urgent-ink:#f08a84;
  --shadow-xs:0 1px 4px rgba(0,0,0,.30);--shadow-sm:0 2px 8px rgba(0,0,0,.40);
  --shadow-md:0 6px 24px rgba(0,0,0,.50);--shadow-lg:0 16px 48px rgba(0,0,0,.55);
  --glass:rgba(28,32,46,0.6);--glass-brd:rgba(255,255,255,0.1);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.07);--glass-shadow:0 12px 36px -12px rgba(0,0,0,.6);
}
input::placeholder,textarea::placeholder{color:var(--text3);opacity:1;}
html,body{height:100%;overflow:hidden;}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:var(--fs-5);-webkit-font-smoothing:antialiased;position:relative;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:radial-gradient(48% 42% at 4% 4%,var(--accent-dim),transparent 70%),radial-gradient(46% 42% at 96% 98%,var(--accent-dim),transparent 72%);}
[data-theme="dark"] body::before{opacity:.7;}
body>*{position:relative;z-index:1;}

header{border-bottom:1px solid var(--border);padding:0 18px;display:flex;
  align-items:center;gap:12px;background:var(--surface);min-height:48px;flex-shrink:0;}
.logo{width:32px;height:32px;border-radius:var(--r-1);background:var(--brand);display:flex;
  align-items:center;justify-content:center;flex-shrink:0;}
.logo svg{width:20px;height:20px;}
.app-name{font-size:var(--fs-5);font-weight:600;letter-spacing:-0.2px;}
.app-sub{font-size:var(--fs-2);color:var(--text2);}
@media(max-width:480px){header .app-sub{display:none;}}

.tab{padding:11px 16px;border:none;background:none;color:var(--text2);
  font-family:var(--sans);font-size:var(--fs-4);font-weight:500;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;
  white-space:nowrap;display:inline-flex;align-items:center;gap:7px;}
.tab svg{width:15px;height:15px;flex-shrink:0;}
.tab.active{color:var(--accent-ink);border-bottom-color:var(--accent);}

.scroll{flex:1;overflow-y:auto;}
/* A culture list is a table, not prose: it was capped at 840px, so on a 1260px pane 210px
   of it sat empty on each side while the rows squeezed. Edge to edge with a clamped gutter,
   the same rule Labbook's Home and Experiments already follow. */
.wrap{max-width:none;margin:0;padding:26px clamp(16px,2.5vw,40px) 60px;}
.pane{display:none;}
.pane.active{display:block;}


/* Inputs / buttons — one dialect with Labbook's New-experiment sheet: a 36px control, --r-2,
   --surface fill, a sentence-case label (--fs-2/600/--text2), and a focus ring in the accent. */
.inp,textarea.inp,select.inp{background:var(--surface);border:1px solid var(--border2);height:36px;
  border-radius:var(--r-2);padding:0 11px;font-family:var(--sans);font-size:var(--fs-3);color:var(--text);
  outline:none;transition:border-color .15s,box-shadow .15s;width:100%;}
.inp:focus,textarea.inp:focus,select.inp:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim);}
textarea.inp{height:auto;resize:vertical;min-height:64px;padding:9px 11px;line-height:1.5;}
.btn{background:var(--accent);border:1px solid var(--accent);color:var(--on-accent);border-radius:var(--r-2);padding:0 18px;height:36px;
  display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-size:var(--fs-4);font-weight:600;cursor:pointer;transition:filter .15s;white-space:nowrap;}
.btn:hover{filter:brightness(1.06);}
.btn.ghost{background:none;border-color:var(--border2);color:var(--text2);font-weight:500;}
.btn.ghost:hover{background:var(--surface2);color:var(--text);filter:none;}
/* the small button of a row of actions: 28px, --r-1, the size of Labbook's icon/row buttons */
.btn.sm{height:28px;padding:0 12px;border-radius:var(--r-1);font-size:var(--fs-3);}
.btn.danger{background:none;border-color:var(--border2);color:var(--urgent-ink);}
.btn.danger:hover{background:var(--urgent-bg);filter:none;}

/* Filter pills */
.filters{display:flex;gap:6px;margin-bottom:16px;}

/* Task add row */

/* Task rows */

/* Incubator */
.inc-bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
/* One control height per bar (docs/UI.md). The row had four controls at four heights: 35, 30, 28 and 26. */
.inc-bar .inc-search input,.inc-bar .inc-fp,.inc-bar .btn{height:34px;}
.ivt{min-height:32px;}
.inc-search{position:relative;flex:1;min-width:180px;}
.inc-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text3);pointer-events:none;}
.inc-search input{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-2);
  padding:8px 11px 8px 31px;font-family:var(--sans);font-size:var(--fs-4);color:var(--text);outline:none;}
.inc-search input:focus{border-color:var(--accent);}
/* one focus ring (docs/UI.md) for everything a keyboard can reach */
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.inp:focus-visible,textarea.inp:focus-visible,select.inp:focus-visible,.inc-search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.crow:focus-visible{outline-offset:-2px;}
.inc-filters{display:flex;gap:4px;}
.inc-fp{padding:6px 12px;border:1px solid var(--border2);border-radius:var(--r-4);background:none;
  color:var(--text2);font-family:var(--sans);font-size:var(--fs-3);font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .14s,color .14s,border-color .14s;}
.inc-fp:hover{background:var(--surface2);color:var(--text);}
.inc-fp.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600;}
.inc-fp .n{font-family:var(--mono);font-size:var(--fs-1);margin-left:5px;}
@media(max-width:1000px){ .inc-search{flex:1 1 100%;} }
@media(max-width:640px){ .inc-filters{flex:1 1 100%;overflow-x:auto;} }
/* ── The list ── */
.clist{border:1px solid var(--border);border-radius:var(--r-2);overflow:hidden;background:var(--surface);box-shadow:var(--shadow-xs);}
.clist-hd,.crow{display:grid;grid-template-columns:minmax(150px,2.1fr) 52px minmax(64px,.8fr) minmax(96px,1.3fr) minmax(104px,1.2fr) minmax(96px,1fr) 34px;
  gap:12px;align-items:center;padding:0 14px;}
.clist-hd{height:34px;background:var(--surface2);border-bottom:1px solid var(--border);}
.clist-hd button{background:none;border:none;padding:0;height:100%;text-align:left;cursor:pointer;font-family:var(--mono);
  font-size:var(--fs-1);font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--text3);}
.clist-hd button:hover{color:var(--text2);}
.clist-hd button.sorted{color:var(--accent-ink);}
.crow{height:46px;border:0;border-bottom:1px solid var(--border);cursor:pointer;background:none;width:100%;
  font-family:var(--sans);text-align:left;color:var(--text);transition:background .12s;}
.crow:last-child{border-bottom:none;}
.crow:hover{background:var(--accent-dim);}
.crow.on{background:var(--accent-dim);box-shadow:inset 3px 0 0 var(--accent);}
.crow.cc-flash{background:var(--accent-dim);box-shadow:inset 3px 0 0 var(--accent),0 0 0 2px var(--accent-soft);}
.cr-line{display:flex;align-items:center;gap:8px;min-width:0;}
.cr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.cr-dot.ok{background:var(--ok);} .cr-dot.soft{background:var(--soft);} .cr-dot.warn{background:var(--urgent);}
.cr-nm{font-size:var(--fs-4);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cr-p{font-family:var(--mono);font-size:var(--fs-3);font-weight:600;color:var(--text2);}
.cr-c{font-size:var(--fs-3);color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cr-due{font-size:var(--fs-3);font-weight:600;white-space:nowrap;}
.cr-due.ok{color:var(--text2);} .cr-due.soft{color:var(--accent-ink);} .cr-due.warn{color:var(--urgent-ink);}
.cr-where{font-size:var(--fs-2);font-family:var(--mono);color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cr-go{color:var(--text3);font-size:var(--fs-5);text-align:right;}
@media(max-width:760px){
  .clist-hd{display:none;}
  .crow{grid-template-columns:1fr auto;grid-auto-rows:auto;height:auto;padding:10px 14px;gap:4px 10px;}
  .cr-c,.cr-where,.cr-go{display:none;}
}
/* ── The drawer ── */
.drw-back{position:fixed;inset:0;background:rgba(16,22,40,.34);opacity:0;pointer-events:none;
  transition:opacity .22s var(--ease);z-index:300;}
.drw-back.open{opacity:1;pointer-events:auto;}
.drw{position:fixed;top:0;right:0;bottom:0;width:min(420px,94vw);background:var(--surface);
  border-left:1px solid var(--border2);box-shadow:-18px 0 48px -18px rgba(20,30,60,.3);
  transform:translateX(102%);visibility:hidden;transition:transform .26s var(--ease),visibility 0s linear .26s;z-index:301;overflow-y:auto;padding:20px 22px 40px;}
.drw.open{transform:translateX(0);visibility:visible;transition:transform .26s var(--ease),visibility 0s;}
.drw-hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px;}
.drw-title{font-size:var(--fs-6);font-weight:700;letter-spacing:-.3px;flex:1;line-height:1.25;}
.drw-x{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;border-radius:var(--r-1);flex-shrink:0;}
.drw-x:hover{color:var(--text);background:var(--surface2);}
.drw-x svg{width:16px;height:16px;display:block;}
/* a drawer section is a sentence-case heading over one hairline, as in Labbook (no uppercase micro-label) */
.drw-sec{font-size:var(--fs-4);font-weight:600;color:var(--text);margin:22px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--border);}
.drw-vessel{display:flex;justify-content:center;padding:4px 0 2px;}
.drw-vessel .vsl-vs{max-width:150px;}
.inc-viewtoggle{display:inline-flex;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-2);overflow:hidden;}
.ivt{border:none;background:none;color:var(--text2);font-family:var(--sans);font-size:var(--fs-3);font-weight:600;padding:6px 12px;cursor:pointer;transition:background .14s,color .14s;}
.ivt.on{background:var(--accent);color:var(--on-accent);}
/* ── Vessel grid (flasks / plates) ── */
.cell-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px 12px;align-items:start;}
.vsl{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 4px 10px;border-radius:var(--r-3);border:1px solid transparent;transition:background .18s,border-color .18s,box-shadow .25s;}
.vsl:hover{background:var(--glass);border-color:var(--glass-brd);}
.vsl-face{position:relative;background:none;border:none;cursor:pointer;padding:0;width:100%;display:flex;align-items:center;justify-content:center;}
/* ── Vessels ──────────────────────────────────────────────────────────────────────────────
   Flat and outline-first, the same language as the Hub's icons: a hairline wall, one accent
   (the cap), no gloss and no drop shadow. The medium is the only thing that carries data — phenol
   red, driven by _vslFrac — so it is the only saturated thing on the tile.
   Motion is arrival, hover and "due", never a loop at rest: the liquid rises once when a flask
   is first drawn, the surface drifts and bubbles rise while you rest on it, and an overdue flask
   breathes a soft halo. Only transform and opacity move. */
.vsl-vs{position:relative;display:block;width:100%;max-width:172px;}
.vsl-svg{display:block;width:100%;height:auto;aspect-ratio:160/100;overflow:visible;transition:transform var(--dur-2) var(--ease-out);}
/* The medium drifts red -> orange -> yellow as the culture grows. Transitioning the gradient
   stops means the change is a drift, not a jump, wherever the SVG survives a re-render. */
.vsl-s1,.vsl-s2{transition:stop-color 1.2s var(--ease);}
/* A cited number and an uncited one must not look the same. */
.ref-cite{font-size:var(--fs-2);color:var(--text2);line-height:1.55;margin-top:10px;padding:9px 12px;
  background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-2);}
.ref-cite a{color:var(--accent-ink);text-decoration:none;border-bottom:1px solid transparent;}
.ref-cite a:hover{border-bottom-color:currentColor;}
.ref-range{color:var(--text3);}
.ref-cite-none{border-left-color:var(--text3);color:var(--text3);}
.vsl-wall{fill:var(--surface);stroke:none;}
.vsl-rim{fill:none;stroke:var(--text2);stroke-opacity:.72;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;}
.vsl-neckc{fill:var(--surface);stroke:none;}
.vsl-ring{fill:var(--surface);stroke:var(--text2);stroke-opacity:.72;stroke-width:1.4;}
.vsl-tick{fill:none;stroke:var(--text3);stroke-width:1.1;stroke-linecap:round;opacity:.85;}
.vsl-cap{fill:color-mix(in srgb,var(--accent) 14%,var(--surface));stroke:var(--accent);stroke-width:1.5;}
.vsl-rib{fill:none;stroke:var(--accent);stroke-width:1.2;stroke-linecap:round;opacity:.5;}
.vsl-hl{fill:none;stroke:#fff;stroke-opacity:.5;stroke-width:1.6;stroke-linecap:round;}
.vsl-sheen{fill:none;stroke:#fff;stroke-opacity:.55;stroke-width:2;stroke-linecap:round;transform-box:view-box;transform-origin:80px 50px;transition:transform 700ms var(--ease-out);}
.vsl-halo{fill:none;stroke:var(--warn);stroke-width:6;stroke-linejoin:round;opacity:0;}
.vsl-bub{fill:#fff;}
.vsl-bubs{opacity:0;transition:opacity var(--dur-2) var(--ease);}
/* Hover: the vessel lifts, the surface drifts and bubbles rise. The animations are paused rather
   than removed at rest, so leaving a flask freezes the surface where it is instead of snapping. */
.vsl-face:hover .vsl-svg,.vsl-face:focus-visible .vsl-svg{transform:translateY(-3px);}
.vsl-wave{animation:vslWave 3s linear infinite paused;}
.vsl-bub{animation:vslBub 2.4s ease-in infinite paused;}
.vsl-face:hover .vsl-wave,.vsl-face:focus-visible .vsl-wave,
.vsl-face:hover .vsl-bub,.vsl-face:focus-visible .vsl-bub{animation-play-state:running;}
.vsl-face:hover .vsl-bubs,.vsl-face:focus-visible .vsl-bubs{opacity:1;}
.vsl-face:hover .vsl-sheen,.vsl-face:focus-visible .vsl-sheen{transform:rotate(40deg);}
@keyframes vslWave{to{transform:translateX(-40px);}}
@keyframes vslBub{0%{transform:translateY(0);opacity:0;}25%{opacity:.75;}100%{transform:translateY(-20px);opacity:0;}}
/* Arrival: once per vessel per session (the JS marks it), staggered along the grid. */
.vsl-new .vsl-lq{animation:vslFill 900ms var(--ease-out) both;animation-delay:calc(var(--i,0) * 45ms);}
.vsl-new .vsl-lqp{transform-box:fill-box;transform-origin:center;animation:vslDish 800ms var(--ease-out) both;animation-delay:calc(var(--i,0) * 45ms);}
@keyframes vslFill{from{transform:translateY(28px);opacity:0;}to{transform:none;opacity:1;}}
@keyframes vslDish{from{transform:scale(.72);opacity:0;}to{transform:none;opacity:1;}}
/* The passage number sits on the medium, dark ink so it reads on all of red, orange and yellow. */
.vsl-p{position:absolute;left:6%;width:71%;top:54%;height:32%;display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-5);font-weight:700;color:#4a3b33;letter-spacing:.2px;pointer-events:none;}
.vsl-vs.dish .vsl-p{left:0;width:100%;top:0;height:100%;}
.vsl-name{font-size:var(--fs-4);font-weight:700;color:var(--text);margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.vsl-tag{font-size:var(--fs-1);font-weight:600;margin-top:2px;line-height:1.3;color:var(--text3);max-width:100%;}
.vsl.due .vsl-halo{animation:vslHalo 3.4s ease-in-out infinite;}
@keyframes vslHalo{0%,100%{opacity:0;}50%{opacity:.32;}}
.vsl.cc-flash{background:var(--glass);border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent);}
/* expanded tile spans the row: flask on the left, details on the right */
.vsl.open{grid-column:1/-1;flex-direction:row;align-items:flex-start;text-align:left;gap:20px;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--glass-brd);border-radius:var(--r-3);box-shadow:var(--glass-shadow),var(--glass-hi);padding:18px;}
.vsl.open .vsl-name{margin-top:8px;}
@media(max-width:560px){ .cell-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));} .vsl-vs{max-width:120px;} .vsl.open{flex-direction:column;} }
@keyframes ccFlash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent);}100%{box-shadow:0 0 0 8px transparent;}}
.cc-type{font-size:var(--fs-1);font-family:var(--mono);color:var(--text3);letter-spacing:.5px;
  border:1px solid var(--border2);padding:1px 6px;border-radius:var(--r-2);margin-left:8px;vertical-align:middle;}
.cc-alerts{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
.alert{font-size:var(--fs-2);font-weight:600;padding:4px 10px;border-radius:var(--r-4);display:inline-flex;align-items:center;gap:5px;}
.alert.warn{background:var(--warn-bg);color:var(--warn-ink);}
.alert.soft{background:var(--soft-bg);color:var(--accent-ink);}
.alert.ok{background:var(--ok-bg);color:var(--good-ink);}
.cc-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px 18px;
  margin-top:13px;padding-top:13px;border-top:1px solid var(--border);}
.cc-meta-item .k{font-size:var(--fs-2);font-weight:500;color:var(--text3);}
.cc-meta-item .v{font-size:var(--fs-4);color:var(--text);margin-top:2px;}

// Vessel visuals — the medium is phenol-red: healthy culture = RED, and it turns YELLOWER
// (more acidic) the more urgent a split is. All native SVG/CSS.
// ok = healthy media → deep phenol red; soft = "soon to split" → orange; warn = split due/overdue → acidic yellow.
// Phenol red, not a traffic light. Fresh medium is red-pink and acidifies through orange to
// yellow as the culture grows out — so a healthy flask is red and an overdue one is yellow.
// It looks inverted if you read it as a status colour; it is the medium.
// ── How red the medium is ──────────────────────────────────────────────────
// Phenol red is not a status light: fresh medium is red-pink, and as the culture grows it
// acidifies through orange to yellow. So the colour has to track CELL NUMBER, not an alert
// level — which is why this is a continuous fraction and not the three fixed pairs it used
// to be (a flask jumped from healthy to warning with nothing in between).
//
// Cell number doubles every `doublingH`, and a 1:N split means you need log2(N) doublings to
// get back to where you were. Both numbers are already in CELL_REF, so:
//
//     done   = hours since seeding / doublingH
//     needed = log2(split ratio)
//     frac   = done / needed          0 = just split, 1 = back to confluent, >1 = overdue
//
// That is why doubling time matters: two lines split 1:8 on the same day diverge, because
// HCT116 (21 h) gets through three doublings while U2OS (29 h) is still on its second.

  var n = parseFloat((ratio.split(':')[1]||'')) || 0;
  var hours = (now - cell.seeded) / 3600000;
  if(dh > 0 && n > 1){
    var needed = Math.log(n) / Math.LN2;          // 1:8 -> 3 doublings
    return Math.max(0, Math.min(1.25, (hours/dh) / needed));

  // statement made coarsely. Better a rough curve than a flask that never changes colour.
  var days = +(cell.intervalDays || ref.intervalDays || 0);

// the same frame so switching Flasks/Plates does not move the grid.
// The medium is the only saturated thing on the tile: a liquid pool clipped to the wall, its
// surface a wave that only drifts while hovered. Colour is _vslStops(frac) — unchanged.
var _vslSeen = {};   // vessels already drawn this session: the arrival plays once, not on every re-render
var FLASK_BODY = 'M18 22 H92 L122 50 V78 Q122 86 114 86 H18 Q10 86 10 78 V30 Q10 22 18 22 Z';
// Period 40, so translating by -40 is seamless; it runs 0..200 so the visible 10..122 is always covered.
var FLASK_WAVE = 'M0 56 q10 -2.4 20 0' + ' t20 0'.repeat(9) + ' V96 H0 Z';
function flaskSvg(id, st, seq){
  var s = _vslStops(st), g='vg_'+id, cp='vc_'+id, fresh=!_vslSeen[id]; _vslSeen[id]=1;
  return '<svg class="vsl-svg'+(fresh?' vsl-new':'')+'" viewBox="0 0 160 100" style="--i:'+(seq||0)+'" aria-hidden="true">'
    + '<defs>'
      + '<linearGradient id="'+g+'" gradientUnits="userSpaceOnUse" x1="0" y1="54" x2="0" y2="88">'
        + '<stop class="vsl-s2" offset="0" stop-color="'+s[0]+'"/>'
        + '<stop class="vsl-s1" offset="1" stop-color="'+s[1]+'"/></linearGradient>'
      + '<clipPath id="'+cp+'"><path d="'+FLASK_BODY+'"/></clipPath>'
    + '</defs>'
    + '<path class="vsl-halo" d="'+FLASK_BODY+'"/>'
    + '<path class="vsl-wall" d="'+FLASK_BODY+'"/>'
    + '<g clip-path="url(#'+cp+')"><g class="vsl-lq">'
        + '<path class="vsl-wave" d="'+FLASK_WAVE+'" fill="url(#'+g+')"/>'
        + '<path class="vsl-hl" d="M17 61 V80"/>'
        + '<g class="vsl-bubs"><circle class="vsl-bub" cx="38" cy="80" r="1.5"/>'
          + '<circle class="vsl-bub" style="animation-delay:-.8s" cx="66" cy="77" r="1.2"/>'
          + '<circle class="vsl-bub" style="animation-delay:-1.6s" cx="94" cy="81" r="1.6"/></g>'
    + '</g></g>'
    + '<path class="vsl-tick" d="M17 32 H25 M17 38 H22 M17 44 H25"/>'
    + '<path class="vsl-rim" d="'+FLASK_BODY+'"/>'
    // The neck is open to the body: paint over the wall where it passes, then draw the neck's two lines.
    + '<rect class="vsl-neckc" x="121.2" y="54.8" width="13" height="18.4"/>'
    + '<path class="vsl-rim" d="M122 54 H134 M122 74 H134"/>'
    + '<rect class="vsl-ring" x="130.5" y="50.5" width="4" height="27" rx="1.6"/>'
    + '<rect class="vsl-cap" x="134" y="47" width="16" height="31" rx="5"/>'
    + '<path class="vsl-rib" d="M140.5 54 V71 M144 54 V71 M147.5 54 V71"/>'
  + '</svg>';
}

function saveCellForm(){
  var base=val('cf-baseline').trim();
  if(!base){ el('cf-baseline').focus(); showToast('Choose or type a base cell line'); return; }
  var suffix=val('cf-suffix').trim();
  var line = suffix ? (base+' '+suffix) : base;      // display name (still governed by base rules)
  var ref=_cfArch || archLookup(base);
  // What is typed must be a whole number in a sane range (the box's min= does not stop typing -5 or 1e999), and a split or a test cannot be dated in the future.
  function whole(id, lo, hi, what, allowEmpty){
    var raw=val(id).trim(), bad=el(id).validity&&el(id).validity.badInput;   // a number box empties itself on 1e999 or text but still knows it was typed
    if(bad){ el(id).focus(); showToast(what+' must be a whole number from '+lo+' to '+hi); return null; }
    if(raw===''){ if(allowEmpty) return {v:null}; return {v:0}; }
    var n=Number(raw.replace(',','.')); if(!isFinite(n) || n!==Math.floor(n) || n<lo || n>hi){ el(id).focus(); showToast(what+' must be a whole number from '+lo+' to '+hi); return null; }
    return {v:n};
  }
  var pP=whole('cf-passage',0,999,'Passage',false); if(!pP) return;
  var pI=whole('cf-interval',1,365,'Split every (days)',true); if(!pI) return;
  var pL=whole('cf-limit',1,999,'Passage limit',true); if(!pL) return;
  var endToday=addDays(new Date().setHours(0,0,0,0),1);
  var seeded=fromDateInput(val('cf-seeded')) || Date.now();
  if(seeded>=endToday){ el('cf-seeded').focus(); showToast('The last split cannot be in the future'); return; }
  var mycoT=fromDateInput(val('cf-myco'));
  if(mycoT!=null && mycoT>=endToday){ el('cf-myco').focus(); showToast('The last myco test cannot be in the future'); return; }
  var cell={
    line:line,
    baseLine:base,
    titleSuffix:suffix,
    passage:pP.v,
    vessel:val('cf-vessel').trim(),
    media:val('cf-media').trim(),
    intervalDays:pI.v,
    passageLimit:pL.v,
    seeded:seeded,
    mycoLast:mycoT,
    incubator:val('cf-incubator').trim(),
    shelf:val('cf-shelf').trim(),
    notes:val('cf-notes').trim(),
    ratio:(ref&&ref.ratio)||'',
    type:(ref&&ref.type)||''
  };
  if(_cellForm==='new'){
    cell.history=[{action:'seeded',passage:cell.passage,ts:seeded}];
    STORE.addCell(cell); showToast(line+' added to the incubator');
  } else {
    var existing=STORE.get().incubator[_cellForm]||{};
    cell.history=existing.history||[];
    if(!cell.ratio) cell.ratio=existing.ratio||'';
    if(!cell.type) cell.type=existing.type||'';
    STORE.updateCell(_cellForm,cell); showToast('Updated '+line);
  }
  _cellForm=null; renderIncubator();
}

  var cell=STORE.get().incubator[id]; if(!cell) return;

  if(badP || !isFinite(newP) || newP!==Math.floor(newP) || newP<0 || newP>999){ el('sp-passage-'+id).focus(); showToast('The new passage must be a whole number from 0 to 999'); return; }
  var when=fromDateInput(val('sp-date-'+id)) || Date.now();
  if(when>=addDays(new Date().setHours(0,0,0,0),1)){ el('sp-date-'+id).focus(); showToast('A split cannot be dated in the future'); return; }

// ── State ────────────────────────────────────────────────────────────────
// Layout (how the cultures are laid out) and vessel (what is drawn in a grid tile) are two
// different questions; they used to share one variable, so choosing "Plates" also decided
// whether you got a list.
var _incLayout = 'list', _incQuery = '', _incFilter = 'all', _incSort = 'due';
try { _incLayout = localStorage.getItem('incubator_layout') || 'list'; } catch(e){}
try { _incSort   = localStorage.getItem('incubator_sort')   || 'due'; } catch(e){}
function setIncLayout(v){ _incLayout=v; try{ localStorage.setItem('incubator_layout',v); }catch(e){} renderIncubator(); }
function setIncQuery(v){ _incQuery=String(v||'').toLowerCase().trim(); renderIncubator(); }
function setIncFilter(v){ _incFilter=v; renderIncubator(); }
function setIncSort(v){ _incSort=(_incSort===v?('-'+v):v); try{ localStorage.setItem('incubator_sort',_incSort); }catch(e){} renderIncubator(); }

var DAYMS = 86400000;
// The one number the list is really about: when is this due to be split.
function nextDue(c){
  if (!c || !c.seeded || !c.intervalDays) return null;
  if (c.needsSplit && c.needsSplit > c.seeded) return Math.min(c.needsSplit, Date.now());   // the morning check said so: now
  return Math.max(addDays(c.seeded, c.intervalDays), c.postponedUntil || 0);
}
function dueText(c){
  var t = nextDue(c);
  if (t == null) return {text:'—', cls:'ok'};
  if (c.needsSplit && c.needsSplit > c.seeded) return {text:'now', cls:'warn'};
  if (c.postponedUntil && c.postponedUntil === t && t > Date.now()) return {text:'postponed · '+shortDay(t), cls:'soft'};
  var d = dayNum(t) - dayNum(Date.now());
  if (d < 0)  return {text:Math.abs(d)+'d overdue', cls:'warn'};
  if (d === 0) return {text:'today', cls:'warn'};
  if (d === 1) return {text:'tomorrow', cls:'soft'};
  return {text:'in '+d+'d', cls:(d<=2?'soft':'ok')};
}
function cultureWhere(c){
  return [c && c.incubator, c && c.shelf].filter(Boolean).join(' · ');
}
function statusOf(alerts){
  return alerts.some(function(a){return a.level==='warn';}) ? 'warn'
       : alerts.some(function(a){return a.level==='soft';}) ? 'soft' : 'ok';
}
function _incRows(){
  var cells=STORE.get().incubator, now=Date.now();
  return Object.keys(cells).map(function(id){
    var c=cells[id], alerts=computeCellAlerts(c,now);
    return {id:id, cell:c, alerts:alerts, st:statusOf(alerts), due:nextDue(c)};
  });
}
function _incFiltered(){
  var rows=_incRows();
  if (_incFilter!=='all') rows=rows.filter(function(r){
    if (_incFilter==='overdue') return r.due!=null && r.due < Date.now();
    if (_incFilter==='due')     return r.st!=='ok';
    return r.st==='ok';
  });
  if (_incQuery) rows=rows.filter(function(r){
    var c=r.cell;
    return [c.line,c.vessel,c.media,c.incubator,c.shelf,c.notes,c.type]
      .some(function(x){ return x && String(x).toLowerCase().indexOf(_incQuery)>-1; });
  });
  var dir = _incSort.charAt(0)==='-' ? -1 : 1, key = _incSort.replace(/^-/,'');
  rows.sort(function(a,b){
    var v=0;
    if (key==='due'){
      // Something overdue is the reason you opened this app; it goes first whatever else sorts.
      var av=a.due==null?Infinity:a.due, bv=b.due==null?Infinity:b.due;
      v = av-bv;
    }
    else if (key==='line')    v = String(a.cell.line||'').localeCompare(String(b.cell.line||''));
    else if (key==='passage') v = (a.cell.passage||0)-(b.cell.passage||0);
    else if (key==='vessel')  v = String(a.cell.vessel||'').localeCompare(String(b.cell.vessel||''));
    else if (key==='where')   v = cultureWhere(a.cell).localeCompare(cultureWhere(b.cell));
    return v*dir || String(a.cell.line||'').localeCompare(String(b.cell.line||''));
  });
  return rows;
}

function _incFilterBar(){
  var all=_incRows(), n={
    all: all.length,
    overdue: all.filter(function(r){ return r.due!=null && r.due<Date.now(); }).length,

    healthy: all.filter(function(r){ return r.st==='ok'; }).length

  return [['all','All'],['overdue','Overdue'],['due','Needs attention'],['healthy','Healthy']]
    .map(function(f){ return '<button class="inc-fp'+(_incFilter===f[0]?' on':'')+'" onclick="setIncFilter(\''+f[0]+'\')">'

}

function _incGridHtml(rows){

function renderIncubator(){
  /* The form is a dialog: built when it opens, not on every render, so a store update (a sync landing)
     cannot rebuild it under your hands and empty what you typed. */
  if(_cfShown!==_cellForm){
    _cfShown=_cellForm;
    el('cell-form-area').innerHTML = _cellForm ? cellFormHtml() : '';
